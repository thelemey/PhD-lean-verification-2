name: Verify thesis
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build all statements and proofs
        working-directory: lean
        run: |
          mapfile -t imports < <(git grep -h '^import Mathlib' -- '*.lean' | awk '{print $2}' | sort -u)
          lake exe cache get "${imports[@]}"
          lake build
      - name: Install PDF reader
        run: python3 -m pip install "pypdf>=5,<7"
      - name: Check HTML, SVG, PDF and proof declarations
        run: python3 scripts/graph.py --check --audit
