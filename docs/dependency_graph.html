<script id="data" type="application/json">{"nodes":{"Caterpillar":{"short":"П 2.2.1","title":"Формула irr через хребет","page":"13","chapter":2,"statement":"\\begin{proposition}\\label{Caterpillar} Пусть $\\TT$ — гусеничное дерево с последовательностью степеней хребта $(d_1,\\dots,d_k)$, $k\\ge 2$. Тогда \\begin{equation}~\\label{eqqq01Caterpillar} \\irr(\\TT)=(d_1-1)^2+(d_k-1)^2+\\sum_{i=2}^{k-1}(d_i-1)(d_i-2)+\\sum_{i=1}^{k-1}|d_i-d_{i+1}|. \\end{equation} \\end{proposition}","lines":["Формула irr через хребет"]},"Thm01worksep":{"short":"Т 3.4.1","title":"Точное разложение f(s)+g(δ,t)","page":"35","chapter":3,"statement":"\\begin{theorem}~\\label{Thm01worksep} Пусть $n\\geqslant 8$ и $\\lambda\\geq 0$. Тогда \\begin{equation}~\\label{eqq01Thm01worksep} \\sig{\\lambda}(\\mathscr S) \\;=\\; f_{n,\\lambda}(s) \\;+\\; g_\\lambda(\\delta,t), \\end{equation} где \\begin{equation}~\\label{eqq02Thm01worksep} f_{n,\\lambda}(s)= A_\\lambda\\,s^{2}+B_{n,\\lambda}\\,s+\\tfrac{3^{\\lambda}}{4}n^{2}. \\end{equation} \\end{theorem}","lines":["Точное разложение f(s)+g(δ,t)"]},"Thm02worksep":{"short":"Т 3.4.2","title":"Перебор допустимых параметров глобального максимума","page":"37","chapter":3,"statement":"\\begin{theorem}~\\label{Thm02worksep} Пусть $n\\ge8$ и $\\lambda\\ge0$. Все максимизирующие $\\sig\\lambda$ графичные последовательности $(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ порядка $n$ можно получить следующим точным алгоритмом. Переберём $s=0,\\dots,n$ и $\\delta=-(n-s),-(n-s)+2,\\dots,n-s$. Для каждой пары выберем все ближайшие к $-(2^\\lambda-1)\\delta$ элементы множества \\begin{equation}\\label{repair:tgrid} T_{n,s,\\delta}=\\{t\\in\\mathbb Z:-s\\le t\\le s,\\quad t\\equiv n+\\delta\\pmod4\\}. \\end{equation} Пустые множества пропускаются. Восстановим $a_i$ по~\\eqref{eqq01recover} и оставим все последовательности с наибольшим значением~\\eqref{eqq02modsigma}. Для максимизации среди последовательностей, допускающих связную реализацию, дополнительно ограничим $t\\le n+4-3\\delta$ в~\\eqref{repair:tgrid}. Число проверяемых кандидатов есть $O(n^2)$; для каждой пары $(s,\\delta)$ их не более двух. \\end{theorem}","lines":["Перебор допустимых параметров","глобального максимума"]},"Thm03worksep":{"short":"Т 3.4.3","title":"Оптимум внутри семейства по ближайшему целому","page":"40","chapter":3,"statement":"\\begin{theorem}\\label{Thm03worksep} Пусть $n=4k+r\\ge8$, $r\\in\\{1,2,3\\}$ и $\\lambda\\in[0,2)$. Внутри семейства $\\mathscr S_a^{(r)}$ из определения~\\ref{def01families}, $a\\in\\{0,\\dots,k\\}$, максимум $\\sig\\lambda$ достигается в точности при всех ближайших к $x_\\lambda^{(r)}$ целых точках отрезка $[0,k]$, где \\begin{align*} x_\\lambda^{(1)}&=\\frac{(2k+1)(3^\\lambda-1)-2^\\lambda}{2D(\\lambda)},\\\\ x_\\lambda^{(2)}&=\\frac{(2k+1)(3^\\lambda-1)}{2D(\\lambda)},\\\\ x_\\lambda^{(3)}&=\\frac{2(k+1)(3^\\lambda-1)-2^\\lambda}{2D(\\lambda)}. \\end{align*} При выходе вершины за отрезок выбирается ближайший конец; при равноудалённости двух допустимых целых чисел оба дают максимум. Принадлежность глобального максимизатора этому семейству здесь не утверждается. \\end{theorem}","lines":["Оптимум внутри семейства по","ближайшему целому"]},"Thm04worksep":{"short":"Т 3.4.6","title":"Максимум внутри семейства при r=1","page":"42","chapter":3,"statement":"\\begin{theorem}\\label{Thm04worksep} При $n=4k+1\\ge9$ и $\\lambda>2$ максимум внутри семейства $\\mathscr S_a^{(1)}$, $0\\le a\\le k$, достигается только при $a=k$. \\end{theorem}","lines":["Максимум внутри семейства при","r=1"]},"Thm05worksep":{"short":"Т 3.4.7","title":"Сравнение с поляризованной последовательностью","page":"42","chapter":3,"statement":"\\begin{theorem}\\label{Thm05worksep} При $n=4k+3\\ge11$ и $\\lambda>2$ выполняется $\\sig\\lambda(\\mathcal P^{(3)})>\\sig\\lambda(\\mathscr S_k^{(3)})>\\sig\\lambda(\\mathscr S_0^{(3)})$. Значение при $a=k$ максимально внутри семейства $\\mathscr S_a^{(3)}$. \\end{theorem}","lines":["Сравнение с поляризованной","последовательностью"]},"ThmDecSigma":{"short":"Т 3.1.1","title":"Сигма-индекс по числам прикреплённых листьев","page":"21","chapter":3,"statement":"\\begin{theorem}\\label{ThmDecSigma} Пусть к $i$-й вершине пути $P_k$, $k\\ge2$, присоединено $p_i\\ge0$ новых листьев. Обозначим через $s_i$ степень этой вершины в пути и положим $x_i=s_i+p_i$. Тогда \\[ \\sigma(T)=\\sum_{i=1}^k p_i(x_i-1)^2+\\sum_{i=1}^{k-1}(x_i-x_{i+1})^2. \\] Если $p_1,p_k\\ge1$, выделенный путь совпадает с хребтом из невисячих вершин. \\end{theorem}","lines":["Сигма-индекс по числам","прикреплённых листьев"]},"ThmLinDualln1":{"short":"Т 4.1.1","title":"Точный максимум Gut по подмножествам","page":"44","chapter":4,"statement":"\\begin{theorem}\\label{ThmLinDualln1} Пусть $H_+(\\varnothing)=0$ и для непустого $S\\subseteq I$ \\[ H_+(S)=c(S)+\\max_{i\\in S}H_+(S\\setminus\\{i\\}). \\] Тогда по всем расстановкам заданных степеней на хребте \\[ \\Gut_{\\max}=4[\\ell(n-1)+H_+(I)]-(n-1)(2n-1). \\] Все максимизирующие расстановки восстанавливаются обратным проходом по всем переходам, на которых достигается максимум. \\end{theorem}","lines":["Точный максимум Gut по","подмножествам"]},"ThmLinDualln2":{"short":"Т 4.1.2","title":"Точный минимум Gut по подмножествам","page":"44","chapter":4,"statement":"\\begin{theorem}\\label{ThmLinDualln2} Определим $H_-(\\varnothing)=0$ и $H_-(S)=c(S)+\\min_{i\\in S}H_-(S\\setminus\\{i\\})$ для $S\\ne\\varnothing$. Тогда \\[ \\Gut_{\\min}=4[\\ell(n-1)+H_-(I)]-(n-1)(2n-1). \\] Обратный проход по всем минимизирующим переходам перечисляет все минимизаторы. \\end{theorem}","lines":["Точный минимум Gut по","подмножествам"]},"ThmSigmairregularityn1":{"short":"Т 3.3.4","title":"Ослабление точной границы σ","page":"30","chapter":3,"statement":"\\begin{theorem}\\label{ThmSigmairregularityn1} Если $2\\le d_1\\le\\cdots\\le d_k$, $k\\ge2$, то $\\sigma(T)\\ge\\Gamma(M)+(d_1-1)^2+(d_2-1)^2+(d_k-d_{k-1})^2$. \\end{theorem}","lines":["Ослабление точной границы σ"]},"Thmcor01":{"short":"Т 2.2.1","title":"Максимум irr по расстановкам","page":"14","chapter":2,"statement":"\\begin{theorem}~\\label{Thmcor01} Пусть $d_1\\ge\\cdots\\ge d_k\\ge2$, $k\\ge2$, и $p=\\lceil k/2\\rceil$. Среди гусеничных деревьев с мультимножеством степеней хребта $M=\\{d_1,\\dots,d_k\\}$ \\begin{equation}\\label{eqqq01Thmcor01} \\irr_{\\max}(M)=\\sum_{i=1}^k(d_i-1)(d_i-2)-2 +2\\sum_{i=1}^p d_i-2\\sum_{i=k-p+2}^k d_i. \\end{equation} Пустая сумма равна нулю. Максимум достигается, например, на следующих порядках: при $k=2p-1$ положим $y_{2j-1}=d_j$ ($1\\le j\\le p$), $y_{2j}=d_{k+1-j}$ ($1\\le j\u003cp$); при $k=2p$ положим $y_1=d_{p+1}$, $y_{2j}=d_j$ ($1\\le j\\le p$), $y_{2j+1}=d_{k+1-j}$ ($1\\le j\u003cp$). \\end{theorem}","lines":["Максимум irr по расстановкам"]},"albstarirr":{"short":"Л 1.2.1","title":"Индекс Альбертсона звезды","page":"6","chapter":1,"statement":"\\begin{lemma}\\label{albstarirr} Для звезды $\\mathcal S_n=K_{1,n-1}$, $n\\ge2$, индекс Альбертсона равен $(n-1)(n-2)$. \\end{lemma}","lines":["Индекс Альбертсона звезды"]},"bipartite01sets":{"short":"С 5.2.1","title":"Верхние оценки Хеннинга — Раутенбаха","page":"49","chapter":5,"statement":"\\begin{corollary}\\label{bipartite01sets} Для двудольного графа с долями равной мощности и общим числом вершин $n$ выполнено $\\irr(G)\\le n^3/27$. Если $p\\ge2q$, то $\\irr(G)\\le\\irr(K_{p,q})=pq(p-q)$. \\end{corollary}","lines":["Верхние оценки Хеннинга —","Раутенбаха"]},"bipartite02sets":{"short":"Т 5.2.2","title":"Экстремумы irr по типам строк","page":"49","chapter":5,"statement":"\\begin{theorem}\\label{bipartite02sets} Для каждого $S\\subseteq\\{1,\\ldots,q\\}$ пусть $x_S$ --- число строк, единицы которых стоят ровно в столбцах из $S$. Для $x_S\\in\\mathbb Z_{\\ge0}$, $\\sum_Sx_S=p$ положим \\[ c_j(x)=\\sum_{S\\ni j}x_S,\\qquad L(x)=\\sum_S x_S\\sum_{j\\in S}\\bigl||S|-c_j(x)\\bigr|. \\] Точные экстремумы $\\irr$ при заданных долях равны $\\min_x L(x)$ и $\\max_x L(x)$. Если требуется ровно $m$ рёбер, к условиям добавляется $\\sum_S|S|x_S=m$. Отсутствие изолированных вершин задаётся условиями $x_\\varnothing=0$ и $c_j(x)\\ge1$ для каждого $j$. Эти формулы применяются при непустом множестве допустимых векторов. \\end{theorem}","lines":["Экстремумы irr по типам строк"]},"bipmatrix":{"short":"Ф 5.1","title":"Нерегулярность по матрице двудольного графа","page":"48","chapter":5,"statement":"\\begin{equation}\\label{bipmatrix} \\irr(G)=\\sum_{ij}b_{ij}|r_i-c_j|,\\qquad \\sigma(G)=\\sum_{ij}b_{ij}(r_i-c_j)^2. \\end{equation}","lines":["Нерегулярность по матрице","двудольного графа"]},"boundbipartitegraph":{"short":"П 5.3.1","title":"Границы irr и σ по размерам долей","page":"50","chapter":5,"statement":"\\begin{proposition}~\\label{boundbipartitegraph} Пусть $\\mathcal{BG}$ --- простой двудольный граф без изолированных вершин с долями $V_1,V_2$ порядков $n_1,n_2$, $m\\ge1$ рёбрами, максимальной степенью $\\Delta$ и минимальной степенью $\\delta\\ge1$, и пусть $M=\\max\\{n_1,n_2\\}$. Тогда \\begin{align} \\irr(\\mathcal{BG})& \\le\\ n_1n_2\\,(M-1), \\label{eq0boundbipartitegraph}\\\\ \\sigma(\\mathcal{BG})&\\le\\ n_1n_2\\,(M-1)^2 .\\label{eq0boundbipartitegraphsigma} \\end{align} Для каждого из двух неравенств равенство равносильно $\\mathcal{BG}\\cong K_{1,M}$. \\end{proposition}","lines":["Границы irr и σ по размерам","долей"]},"boundbipartitegraphn2":{"short":"П 5.3.2","title":"Построчная оценка irr","page":"50","chapter":5,"statement":"\\begin{proposition}\\label{boundbipartitegraphn2} Пусть $p=|U|$ и $D=\\max_{v\\in V}d(v)$. По заданным степеням строк получаем уточнённую верхнюю оценку \\[ \\irr(G)\\le\\sum_{i:\\,r_i>0}r_i\\max\\{|r_i-1|,|r_i-D|\\},\\qquad D\\le p . \\] \\end{proposition}","lines":["Построчная оценка irr"]},"boundbipartitegraphn3":{"short":"Л 5.3.1","title":"Связь σ, irr и M₁","page":"51","chapter":5,"statement":"\\begin{lemma}\\label{boundbipartitegraphn3} В двудольном графе с $m\\ge1$ и $n=p+q$ выполняется $\\sigma(G)\\le(\\Delta-1)\\irr(G)\\le 2M_1+(n-3)\\irr(G)$. \\end{lemma}","lines":["Связь σ, irr и M₁"]},"caterpillarvertex":{"short":"П 2.4.3","title":"Сильная опора у максимизатора irr","page":"19","chapter":2,"statement":"\\begin{proposition}~\\label{caterpillarvertex} Пусть $\\TT(n,m)$ --- гусеничное дерево, где $m\\ge4$ и $n\\ge m+1$, с $m$ висячими вершинами, индекс Альбертсона которого максимален среди всех таких гусеничных деревьев. Тогда $\\TT$ имеет сильную опорную вершину, смежную по крайней мере с двумя висячими вершинами. \\end{proposition}","lines":["Сильная опора у максимизатора","irr"]},"claim1":{"short":"Защ. 1","title":"Формулы irr и σ через степени хребта","page":"6","chapter":1,"statement":"\\item\\label{defence1} Пусть $x_1,\\ldots,x_k$ --- полные степени невисячих вершин в порядке обхода хребта гусеницы $T$, $k\\ge2$. Для $r=1,2$ обозначим $J_r(T)=\\sum_{uv\\in E(T)}|d(u)-d(v)|^r$, так что $J_1=\\operatorname{irr}$, $J_2=\\sigma$. Тогда \\[ J_r(T)=\\sum_{i=1}^k(x_i-2)(x_i-1)^r+(x_1-1)^r+(x_k-1)^r +\\sum_{i=1}^{k-1}|x_{i+1}-x_i|^r . \\] {\\small См.~\\ref{Caterpillar}, \\ref{propsigmaspine}.}","claim":1,"spec":"Thesis.Trees.Claim1","module":"Thesis/Trees.lean","lines":["Формулы irr и σ через степени","хребта"]},"claim2":{"short":"Защ. 2","title":"Минимум и максимум irr по расположениям","page":"7","chapter":1,"statement":"\\item\\label{defence2} Пусть $d_1\\ge\\cdots\\ge d_k\\ge2$, $k\\ge2$, $h=\\lceil k/2\\rceil$ и $B=\\sum_i(d_i-1)(d_i-2)-2$. По всем расстановкам этого мультимножества на хребте \\[ \\operatorname{irr}_{\\min}=B+2d_1,\\qquad \\operatorname{irr}_{\\max}=B+2\\left(\\sum_{i=1}^{h}d_i-\\sum_{i=k-h+2}^{k}d_i\\right). \\] Сумма по пустому множеству индексов равна нулю. {\\small См.~\\ref{thmext}.}","claim":2,"spec":"Thesis.Trees.Claim2","module":"Thesis/Trees.lean","lines":["Минимум и максимум irr по","расположениям"]},"claim3":{"short":"Защ. 3","title":"Обе границы irr через M₁ и случаи равенства","page":"7","chapter":1,"statement":"\\item\\label{defence3} Для дерева $T$ порядка $n\\ge3$ положим $\\Delta=\\max_v d(v)$ и $M_1=\\sum_v d(v)^2$. Тогда \\[ M_1-4(n-1)+2\\Delta\\le\\operatorname{irr}(T)\\le M_1-2(n-1). \\] Равенство справа характеризует звезду $K_{1,n-1}$. Равенство слева характеризует деревья, для которых существует вершина степени $\\Delta$, такая, что вдоль каждого простого пути, начинающегося в ней, степени не возрастают. {\\small См.~\\ref{propzagreb}.}","claim":3,"spec":"Thesis.Trees.Claim3","module":"Thesis/Trees.lean","lines":["Обе границы irr через M₁ и","случаи равенства"]},"claim5":{"short":"Защ. 5","title":"Перестановка степеней и изменение Gut","page":"7","chapter":1,"statement":"\\item\\label{defence5} Пусть $x_1,\\ldots,x_k$ --- степени в порядке хребта, $n=2+\\sum_i(x_i-1)$, $A_i=1+\\sum_{j=1}^{i}(x_j-1)$. При обмене позиций $u\u003cv$ положим $\\delta=x_v-x_u$. Тогда \\[ \\operatorname{Gut}(T')-\\operatorname{Gut}(T) =4\\delta\\sum_{i=u}^{v-1}(n-2A_i-\\delta). \\] У глобального максимизатора каждая такая разность неположительна. Обратная импликация опровергается примером~\\ref{exgutlocal}. {\\small См.~\\ref{lems001wap}.}","claim":5,"spec":"Thesis.Trees.Claim5","module":"Thesis/Trees.lean","lines":["Перестановка степеней и","изменение Gut"]},"claim6":{"short":"Защ. 6","title":"Границы irr и σ для двудольных графов","page":"7","chapter":1,"statement":"\\item\\label{defence6} Для конечного простого двудольного графа с непустыми долями размеров $n_1,n_2$, без изолированных вершин, положим $M=\\max(n_1,n_2)$. Тогда \\[ \\operatorname{irr}(G)\\le n_1n_2(M-1),\\qquad \\sigma(G)\\le n_1n_2(M-1)^2 . \\] Для каждой оценки в отдельности равенство эквивалентно $G\\cong K_{1,M}$, включая $K_{1,1}$. {\\small См.~\\ref{boundbipartitegraph}.}","claim":6,"spec":"Thesis.Bipartite.Claim6","module":"Thesis/Bipartite.lean","lines":["Границы irr и σ для","двудольных графов"]},"claim7":{"short":"Защ. 7","title":"Штурмовость, морфизм и свойства слов","page":"7","chapter":1,"statement":"\\item\\label{defence7} Пусть $a,b\\ge1$ целые, $F_0=1$, $F_1=0$ и $F_n=F_{n-1}^{c_n}F_{n-2}$ при $n\\ge2$, где $c_n=a$ для чётных $n$ и $c_n=b$ для нечётных. Предел $F^{(a,b)}$ есть характеристическое слово Штурма наклона \\[ t=[0;a+1,\\overline{b,a}]=b/(\\alpha+b),\\qquad \\alpha=(ab+\\sqrt{a^2b^2+4ab})/2 . \\] Частоты $1$ и $0$ равны $t$ и $1-t$. Для $\\sigma_a(0)=0^a1$, $\\sigma_a(1)=0$ выполняется $F^{(a,b)}=\\sigma_a(F^{(b,a)})$. Возвратные слова к $0$ суть $0,01$, к $1$ --- $10^a,10^{a+1}$. Для $n\\ge2$ удаление двух последних букв $F_n$ даёт палиндромный префикс. Все длины палиндромных префиксов задаёт критерий следствия~\\ref{cor002arbitrary}. {\\small См.~\\ref{cor01sturmian}, \\ref{thm01desub}, \\ref{thm02freqduality}, \\ref{thm01return0}, \\ref{thm02return1}, \\ref{thm01centralpalindrome}, \\ref{cor002arbitrary}.}","claim":7,"spec":"Thesis.Words.Claim7","module":"Thesis/Words.lean","lines":["Штурмовость, морфизм и","свойства слов"]},"classoftrees":{"short":"П 2.4.4","title":"Уменьшение irr при второй опоре","page":"19","chapter":2,"statement":"\\begin{proposition}\\label{classoftrees} Пусть $\\mathcal T_{n,\\Delta}$ --- класс деревьев с $n$ вершинами и максимальной степенью $\\Delta$, пусть $\\TT\\in\\mathcal T_{n,\\Delta}$ и пусть $v_0\\in V(\\TT)$ имеет степень $\\Delta$. Если $\\TT$ имеет опорную вершину $v_\\ell\\neq v_0$ с $d(v_\\ell)\\ge3$, то существует $\\TT'\\in\\mathcal T_{n,\\Delta}$ такое, что $\\operatorname{irr}(\\TT')\u003c\\operatorname{irr}(\\TT)$. \\end{proposition}","lines":["Уменьшение irr при второй","опоре"]},"classoftreessigma":{"short":"П 3.2.1","title":"Уменьшение σ у сильной опоры","page":"25","chapter":3,"statement":"\\begin{proposition}~\\label{classoftreessigma} Пусть $T\\in\\mathcal T_{n,\\Delta}$, пусть $v_0\\in V(T)$ --- вершина степени $\\Delta$, и пусть $y\\ne v_0$ --- вершина $T$, смежная по крайней мере с двумя висячими вершинами, где $\\lambda=d_T(y)\\ge3$ и $2\\Delta\u003c3(\\lambda+1)$. Тогда существует дерево $T'\\in\\mathcal T_{n,\\Delta}$ такое, что $\\sigma(T')\u003c\\sigma(T)$. \\end{proposition}","lines":["Уменьшение σ у сильной опоры"]},"classoftreesstrong":{"short":"П 2.4.5","title":"Уменьшение irr: сильная опора","page":"20","chapter":2,"statement":"\\begin{proposition}\\label{classoftreesstrong} Если вне выбранной вершины максимальной степени $\\Delta$ существует сильная опорная вершина степени не ниже трёх, индекс $\\irr$ можно строго уменьшить при сохранении $n$ и $\\Delta$. \\end{proposition}","lines":["Уменьшение irr: сильная опора"]},"conj01dualityinformal":{"short":"П 6.2.1","title":"Невозможность замены букв при разных параметрах","page":"54","chapter":6,"statement":"\\begin{proposition}\\label{conj01dualityinformal} При $a\\ne b$ слова $\\FD^{(a,b)}$ и $\\FD^{(b,a)}$ невозможно получить одно из другого переименованием букв и конечным изменением префикса. \\end{proposition}","lines":["Невозможность замены букв при","разных параметрах"]},"cor001polarizedgraphical":{"short":"С 3.4.1","title":"Графичность поляризованных кандидатов","page":"32","chapter":3,"statement":"\\begin{corollary}\\label{cor001polarizedgraphical} При $n\\ge8$ обе последовательности $\\mathcal P^{(2)}$ и $\\mathcal P^{(3)}$ из \\eqref{eqq01def002polarized} графичны. \\end{corollary}","lines":["Графичность поляризованных","кандидатов"]},"cor002arbitrary":{"short":"С 6.2.2","title":"Критерий всех палиндромных префиксов","page":"57","chapter":6,"statement":"\\begin{corollary}\\label{cor002arbitrary} Пусть $\\{x\\}=x-\\lfloor x\\rfloor$. Для каждого целого $L\\ge0$ префикс длины $L$ палиндромен в точности тогда, когда $\\{(L+2)t\\}$ меньше всех либо больше всех чисел $\\{jt\\}$ при $1\\le j\\le L+1$. В частности, длины палиндромных префиксов не ограничены. \\end{corollary}","lines":["Критерий всех палиндромных","префиксов"]},"cor01bounded":{"short":"С 3.4.2","title":"Равномерный отрыв спектра от нуля","page":"36","chapter":3,"statement":"\\begin{corollary}\\label{cor01bounded} При каждом фиксированном $\\lambda\\in[0,2)$ число $\\alpha(\\lambda)=\\mu_{\\min}(-Q(\\lambda))$ положительно и \\[ g_\\lambda(\\delta,t)\\le-\\alpha(\\lambda)(\\delta^2+t^2). \\] Для любого $\\varepsilon\\in(0,2)$ оценка равномерна на $[0,2-\\varepsilon]$. На всём $[0,2)$ равномерной положительной нижней границы нет. На $[0,1]$ можно использовать явную оценку $\\alpha(\\lambda)\\ge1/16$. \\end{corollary}","lines":["Равномерный отрыв спектра от","нуля"]},"cor01returnduality":{"short":"С 6.2.1","title":"Двойственность возвратных слов","page":"56","chapter":6,"statement":"\\begin{corollary}~\\label{cor01returnduality} Возвратными словами $1$ в $\\FD^{(a,b)}$ и $\\FD^{(b,a)}$ являются $\\{1\\,0^a,\\ 1\\,0^{a+1}\\}$ и $\\{1\\,0^b,\\ 1\\,0^{b+1}\\}$ соответственно. Обмен $a$ и $b$ действует на множество возвратных слов $1$ в точности заменой показателя $a$ на $b$, тогда как множество возвратных слов $0$, $\\{0,01\\}$, остаётся неизменным. \\end{corollary}","lines":["Двойственность возвратных","слов"]},"cor01sturmian":{"short":"С 6.1.1","title":"Слово является штурмовым","page":"53","chapter":6,"statement":"\\begin{corollary}\\label{cor01sturmian} Для целых $a,b\\ge1$ слово $\\FD^{(a,b)}$ является характеристическим словом Штурма наклона $t=[0;a+1,\\overline{b,a}]$. При нумерации с нуля его буква с индексом $i$ равна $\\lfloor(i+2)t\\rfloor-\\lfloor(i+1)t\\rfloor$. \\end{corollary}","lines":["Слово является штурмовым"]},"cor01symmetry":{"short":"С 6.3.1","title":"Симметрия функции Ind","page":"59","chapter":6,"statement":"\\begin{corollary}~\\label{cor01symmetry} Для $a,b\\geqslant 1$ имеет место $\\operatorname{Ind}(\\FD^{(a,b)})=\\operatorname{Ind}(\\FD^{(b,a)})$. \\end{corollary}","lines":["Симметрия функции Ind"]},"corbounds":{"short":"С 2.4.1","title":"Граница минимума irr через n и Δ","page":"19","chapter":2,"statement":"\\begin{corollary}~\\label{corbounds} Пусть $M=\\{d_1,\\dots,d_k\\}$, $k\\ge2$, --- мультимножество целых чисел $\\ge2$ с максимумом $\\Delta$, и $n=\\sum_{i=1}^{k}(d_i-1)+2$ --- порядок соответствующих гусеничных деревьев. Тогда \\begin{equation}~\\label{eqqq01corbounds} \\irr_{\\min}(\\TT(M))\\le(\\Delta-2)n+2, \\end{equation} причём равенство достигается тогда и только тогда, когда все $d_i=\\Delta$ или $\\Delta=2$. \\end{corollary}","lines":["Граница минимума irr через n","и Δ"]},"corsmall":{"short":"С 2.2.1","title":"Формулы для коротких хребтов","page":"15","chapter":2,"statement":"\\begin{corollary}~\\label{corsmall} Пусть $a_1\\ge\\dots\\ge a_k\\ge 2$ — степени хребта $\\TT$ в невозрастающем порядке. Тогда \\begin{align} &\\operatorname{irr}_{\\min}(\\TT)=\\sum_{i=1}^{k}(a_i-1)^2+a_1-\\sum_{i=2}^{k}a_i+k-2,~\\label{eqq01corsmall} \\\\ &\\operatorname{irr}_{\\max}(\\TT)-\\operatorname{irr}_{\\min}(\\TT)=2\\Bigl(\\sum_{i=2}^{h}a_i-\\sum_{i=k-h+2}^{k}a_i\\Bigr),~\\label{eqq02corsmall} \\end{align} где $h=\\lfloor(k+1)/2\\rfloor$. \\end{corollary}","lines":["Формулы для коротких хребтов"]},"cortreen1":{"short":"С 1.2.1","title":"Критерий дерева по числу рёбер связного графа","page":"5","chapter":1,"statement":"\\begin{corollary}[\\cite{Reinhard6thDiestel}]~\\label{cortreen1} Пусть $G$ — связный граф с $n$ вершинами. Тогда $G$ является деревом $\\TT$ тогда и только тогда, когда $G$ имеет $n-1$ рёбер. \\end{corollary}","lines":["Критерий дерева по числу","рёбер связного графа"]},"def001modifiedsequences":{"short":"О 3.4.4","title":"Два преобразования кратностей","page":"32","chapter":3,"statement":"\\begin{definition}~\\label{def001modifiedsequences} Пусть $\\mathscr{S}=(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ --- химическая последовательность степеней. Определим следующие элементарные модификации $\\mathscr{S}$: \\begin{itemize} \\item $\\mathscr{S}^+ = (1^{a_1-1},\\,2^{a_2-1},\\,3^{a_3+1},\\,4^{a_4+1})$ при условии, что $a_1,a_2\\geq 1$; \\item $\\mathscr{S}^- = (1^{a_1+1},\\,2^{a_2+1},\\,3^{a_3-1},\\,4^{a_4-1})$ при условии, что $a_3,a_4\\geq 1$; \\item $\\mathscr{S}^\\dagger = (1^{a_1+1},\\,2^{a_2-1},\\,3^{a_3+1},\\,4^{a_4-1})$ при условии, что $a_2,a_4\\geq 1$; \\item $\\mathscr{S}^\\ddagger = (1^{a_1-1},\\,2^{a_2+1},\\,3^{a_3-1},\\,4^{a_4+1})$ при условии, что $a_1,a_3\\geq 1$. \\end{itemize} \\end{definition}","lines":["Два преобразования кратностей"]},"def01ce":{"short":"О 6.0.2","title":"Критический показатель слова","page":"52","chapter":6,"statement":"\\begin{definition}\\label{def01ce} Период непустого конечного слова $w$ --- положительное целое $p$, для которого $w_i=w_{i+p}$ при $0\\le i\u003c|w|-p$. При наименьшем периоде $\\pi(w)$ полагаем $e(w)=|w|/\\pi(w)$. Критический показатель $\\CE(x)$ бесконечного слова есть супремум $e(w)$ по его непустым факторам. Для начального показателя $\\ice(x)$ супремум берётся по непустым префиксам. \\end{definition}","lines":["Критический показатель слова"]},"def01families":{"short":"О 3.4.1","title":"Однопараметрические семейства кратностей","page":"31","chapter":3,"statement":"\\begin{definition}~\\label{def01families} Пусть $\\mathscr S_a^{(r)}$ --- семейство кандидатов. Тогда \\begin{enumerate} \\item Для $0 \\le a \\le k$ и $r=1$ положим \\begin{equation}~\\label{eqq01familyr1} \\mathscr S_a^{(1)} = \\big(1^{k+a},\\, 2^{k-a},\\, 3^{k-a},\\, 4^{k+1+a}\\big). \\end{equation} \\item Для $0 \\le a \\le k$ и $r=2$ положим \\begin{equation}~\\label{eqq01familyr2} \\mathscr S_a^{(2)} = \\big(1^{k+a},\\, 2^{k+1-a},\\, 3^{k-a},\\, 4^{k+1+a}\\big), \\end{equation} \\item Для $0 \\le a \\le k$ и $r=3$ положим \\begin{equation}~\\label{eqq01familyr3} \\mathscr S_a^{(3)} = \\big(1^{k+1+a},\\, 2^{k-a},\\, 3^{k+1-a},\\, 4^{k+1+a}\\big), \\end{equation} \\end{enumerate} \\end{definition}","lines":["Однопараметрические семейства","кратностей"]},"def01returnword":{"short":"О 6.2.1","title":"Возвратное слово","page":"56","chapter":6,"statement":"\\begin{definition}~\\label{def01returnword} Пусть $w\\in\\AlphA^{\\N}$, и пусть $u\\in\\mathcal{L}(w)$ встречается в позициях $p_0\u003cp_1\u003cp_2\u003c\\cdots$ слова $w$. \\emph{Возвратными словами} слова $u$ в $w$ называются факторы $w[p_i,p_{i+1})$, $i\\geqslant 0$, где каждый такой фактор начинается с вхождения $u$ и продолжается до места непосредственно перед следующим вхождением. \\end{definition}","lines":["Возвратное слово"]},"def01standardsequence":{"short":"О 6.1.1","title":"Стандартная последовательность слов","page":"53","chapter":6,"statement":"\\begin{definition}~\\label{def01standardsequence} Для заданной последовательности положительных целых чисел $(d_k)_{k\\ge1}$ соответствующая \\emph{стандартная последовательность} $(s_k)_{k\\ge-1}$ определяется формулами \\[ s_{-1} = 1, \\qquad s_0 = 0, \\qquad s_k = s_{k-1}^{\\,d_k}\\,s_{k-2} \\quad (k\\ge1). \\] \\end{definition}","lines":["Стандартная","последовательность слов"]},"defence_sigma":{"short":"Защ. 4","title":"Минимум σ и критерий равенства","page":"7","chapter":1,"statement":"\\item\\label{defence4} Пусть $2\\le d_1\\le\\cdots\\le d_k$, $k\\ge2$. Среди гусениц с этими степенями хребта минимум $\\sigma$ достигается, если сначала выписать $d_i$ с нечётными индексами по возрастанию индексов, затем $d_i$ с чётными индексами по убыванию индексов. При попарно различных степенях порядок единствен с точностью до обращения. Для повторяющихся степеней все случаи равенства описывает критерий по разрезам в теореме~\\ref{thmsigmin001}. {\\small См.~\\ref{thmsigmin001}.}","claim":4,"spec":"Thesis.Trees.Claim4","module":"Thesis/Trees.lean","lines":["Минимум σ и критерий","равенства"]},"domnumn1":{"short":"П 1.1.3","title":"Нижняя граница числа доминирования по степеням","page":"5","chapter":1,"statement":"\\begin{proposition}[\\cite{Slater1995PJV1, Desormeaux2014WyattHaynes}]~\\label{domnumn1} Пусть $d_1\\ge d_2\\ge\\dots\\ge d_n$ — последовательность степеней графа $G$ порядка $n$, и пусть $\\gamma(G)$ — его число доминирования. Тогда \\[ \\gamma(G)\\ \\ge\\ \\min\\Bigl\\{\\,t\\ :\\ t+\\sum_{i=1}^{t}d_i\\ \\ge\\ n\\Bigr\\}. \\] \\end{proposition}","lines":["Нижняя граница числа","доминирования по степеням"]},"end_chemical":{"short":"Закл. хим.","title":"Заключение об области оптимизации","page":"60","chapter":7,"statement":"Для модифицированной полной нерегулярности инвариант определяется кратностями степеней. Теорема~\\ref{Thm02worksep} даёт конечный алгоритм при $\\lambda\\ge0$, учитывающий чётность и границы допустимой области. Теорема~\\ref{thm001global} дополнительно сокращает множество рассматриваемых ветвей при $0\\le\\lambda\\le1$. Условие существования связной реализации можно включить в тот же отбор.","lines":["Заключение об области","оптимизации"]},"end_gut":{"short":"Закл. Gut","title":"Заключение об оптимальных расстановках Gut","page":"60","chapter":7,"statement":"Для индекса Гутмана каждое ребро хребта вносит в сумму расстояний величину, определяемую суммой весов начального отрезка. По теоремам~\\ref{ThmLinDualln1} и~\\ref{ThmLinDualln2} это даёт точный алгоритм для обоих экстремумов. Даже при фиксации всех степеней экстремальное дерево может быть неединственным. Лемма~\\ref{lems001wap} определяет изменение индекса при одном обмене; пример с восемью степенями показывает границу применения такого теста.","lines":["Заключение об оптимальных","расстановках Gut"]},"end_slope":{"short":"Закл. слово","title":"Заключение о наклоне и критическом показателе","page":"61","chapter":7,"statement":"Для рекурсии с начальными словами $1,0$ наклон и частота единицы равны $b/(\\alpha+b)$. В теореме~\\ref{thm01desub} связь между переставленными параметрами установлена для каждого конечного слова и его предела. Получены явные возвратные слова и критерий палиндромных префиксов. Подстановка цепной дроби в классическую формулу штурмова индекса приводит к~\\eqref{eqq01indMP}. В пределах рассматриваемого семейства слова с переставленными параметрами имеют одинаковый критический показатель, хотя при $a\\ne b$ различаются их частоты.","lines":["Заключение о наклоне и","критическом показателе"]},"eq1gut":{"short":"Ф 4.1","title":"Определение индекса Гутмана","page":"43","chapter":4,"statement":"\\begin{equation}\\label{eq1gut} \\Gut(G)=\\sum_{\\{u,v\\}\\subset V(G)}d(u)d(v)\\dist(u,v). \\end{equation}","lines":["Определение индекса Гутмана"]},"eqq01Dsign":{"short":"Ф 3.42","title":"Знак коэффициента D(λ)","page":"38","chapter":3,"statement":"\\begin{equation}~\\label{eqq01Dsign} D(\\lambda) \\;\\begin{cases} >0, & \\lambda\\in[0,2), \\\\ \u003c0, & \\lambda\\in(2,\\infty). \\end{cases} \\end{equation}","lines":["Знак коэффициента D(λ)"]},"eqq01def002Sp":{"short":"О 3.4.3 · Ф 3.27","title":"Семейство при n ≡ 2 (mod 4)","page":"32","chapter":3,"statement":"\\begin{definition} Для $n=4k+2$ и $0\\le p\\le 2k$ положим \\begin{equation}\\label{eqq01def002Sp} \\mathscr S_p := \\big(1^{p},\\,2^{2k+2-p},\\,3^{2k-p},\\,4^{p}\\big). \\end{equation} \\end{definition}","lines":["Семейство при n ≡ 2 (mod 4)"]},"eqq01def002polarized":{"short":"О 3.4.2 · Ф 3.26","title":"Поляризованные последовательности","page":"32","chapter":3,"statement":"\\begin{definition} Для $r\\in\\{2,3\\}$ \\emph{поляризованной последовательностью} $\\mathcal P^{(r)}$ называется последовательность степеней без вершин степени $2$ или $3$: \\begin{equation}\\label{eqq01def002polarized} \\mathcal P^{(2)} = \\big(1^{2k},\\,4^{2k+2}\\big), \\qquad \\mathcal P^{(3)} = \\big(1^{2k+2},\\,4^{2k+1}\\big). \\end{equation} \\end{definition}","lines":["Поляризованные","последовательности"]},"eqq01modsigma":{"short":"Ф 3.21","title":"Полная модифицированная нерегулярность","page":"31","chapter":3,"statement":"\\begin{equation}~\\label{eqq01modsigma} \\sig{\\lambda}(G) = \\sum_{\\{u,v\\} \\subseteq V(G)} |d_G(u) - d_G(v)|^{\\lambda}. \\end{equation}","lines":["Полная модифицированная","нерегулярность"]},"eqq02modsigma":{"short":"Ф 3.22","title":"Формула по четырём кратностям","page":"31","chapter":3,"statement":"\\begin{equation}~\\label{eqq02modsigma} \\sig{\\lambda}(\\mathscr S) = (a_1a_2+a_2a_3+a_3a_4) + (a_1a_3+a_2a_4)\\,2^{\\lambda} + a_1a_4\\,3^{\\lambda} \\end{equation}","lines":["Формула по четырём кратностям"]},"eqq1AlphAadef":{"short":"Ф 6.2","title":"Квадратичный параметр α","page":"53","chapter":6,"statement":"\\begin{equation}\\label{eqq1AlphAadef} \\alpha=\\alpha(a,b)=\\tfrac12(ab+\\sqrt{a^2b^2+4ab}). \\end{equation}","lines":["Квадратичный параметр α"]},"exgutlocal":{"short":"Пр 4.2.1","title":"Локальный максимум Gut ниже глобального","page":"45","chapter":4,"statement":"\\begin{example}\\label{exgutlocal} Условие локального максимума по всем попарным обменам степеней может выполняться строго ниже глобального максимума.\\end{example}","lines":["Локальный максимум Gut ниже","глобального"]},"exguttie":{"short":"Пр 4.1.1","title":"Два неизоморфных максимизатора Gut","page":"44","chapter":4,"statement":"\\begin{example}\\label{exguttie} Для одного мультимножества степеней максимум индекса Гутмана могут достигать две неизоморфные гусеницы.\\end{example}","lines":["Два неизоморфных","максимизатора Gut"]},"general01Gutmanindex":{"short":"Т 1.1.1","title":"Общий индекс Гутмана r-дольного графа","page":"5","chapter":1,"statement":"\\begin{theorem}\\label{general01Gutmanindex} Пусть связный граф $G$ порядка $n\\ge2$ разбит на $r\\ge2$ непустых независимых долей размеров $n_1,\\ldots,n_r$. При $a\\le0$, $b>0$ имеем $\\Gut_{a,b}(G)\\ge\\Gut_{a,b}(K_{n_1,\\ldots,n_r})$. Равенство достигается только для полного многодольного графа. \\end{theorem}","lines":["Общий индекс Гутмана","r-дольного графа"]},"hypothesizeSigmaCatern1":{"short":"З 3.1.1","title":"Точный максимум σ по подмножествам","page":"23","chapter":3,"statement":"\\begin{remark}\\label{hypothesizeSigmaCatern1} Для произвольного числа степеней точный максимум квадратичной вариации вычисляется по подмножествам рангов. Пусть $H(S,j)$ --- максимум на пути из $0$, посещающем ровно ранги $S$ и заканчивающемся в $j\\in S$. Тогда \\[ H(\\{j\\},j)=z_j^2,\\qquad H(S,j)=\\max_{i\\in S\\setminus\\{j\\}}\\{H(S\\setminus\\{j\\},i)+(z_j-z_i)^2\\} \\] для $|S|\\ge2$. К $\\max_j[H(\\{1,\\ldots,k\\},j)+z_j^2]$ прибавляется $\\Gamma(M)$. \\end{remark}","lines":["Точный максимум σ по","подмножествам"]},"ind_ce":{"short":"Т 6.3.3","title":"Точная формула критического показателя","page":"58","chapter":6,"statement":"\\begin{theorem}\\label{ind_ce} Пусть $a,b\\ge1$ и $M=\\max(a,b)$. Тогда критический показатель бесконечного слова равен \\begin{equation}\\label{eqq01indMP} \\CE(\\FD^{(a,b)})=2+M\\left(1+\\frac1{\\alpha}\\right). \\end{equation} \\end{theorem}","lines":["Точная формула критического","показателя"]},"irr_norm":{"short":"Нормировки","title":"Определения irr, σ и полной нерегулярности","page":"4","chapter":1,"statement":"Индекс Альбертсона~\\cite{Albertson1997MO}, рёберный сигма-индекс~\\cite{Dimitrov2018Abdo} и полная нерегулярность~\\cite{Brandt} задаются формулами \\begin{align} \\irr(G)&=\\sum_{uv\\in E}|d(u)-d(v)|,\\qquad \\sigma(G)=\\sum_{uv\\in E}(d(u)-d(v))^2,\\label{defedgeindices}\\\\ \\irr_t(G)&=\\sum_{\\{u,v\\}\\subset V}|d(u)-d(v)| =\\tfrac12\\sum_{u,v\\in V}|d(u)-d(v)|.\\label{defallirr} \\end{align} В первой сумме по вершинам каждая двухэлементная пара учитывается один раз. Среднее абсолютное отклонение степеней от $2m/n$ является другой характеристикой. На пути $P_3$ оно равно $4/9$, тогда как $\\irr(P_3)=2$.","lines":["Определения irr, σ и полной","нерегулярности"]},"irr_wrongbound":{"short":"Оценка irr","title":"Коши и верная оценка через F−2M₂","page":"4","chapter":1,"statement":"Первые два индекса Загреба и сумма кубов степеней суть $M_1=\\sum_v d(v)^2$, $M_2=\\sum_{uv\\in E}d(u)d(v)$ и $F=\\sum_v d(v)^3$. В частности, $\\sum_{uv\\in E}(d(u)+d(v))=M_1$. Раскрывая квадрат в~\\eqref{defedgeindices} и применяя неравенство Коши, получаем \\begin{equation}\\label{normbound} \\sigma=F-2M_2,\\qquad \\irr^2\\le m(F-2M_2). \\end{equation} Для полной суммы квадратов по парам вершин соответствующее тождество имеет вид $\\sigma_t=nM_1-4m^2$. При нормировке дисперсии делением на $n$ это $n^2\\operatorname{Var}(d)$.","lines":["Коши и верная оценка через","F−2M₂"]},"lem0001compatibility":{"short":"Л 3.4.1","title":"Совместимость δ−t по модулю 4","page":"33","chapter":3,"statement":"\\begin{lemma}~\\label{lem0001compatibility} Пусть $n\\geqslant 8$ и $(\\DA, \\DB)\\in\\mathbb{Z}^2$. Предположим, что $(\\DA, \\DB)=(a_1-a_4,\\,a_2-a_3)$ для некоторой графичной химической последовательности степеней $(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ порядка $n$. Тогда $n +\\DA-\\DB \\equiv 0 \\pmod 4$. \\end{lemma}","lines":["Совместимость δ−t по модулю 4"]},"lem001negdef":{"short":"Л 3.4.3","title":"Отрицательная определённость gλ","page":"34","chapter":3,"statement":"\\begin{lemma}~\\label{lem001negdef} Для каждого $\\lambda\\in[0,2)$ и каждой $(\\delta,t)\\ne(0,0)$ имеем $g_\\lambda(\\delta,t)\u003c0$ на $\\mathbb{R}^{2}$, и $g_\\lambda(0,0)=0$. \\end{lemma}","lines":["Отрицательная определённость","gλ"]},"lem001starlikeloseform":{"short":"Л 3.2.1","title":"σ паука через число коротких ветвей","page":"24","chapter":3,"statement":"\\begin{lemma}~\\label{lem001starlikeloseform} Пусть $S=S(n_1,\\dots,n_k)$ --- звездообразное дерево с $k\\ge 3$ ветвями, то есть дерево, полученное присоединением центральной вершины $r$ к одному концу каждого из $k$ попарно непересекающихся путей $\\mathcal P_{n_1},\\dots,\\mathcal P_{n_k}$. Пусть $a=a(S)=|\\{\\,i : n_i=1\\,\\}|$. Тогда \\begin{equation}~\\label{eqqq01lem001starlikeloseform} \\sigma(S)=k\\bigl[(k-2)^2+1\\bigr]+2(k-2)\\,a. \\end{equation} \\end{lemma}","lines":["σ паука через число коротких","ветвей"]},"lem001starlikerr":{"short":"Л 2.4.2","title":"Индекс Альбертсона паука с d ветвями","page":"19","chapter":2,"statement":"\\begin{lemma}\\label{lem001starlikerr} Пусть $S(l_1,\\ldots,l_d)$ состоит из $d\\ge2$ путей длины $l_i\\ge1$ с общим началом. Тогда $\\irr(S)=d(d-1)$. \\end{lemma}","lines":["Индекс Альбертсона паука с d","ветвями"]},"lem001sumsquares":{"short":"Л 3.4.2","title":"Значение при λ=0","page":"33","chapter":3,"statement":"\\begin{lemma}~\\label{lem001sumsquares} Для любой химической последовательности степеней $\\mathscr S=(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ порядка $n$ при $\\lambda=0$ \\begin{equation}~\\label{eqq01lem001sumsquares} \\sig{0}(\\mathscr S) = \\frac{1}{2}\\,\\big(n^2 - \\big(a_1^2+a_2^2+a_3^2+a_4^2\\big)\\big). \\end{equation} \\end{lemma}","lines":["Значение при λ=0"]},"lem001tail":{"short":"Л 3.4.7","title":"Отсечение всех дальних ветвей","page":"40","chapter":3,"statement":"\\begin{lemma}~\\label{lem001tail} Пусть $n\\ge8$ и $\\lambda\\in[0,1]$. У каждой последовательности, глобально максимизирующей $\\sig\\lambda$ среди графичных последовательностей порядка $n$, выполнено $\\delta^2+t^2\u003c20$. То же верно при требовании существования связной реализации. \\end{lemma}","lines":["Отсечение всех дальних ветвей"]},"lem003exact":{"short":"Л 3.4.6","title":"Точный максимум на допустимой ветви","page":"38","chapter":3,"statement":"\\begin{lemma}~\\label{lem003exact} Пусть $n\\ge8$, $0\\le\\lambda\u003c2$ и $\\delta-t\\equiv-n\\pmod4$. Положим \\[ I_n(\\delta,t)=\\{s\\in\\mathbb Z:|t|\\le s\\le n-|\\delta|,\\quad s\\equiv t\\pmod2\\}. \\] Для связной реализации дополнительно требуется $t\\le n+4-3\\delta$. Если множество $I_n(\\delta,t)$ непусто и пара не исключена условием связности, то максимум на соответствующей ветви равен \\begin{equation}\\label{repair:branch} V_{n,\\lambda}(\\delta,t)=g_\\lambda(\\delta,t)+f_{n,\\lambda}(s^*) -|A_\\lambda|\\operatorname{dist}(s^*,I_n(\\delta,t))^2, \\qquad s^*=-\\frac{B_{n,\\lambda}}{2A_\\lambda}. \\end{equation} Все оптимальные $s$ --- ближайшие к $s^*$ точки $I_n(\\delta,t)$. Для двух ветвей разность максимумов равна \\begin{equation}\\label{eqq001lem003exact} V_1-V_2=g_\\lambda(\\delta_1,t_1)-g_\\lambda(\\delta_2,t_2) +|A_\\lambda|(d_2^2-d_1^2), \\end{equation} где $d_i=\\operatorname{dist}(s^*,I_n(\\delta_i,t_i))$. Если $t_1$ нечётно, $t_2$ чётно и ближайшие точки обеих неограниченных решёток чётности лежат в соответствующих $I_n$, то $d_2^2-d_1^2=\\tau(s^*)$. \\end{lemma}","lines":["Точный максимум на допустимой","ветви"]},"lem006cyc":{"short":"Л 2.2.2","title":"Экстремумы вариации циклической расстановки","page":"13","chapter":2,"statement":"\\begin{lemma}\\label{lem006cyc} Для $m\\ge3$, $s_1\\le\\cdots\\le s_m$ и $h=\\lfloor m/2\\rfloor$ по всем циклическим расстановкам этих значений имеем точные границы \\begin{equation}\\label{eqqq01claim02} 2(s_m-s_1)\\le I\\le2\\left(\\sum_{i=m-h+1}^m s_i-\\sum_{i=1}^h s_i\\right). \\end{equation} \\end{lemma}","lines":["Экстремумы вариации","циклической расстановки"]},"lem01alphamonotone":{"short":"Л 6.3.1","title":"Монотонность α(P)","page":"58","chapter":6,"statement":"\\begin{lemma}~\\label{lem01alphamonotone} Функция $\\alpha (P)$ строго возрастает при $P>0$. \\end{lemma}","lines":["Монотонность α(P)"]},"lem01length":{"short":"Л 6.2.1","title":"Длина образа при σd","page":"54","chapter":6,"statement":"\\begin{lemma}~\\label{lem01length} Для каждого конечного слова $x\\in\\AlphA^{*}$ и каждого $d\\geqslant 1$ имеет место $|\\sigma_d(x)| = d\\,|x|_0 + |x|.$ \\end{lemma}","lines":["Длина образа при σd"]},"lem01lockstructure":{"short":"Л 6.3.2","title":"Ind при фиксированном max(a,b)","page":"59","chapter":6,"statement":"\\begin{lemma}~\\label{lem01lockstructure} Пусть $M$ --- положительное целое и $(a,b)$ пробегает все пары с $\\max(a,b)=M$. Тогда $\\operatorname{Ind}(\\FD^{(a,b)})$ является строго убывающей функцией от $m=\\min(a,b)$. \\end{lemma}","lines":["Ind при фиксированном","max(a,b)"]},"lem01primitivity":{"short":"Л 6.2.2","title":"Образ примитивного слова примитивен","page":"54","chapter":6,"statement":"\\begin{lemma}~\\label{lem01primitivity} Если непустое слово $u\\in\\{0,1\\}^*$ примитивно, то $\\sigma_d(u)$ примитивно при каждом целом $d\\ge1$. \\end{lemma}","lines":["Образ примитивного слова","примитивен"]},"lem02exponenttransform":{"short":"Л 6.2.3","title":"Нижняя граница показателя образа фактора и равенство","page":"54","chapter":6,"statement":"\\begin{lemma}~\\label{lem02exponenttransform} Пусть $u\\in\\{0,1\\}^*$ непусто и примитивно, $u_p$ --- собственный префикс $u$, возможно пустой, $j\\ge1$, $w=u^ju_p$. Если $w$ --- фактор $\\FD^{(b,a)}$, то $\\sigma_a(w)$ --- фактор $\\FD^{(a,b)}$, причём \\begin{equation}\\label{eq01exponenttransform} e(\\sigma_a(w))\\ \\ge\\ j+\\frac{a|u_p|_0+|u_p|}{a|u|_0+|u|}. \\end{equation} Равенство выполняется тогда и только тогда, когда $|\\sigma_a(u)|$ является наименьшим периодом $\\sigma_a(w)$. В частности, равенство гарантировано при $j\\ge2$. При $j\\ge2$ и $u_p\\ne\\varepsilon$ равенство $e(\\sigma_a(w))=e(w)$ эквивалентно $|u_p|_0/|u_p|=|u|_0/|u|$. \\end{lemma}","lines":["Нижняя граница показателя","образа фактора и равенство"]},"lem02parity":{"short":"Л 3.4.4","title":"Графичность: критерий чётности","page":"35","chapter":3,"statement":"\\begin{lemma}\\label{lem02parity} При $n\\ge8$ последовательность $\\mathscr S=(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ с неотрицательными кратностями и суммой кратностей $n$ графична в классе простых графов тогда и только тогда, когда $a_1+a_3$ чётно. \\end{lemma}","lines":["Графичность: критерий","чётности"]},"lem03diagonalincreasing":{"short":"Л 6.3.3","title":"Возрастание Ind на диагонали","page":"59","chapter":6,"statement":"\\begin{lemma}\\label{lem03diagonalincreasing} На положительной вещественной полуоси функция $g(M)=2+M+2/(M+\\sqrt{M^2+4})$ строго возрастает. При положительном целом $M$ она совпадает с $\\CE(\\FD^{(M,M)})$. \\end{lemma}","lines":["Возрастание Ind на диагонали"]},"lemAdecomp":{"short":"Л 3.2.3","title":"Разбиение irr и σ на типы рёбер","page":"26","chapter":3,"statement":"\\begin{lemma}~\\label{lemAdecomp} Пусть $\\TT$ --- гусеничное дерево с хребтом $v_1, v_2, \\dots, v_n$ из вершин степени не менее $2$ и последовательностью степеней хребта $\\mathscr{D} = (d_1, \\dots, d_n)$, где $d_i = d_{\\TT}(v_i)$ обозначает степень $v_i$ в $\\TT$. Для $i=1,\\dots,n$ пусть $\\ell_i$ обозначает число висячих вершин, присоединённых к $v_i$, так что $\\ell_1 = d_1 - 1$, $\\ell_n = d_n - 1$ и $\\ell_i = d_i - 2$ для всех $1\u003ci\u003cn$. Тогда \\begin{equation}\\label{eqAirr} \\irr(\\TT) = \\sum_{i=1}^{n-1} |d_i - d_{i+1}| + \\sum_{i=1}^{n} \\ell_i (d_i - 1), \\end{equation} \\begin{equation}\\label{eqAsigma} \\sigma(\\TT) = \\sum_{i=1}^{n-1} (d_i - d_{i+1})^2 + \\sum_{i=1}^{n} \\ell_i (d_i - 1)^2. \\end{equation} \\end{lemma}","lines":["Разбиение irr и σ на типы","рёбер"]},"lemcutform":{"short":"Л 4.2.3","title":"Gut через префиксные суммы","page":"46","chapter":4,"statement":"\\begin{lemma}~\\label{lemcutform} Пусть $\\ell\\ge2$, пусть $m_1,\\dots,m_\\ell\\ge0$ --- целые числа, и пусть $\\TT=\\TT_\\ell(m_1,\\dots,m_\\ell)$ получено присоединением $m_i$ листьев к вершине $i$ пути. Пусть $s_1=s_\\ell=1$, $s_i=2$ при $1\u003ci\u003c\\ell$, $M=\\sum_{i=1}m_i$ и $S_t=\\sum_{i\\le t}m_i$. Тогда \\begin{equation}~\\label{eqqq01lemcutform} \\Gut(\\TT)=2M^2+4\\sum_{t=1}^{\\ell-1}S_t\\,(M-S_t)+\\sum_{i=1}^{\\ell}c_i\\,m_i+C_\\ell, \\end{equation} где $c_i=(s_i-1)+\\sum_{j\\ne i}s_j\\,(2|i-j|+1)$ и $C_\\ell=\\sum_{i\u003cj}s_is_j\\,(j-i)$ зависят только от $\\ell$. \\end{lemma}","lines":["Gut через префиксные суммы"]},"lemleaves":{"short":"Л 2.1.2","title":"Число листьев через степени","page":"12","chapter":2,"statement":"\\begin{lemma}~\\label{lemleaves} Пусть $\\TT$ — дерево, степени невисячих вершин которого равны $d_1,\\dots,d_n\\ge 2$, где $n\\geqslant 1$. Тогда $\\TT$ имеет \\begin{equation}~\\label{eq2lemmaworkn1} \\ell(\\mathscr{D})=\\sum_{i=1}^n d_i - 2n + 2, \\end{equation} висячих вершин, и $|V(\\TT)|=n+\\ell$. \\end{lemma}","lines":["Число листьев через степени"]},"lemm01Total":{"short":"Л 2.1.1","title":"Формула полной нерегулярности","page":"11","chapter":2,"statement":"\\begin{lemma}[Ali, A. и др.~\\cite{Albalahi2025DimitrovAli}]~\\label{lemm01Total} Пусть $d_1\\ge d_2\\ge\\dots\\ge d_n$ — степени графа $G$ и $m=|E(G)|$. Тогда \\begin{equation}~\\label{eqqq01lemm01Total} \\operatorname{irr}_t(G)=2(n+1)m-2\\sum_{i=1}^{n}i\\,d_i . \\end{equation} \\end{lemma}","lines":["Формула полной нерегулярности"]},"lemmaboundAlbertsonn2":{"short":"Л 2.4.1","title":"Двусторонняя оценка irr через Δ","page":"18","chapter":2,"statement":"\\begin{lemma}\\label{lemmaboundAlbertsonn2} Для дерева порядка $n\\ge3$ с максимальной степенью $\\Delta$ имеем $\\Delta(\\Delta-1)\\le\\irr(T)\\le(n-1)(\\Delta-1)$. \\end{lemma}","lines":["Двусторонняя оценка irr через","Δ"]},"lemmastep2Albertsonn2":{"short":"Л 2.4.3","title":"Путь как единственный минимизатор irr","page":"19","chapter":2,"statement":"\\begin{lemma}\\label{lemmastep2Albertsonn2} Для любого дерева $T$ порядка $n\\ge3$ имеем $\\irr(T)\\ge\\irr(P_n)=2$, причём равенство характеризует путь. \\end{lemma}","lines":["Путь как единственный","минимизатор irr"]},"lemmastep2Sigman1":{"short":"Л 3.3.1","title":"Границы σ через листья и Δ","page":"29","chapter":3,"statement":"\\begin{lemma}~\\label{lemmastep2Sigman1} Пусть $T\\in\\mathcal T_{n,\\Delta}$, $n\\ge3$, и пусть $\\ell$ --- число его висячих вершин. Тогда \\[ \\ell\\ \\le\\ \\sigma(T)\\ \\le\\ (n-1)(\\Delta-1)^2. \\] Нижняя оценка достигается тогда и только тогда, когда $T\\cong\\mathcal P_n$, а верхняя --- тогда и только тогда, когда $T\\cong K_{1,n-1}$. \\end{lemma}","lines":["Границы σ через листья и Δ"]},"lemn1gut":{"short":"Л 4.0.1","title":"Разрез дерева и тождество Гутмана — Винера","page":"43","chapter":4,"statement":"\\begin{lemma}\\label{lemn1gut} Ребро дерева порядка $n$ выделяет компоненты размеров $s,n-s$. Суммы степеней исходного дерева в этих компонентах равны $2s-1,2(n-s)-1$. В частности, \\[ W(T)=\\sum_{e}s_e(n-s_e),\\qquad \\Gut(T)=4W(T)-(n-1)(2n-1). \\] \\end{lemma}","lines":["Разрез дерева и тождество","Гутмана — Винера"]},"lemrea001rr":{"short":"Л 4.2.2","title":"Перестановочное неравенство","page":"46","chapter":4,"statement":"\\begin{lemma}\\label{lemrea001rr} Если $v_1\\le\\cdots\\le v_k$ и $w_1\\le\\cdots\\le w_k$, то максимум $\\sum_i w_i v_{\\pi(i)}$ достигается при совпадающем порядке, минимум --- при обратном. \\end{lemma}","lines":["Перестановочное неравенство"]},"lemred0005":{"short":"Л 2.2.1","title":"irr: постоянная часть и вариация","page":"13","chapter":2,"statement":"\\begin{lemma}\\label{lemred0005} Положим $D(M)=\\sum_{d\\in M}(d-1)(d-2)$, считая элементы с кратностями. Для расстановки $x=(x_1,\\dots,x_k)$ выполнено \\begin{equation}\\label{eqqq01lemred0005} \\irr(T)=D(M)-2+x_1+x_k+\\sum_{i=1}^{k-1}|x_i-x_{i+1}|. \\end{equation} \\end{lemma}","lines":["irr: постоянная часть и","вариация"]},"lems001wap":{"short":"Л 4.2.1","title":"Изменение Gut при перестановке","page":"45","chapter":4,"statement":"\\begin{lemma}~\\label{lems001wap} Пусть $\\TT$ --- гусеничное дерево со степенями хребта $(d_1,\\dots,d_k)$, $n=\\sum(d_i-1)+2$. Для $1\\le a\u003cb\\le k$ пусть $\\TT'$ получено из $\\TT$ перестановкой $d_a$ и $d_b$, и положим $\\delta=d_b-d_a$. Тогда \\begin{equation}~\\label{eqqq01lems001wap} \\Gut(\\TT')-\\Gut(\\TT)=4\\delta\\sum_{i=a}^{b-1}\\bigl(n-2A_i-\\delta\\bigr). \\end{equation} \\end{lemma}","lines":["Изменение Gut при","перестановке"]},"lemsigred":{"short":"Л 3.1.2","title":"σ как циклическая квадратичная сумма","page":"22","chapter":3,"statement":"\\begin{lemma}\\label{lemsigred} Положим $z_0=0$, а по хребту $z_i=x_i-1$, $1\\le i\\le k$. Дополним список ребром, возвращающим последний элемент к нулю. Тогда $\\sigma(T)=\\Gamma(M)+Q(C)$, где $\\Gamma(M)=\\sum_{d\\in M}(d-2)(d-1)^2$ и $Q(C)=\\sum_{uv\\in E(C)}(z_u-z_v)^2$. \\end{lemma}","lines":["σ как циклическая","квадратичная сумма"]},"lemstarliken200":{"short":"Л 3.2.2","title":"Перенос вершины между ветвями","page":"25","chapter":3,"statement":"\\begin{lemma}~\\label{lemstarliken200} Пусть $S=S(n_1,\\dots,n_k)$ --- звездообразное дерево с $k\\ge 3$ ветвями, и пусть $n_i=1$ и $n_j\\ge 3$ для некоторых $i\\ne j$. Пусть $S^{*}=S(n_1,\\dots,n_i+1,\\dots,n_j-1,\\dots,n_k)$ --- звездообразное дерево, полученное из $S$ перенесением концевой вершины $j$-й ветви к концевой вершине $i$-й ветви. Тогда $\\sigma(S)-\\sigma(S^{*})=2(k-2)>0$. \\end{lemma}","lines":["Перенос вершины между ветвями"]},"lesegma3":{"short":"Л 3.1.1","title":"σ: хребет длины 3","page":"22","chapter":3,"statement":"\\begin{lemma}~\\label{lesegma3} Пусть $\\TT$ --- гусеничное дерево с хребтом $v_1v_2v_3$ и степенями хребта $(d_1,d_2,d_3)$, где $d_i\\geqslant 2, i=1,2,3$. Тогда \\begin{equation}\\label{eqlesegma3n1} \\sigma(\\TT)=\\sum_{i=1}^{3}(d_i-1)^3+\\sum_{i=1}^{2}(d_i-d_{i+1})^2-(d_2-1)^2. \\end{equation} \\end{lemma}","lines":["σ: хребет длины 3"]},"lesigma2":{"short":"Л 3.1.3","title":"Точные экстремумы σ на четырёх степенях","page":"23","chapter":3,"statement":"\\begin{lemma}\\label{lesigma2} Пусть $2\\le d_1\\le d_2\\le d_3\\le d_4$, $z_0=0$, $z_i=d_i-1$. Минимум равен $\\Gamma(M)+Q(0,1,3,4,2)$, максимум равен $\\Gamma(M)+Q(0,4,1,2,3)$. Последний ранг в каждом списке соединяется с нулём. \\end{lemma}","lines":["Точные экстремумы σ на","четырёх степенях"]},"lowerboundSigmastep2":{"short":"П 3.3.2","title":"Нижняя оценка σ через Δ","page":"28","chapter":3,"statement":"\\begin{proposition}\\label{lowerboundSigmastep2} На гусенице порядка $n\\ge3$ с максимальной степенью $\\Delta$ выполнено $\\sigma(T)\\ge\\Delta(\\Delta-1)$. Для $\\Delta=2$ оценка точна при каждом $n\\ge3$. \\end{proposition}","lines":["Нижняя оценка σ через Δ"]},"maxtreejas":{"short":"Т 1.2.1","title":"Экстремумы полной нерегулярности деревьев","page":"6","chapter":1,"statement":"\\begin{theorem}\\label{maxtreejas} На классе деревьев порядка $n\\ge3$ минимум $\\irr_t$ равен $2(n-2)$, а максимум равен $(n-1)(n-2)$. \\end{theorem}","lines":["Экстремумы полной","нерегулярности деревьев"]},"numbercaterpillartree":{"short":"П 1.2.1","title":"Число гусеничных деревьев","page":"6","chapter":1,"statement":"\\begin{proposition}\\label{numbercaterpillartree} Число неизоморфных гусениц порядка $n\\ge3$ равно $2^{n-4}+2^{\\lfloor n/2\\rfloor-2}$. \\end{proposition}","lines":["Число гусеничных деревьев"]},"proSigmaCaterpillarn1":{"short":"П 3.1.2","title":"σ: одинаковое число листьев","page":"22","chapter":3,"statement":"\\begin{proposition}\\label{proSigmaCaterpillarn1} Пусть $n\\ge2$ и $m\\ge1$, и пусть $\\TT$ --- гусеничное дерево с хребтом $x_1x_2\\cdots x_n$, в котором каждая $x_i$ смежна ровно с $m$ висячими вершинами $y_{i,1},\\dots,y_{i,m}$. Тогда \\begin{equation}~\\label{eqqq01proSigmaCaterpillarn1} \\sigma(\\TT)=\\begin{cases} 2m^3, & n=2,\\\\[2pt] 2m^3+(n-2)\\,m\\,(m+1)^2+2, & n\\ge3. \\end{cases} \\end{equation} \\end{proposition}","lines":["σ: одинаковое число листьев"]},"problemn2":{"short":"Т 4.2.1","title":"M₁ и M₂ после висячих расширений","page":"47","chapter":4,"statement":"\\begin{theorem}\\label{problemn2} Пусть $n\\ge3$, $p\\ge1$ и $h\\ge1$. На $j$-м шаге присоединим к каждому текущему листу $b_j\\ge1$ новых листьев. Положим $P_0=1$, $P_j=\\prod_{t=1}^j b_t$, $s_1=s_n=p+1$, $s_i=p+2$ при $1\u003ci\u003cn$. Тогда \\begin{align*} M_1={}&\\sum_{i=1}^n s_i^2+np\\sum_{j=1}^hP_{j-1}(1+b_j)^2+npP_h,\\\\ M_2={}&\\sum_{i=1}^{n-1}s_i s_{i+1}+p(1+b_1)\\sum_i s_i\\\\ &+np\\sum_{j=1}^{h-1}P_j(1+b_j)(1+b_{j+1})+npP_h(1+b_h). \\end{align*} \\end{theorem}","lines":["M₁ и M₂ после висячих","расширений"]},"projas":{"short":"П 2.3.3","title":"irr: одинаковое число листьев","page":"17","chapter":2,"statement":"\\begin{proposition}\\label{projas} Пусть $P_k$ --- выделенный путь, и к каждой его вершине присоединено $m\\ge1$ листьев. Индекс полученного дерева при $k=1$ равен $m(m-1)$, при $k=2$ равен $2m^2$, а при $k\\ge3$ равен $km(m+1)-2m+2$. \\end{proposition}","lines":["irr: одинаковое число листьев"]},"prop001convergentidentity":{"short":"П 6.3.2","title":"Длины и знаменатели подходящих дробей","page":"58","chapter":6,"statement":"\\begin{proposition}\\label{prop001convergentidentity} При $n\\ge1$ длина $q_n$ равна знаменателю подходящей дроби наклона с номером $n-1$, если нулевая подходящая дробь равна $0/1$. \\end{proposition}","lines":["Длины и знаменатели","подходящих дробей"]},"prop001r1":{"short":"Л 3.4.5","title":"Максимизаторы gλ по вычетам","page":"36","chapter":3,"statement":"\\begin{lemma}~\\label{prop001r1} Пусть $\\lambda\\in[0,1]$ и $\\delta-t\\equiv-r\\pmod4$. На этой решётке функция $g_\\lambda$ имеет следующие максимизаторы: при $r=0$ --- $(0,0)$; при $r=1$ --- $(0,1)$, а при $\\lambda=0$ также $(-1,0)$; при $r=2$ --- $(1,-1)$ и $(-1,1)$; при $r=3$ --- $(0,-1)$, а при $\\lambda=0$ также $(1,0)$. Перечень полон. Это утверждение относится к $g_\\lambda$, а не непосредственно к $\\sig\\lambda$. \\end{lemma}","lines":["Максимизаторы gλ по вычетам"]},"prop001r13":{"short":"П 3.4.4","title":"Сравнение ветвей при r=1,3","page":"39","chapter":3,"statement":"\\begin{proposition}~\\label{prop001r13} Пусть $n\\equiv r\\pmod4$, $r=1$ или $3$, $n\\ge8$ и $\\lambda\\in[0,2)$. Сравним только две ветви: $b_o=(0,1)$ и $b_e=(-1,0)$ при $r=1$; $b_o=(0,-1)$ и $b_e=(1,0)$ при $r=3$. Положим $d_o=\\operatorname{dist}(s^*,I_n(b_o))$, $d_e=\\operatorname{dist}(s^*,I_n(b_e))$. Тогда \\begin{equation}\\label{eqq01prop001r13} \\Delta_r=V_{n,\\lambda}(b_o)-V_{n,\\lambda}(b_e) =\\frac{3^\\lambda-1}{4}+|A_\\lambda|(d_e^2-d_o^2). \\end{equation} Если $\\Delta_r>0$, выигрывает $b_o$; если $\\Delta_r\u003c0$, выигрывает $b_e$; при $\\Delta_r=0$ обе ветви дают один максимум. Когда ближайшие точки неограниченных решёток допустимы, $d_e^2-d_o^2=\\tau(s^*)$. Утверждение не является классификацией всех глобальных максимумов. \\end{proposition}","lines":["Сравнение ветвей при r=1,3"]},"prop01AlphAacf":{"short":"П 6.1.2","title":"α = bχ для периодической дроби","page":"53","chapter":6,"statement":"\\begin{proposition}\\label{prop01AlphAacf} Выполняется равенство $\\alpha=b\\chi(a,b)$. \\end{proposition}","lines":["α = bχ для периодической","дроби"]},"prop01alphareduced":{"short":"П 6.3.1","title":"α — приведённая иррациональность","page":"57","chapter":6,"statement":"\\begin{proposition}~\\label{prop01alphareduced} Для всех целых $a,b\\geqslant 1$ число $\\alpha =\\alpha (a,b)$ является приведённой квадратичной иррациональностью. \\end{proposition}","lines":["α — приведённая","иррациональность"]},"prop01celowerbound":{"short":"Л 6.2.4","title":"Нижняя граница критического показателя","page":"55","chapter":6,"statement":"\\begin{lemma}~\\label{prop01celowerbound} Для $a,b\\ge1$ имеем \\[ \\CE(\\FD^{(a,b)})\\ge \\sup\\left\\{j+\\frac{a|u_p|_0+|u_p|}{a|u|_0+|u|}: u^ju_p\\text{ --- фактор }\\FD^{(b,a)}\\right\\}, \\] где $u$ непусто и примитивно, $u_p$ --- собственный префикс $u$, $j\\ge1$. \\end{lemma}","lines":["Нижняя граница критического","показателя"]},"prop01fabisstandard":{"short":"П 6.1.1","title":"Совпадение со стандартной последовательностью","page":"53","chapter":6,"statement":"\\begin{proposition}~\\label{prop01fabisstandard} Для любых $a,b\\geqslant 1$ бипериодическое слово Фибоначчи $f^{(a,b)}$ совпадает со стандартной последовательностью $s^{(d_1,d_2,d_3,\\ldots)}$ с направляющей последовательностью \\[ (d_1,d_2,d_3,d_4,\\ldots) = (a,b,a,b,\\ldots), \\qquad d_k = \\begin{cases} a & k \\text{ нечётно},\\\\ b & k \\text{ чётно}.\\end{cases} \\] \\end{proposition}","lines":["Совпадение со стандартной","последовательностью"]},"prop01icelowerbound":{"short":"П 6.2.2","title":"Нижняя граница начального показателя","page":"55","chapter":6,"statement":"\\begin{proposition}~\\label{prop01icelowerbound} Для каждого $n\\ge1$ слово $s_n^{d_{n+1}}s_{n-1}=s_{n+1}$ является префиксом $\\FD^{(a,b)}$. Следовательно, \\[ \\ice(\\FD^{(a,b)})\\ge \\sup_{n\\ge1}\\left(d_{n+1}+\\frac{L_{n-1}}{L_n}\\right). \\] \\end{proposition}","lines":["Нижняя граница начального","показателя"]},"prop06squeeze":{"short":"П 3.4.2","title":"Критерий локальной оптимальности при двух модификациях","page":"33","chapter":3,"statement":"\\begin{proposition}~\\label{prop06squeeze} Пусть $\\mathscr S=(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ графична, $n\\ge8$, $a_i\\ge1$ и $\\lambda\\in[0,1]$. Обозначим $L=\\DA(2^\\lambda-3^\\lambda-1)+\\DB(2-2^\\lambda)$ и $c=3+3^\\lambda-2^{\\lambda+1}$. Тогда \\begin{equation}\\label{eqq01prop06squeeze} \\sig\\lambda(\\mathscr S^\\dagger)-\\sig\\lambda(\\mathscr S)=L-c,\\qquad \\sig\\lambda(\\mathscr S^\\ddagger)-\\sig\\lambda(\\mathscr S)=-L-c. \\end{equation} Обе модификации не увеличивают значение тогда и только тогда, когда $|L|\\le c$. Это условие локальной оптимальности относительно двух указанных модификаций. Глобальная оптимальность из него не следует. \\end{proposition}","lines":["Критерий локальной","оптимальности при двух","модификациях"]},"prop3spine":{"short":"П 2.2.2","title":"irr: разность экстремумов при k=3","page":"16","chapter":2,"statement":"\\begin{proposition}\\label{prop3spine} Пусть $d_1\\ge d_2\\ge d_3\\ge 2$ и пусть $\\mathcal C$ — класс гусеничных деревьев, последовательность степеней хребта которых является упорядочением $(d_1,d_2,d_3)$. Тогда \\[ \\operatorname{irr}_{\\max}(\\TT)-\\operatorname{irr}_{\\min}(\\TT)=2(d_2-d_3). \\] Если $d_2>d_3$, то максимум достигается в точности тогда, когда средняя степень хребта равна $d_3$, а минимум — в точности тогда, когда она равна $d_1$ или $d_2$. Если $d_2=d_3$, то разность равна $0$. \\end{proposition}","lines":["irr: разность экстремумов при","k=3"]},"prop:r2":{"short":"П 3.4.3","title":"Сравнение ветвей при r=2","page":"39","chapter":3,"statement":"\\begin{proposition}~\\label{prop:r2} Пусть $n\\equiv2\\pmod4$, $n\\ge10$, $\\lambda\\in[0,1]$. При сравнении только ветвей $(\\delta,t)=(1,-1),(-1,1)$ и $(0,2),(0,-2)$ первые две слабо доминируют последние две. Положим $d_o=\\operatorname{dist}(s^*,I_n(1,-1))$ и $d_e=\\operatorname{dist}(s^*,I_n(0,2))$. Разность их лучших значений равна $|A_\\lambda|(1+d_e^2-d_o^2)$; равенство имеет место в точности при $d_o^2=1+d_e^2$. Если ближайшие точки неограниченных решёток допустимы, равенство эквивалентно $s^*\\in2\\mathbb Z$. Это сравнение само по себе не исключает другие ветви. \\end{proposition}","lines":["Сравнение ветвей при r=2"]},"propMaximumn1trees":{"short":"П 2.1.1","title":"irr: звезда и путь","page":"11","chapter":2,"statement":"\\begin{proposition}\\label{propMaximumn1trees} Пусть $n\\ge 2$. Тогда $\\operatorname{irr}_{\\max}(\\mathcal T_n)=(n-1)(n-2)$, причём оно достигается только на звезде $K_{1,n-1}$, и \\[ \\operatorname{irr}_{\\min}(\\mathcal T_n)=\\begin{cases}0,& n=2,\\\\ 2,& n\\ge 3,\\end{cases} \\] причём при $n\\geqslant 3$ оно достигается только на пути $\\mathcal P_n$. \\end{proposition}","lines":["irr: звезда и путь"]},"propfib":{"short":"П 2.3.4","title":"irr: степени Фибоначчи","page":"18","chapter":2,"statement":"\\begin{proposition}~\\label{propfib} Пусть $F_1=F_2=1$, $F_{i+1}=F_i+F_{i-1}$, и пусть $\\TT_m$ --- гусеничное дерево, где $m\\ge4$, со степенями хребта $(F_3,F_4,\\dots,F_m)$. Тогда \\begin{equation}~\\label{eqqq01propfib} \\irr(\\TT_m)=F_mF_{m+1}-3F_{m+2}+2F_m+2m+1 , \\end{equation} \\end{proposition}","lines":["irr: степени Фибоначчи"]},"propfibsig":{"short":"П 3.2.2","title":"σ: степени Фибоначчи","page":"26","chapter":3,"statement":"\\begin{proposition}~\\label{propfibsig} Пусть $m\\ge4$, а $\\TT_m$ --- гусеничное дерево с хребтом $v_1v_2\\cdots v_{m-2}$ таким, что $d(v_j)=F_{j+2}$, где $v_1$ несёт одну висячую вершину, $v_{m-2}$ несёт $F_m-1$, а каждая $v_j$ при $1\u003cj\u003cm-2$ несёт $F_{j+2}-2$. Тогда \\begin{equation}~\\label{eqqq01propfibsig} \\sigma(\\TT_m)=1+(F_m-1)^3+\\sum_{i=4}^{m-1}(F_i-2)(F_i-1)^2+\\bigl(F_{m-2}F_{m-1}-1\\bigr). \\end{equation} \\end{proposition}","lines":["σ: степени Фибоначчи"]},"propgutformula":{"short":"П 4.2.1","title":"Gut через типы пар вершин","page":"46","chapter":4,"statement":"\\begin{proposition}\\label{propgutformula} Пусть $\\TT$ --- гусеничное дерево с хребтом $v_1v_2\\cdots v_k$, $k\\ge2$, где $d_i=d_{\\TT}(v_i)\\ge2$. Пусть $s_1=s_k=1$, $s_i=2$ при $1\u003ci\u003ck$, и $p_i=d_i-s_i$ --- число висячих вершин при $v_i$. Тогда \\[ \\Gut(\\TT)=\\sum_{i=1}^{k}\\bigl(d_ip_i+p_i(p_i-1)\\bigr) +\\sum_{1\\le i\u003cj\\le k}\\Bigl(d_id_j\\,a_{ij}+(d_ip_j+d_jp_i)(a_{ij}+1) +p_ip_j(a_{ij}+2)\\Bigr), \\] где $a_{ij}=j-i$. \\end{proposition}","lines":["Gut через типы пар вершин"]},"propjoinirr":{"short":"П 1.1.1","title":"Нерегулярность соединения графов","page":"4","chapter":1,"statement":"\\begin{proposition}~\\label{propjoinirr} Пусть $G,H$ — графы, для которых $n_1=|V(G)|\\ge n_2=|V(H)|\\ge 1$. Тогда \\begin{equation}~\\label{eqboundjoin} \\operatorname{irr}(G+H)\\le \\operatorname{irr}(G)+\\operatorname{irr}(H)+n_1n_2(n_1-1). \\end{equation} Равенство выполняется тогда и только тогда, когда $G=\\overline{K_{n_1}}$ и $H=K_{n_2}$ (при $n_1=n_2\\ge 2$ также когда $G=K_{n_1}$ и $H=\\overline{K_{n_2}}$); в частности, \\eqref{eqboundjoin} является точной оценкой. \\end{proposition}","lines":["Нерегулярность соединения","графов"]},"propleaves":{"short":"П 2.1.3","title":"irr ≤ ℓ(ℓ−1) и равенство","page":"12","chapter":2,"statement":"\\begin{proposition}~\\label{propleaves} Пусть $T$ --- дерево с $n\\ge3$ вершинами и $\\ell$ листьями. Тогда $\\irr(T)\\le\\ell(\\ell-1)$. Равенство выполняется тогда и только тогда, когда в $T$ не более одной вершины степени строго больше $2$, то есть $T$ --- подразделение звезды, включая путь. \\end{proposition}","lines":["irr ≤ ℓ(ℓ−1) и равенство"]},"proplusmnus01":{"short":"П 3.4.1","title":"Изменение σᵗ при операциях ±","page":"32","chapter":3,"statement":"\\begin{proposition}~\\label{proplusmnus01} Пусть $a_1,a_2,a_3,a_4\\geqslant 1$ --- графичная химическая последовательность степеней и пусть $\\lambda \\in [0,1]$. Тогда \\begin{equation}~\\label{eqqplussigma} \\sig{\\lambda }(\\mathscr S^+)-\\sig{\\lambda}(\\mathscr S)= \\DA(2^{\\lambda}+3^{\\lambda}-1)+2^{\\lambda}\\DB +\\bigl(1-2^{\\lambda+1}-3^{\\lambda}\\bigr), \\end{equation} \\begin{equation}~\\label{eqqminussigma} \\sig{\\lambda}(\\mathscr S^-)-\\sig{\\lambda}(\\mathscr S)= -\\DA(2^{\\lambda}+3^{\\lambda}-1)-2^{\\lambda}\\DB +\\bigl(1-2^{\\lambda+1}-3^{\\lambda}\\bigr). \\end{equation} \\end{proposition}","lines":["Изменение σᵗ при операциях ±"]},"propmono":{"short":"П 2.3.1","title":"Унимодальный хребет минимизирует irr","page":"16","chapter":2,"statement":"\\begin{proposition}~\\label{propmono} Пусть $\\TT$ — гусеничное дерево с последовательностью степеней хребта $(d_1,\\dots,d_k)$, $k\\ge 2$, $\\Delta=\\max d_i$. Если последовательность унимодальна, то \\begin{equation}~\\label{eqq01propmono} \\irr(\\TT)=\\sum_{i=1}^{k}d_i^2-3\\sum_{i=1}^{k}d_i+2\\Delta+2k-2, \\end{equation} и это есть минимум $\\operatorname{irr}$ по всем гусеничным деревьям с теми же степенями хребта. \\end{proposition}","lines":["Унимодальный хребет","минимизирует irr"]},"proposition_3.3.1":{"short":"П 3.3.1","title":"Точные общие границы σ для дерева","page":"28","chapter":3,"statement":"\\begin{proposition}\\label{proposition_3.3.1} Для дерева $T$ порядка $n\\ge3$ имеем $2\\le\\sigma(T)\\le(n-1)(n-2)^2$. Нижнее равенство характеризует путь, верхнее --- звезду. \\end{proposition}","lines":["Точные общие границы σ для","дерева"]},"propsigM1":{"short":"П 3.3.3","title":"Нижняя граница σ через M₁","page":"28","chapter":3,"statement":"\\begin{proposition}\\label{propsigM1} Для каждого дерева $\\TT$ порядка $n\\ge3$ с максимальной степенью $\\Delta$ \\[ \\sigma(\\TT)\\geqslant M_1(\\TT)-4(n-1)+2\\Delta. \\] \\end{proposition}","lines":["Нижняя граница σ через M₁"]},"propsigcat":{"short":"П 3.3.4","title":"Границы минимума σ через n и Δ","page":"28","chapter":3,"statement":"\\begin{proposition}\\label{propsigcat} Для фиксированного мультимножества степеней хребта гусеницы порядка $n\\ge3$ имеем $\\Delta(\\Delta-1)\\le\\sigma_{\\min}\\le(\\Delta-1)((\\Delta-2)n+2)$. При одной невисячей вершине верхняя граница достигается. \\end{proposition}","lines":["Границы минимума σ через n и","Δ"]},"propsigma":{"short":"П 2.4.1","title":"Границы irr через F и M₂","page":"18","chapter":2,"statement":"\\begin{proposition}~\\label{propsigma} Пусть $G$ — нерегулярный граф с $m$ рёбрами, \\begin{equation}~\\label{eqqq01propsigma} \\frac{F(G)-2M_2(G)}{\\Delta-\\delta}\\ \\le\\ \\operatorname{irr}(G)\\ \\le\\ \\sqrt{m\\,(F(G)-2M_2(G))}. \\end{equation} \\end{proposition}","lines":["Границы irr через F и M₂"]},"propsigmaspine":{"short":"П 3.1.1","title":"Формула σ через хребет","page":"21","chapter":3,"statement":"\\begin{proposition}\\label{propsigmaspine} Пусть $\\TT$ --- гусеничное дерево с последовательностью степеней хребта $(d_1,\\dots,d_k)$, $k\\ge2$. Тогда \\begin{equation}~\\label{eqqq01propsigmaspine} \\sigma(\\TT)=(d_1-1)^3+(d_k-1)^3+\\sum_{i=2}^{k-1}(d_i-1)^2(d_i-2)+\\sum_{i=1}^{k-1}(d_i-d_{i+1})^2 . \\end{equation} \\end{proposition}","lines":["Формула σ через хребет"]},"propstar":{"short":"П 2.3.2","title":"irr: внутренний подграф K₁,₃","page":"17","chapter":2,"statement":"\\begin{proposition}\\label{propstar} Если невисячие вершины дерева порождают $K_{1,3}$, обозначим полную степень центральной вершины через $d$ и степени трёх её соседей через $b_1,b_2,b_3$. Тогда $\\irr=(d-3)(d-1)+\\sum_{i=1}^3[(b_i-1)^2+|b_i-d|]$. \\end{proposition}","lines":["irr: внутренний подграф K₁,₃"]},"propzagreb":{"short":"П 2.1.2","title":"Границы irr через M₁","page":"12","chapter":2,"statement":"\\begin{proposition}~\\label{propzagreb} Для каждого дерева $\\TT$ с $n\\ge 3$ вершинами и максимальной степенью $\\Delta$ \\begin{equation}~\\label{eqqq01propzagreb} M_1(\\TT)-4(n-1)+2\\Delta\\ \\le\\ \\operatorname{irr}(\\TT)\\ \\le\\ M_1(\\TT)-2(n-1). \\end{equation} Равенство справа достигается в точности на звезде $\\mathcal S_n$. Равенство слева достигается тогда и только тогда, когда существует корень степени $\\Delta$, от которого степени не возрастают вдоль каждого простого пути. \\end{proposition}","lines":["Границы irr через M₁"]},"prozagrebAlbertsonn1":{"short":"П 2.4.2","title":"irr при равных внутренних степенях","page":"18","chapter":2,"statement":"\\begin{proposition}\\label{prozagrebAlbertsonn1} Пусть $\\TT$ — гусеничное дерево с хребтом $v_1\\cdots v_k$, $k\\ge3$, и степенями хребта $d_i=\\deg(v_i)$, такими что $d_1 \\ge\\ d_2=\\dots=d_{k-1}\\ge\\ d_k=\\delta\\ \\ge 2$, где $d_1=\\Delta$, $d_{k-1}=\\lambda$, $d_k=\\delta\\geqslant$ и $\\lambda=\\tfrac{\\Delta+\\delta}{2}\\in\\mathbb Z$. Тогда \\begin{align} \\operatorname{irr}(\\TT)&=(\\Delta-1)^2+(\\delta-1)^2+(k-2)(\\lambda-1)(\\lambda-2)+\\Delta-\\delta, \\label{eqqq01prozagrebAlbertsonn1}\\\\ \\operatorname{irr}(\\TT)&=M_1(\\TT)-2\\sum_{i=2}^{k-1}d_i-2\\delta-2(n-k). \\label{eqqq02prozagrebAlbertsonn1} \\end{align} \\end{proposition}","lines":["irr при равных внутренних","степенях"]},"relationn1pro":{"short":"П 3.3.5","title":"Зигзаг не увеличивает σ","page":"30","chapter":3,"statement":"\\begin{proposition}\\label{relationn1pro} Пусть $2\\le d_1\\le\\cdots\\le d_k$, $k\\ge2$. Если $\\TT$ --- произвольное гусеничное дерево с этим мультимножеством степеней хребта, а $\\TT_{\\mathscr D}$ имеет порядок $d_1,d_3,d_5,\\dots,d_6,d_4,d_2$, то $\\sigma(\\TT_{\\mathscr D})\\le\\sigma(\\TT)$. \\end{proposition}","lines":["Зигзаг не увеличивает σ"]},"remarksec3ch301":{"short":"З 2.3.1","title":"Монотонный порядок степеней","page":"17","chapter":2,"statement":"\\begin{remark}\\label{remarksec3ch301} Для неубывающего случая предложение~\\ref{Caterpillar} даёт \\begin{equation}~\\label{eqqq01remarksec3ch301} \\irr(\\TT)=(d_1-1)^2+(d_k-1)^2+\\sum_{i=2}^{k-1}(d_i-1)(d_i-2)+d_k-d_1. \\end{equation} \\end{remark}","lines":["Монотонный порядок степеней"]},"remhy1":{"short":"З 2.2.1","title":"Соседство верхних и нижних рангов","page":"15","chapter":2,"statement":"\\begin{remark}\\label{remhy1} Если две последовательные вершины расширенного цикла входят в верхнюю половину при попарно различных степенях, верхняя граница не достигается. То же справедливо для двух элементов нижней половины, соседство которых сохраняется после исключения медианы. \\end{remark}","lines":["Соседство верхних и нижних","рангов"]},"sharpbound":{"short":"Т 5.3.1","title":"Граница σ и случай равенства","page":"51","chapter":5,"statement":"\\begin{theorem}~\\label{sharpbound} Пусть $\\mathcal{BG}$ --- простой двудольный граф с долями размеров $n_1,n_2$ и по крайней мере одним ребром. Тогда $\\sigma(\\mathcal{BG})\u003cn_1^4+n_2^4$. Более точно, $\\sigma(\\mathcal{BG})\\le n_1n_2\\bigl(\\max\\{n_1,n_2\\}-1\\bigr)^2$, причём равенство имеет место тогда и только тогда, когда $\\mathcal{BG}\\cong K_{1,\\max(n_1,n_2)}$. \\end{theorem}","lines":["Граница σ и случай равенства"]},"theorem_5.2.1":{"short":"Т 5.2.1","title":"Минимум M₁ при заданных долях и числе рёбер","page":"48","chapter":5,"statement":"\\begin{theorem}\\label{theorem_5.2.1} Пусть $0\\le m\\le pq$ и $B(s,m)=(s-r)t^2+r(t+1)^2$, где $m=st+r$, $0\\le r\u003cs$. Минимум $M_1$ по простым двудольным графам с долями $p,q$ и $m$ рёбрами равен $B(p,m)+B(q,m)$. При фиксированных $n=p+q,m$ берётся минимум этого выражения по всем допустимым парам $p,q$. \\end{theorem}","lines":["Минимум M₁ при заданных долях","и числе рёбер"]},"thm001global":{"short":"Т 3.4.5","title":"Точная конечная редукция глобального максимума при λ ∈ [0,1]","page":"41","chapter":3,"statement":"\\begin{theorem}[Точная конечная редукция]\\label{thm001global} Пусть $n\\ge8$, $r=n\\bmod4$ и $\\lambda\\in[0,1]$. Положим \\[ \\mathcal C_r=\\{(\\delta,t)\\in\\mathbb Z^2: \\delta-t\\equiv-r\\pmod4,\\quad\\delta^2+t^2\u003c20\\}. \\] Глобальный максимум $\\sig\\lambda$ среди всех графичных последовательностей порядка $n$ равен \\begin{equation}\\label{repair:global} \\max_{\\substack{(\\delta,t)\\in\\mathcal C_r\\\\I_n(\\delta,t)\\ne\\varnothing}} \\left[g_\\lambda(\\delta,t)+f_{n,\\lambda}(s^*) -|A_\\lambda|\\operatorname{dist}(s^*,I_n(\\delta,t))^2\\right]. \\end{equation} Для максимизации среди последовательностей со связной реализацией в максимум дополнительно включаются только пары $t\\le n+4-3\\delta$. Все максимизирующие последовательности получаются восстановлением~\\eqref{eqq01recover} из всех пар, достигающих~\\eqref{repair:global}, и всех ближайших допустимых $s$. Числа пар в $\\mathcal C_0,\\mathcal C_1,\\mathcal C_2,\\mathcal C_3$ равны соответственно $17,16,12,16$; они не зависят от $n$. \\end{theorem}","lines":["Точная конечная редукция","глобального максимума при λ ∈","[0,1]"]},"thm001lambda2":{"short":"Т 3.4.4","title":"Максимум в семействе при λ=2","page":"41","chapter":3,"statement":"\\begin{theorem}[Вырожденный случай $\\lambda=2$]\\label{thm001lambda2} Для $n=4k+r\\geqslant8$, где $r\\in\\{1,2,3\\}$, при $\\lambda=2$ максимизатор $\\sig{2}$ в рамках семейства $\\mathscr S_a^{(r)}$ есть $\\mathscr S_k^{(r)}$ для каждого $r\\in\\{1,2,3\\}$. \\end{theorem}","lines":["Максимум в семействе при λ=2"]},"thm01alphacf":{"short":"Т 6.3.1","title":"Цепная дробь α","page":"57","chapter":6,"statement":"\\begin{theorem}~\\label{thm01alphacf} Для всех целых $a,b\\geqslant 1$ \\begin{equation}~\\label{eq01alphacf} \\alpha (a,b) \\;=\\; [\\overline{ab,\\,1}]. \\end{equation} \\end{theorem}","lines":["Цепная дробь α"]},"thm01centralpalindrome":{"short":"Т 6.2.6","title":"Палиндромность усечённых слов","page":"56","chapter":6,"statement":"\\begin{theorem}~\\label{thm01centralpalindrome} Для любых $a,b\\geqslant 1$ и любого $n\\geqslant 2$ слово $\\bigl(\\FD^{(a,b)}_n\\bigr)^{-}$ является палиндромом. \\end{theorem}","lines":["Палиндромность усечённых слов"]},"thm01desub":{"short":"Т 6.1.1","title":"Морфизм связывает два семейства","page":"53","chapter":6,"statement":"\\begin{theorem}\\label{thm01desub} Для целых $a,b\\ge1$ и всех $n\\ge0$ выполняется \\[ \\sigma_a(\\FD^{(b,a)}_n)=\\FD^{(a,b)}_{n+1},\\qquad \\FD^{(a,b)}=\\sigma_a(\\FD^{(b,a)}). \\] \\end{theorem}","lines":["Морфизм связывает два","семейства"]},"thm01globalmin":{"short":"Т 6.3.4","title":"Глобальный минимум функции Ind","page":"59","chapter":6,"statement":"\\begin{theorem}~\\label{thm01globalmin} Среди всех $\\FD^{(a,b)}$ с целыми $a,b\\geqslant 1$ величина $\\operatorname{Ind}(\\FD^{(a,b)})$ достигает своего глобального минимума единственным образом при $(a,b)=(1,1)$, со значением $2+\\varphi$. \\end{theorem}","lines":["Глобальный минимум функции","Ind"]},"thm01return0":{"short":"Т 6.2.4","title":"Возвратные слова нуля","page":"56","chapter":6,"statement":"\\begin{theorem}~\\label{thm01return0} Для любых $a,b\\geqslant 1$ возвратными словами буквы $0$ в $\\FD^{(a,b)}$ являются в точности $\\{\\,0,\\ 01\\,\\}.$ \\end{theorem}","lines":["Возвратные слова нуля"]},"thm01slopecf":{"short":"Т 6.3.2","title":"Наклон бипериодического слова и его цепная дробь","page":"58","chapter":6,"statement":"\\begin{theorem}\\label{thm01slopecf} Наклон слова для рекурсии~\\eqref{eqq01biperiodicrecurrence} равен \\begin{equation}\\label{eqq2slopecf} \\theta^{(a,b)}=[0;a+1,\\overline{b,a}]=b/(\\alpha+b). \\end{equation} \\end{theorem}","lines":["Наклон бипериодического слова","и его цепная дробь"]},"thm01trivialinvariants":{"short":"Т 6.2.2","title":"Баланс 1 и абелева сложность 2","page":"55","chapter":6,"statement":"\\begin{theorem}\\label{thm01trivialinvariants} Для всех $a,b\\ge1$ и $L\\ge1$ имеем $B(L)=1$ и $\\mathcal{AC}(L)=2$. \\end{theorem}","lines":["Баланс 1 и абелева сложность","2"]},"thm01vuillon":{"short":"Т 6.2.3","title":"Характеризация Вуйона","page":"56","chapter":6,"statement":"\\begin{theorem}[Вуйон~\\cite{Vuillon2001}] \\label{thm01vuillon} Апериодическое двоичное слово $w$ является словом Штурма тогда и только тогда, когда каждый непустой фактор $u\\in\\mathcal{L}(w)$ имеет ровно два возвратных слова в $w$. \\end{theorem}","lines":["Характеризация Вуйона"]},"thm02freqduality":{"short":"Т 6.2.1","title":"Частоты букв при фиксированных начальных словах","page":"54","chapter":6,"statement":"\\begin{theorem}~\\label{thm02freqduality} Для всех $a,b\\geqslant 1$ частоты букв слова $f^{(a,b)}$ равны \\begin{equation}~\\label{eq01freqcorrected} \\operatorname{freq}_1\\bigl(\\FD^{(a,b)}\\bigr)=\\frac{b}{\\alpha+b}, \\qquad \\operatorname{freq}_0\\bigl(\\FD^{(a,b)}\\bigr)=\\frac{\\alpha}{\\alpha+b}. \\end{equation} \\end{theorem}","lines":["Частоты букв при","фиксированных начальных","словах"]},"thm02return1":{"short":"Т 6.2.5","title":"Возвратные слова единицы","page":"56","chapter":6,"statement":"\\begin{theorem}~\\label{thm02return1} Для любых $a,b\\geqslant 1$ возвратными словами буквы $1$ в $\\FD^{(a,b)}$ являются в точности $\\{\\,1\\,0^a,\\ 1\\,0^{a+1}\\,\\}.$ \\end{theorem}","lines":["Возвратные слова единицы"]},"thm1sigmaindexbipartite01":{"short":"Т 5.2.3","title":"σ полного двудольного графа","page":"50","chapter":5,"statement":"\\begin{theorem}[Секар и др.~\\cite{Sekar}]\\label{thm1sigmaindexbipartite01} Пусть $G = K_{m,n}$ --- полный двудольный граф. Тогда сигма-индекс равен \\[ \\sigma(K_{m,n}) = mn (n-m)^2. \\] \\end{theorem}","lines":["σ полного двудольного графа"]},"thmSigman4":{"short":"Т 3.3.2","title":"irr ≤ σ ≤ (Δ−1)irr","page":"28","chapter":3,"statement":"\\begin{theorem}\\label{thmSigman4} Для дерева с $n\\ge3$ выполняется $\\irr(T)\\le\\sigma(T)\\le(\\Delta-1)\\irr(T)$. \\end{theorem}","lines":["irr ≤ σ ≤ (Δ−1)irr"]},"thmalbertsonn5":{"short":"Т 2.1.1","title":"Нижняя граница irr через M₁","page":"13","chapter":2,"statement":"\\begin{theorem}~\\label{thmalbertsonn5} Пусть $\\TT$ --- дерево порядка $n\\ge3$ с максимальной степенью $\\Delta$. Тогда \\begin{equation}\\label{eq0thmalbertsonn5} \\operatorname{irr}(\\TT)\\ \\ge\\ M_1(\\TT)-4(n-1)+2\\Delta , \\end{equation} \\end{theorem}","lines":["Нижняя граница irr через M₁"]},"thmalltrees":{"short":"Т 2.3.1","title":"Минимум irr по всем деревьям","page":"17","chapter":2,"statement":"\\begin{theorem}\\label{thmalltrees} Пусть $M$ --- мультимножество $k\\ge2$ степеней невисячих вершин и $\\Delta=\\max M$. Среди всех деревьев с этими степенями, включая реализации, в которых невисячие вершины не лежат на одном пути, минимум $\\irr$ равен $D(M)-2+2\\Delta$. Равенство выполняется в точности при невозрастании степеней на путях от некоторой вершины степени $\\Delta$. \\end{theorem}","lines":["Минимум irr по всем деревьям"]},"thmchar007":{"short":"Т 2.2.3","title":"Все максимизаторы irr: разные степени","page":"15","chapter":2,"statement":"\\begin{theorem}\\label{thmchar007} Пусть $M=\\{d_1,\\dots,d_k\\}$, $k\\ge2$, — множество попарно различных целых чисел $\\ge 2$. Пусть $n=k+1$, $h=\\lfloor n/2\\rfloor=\\lfloor (k+1)/2\\rfloor$, и упорядочим $M\\cup\\{0\\}$ как $w_1>w_2>\\dots>w_n=0$. Пусть $H=\\{w_1,\\dots,w_h\\}$ и $L=\\{w_{n-h+1},\\dots,w_n\\}$; заметим, что $0\\in L$. \\begin{itemize} \\item Если $k$ нечётно ($n=2h$), то $\\irr$ максимален тогда и только тогда, когда циклическая последовательность $(0,y_1,\\dots,y_k)$ чередуется между $L$ и $H$. \\item Если $k$ чётно ($n=2h+1$) и $m^{*}=w_{h+1}$ — медиана $M\\cup\\{0\\}$, то $\\irr$ максимален тогда и только тогда, когда после исключения $m^{*}$ циклическая последовательность чередуется между $L$ и $H$, а $m^{*}$ вставлен между соседом из $L$ и соседом из $H$. \\end{itemize} \\end{theorem}","lines":["Все максимизаторы irr: разные","степени"]},"thmext":{"short":"Т 2.2.2","title":"Минимум и максимум irr","page":"14","chapter":2,"statement":"\\begin{theorem}~\\label{thmext} Пусть $M=\\{d_1,\\dots,d_k\\}$, где $d_1\\ge\\cdots\\ge d_k\\ge2$, $k\\ge2$, $\\Delta=d_1$ и $h=\\lceil k/2\\rceil$. На классе $\\TT(M)$ всех гусеничных деревьев с этим мультимножеством степеней хребта имеем \\begin{align} \\irr_{\\min}(M)&=\\sum_{i=1}^k(d_i-1)(d_i-2)-2+2\\Delta, \\label{eqqq01thmext}\\\\ \\irr_{\\max}(M)&=\\sum_{i=1}^k(d_i-1)(d_i-2)-2 +2\\left(\\sum_{i=1}^h d_i-\\sum_{i=k-h+2}^k d_i\\right). \\label{eqqq02thmext} \\end{align} \\end{theorem}","lines":["Минимум и максимум irr"]},"thmrelationsialn1":{"short":"Т 3.3.1","title":"Общие границы σ и член irr²/m","page":"28","chapter":3,"statement":"\\begin{theorem}\\label{thmrelationsialn1} Пусть $G$ имеет $m\\ge1$ рёбер. Тогда \\begin{equation}\\label{eq1thmrelationsialn1} \\max\\{\\irr(G),\\irr(G)^2/m\\}\\le\\sigma(G)\\le(\\Delta-\\delta)\\irr(G). \\end{equation} \\end{theorem}","lines":["Общие границы σ и член irr²/m"]},"thmsigmin":{"short":"Т 3.1.2","title":"Точное значение минимума σ","page":"22","chapter":3,"statement":"\\begin{theorem}~\\label{thmsigmin} Пусть $M=\\{d_1,\\dots,d_k\\}$ --- мультимножество целых чисел со степенями не менее 2, где $d_1\\leqslant d_2 \\leqslant \\dots \\leqslant d_k$. Предполагается $k\\ge2$. Минимум $\\sigma$ по всем гусеничным деревьям, степени хребта которых являются упорядочением $M$, равен \\begin{equation}~\\label{eqqq01thmsigmin} \\sigma_{\\min}(M)=\\sum_{i=1}^{k}(d_i-1)^2(d_i-2)+\\sum_{i=1}^{2}(d_i-1)^2+(d_k-d_{k-1})^2+\\sum_{j=1}^{k-2}(d_{j+2}-d_j)^2, \\end{equation} и достигается при обходе нечётных индексов по возрастанию, а затем чётных по убыванию. \\end{theorem}","lines":["Точное значение минимума σ"]},"thmsigmin001":{"short":"Т 3.3.3","title":"Все порядки, достигающие минимума σ","page":"29","chapter":3,"statement":"\\begin{theorem}~\\label{thmsigmin001} Пусть $\\TT$ --- гусеничное дерево с мультимножеством степеней хребта $2\\le d_1\\le\\cdots\\le d_k$, $k\\ge2$; индексы $d_i$ здесь задают сортировку, а не фактический порядок вдоль хребта. Тогда \\begin{equation}\\label{eqqq01thmsigmin001} \\begin{split} \\sigma(\\TT)\\ge{}&\\sum_{i=1}^k(d_i-1)^2(d_i-2)+(d_1-1)^2+(d_2-1)^2\\\\ &+(d_k-d_{k-1})^2+\\sum_{j=1}^{k-2}(d_{j+2}-d_j)^2. \\end{split} \\end{equation} Равенство достигается, в частности, на порядке $d_1,d_3,d_5,\\dots,d_6,d_4,d_2$ и его обращении. Полная характеризация равенства следующая. Положим $z_0=0$, $z_i=d_i-1$, $g_j=z_{j+1}-z_j$ ($0\\le j\u003ck$). Пометим повторяющиеся значения различными метками. Пусть $C$ --- цикл $(0,x_1,\\dots,x_k,0)$, где $x_i=d(v_i)-1$ в фактическом порядке хребта, и $N_C(j,l)$ --- число его рёбер, покрывающих оба промежутка между индексами $j,j+1$ и $l,l+1$. Равенство имеет место тогда и только тогда, когда одновременно: \\begin{enumerate} \\item $N_C(j,j)=2$ для всех $g_j>0$; \\item $N_C(j,j+1)=1$ для всех $g_jg_{j+1}>0$; \\item $N_C(j,l)=0$ для всех $l\\ge j+2$ с $g_jg_l>0$. \\end{enumerate} Критерий не зависит от нумерации равных значений. При повторениях другие порядки могут также давать
