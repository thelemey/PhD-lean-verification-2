<script>
const D={"nodes":{"Caterpillar":{"old":{"short":"П 2.2.3","title":"Формула irr через хребет","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}\\label{Caterpillar} Пусть $\\TT$ — гусеничное дерево с последовательностью степеней хребта $(d_1,\\dots,d_k)$, $k\\ge 2$. Тогда \\begin{equation}~\\label{eqqq01Caterpillar} \\irr(\\TT)=(d_1-1)^2+(d_k-1)^2+\\sum_{i=2}^{k-1}(d_i-1)(d_i-2)+\\sum_{i=1}^{k-1}|d_i-d_{i+1}|. \\end{equation} \\end{proposition}","line":1380,"page":43,"defence":[1]},"new":{"title":"Формула irr через хребет","short":"П 2.2.1","num":"2.2.1","page":"13","chapter":2,"line":370,"label":"Caterpillar","statement":"\\begin{proposition}\\label{Caterpillar} Пусть $\\TT$ — гусеничное дерево с последовательностью степеней хребта $(d_1,\\dots,d_k)$, $k\\ge 2$. Тогда \\begin{equation}~\\label{eqqq01Caterpillar} \\irr(\\TT)=(d_1-1)^2+(d_k-1)^2+\\sum_{i=2}^{k-1}(d_i-1)(d_i-2)+\\sum_{i=1}^{k-1}|d_i-d_{i+1}|. \\end{equation} \\end{proposition}","proof":"У каждой из двух концевых вершин хребта $d_i-1$ висячих соседей, у каждой внутренней --- $d_i-2$. Каждое висячее ребро при $v_i$ вносит $d_i-1$. Оставшиеся рёбра соединяют $v_i$ и $v_{i+1}$ и дают $|d_{i+1}-d_i|$. Суммирование даёт~\\eqref{eqqq01Caterpillar}, в том числе при $k=2$, когда внутренних вершин нет.","defence":[1],"kind":"proposition","revision":""}},"Thm01worksep":{"old":{"short":"Т 3.4.1","title":"Точное разложение f(s)+g(δ,t)","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}~\\label{Thm01worksep} Пусть $n\\geqslant 8$ и $\\lambda\\geq 0$. Тогда \\begin{equation}~\\label{eqq01Thm01worksep} \\sig{\\lambda}(\\mathscr S) \\;=\\; f_{n,\\lambda}(s) \\;+\\; g_\\lambda(\\delta,t), \\end{equation} где \\begin{equation}~\\label{eqq02Thm01worksep} f_{n,\\lambda}(s)= A_\\lambda\\,s^{2}+B_{n,\\lambda}\\,s+\\tfrac{3^{\\lambda}}{4}n^{2}. \\end{equation} \\end{theorem}","line":3506,"page":98,"defence":[]},"new":{"title":"Точное разложение f(s)+g(δ,t)","short":"Т 3.4.1","num":"3.4.1","page":"35","chapter":3,"line":1278,"label":"Thm01worksep","statement":"\\begin{theorem}~\\label{Thm01worksep} Пусть $n\\geqslant 8$ и $\\lambda\\geq 0$. Тогда \\begin{equation}~\\label{eqq01Thm01worksep} \\sig{\\lambda}(\\mathscr S) \\;=\\; f_{n,\\lambda}(s) \\;+\\; g_\\lambda(\\delta,t), \\end{equation} где \\begin{equation}~\\label{eqq02Thm01worksep} f_{n,\\lambda}(s)= A_\\lambda\\,s^{2}+B_{n,\\lambda}\\,s+\\tfrac{3^{\\lambda}}{4}n^{2}. \\end{equation} \\end{theorem}","proof":"Пусть $U=n-s$. Из определений $s=a_2+a_3$, $t=a_2-a_3$, $\\delta=a_1-a_4$ получаем обратное преобразование \\begin{equation}~\\label{eqq01recover} a_1=\\frac{1}{2}(n-s+\\delta),\\quad a_2=\\frac{1}{2}(s+t),\\quad a_3=\\frac{1}{2}(s-t), \\quad a_4=\\frac{1}{2}(n-s-\\delta). \\end{equation} Имеем $2(a_1a_3+a_2a_4)=sU-t\\delta$, $4a_1a_4=U^2-\\delta^2$ и $a_1a_2+a_2a_3+a_3a_4=(sU+t\\delta)/2+(s^2-t^2)/4$. Подставляя в~\\eqref{eqq02modsigma}, получаем \\begin{equation}~\\label{eqq03Thm01worksep} \\sig{\\lambda}(\\mathscr S) = \\frac{1}{2}(sU+t\\delta)+\\frac{1}{4}(s^{2}-t^{2})+ 2^{\\lambda}\\cdot\\frac{1}{2}(sU-t\\delta)+3^{\\lambda}\\cdot\\frac{1}{4}(U^{2}-\\delta^{2}). \\end{equation} Выделим слагаемые, зависящие от $(\\delta,t)$: \\begin{equation}~\\label{eqq04Thm01worksep} \\sig{\\lambda}(\\mathscr S)=g_\\lambda(\\delta,t)+\\frac{1}{2} sU(1+2^{\\lambda})+\\frac{1}{4} s^{2}+ \\frac{3^\\lambda}{4}\\,U^{2}. \\end{equation} После подстановки $U=n-s$ коэффициенты при $s^2$ и $s$ принимают вид \\begin{equation}~\\label{eqq05Thm01worksep} A_\\lambda= \\frac{1}{4}\\bigl(3^{\\lambda}-2^{\\lambda+1}-1\\bigr), \\qquad B_{n,\\lambda} = \\tfrac{n}{2}\\bigl(1+2^{\\lambda}-3^{\\lambda}\\bigr). \\end{equation} Равенства~\\eqref{eqq04Thm01worksep} и \\eqref{eqq05Thm01worksep} дают \\eqref{eqq02Thm01worksep}, откуда \\eqref{eqq01Thm01worksep} выполняется, что завершает доказательство.","defence":[],"kind":"theorem","revision":""}},"Thm02worksep":{"old":{"short":"Т 3.4.2","title":"Независимый выбор дискретных параметров","chapter":3,"severity":3,"note":"Параметры s и (δ,t) связаны чётностью и границами. n=13, λ=0.8: ветвь (−1,0) даёт 103.39885, а максимизатор g на ветви (0,1) — 103.32213.","statement":"\\begin{theorem}~\\label{Thm02worksep} Пусть $n=4k+r\\geqslant 8$, где $r\\in\\{0,1,2,3\\}$, и $\\lambda\\in[0,1]$. Тогда среди $\\mathscr S$ порядка $n$ последовательность, восстановленная по $(\\delta_r,t_r,s)$, максимизирует $\\sig{\\lambda}(\\mathscr S)$. \\end{theorem}","line":3691,"page":101,"defence":[]},"new":{"title":"Независимый выбор дискретных параметров","short":"Т 3.4.2","num":"3.4.2","page":"37","chapter":3,"line":1399,"label":"Thm02worksep","statement":"\\begin{theorem}~\\label{Thm02worksep} Пусть $n\\ge8$ и $\\lambda\\ge0$. Все максимизирующие $\\sig\\lambda$ графичные последовательности $(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ порядка $n$ можно получить следующим точным алгоритмом. Переберём $s=0,\\dots,n$ и $\\delta=-(n-s),-(n-s)+2,\\dots,n-s$. Для каждой пары выберем все ближайшие к $-(2^\\lambda-1)\\delta$ элементы множества \\begin{equation}\\label{repair:tgrid} T_{n,s,\\delta}=\\{t\\in\\mathbb Z:-s\\le t\\le s,\\quad t\\equiv n+\\delta\\pmod4\\}. \\end{equation} Пустые множества пропускаются. Восстановим $a_i$ по~\\eqref{eqq01recover} и оставим все последовательности с наибольшим значением~\\eqref{eqq02modsigma}. Для максимизации среди последовательностей, допускающих связную реализацию, дополнительно ограничим $t\\le n+4-3\\delta$ в~\\eqref{repair:tgrid}. Число проверяемых кандидатов есть $O(n^2)$; для каждой пары $(s,\\delta)$ их не более двух. \\end{theorem}","proof":"Неотрицательность и целочисленность $a_i$ равносильны ограничениям $0\\le s\\le n$, $|\\delta|\\le n-s$, $|t|\\le s$, $\\delta\\equiv n-s\\pmod2$, $t\\equiv s\\pmod2$. Графичность по лемме~\\ref{lem02parity} дополнительно требует $n+\\delta-t\\equiv0\\pmod4$. При указанном переборе $\\delta$ последнее сравнение уже влечёт $t\\equiv s\\pmod2$. При фиксированных $s,\\delta$ выражение~\\eqref{eqq01Thm01worksep} как функция $t$ равно постоянной минус $\\tfrac14(t+(2^\\lambda-1)\\delta)^2$. Поэтому максимальны в точности ближайшие допустимые точки; выбор обеих при равенстве расстояний сохраняет все максимизаторы. На конечной прогрессии ближайшая точка находится округлением к шагу $4$ с ограничением её концами. Для связности заметим, что сумма степеней равна $(5n-3\\delta-t)/2$, а число рёбер $m=(5n-3\\delta-t)/4$. У положительной графичной последовательности связная реализация существует тогда и только тогда, когда $m\\ge n-1$. Необходимость очевидна. Для достаточности возьмём реализацию с наименьшим числом компонент. Если компонент несколько, условие $m\\ge n-1$ обеспечивает цикл в одной из них. Возьмём ребро $uv$ этого цикла и ребро $xy$ другой компоненты; заменим их рёбрами $ux,vy$. Новые рёбра отсутствовали, степени сохранены, первая компонента после удаления $uv$ связна, а обе части второй после удаления $xy$ присоединены к первой. Число компонент уменьшается --- противоречие. Нужное условие $m\\ge n-1$ равносильно $t\\le n+4-3\\delta$.","defence":[],"kind":"theorem","revision":"Глобальный перебор сохраняет условие чётности и концы допустимого отрезка. Условие существования связной реализации включается отдельно."}},"Thm03worksep":{"old":{"short":"Т 3.4.3","title":"Оптимум в семействе и глобальность","chapter":3,"severity":2,"note":"Округление вершины квадратичной функции внутри семейства обосновано. Переход к глобальному максимуму по всем последовательностям не доказан и конфликтует с М05.","statement":"\\begin{theorem}\\label{Thm03worksep} Пусть $\\lambda\\in[0,2)$, пусть $n=4k+r\\geqslant 8$, где $r\\in\\{1,2,3\\}$, и пусть $\\mathscr S \\in \\mathscr S_{a}^{(r)}$ максимизирует $\\sig{\\lambda}$ среди графичных химических последовательностей порядка $n$, где $a = a_\\lambda^{(r)} := \\Round\\big(x_\\lambda^{(r)}\\big)$. Если \\begin{align} x_\\lambda^{(1)} &= \\frac{(2k+1)(3^\\lambda-1)-2^\\lambda}{2D(\\lambda)}, \\\\ x_\\lambda^{(2)} &= \\frac{(2k+1)(3^\\lambda-1)}{2D(\\lambda)},\\\\ x_\\lambda^{(3)} &= \\frac{2(k+1)(3^\\lambda-1)-2^\\lambda}{2D(\\lambda)}. \\end{align} Если $2(a_\\lambda^{(r)}-x_\\lambda^{(r)})=1$, то и $\\mathscr S_{a_\\lambda^{(r)}}^{(r)}$, и $\\mathscr S_{a_c^{(r)}-1}^{(r)}$ максимизируют $\\sig{\\lambda}$ в рамках семейства; в противном случае максимизатор в рамках семейства единственен. Если $x_\\lambda^{(r)}$ выходит за пределы $[0,k]$, то максимизатор в рамках семейства достигается в соответствующей концевой точке $a=0$ или $a=k$ вместо $\\Round(x_\\lambda^{(r)})$. \\end{theorem}","line":3885,"page":106,"defence":[]},"new":{"title":"Оптимум в семействе и глобальность","short":"Т 3.4.3","num":"3.4.3","page":"40","chapter":3,"line":1595,"label":"Thm03worksep","statement":"\\begin{theorem}\\label{Thm03worksep} Пусть $n=4k+r\\ge8$, $r\\in\\{1,2,3\\}$ и $\\lambda\\in[0,2)$. Внутри семейства $\\mathscr S_a^{(r)}$ из определения~\\ref{def01families}, $a\\in\\{0,\\dots,k\\}$, максимум $\\sig\\lambda$ достигается в точности при всех ближайших к $x_\\lambda^{(r)}$ целых точках отрезка $[0,k]$, где \\begin{align*} x_\\lambda^{(1)}&=\\frac{(2k+1)(3^\\lambda-1)-2^\\lambda}{2D(\\lambda)},\\\\ x_\\lambda^{(2)}&=\\frac{(2k+1)(3^\\lambda-1)}{2D(\\lambda)},\\\\ x_\\lambda^{(3)}&=\\frac{2(k+1)(3^\\lambda-1)-2^\\lambda}{2D(\\lambda)}. \\end{align*} При выходе вершины за отрезок выбирается ближайший конец; при равноудалённости двух допустимых целых чисел оба дают максимум. Принадлежность глобального максимизатора этому семейству здесь не утверждается. \\end{theorem}","proof":"Прямая подстановка определённых в работе семейств в~\\eqref{eqq02modsigma} даёт \\begin{equation}\\label{eqq01quadraticgeneral} \\sig\\lambda(\\mathscr S_a^{(r)})=-D(\\lambda)a^2+B_r(\\lambda)a+C_r(\\lambda), \\end{equation} где $C_r(\\lambda)=\\sig\\lambda(\\mathscr S_0^{(r)})$ и \\begin{align*} B_1&=(2k+1)(3^\\lambda-1)-2^\\lambda,\\\\ B_2&=(2k+1)(3^\\lambda-1),\\\\ B_3&=2(k+1)(3^\\lambda-1)-2^\\lambda. \\end{align*} Тождество~\\eqref{eqq01quadraticgeneral} алгебраически верно при любом $\\lambda\\ge0$. При $0\\le\\lambda<2$ имеем $D>0$, поэтому завершение квадрата даёт утверждение. Для согласования с последующими вычислениями можно также сохранить обозначение \\begin{equation}\\label{eqq007futuresensitivity} \\Phi(\\lambda)=3^\\lambda\\ln(3/2)+\\ln2>0. \\end{equation} Если $B=c(3^\\lambda-1)-\\varepsilon2^\\lambda$, то прямое дифференцирование даёт $B'D-BD'=2^\\lambda\\Phi(\\lambda)(2c-\\varepsilon)$. Это характеризует движение вершины внутри семейства и не доказывает глобальную оптимальность.","defence":[],"kind":"theorem","revision":""}},"Thm04worksep":{"old":{"short":"Т 3.4.6","title":"Концы семейства при λ>2, r=1","chapter":3,"severity":0,"note":"Сравнение концевых значений квадратичной функции в указанном семействе алгебраически согласовано; глобальность по всем графам из него не следует.","statement":"\\begin{theorem}~\\label{Thm04worksep} Пусть $\\lambda\\in(2,\\infty)$, $n=4k+1\\geqslant 9$. Тогда $\\mathscr S_k^{(1)}=(1^{2k},2^0,3^0,4^{2k+1})$ максимизирует $\\sig{\\lambda}$ в рамках семейства $\\mathscr S_a^{(1)}$ тогда и только тогда, когда \\begin{equation}~\\label{eqq01Thm04worksep} (3k+1)(3^\\lambda-1) > (2k+1)\\,2^\\lambda; \\end{equation} в противном случае максимизирует $\\mathscr S_0^{(1)}=(1^k,2^k,3^k,4^{k+1})$. \\end{theorem}","line":4023,"page":109,"defence":[]},"new":{"title":"Максимум внутри семейства при r=1","short":"Т 3.4.6","num":"3.4.6","page":"42","chapter":3,"line":1684,"label":"Thm04worksep","statement":"\\begin{theorem}\\label{Thm04worksep} При $n=4k+1\\ge9$ и $\\lambda>2$ максимум внутри семейства $\\mathscr S_a^{(1)}$, $0\\le a\\le k$, достигается только при $a=k$. \\end{theorem}","proof":"По теореме~\\ref{Thm01worksep} при фиксированных разностях кратностей переменная часть есть квадратичная функция $s$ с коэффициентом $(q-2x-1)/4>0$. В семействе $s$ аффинно зависит от $a$, поэтому максимум достигается на концах. По~\\eqref{eqq02modsigma} разность значений при $k$ и нуле равна $k[(3k+1)(q-1)-(2k+1)x]>0$.","defence":[],"kind":"theorem","revision":""}},"Thm05worksep":{"old":{"short":"Т 3.4.7","title":"Сравнение кандидатов при λ>2, r=3","chapter":3,"severity":0,"note":"Явные разности между тремя кандидатами согласованы с формулой индекса; это не доказательство полноты списка кандидатов.","statement":"\\begin{theorem}~\\label{Thm05worksep} Пусть $\\lambda\\in(2,\\infty)$, $n=4k+3\\geqslant 11$. Тогда \\begin{equation}~\\label{eqq01Thm05worksep} \\begin{aligned} \\sig{\\lambda}(\\mathscr S_k^{(3)}) - \\sig{\\lambda}(\\mathscr S_0^{(3)}) &= k\\big[(3k+2)(3^\\lambda-1)-(2k+1)2^\\lambda\\big],\\\\ \\sig{\\lambda}(\\mathcal P^{(3)})-\\sig{\\lambda}(\\mathscr S_k^{(3)}) &= (2k+1)\\big[(3^\\lambda-1)-2^\\lambda\\big], \\\\ \\sig{\\lambda}(\\mathcal P^{(3)})-\\sig{\\lambda}(\\mathscr S_0^{(3)}) &= (k+1)\\big[(3k+1)(3^\\lambda-1)-(2k+1)2^\\lambda\\big]. \\end{aligned} \\end{equation} \\end{theorem}","line":4117,"page":112,"defence":[]},"new":{"title":"Сравнение с поляризованной последовательностью","short":"Т 3.4.7","num":"3.4.7","page":"42","chapter":3,"line":1691,"label":"Thm05worksep","statement":"\\begin{theorem}\\label{Thm05worksep} При $n=4k+3\\ge11$ и $\\lambda>2$ выполняется $\\sig\\lambda(\\mathcal P^{(3)})>\\sig\\lambda(\\mathscr S_k^{(3)})>\\sig\\lambda(\\mathscr S_0^{(3)})$. Значение при $a=k$ максимально внутри семейства $\\mathscr S_a^{(3)}$. \\end{theorem}","proof":"Из~\\eqref{eqq02modsigma} разности второго и третьего значений и первого и второго равны соответственно $k[(3k+2)(q-1)-(2k+1)x]$ и $(2k+1)(q-1-x)$. Обе положительны. Применим ту же строгую выпуклость, что и в доказательстве теоремы~\\ref{Thm04worksep}. Глобальный поиск за пределами семейства по-прежнему описывается теоремой~\\ref{Thm02worksep}.","defence":[],"kind":"theorem","revision":"Доказаны максимум внутри заданного семейства и сравнение с поляризованной последовательностью. Область оптимизации указана явно."}},"ThmDecSigma":{"old":{"short":"Т 3.1.2","title":"σ через числа листьев pᵢ","chapter":3,"severity":2,"note":"Формула через pᵢ верна. Доказательство использует единый p и повторно прибавляет его к dᵢ, уже определённому как полная степень.","statement":"\\begin{theorem}\\label{ThmDecSigma} Пусть $\\TT$ --- гусеничное дерево, хребтом которого является путь $v_1v_2\\cdots v_n$, и пусть $d_k=d_{\\TT}(v_k)$ для $k=1,\\dots,n$, где $d_n\\geqslant d_{n-1}\\geqslant\\dots\\geqslant d_1\\geqslant 2$. Тогда $v_k$ имеет ровно $p_k=d_k-s_k$ висячих вершин, где $s_1=s_n=1$ и $s_k=2$ при $1<k<n$, и \\begin{equation}\\label{eqq1ThmDecSigma} \\sigma(\\TT)=\\sum_{i=1}^{n-1}(d_{i+1}-d_i)^2+\\sum_{k=1}^{n}p_k\\,(d_k-1)^2 . \\end{equation} \\end{theorem}","line":2599,"page":77,"defence":[]},"new":{"title":"Сигма-индекс по числам прикреплённых листьев","short":"Т 3.1.1","num":"3.1.1","page":"21","chapter":3,"line":674,"label":"ThmDecSigma","statement":"\\begin{theorem}\\label{ThmDecSigma} Пусть к $i$-й вершине пути $P_k$, $k\\ge2$, присоединено $p_i\\ge0$ новых листьев. Обозначим через $s_i$ степень этой вершины в пути и положим $x_i=s_i+p_i$. Тогда \\[ \\sigma(T)=\\sum_{i=1}^k p_i(x_i-1)^2+\\sum_{i=1}^{k-1}(x_i-x_{i+1})^2. \\] Если $p_1,p_k\\ge1$, выделенный путь совпадает с хребтом из невисячих вершин. \\end{theorem}","proof":"Имеется ровно $p_i$ рёбер от вершины $i$ к добавленным листьям. Все остальные рёбра принадлежат исходному пути. Складываем квадраты разностей полных степеней, как в предложении~\\ref{propsigmaspine}. Доказательство сохраняет силу при нулевых $p_i$.","defence":[],"kind":"theorem","revision":""}},"ThmLinDualln1":{"old":{"short":"Т 4.0.1","title":"Единственность максимизатора Gut","chapter":4,"severity":3,"note":"M={2,3,3,3,5}: два неизоморфных максимизатора (3,3,2,3,5) и (3,3,3,2,5), оба Gut=692.","statement":"\\begin{theorem}[Максимальный индекс Гутмана]\\label{ThmLinDualln1} Среди класса всех гусеничных деревьев с последовательностью степеней $\\mathscr{D}$ существует единственное (с точностью до изоморфизма) гусеничное дерево, индекс Гутмана которого достигает максимального значения. Для любого гусеничного дерева $\\TT$ из семейства $\\TT(\\mathscr{D})$ имеем \\begin{equation}\\label{eq1ThmLinDualln1} \\Gut(\\TT) \\leqslant \\Gut\\bigl(\\TT_{\\max}(\\mathscr{D})\\bigr), \\end{equation} причём равенство имеет место тогда и только тогда, когда $\\TT$ изоморфно $\\TT_{\\max}(\\mathscr{D)}$. \\end{theorem}","line":4222,"page":115,"defence":[]},"new":{"title":"Точный максимум Gut по подмножествам","short":"Т 4.1.1","num":"4.1.1","page":"44","chapter":4,"line":1726,"label":"ThmLinDualln1","statement":"\\begin{theorem}\\label{ThmLinDualln1} Пусть $H_+(\\varnothing)=0$ и для непустого $S\\subseteq I$ \\[ H_+(S)=c(S)+\\max_{i\\in S}H_+(S\\setminus\\{i\\}). \\] Тогда по всем расстановкам заданных степеней на хребте \\[ \\Gut_{\\max}=4[\\ell(n-1)+H_+(I)]-(n-1)(2n-1). \\] Все максимизирующие расстановки восстанавливаются обратным проходом по всем переходам, на которых достигается максимум. \\end{theorem}","proof":"По лемме~\\ref{lemn1gut} висячие рёбра вносят в $W$ величину $\\ell(n-1)$. Переменная часть есть сумма $c(S_j)$ по множествам первых $j$ меток. Для фиксированного $S$ последнее приращение $c(S)$ от порядка внутри $S$ не зависит. Удаление последней метки $i$ оставляет ровно задачу на $S\\setminus\\{i\\}$. Индукция по мощности $S$ доказывает рекурсию и показывает, что равенство требует оптимального перехода на каждом шаге. Перестановки равных степеней и обращение хребта задают один тип дерева.","defence":[],"kind":"theorem","revision":"Прежняя классификация максимизатора заменена точной рекурсией по подмножествам. Обратный проход возвращает все оптимальные порядки, включая неизоморфные."}},"ThmLinDualln2":{"old":{"short":"Т 4.0.2","title":"Монотонный хребет минимизирует Gut","chapter":4,"severity":3,"note":"M={2,3,4}: монотонный хребет (4,3,2) даёт Gut=147, а (2,4,3) — 143.","statement":"\\begin{theorem}[Минимальный индекс Гутмана]\\label{ThmLinDualln2} Пусть $\\TT_{\\min}(\\mathscr{D})$ --- гусеничное дерево, построенное упорядочением вершин с наибольшими степенями у одного из концов хребта в невозрастающем порядке. Тогда \\begin{equation}\\label{eq1ThmLinDualln2} \\Gut(\\TT) \\geqslant \\Gut\\bigl(\\TT_{\\min}(\\mathscr{D})\\bigr), \\end{equation} причём равенство имеет место тогда и только тогда, когда $\\TT$ изоморфно $\\TT_{\\min}(\\mathscr{D})$. \\end{theorem}","line":4231,"page":115,"defence":[]},"new":{"title":"Точный минимум Gut по подмножествам","short":"Т 4.1.2","num":"4.1.2","page":"44","chapter":4,"line":1741,"label":"ThmLinDualln2","statement":"\\begin{theorem}\\label{ThmLinDualln2} Определим $H_-(\\varnothing)=0$ и $H_-(S)=c(S)+\\min_{i\\in S}H_-(S\\setminus\\{i\\})$ для $S\\ne\\varnothing$. Тогда \\[ \\Gut_{\\min}=4[\\ell(n-1)+H_-(I)]-(n-1)(2n-1). \\] Обратный проход по всем минимизирующим переходам перечисляет все минимизаторы. \\end{theorem}","proof":"Разложение по разрезам в доказательстве теоремы~\\ref{ThmLinDualln1} справедливо при любом порядке. Заменяя операцию максимума минимумом в той же индукции, получаем утверждение. Сложность вычисления каждого экстремального значения составляет $O(k2^k)$ операций и $O(2^k)$ ячеек, если суммы весов подмножеств предварительно вычислены рекурсией. Перечисление всех оптимальных порядков дополнительно требует времени на вывод.","defence":[],"kind":"theorem","revision":"Минимизаторы восстанавливаются по всем оптимальным переходам той же рекурсии с минимумом."}},"ThmSigmairregularityn1":{"old":{"short":"Т 3.3.4","title":"Ослабление точной границы σ","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}~\\label{ThmSigmairregularityn1} Пусть $\\TT$ --- гусеничное дерево со степенями хребта $2\\le d_1\\le\\dots\\le d_k$. Согласно теореме~\\ref{thmsigmin}, \\[ \\sigma_{\\mathscr D}(\\TT)\\;\\ge\\;\\sum_{i=1}^{k}(d_i-1)^2(d_i-2) +(d_1-1)^2+(d_2-1)^2+(\\Delta-d_{k-1})^2, \\] \\end{theorem}","line":3211,"page":90,"defence":[]},"new":{"title":"Ослабление точной границы σ","short":"Т 3.3.4","num":"3.3.4","page":"30","chapter":3,"line":1028,"label":"ThmSigmairregularityn1","statement":"\\begin{theorem}\\label{ThmSigmairregularityn1} Если $2\\le d_1\\le\\cdots\\le d_k$, $k\\ge2$, то $\\sigma(T)\\ge\\Gamma(M)+(d_1-1)^2+(d_2-1)^2+(d_k-d_{k-1})^2$. \\end{theorem}","proof":"В правой части оценки теоремы~\\ref{thmsigmin001} отбросим сумму неотрицательных слагаемых $\\sum_{j=1}^{k-2}(d_{j+2}-d_j)^2$.","defence":[],"kind":"theorem","revision":""}},"Thmcor01":{"old":{"short":"Т 2.2.1","title":"Максимум irr по расстановкам","chapter":2,"severity":1,"note":"Формула максимума подтверждена. В доказательстве F сначала содержит −2, затем приравнивается сумме вариаций без −2.","statement":"\\begin{theorem}~\\label{Thmcor01} Пусть $ d_1 \\geq d_2 \\geq \\cdots \\geq d_k \\geqslant 2 $ при $ k \\geq 2 $ — целые числа, и пусть $ p = \\lceil k/2 \\rceil $. Среди всех гусеничных деревьев, степени хребта которых являются перестановкой $ (d_1, \\ldots, d_k) $, \\begin{equation}~\\label{eqqq01Thmcor01} \\irr_{\\max}(\\TT)=\\sum_{i=1}^{k} (d_i-1)(d_i-2)- 2 + 2\\sum_{i=1}^{p} d_i - 2\\sum_{i=k-p+2}^{k} d_i. \\end{equation} Оно достигается на следующем расположении $(y_1, \\ldots, y_k) $ хребта: \\begin{itemize} \\item Если $k = 2p-1 $, то $ y_{2j-1} = d_j $ при $ 1 \\leq j \\leq p $ и $ y_{2j} = d_{k+1-j} $ при $ 1 \\leq j \\leq p-1 $. \\item Если $ k=2p$, то $y_1 = d_{p+1} $, $ y_{2j} = d_j $ при $ 1 \\leq j \\leq p $ и $y_{2j+1} = d_{k+1-j}$ при $1 \\leq j \\leq p-1$. \\end{itemize} \\end{theorem}","line":1490,"page":46,"defence":[2]},"new":{"title":"Максимум irr по расстановкам","short":"Т 2.2.1","num":"2.2.1","page":"14","chapter":2,"line":403,"label":"Thmcor01","statement":"\\begin{theorem}~\\label{Thmcor01} Пусть $d_1\\ge\\cdots\\ge d_k\\ge2$, $k\\ge2$, и $p=\\lceil k/2\\rceil$. Среди гусеничных деревьев с мультимножеством степеней хребта $M=\\{d_1,\\dots,d_k\\}$ \\begin{equation}\\label{eqqq01Thmcor01} \\irr_{\\max}(M)=\\sum_{i=1}^k(d_i-1)(d_i-2)-2 +2\\sum_{i=1}^p d_i-2\\sum_{i=k-p+2}^k d_i. \\end{equation} Пустая сумма равна нулю. Максимум достигается, например, на следующих порядках: при $k=2p-1$ положим $y_{2j-1}=d_j$ ($1\\le j\\le p$), $y_{2j}=d_{k+1-j}$ ($1\\le j<p$); при $k=2p$ положим $y_1=d_{p+1}$, $y_{2j}=d_j$ ($1\\le j\\le p$), $y_{2j+1}=d_{k+1-j}$ ($1\\le j<p$). \\end{theorem}","proof":"Применим лемму~\\ref{lem006cyc} к $k+1$ числам $0,d_k,\\ldots,d_1$. Из $p$ нижних значений одно равно нулю; верхние $p$ значений составляют $d_1,\\ldots,d_p$. Формула следует из~\\eqref{eqqq01lemred0005}. Первое указанное расположение чередует верхнюю и нижнюю половины, а во втором случае медиана вставлена между нулём и верхним элементом. В обоих случаях достигается верхняя граница вариации.","defence":[2],"kind":"theorem","revision":""}},"albstarirr":{"old":{"short":"Л 1.2.1","title":"Нерегулярность звездообразного дерева","chapter":1,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{lemma}[\\cite{FathGutmanNasiri}~\\label{albstarirr}] Пусть $\\mathcal{S}_n$ — дерево-звезда порядка $n$. Индекс Альбертсона графа $\\mathcal{S}_n$ удовлетворяет равенству $\\irr(\\mathcal{S}_n) =(n-1)(n-2).$ \\end{lemma}","line":670,"page":22,"defence":[]},"new":{"title":"Нерегулярность звездообразного дерева","short":"Л 1.2.1","num":"1.2.1","page":"6","chapter":1,"line":149,"label":"albstarirr","statement":"\\begin{lemma}\\label{albstarirr} Для звезды $\\mathcal S_n=K_{1,n-1}$, $n\\ge2$, индекс Альбертсона равен $(n-1)(n-2)$. \\end{lemma}","proof":"На каждом из $n-1$ рёбер разность степеней равна $n-2$.","defence":[],"kind":"lemma","revision":""}},"bipartite01sets":{"old":{"short":"С 5.2.1","title":"Известная верхняя оценка irr","chapter":5,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{corollary}[\\cite{Michael2007Henning}]~\\label{bipartite01sets} Пусть $n_1 \\geqslant n_2$ --- мощности долей соответственно для двудольного графа $G = (V, E)$. Следовательно, $$ \\irr(G) \\leqslant u_1 u_2 (n_1 - n_2) + u_1 (n_2 - u_2)(n_2 - u_1) + u_2 (n_1 - u_1)(n_1 - u_2), $$ где $$ \\begin{aligned} & u_1 = \\frac{1}{2} (n_2 - u_2) \\quad \\text{и} \\\\ & u_2 = \\begin{cases} n_2 - \\frac{4}{3} n_1 + \\sqrt{\\frac{28}{9} n_1^2 - \\frac{8}{3} n_1 n_2} & \\text{если } n_1 < 2 n_2, \\\\ n_2 & \\text{если } n_1 \\geqslant 2 n_2. \\end{cases} \\end{aligned} $$ \\end{corollary}","line":4693,"page":128,"defence":[]},"new":{"title":"Верхние оценки Хеннинга — Раутенбаха","short":"С 5.2.1","num":"5.2.1","page":"49","chapter":5,"line":1875,"label":"bipartite01sets","statement":"\\begin{corollary}\\label{bipartite01sets} Для двудольного графа с долями равной мощности и общим числом вершин $n$ выполнено $\\irr(G)\\le n^3/27$. Если $p\\ge2q$, то $\\irr(G)\\le\\irr(K_{p,q})=pq(p-q)$. \\end{corollary}","proof":"Обе оценки являются частными случаями результата Хеннинга и Раутенбаха~\\cite{Michael2007Henning} об иррегулярности графа с заданными мощностями долей. Во втором случае значение правой части следует подстановкой $r_i=q,\\ c_j=p$ в~\\eqref{bipmatrix}.","defence":[],"kind":"corollary","revision":"Неравенства сформулированы в области действия теоремы Хеннинга и Раутенбаха. Вещественная оценка может не достигаться."}},"bipartite02sets":{"old":{"short":"Т 5.2.2","title":"Точные экстремумы irr по долям","chapter":5,"severity":3,"note":"При n₁=n₂=2 формулы дают минимум 2/3 и максимум 64/27. Реальные значения целочисленного irr: 0 и 2.","statement":"\\begin{theorem}\\label{bipartite02sets} Пусть $\\mathcal{BG}$ --- двудольный граф с размерами долей $n_1$ и $n_2$, удовлетворяющими $n_1 \\leq 2n_2$. Тогда максимальное и минимальное значения $\\irr(\\mathcal{BG})$ равны \\begin{equation}\\label{eq3bipartite02sets} \\irr(\\mathcal{BG}) = \\begin{cases} \\irr_{\\max}(\\mathcal{BG}) = \\dfrac{1}{108} \\Bigl( 4 n_1 - \\sqrt{28 n_1^2 - 24 n_1 n_2} \\Bigr)^3 + \\alpha n_1^2 - \\alpha^2 n_1, \\\\[1.2em] \\irr_{\\min}(\\mathcal{BG}) = n_2 - \\dfrac{4}{3} n_1 + \\sqrt{\\dfrac{28}{9} n_1^2 - \\dfrac{8}{3} n_1 n_2}, \\end{cases} \\end{equation} где \\[ \\alpha = n_2 - \\frac{4}{3} n_1 + \\frac{1}{3} \\sqrt{28 n_1^2 - 24 n_1 n_2}. \\] \\end{theorem}","line":4720,"page":129,"defence":[]},"new":{"title":"Экстремумы irr по типам строк","short":"Т 5.2.2","num":"5.2.2","page":"49","chapter":5,"line":1882,"label":"bipartite02sets","statement":"\\begin{theorem}\\label{bipartite02sets} Для каждого $S\\subseteq\\{1,\\ldots,q\\}$ пусть $x_S$ --- число строк, единицы которых стоят ровно в столбцах из $S$. Для $x_S\\in\\mathbb Z_{\\ge0}$, $\\sum_Sx_S=p$ положим \\[ c_j(x)=\\sum_{S\\ni j}x_S,\\qquad L(x)=\\sum_S x_S\\sum_{j\\in S}\\bigl||S|-c_j(x)\\bigr|. \\] Точные экстремумы $\\irr$ при заданных долях равны $\\min_x L(x)$ и $\\max_x L(x)$. Если требуется ровно $m$ рёбер, к условиям добавляется $\\sum_S|S|x_S=m$. Отсутствие изолированных вершин задаётся условиями $x_\\varnothing=0$ и $c_j(x)\\ge1$ для каждого $j$. Эти формулы применяются при непустом множестве допустимых векторов. \\end{theorem}","proof":"Переход от матрицы к числам $x_S$ сохраняет суммы столбцов и степени концов каждого ребра. По~\\eqref{bipmatrix} его вклад при типе строки $S$ равен $\\bigl||S|-c_j(x)\\bigr|$, откуда следует формула $L(x)$. Обратно, для каждого допустимого вектора выпишем по $x_S$ экземпляров строки с носителем $S$. Получим простой граф с требуемыми параметрами. Поэтому перечисление слабых композиций $p$ по $2^q$ типам охватывает все значения и достигает обоих экстремумов. Для подзадачи со связностью дополнительно оставляем матрицы, задающие связный граф. Перестановка строк не влияет на это условие.","defence":[],"kind":"theorem","revision":"Целочисленный перебор по типам строк даёт точные значения. Можно задать число рёбер, запретить изолированные вершины или оставить только связные реализации."}},"bipmatrix":{"old":null,"new":{"title":"Нерегулярность по матрице двудольного графа","short":"Ф 5.1","num":"5.1","page":"48","chapter":5,"line":1861,"label":"bipmatrix","statement":"\\begin{equation}\\label{bipmatrix} \\irr(G)=\\sum_{ij}b_{ij}|r_i-c_j|,\\qquad \\sigma(G)=\\sum_{ij}b_{ij}(r_i-c_j)^2. \\end{equation}","proof":"","defence":[],"kind":"equation","revision":""}},"boundbipartitegraph":{"old":{"short":"П 5.3.1","title":"Границы irr и σ по размерам долей","chapter":5,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}~\\label{boundbipartitegraph} Пусть $\\mathcal{BG}$ --- двудольный граф без изолированных вершин с долями $V_1,V_2$ порядков $n_1,n_2$, $m\\ge1$ рёбрами, максимальной степенью $\\Delta$ и минимальной степенью $\\delta\\ge1$, и пусть $M=\\max\\{n_1,n_2\\}$. Тогда \\begin{align} \\irr(\\mathcal{BG})& \\le\\ n_1n_2\\,(M-1), \\label{eq0boundbipartitegraph}\\\\ \\sigma(\\mathcal{BG})&\\le\\ n_1n_2\\,(M-1)^2 .\\label{eq0boundbipartitegraphsigma} \\end{align} Равенство во внешних неравенствах~\\eqref{eq0boundbipartitegraph} и~\\eqref{eq0boundbipartitegraphsigma} выполняется тогда и только тогда, когда $\\mathcal{BG}$ --- звезда $K_{1,M}$. \\end{proposition}","line":4804,"page":131,"defence":[6]},"new":{"title":"Границы irr и σ по размерам долей","short":"П 5.3.1","num":"5.3.1","page":"50","chapter":5,"line":1921,"label":"boundbipartitegraph","statement":"\\begin{proposition}~\\label{boundbipartitegraph} Пусть $\\mathcal{BG}$ --- простой двудольный граф без изолированных вершин с долями $V_1,V_2$ порядков $n_1,n_2$, $m\\ge1$ рёбрами, максимальной степенью $\\Delta$ и минимальной степенью $\\delta\\ge1$, и пусть $M=\\max\\{n_1,n_2\\}$. Тогда \\begin{align} \\irr(\\mathcal{BG})& \\le\\ n_1n_2\\,(M-1), \\label{eq0boundbipartitegraph}\\\\ \\sigma(\\mathcal{BG})&\\le\\ n_1n_2\\,(M-1)^2 .\\label{eq0boundbipartitegraphsigma} \\end{align} Для каждого из двух неравенств равенство равносильно $\\mathcal{BG}\\cong K_{1,M}$. \\end{proposition}","proof":"Положим $J_1=\\operatorname{irr}$, $J_2=\\sigma$. Пусть $m$ --- число рёбер. На любом ребре обе степени лежат между $1$ и $M$, так что для $r=1,2$ выполнено $J_r\\le m(M-1)^r\\le n_1n_2(M-1)^r$. При $M>1$ равенство для любого из двух $r$ требует $m=n_1n_2$, то есть граф полный двудольный. На каждом его ребре разность равна $|n_1-n_2|=M-\\min(n_1,n_2)$. Она равна $M-1$ ровно при $\\min(n_1,n_2)=1$. Обратно, на звезде все $M$ рёбер имеют разность $M-1$. При $M=1$ наличие хотя бы одного ребра даёт $K_{1,1}$ и оба индекса равны нулю.","defence":[6],"kind":"proposition","revision":"Уточнены область допустимых двудольных графов и условия достижения обеих границ."}},"boundbipartitegraphn2":{"old":{"short":"П 5.3.2","title":"Уточнение границы irr","chapter":5,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{proposition}\\label{boundbipartitegraphn2} Пусть $\\mathcal{BG}$ --- двудольный граф без изолированных вершин с максимальной степенью $\\Delta(G) \\geq 3$. Пусть $V_1$ и $V_2$ --- доли вершин, $|V_1| = n_1$, $|V_2| = n_2$, и пусть $m = |E(G)|$. Тогда \\begin{equation}\\label{eq0boundbipartitegraphn2} \\irr(\\mathcal{BG}) \\leq \\sum_{v \\in V_1} (d(v) - 1)^2 + \\sum_{u \\in V_2} (d(u) - 2) + 2 n_1 \\Delta. \\end{equation} \\end{proposition}","line":4837,"page":132,"defence":[]},"new":{"title":"Построчная оценка irr","short":"П 5.3.2","num":"5.3.2","page":"50","chapter":5,"line":1933,"label":"boundbipartitegraphn2","statement":"\\begin{proposition}\\label{boundbipartitegraphn2} Пусть $p=|U|$ и $D=\\max_{v\\in V}d(v)$. По заданным степеням строк получаем уточнённую верхнюю оценку \\[ \\irr(G)\\le\\sum_{i:\\,r_i>0}r_i\\max\\{|r_i-1|,|r_i-D|\\},\\qquad D\\le p . \\] \\end{proposition}","proof":"Каждый столбец, инцидентный строке $i$, имеет степень в $[1,D]$. Максимум функции $|r_i-x|$ на этом отрезке достигается в одном из концов. Сложим оценки сначала по соседям строки, затем по всем непустым строкам, используя~\\eqref{bipmatrix}.","defence":[],"kind":"proposition","revision":""}},"boundbipartitegraphn3":{"old":{"short":"Л 5.3.1","title":"Связь σ, irr и M₁","chapter":5,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{lemma}~\\label{boundbipartitegraphn3} Пусть $\\mathcal{BG}$ --- двудольный граф с долями $V_1,V_2$, $|V_1|=n_1$, $|V_2|=n_2$. Тогда \\begin{equation}~\\label{eqqq01boundbipartitegraphn3} \\sigma(\\mathcal{BG})\\le(\\Delta-1)\\,\\irr(\\mathcal{BG})\\le 2M_1(\\mathcal{BG})+(n_1+n_2-3)\\,\\irr(\\mathcal{BG}). \\end{equation} \\end{lemma}","line":4853,"page":133,"defence":[]},"new":{"title":"Связь σ, irr и M₁","short":"Л 5.3.1","num":"5.3.1","page":"51","chapter":5,"line":1943,"label":"boundbipartitegraphn3","statement":"\\begin{lemma}\\label{boundbipartitegraphn3} В двудольном графе с $m\\ge1$ и $n=p+q$ выполняется $\\sigma(G)\\le(\\Delta-1)\\irr(G)\\le 2M_1+(n-3)\\irr(G)$. \\end{lemma}","proof":"На концах каждого ребра степени положительны, откуда $|r_i-c_j|\\le\\Delta-1$. Для второго неравенства достаточно $(\\Delta-n+2)\\irr\\le2M_1$. Так как $\\Delta\\le n-1$, левая часть не больше $\\irr$, а $\\irr\\le\\sum_{uv\\in E}(d_u+d_v)=M_1$.","defence":[],"kind":"lemma","revision":""}},"caterpillarvertex":{"old":{"short":"П 2.4.5","title":"Сильная опора у максимизатора irr","chapter":2,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{proposition}~\\label{caterpillarvertex} Пусть $\\TT(n,m)$ --- гусеничное дерево, где $m\\ge4$ и $n\\ge m+1$, с $m$ висячими вершинами, индекс Альбертсона которого максимален среди всех таких гусеничных деревьев. Тогда $\\TT$ имеет сильную опорную вершину, смежную по крайней мере с двумя висячими вершинами. \\end{proposition}","line":2307,"page":66,"defence":[]},"new":{"title":"Сильная опора у максимизатора irr","short":"П 2.4.3","num":"2.4.3","page":"19","chapter":2,"line":627,"label":"caterpillarvertex","statement":"\\begin{proposition}~\\label{caterpillarvertex} Пусть $\\TT(n,m)$ --- гусеничное дерево, где $m\\ge4$ и $n\\ge m+1$, с $m$ висячими вершинами, индекс Альбертсона которого максимален среди всех таких гусеничных деревьев. Тогда $\\TT$ имеет сильную опорную вершину, смежную по крайней мере с двумя висячими вершинами. \\end{proposition}","proof":"Для заданных $m,n$ рассмотрим дерево с $m-1$ ветвями длины один и последней ветвью длины $n-m$. Оно является гусеницей и имеет $\\irr=m(m-1)$ по лемме~\\ref{lem001starlikerr}. По предложению~\\ref{propleaves} каждый максимизатор есть подразделение звезды с $m$ ветвями. В гусенице не более двух ветвей такой звезды могут иметь длину больше единицы: иначе подграф невисячих вершин содержит вершину степени хотя бы три. Следовательно, не менее $m-2\\ge2$ листьев смежны с центром.","defence":[],"kind":"proposition","revision":""}},"claim1":{"old":null,"new":{"title":"Формулы irr и σ через степени хребта","short":"Защ. 1","num":"","page":"6","chapter":1,"line":176,"label":"defence1","statement":"\\item\\label{defence1} Пусть $x_1,\\ldots,x_k$ --- полные степени невисячих вершин в порядке обхода хребта гусеницы $T$, $k\\ge2$. Для $r=1,2$ обозначим $J_r(T)=\\sum_{uv\\in E(T)}|d(u)-d(v)|^r$, так что $J_1=\\operatorname{irr}$, $J_2=\\sigma$. Тогда \\[ J_r(T)=\\sum_{i=1}^k(x_i-2)(x_i-1)^r+(x_1-1)^r+(x_k-1)^r +\\sum_{i=1}^{k-1}|x_{i+1}-x_i|^r . \\] {\\small См.~\\ref{Caterpillar}, \\ref{propsigmaspine}.}","proof":"","defence":[1],"kind":"claim","revision":""}},"claim2":{"old":null,"new":{"title":"Минимум и максимум irr по расположениям","short":"Защ. 2","num":"","page":"7","chapter":1,"line":183,"label":"defence2","statement":"\\item\\label{defence2} Пусть $d_1\\ge\\cdots\\ge d_k\\ge2$, $k\\ge2$, $h=\\lceil k/2\\rceil$ и $B=\\sum_i(d_i-1)(d_i-2)-2$. По всем расстановкам этого мультимножества на хребте \\[ \\operatorname{irr}_{\\min}=B+2d_1,\\qquad \\operatorname{irr}_{\\max}=B+2\\left(\\sum_{i=1}^{h}d_i-\\sum_{i=k-h+2}^{k}d_i\\right). \\] Сумма по пустому множеству индексов равна нулю. {\\small См.~\\ref{thmext}.}","proof":"","defence":[2],"kind":"claim","revision":""}},"claim3":{"old":null,"new":{"title":"Обе границы irr через M₁ и случаи равенства","short":"Защ. 3","num":"","page":"7","chapter":1,"line":191,"label":"defence3","statement":"\\item\\label{defence3} Для дерева $T$ порядка $n\\ge3$ положим $\\Delta=\\max_v d(v)$ и $M_1=\\sum_v d(v)^2$. Тогда \\[ M_1-4(n-1)+2\\Delta\\le\\operatorname{irr}(T)\\le M_1-2(n-1). \\] Равенство справа характеризует звезду $K_{1,n-1}$. Равенство слева характеризует деревья, для которых существует вершина степени $\\Delta$, такая, что вдоль каждого простого пути, начинающегося в ней, степени не возрастают. {\\small См.~\\ref{propzagreb}.}","proof":"","defence":[3],"kind":"claim","revision":""}},"claim5":{"old":null,"new":{"title":"Перестановка степеней и изменение Gut","short":"Защ. 5","num":"","page":"7","chapter":1,"line":201,"label":"defence5","statement":"\\item\\label{defence5} Пусть $x_1,\\ldots,x_k$ --- степени в порядке хребта, $n=2+\\sum_i(x_i-1)$, $A_i=1+\\sum_{j=1}^{i}(x_j-1)$. При обмене позиций $u<v$ положим $\\delta=x_v-x_u$. Тогда \\[ \\operatorname{Gut}(T')-\\operatorname{Gut}(T) =4\\delta\\sum_{i=u}^{v-1}(n-2A_i-\\delta). \\] У глобального максимизатора каждая такая разность неположительна. Обратная импликация опровергается примером~\\ref{exgutlocal}. {\\small См.~\\ref{lems001wap}.}","proof":"","defence":[5],"kind":"claim","revision":""}},"claim6":{"old":null,"new":{"title":"Границы irr и σ для двудольных графов","short":"Защ. 6","num":"","page":"7","chapter":1,"line":209,"label":"defence6","statement":"\\item\\label{defence6} Для конечного простого двудольного графа с непустыми долями размеров $n_1,n_2$, без изолированных вершин, положим $M=\\max(n_1,n_2)$. Тогда \\[ \\operatorname{irr}(G)\\le n_1n_2(M-1),\\qquad \\sigma(G)\\le n_1n_2(M-1)^2 . \\] Для каждой оценки в отдельности равенство эквивалентно $G\\cong K_{1,M}$, включая $K_{1,1}$. {\\small См.~\\ref{boundbipartitegraph}.}","proof":"","defence":[6],"kind":"claim","revision":""}},"claim7":{"old":null,"new":{"title":"Штурмовость, морфизм и свойства слов","short":"Защ. 7","num":"","page":"7","chapter":1,"line":217,"label":"defence7","statement":"\\item\\label{defence7} Пусть $a,b\\ge1$ целые, $F_0=1$, $F_1=0$ и $F_n=F_{n-1}^{c_n}F_{n-2}$ при $n\\ge2$, где $c_n=a$ для чётных $n$ и $c_n=b$ для нечётных. Предел $F^{(a,b)}$ есть характеристическое слово Штурма наклона \\[ t=[0;a+1,\\overline{b,a}]=b/(\\alpha+b),\\qquad \\alpha=(ab+\\sqrt{a^2b^2+4ab})/2 . \\] Частоты $1$ и $0$ равны $t$ и $1-t$. Для $\\sigma_a(0)=0^a1$, $\\sigma_a(1)=0$ выполняется $F^{(a,b)}=\\sigma_a(F^{(b,a)})$. Возвратные слова к $0$ суть $0,01$, к $1$ --- $10^a,10^{a+1}$. Для $n\\ge2$ удаление двух последних букв $F_n$ даёт палиндромный префикс. Все длины палиндромных префиксов задаёт критерий следствия~\\ref{cor002arbitrary}. {\\small См.~\\ref{cor01sturmian}, \\ref{thm01desub}, \\ref{thm02freqduality}, \\ref{thm01return0}, \\ref{thm02return1}, \\ref{thm01centralpalindrome}, \\ref{cor002arbitrary}.}","proof":"","defence":[7],"kind":"claim","revision":""}},"classoftrees":{"old":{"short":"П 2.4.6","title":"Уменьшение irr при второй опоре","chapter":2,"severity":2,"note":"В доказательстве написано «две вершины степени не более 3» вместо по крайней мере 3; строгий выигрыш относительно выбранного паука не выведен. Формулировка не опровергнута.","statement":"\\begin{proposition}\\label{classoftrees} Пусть $\\mathcal T_{n,\\Delta}$ --- класс деревьев с $n$ вершинами и максимальной степенью $\\Delta$, пусть $\\TT\\in\\mathcal T_{n,\\Delta}$ и пусть $v_0\\in V(\\TT)$ имеет степень $\\Delta$. Если $\\TT$ имеет опорную вершину $v_\\ell\\neq v_0$ с $d(v_\\ell)\\ge3$, то существует $\\TT'\\in\\mathcal T_{n,\\Delta}$ такое, что $\\operatorname{irr}(\\TT')<\\operatorname{irr}(\\TT)$. \\end{proposition}","line":2349,"page":68,"defence":[]},"new":{"title":"Уменьшение irr при второй опоре","short":"П 2.4.4","num":"2.4.4","page":"19","chapter":2,"line":635,"label":"classoftrees","statement":"\\begin{proposition}\\label{classoftrees} Пусть $\\mathcal T_{n,\\Delta}$ --- класс деревьев с $n$ вершинами и максимальной степенью $\\Delta$, пусть $\\TT\\in\\mathcal T_{n,\\Delta}$ и пусть $v_0\\in V(\\TT)$ имеет степень $\\Delta$. Если $\\TT$ имеет опорную вершину $v_\\ell\\neq v_0$ с $d(v_\\ell)\\ge3$, то существует $\\TT'\\in\\mathcal T_{n,\\Delta}$ такое, что $\\operatorname{irr}(\\TT')<\\operatorname{irr}(\\TT)$. \\end{proposition}","proof":"Пусть $M$ --- внутренние степени дерева, а $\\Delta$ --- одна выбранная степень корня. По предложению~\\ref{propzagreb} и лемме~\\ref{lemleaves} \\[ \\irr(T)\\ge\\Delta(\\Delta-1)+\\sum_{d\\in M\\setminus\\{\\Delta\\}}(d-1)(d-2), \\] где удаляется одно вхождение $\\Delta$. При второй вершине степени хотя бы три сумма положительна. Паук с $\\Delta-1$ ветвями длины один и ветвью длины $n-\\Delta$ имеет те же $n,\\Delta$ и достигает $\\Delta(\\Delta-1)$ по лемме~\\ref{lem001starlikerr}.","defence":[],"kind":"proposition","revision":""}},"classoftreessigma":{"old":{"short":"П 3.2.1","title":"Уменьшение σ у сильной опоры","chapter":3,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{proposition}~\\label{classoftreessigma} Пусть $T\\in\\mathcal T_{n,\\Delta}$, пусть $v_0\\in V(T)$ --- вершина степени $\\Delta$, и пусть $y\\ne v_0$ --- вершина $T$, смежная по крайней мере с двумя висячими вершинами, где $\\lambda=d_T(y)\\ge3$ и $2\\Delta<3(\\lambda+1)$. Тогда существует дерево $T'\\in\\mathcal T_{n,\\Delta}$ такое, что $\\sigma(T')<\\sigma(T)$. \\end{proposition}","line":2914,"page":81,"defence":[]},"new":{"title":"Уменьшение σ у сильной опоры","short":"П 3.2.1","num":"3.2.1","page":"25","chapter":3,"line":808,"label":"classoftreessigma","statement":"\\begin{proposition}~\\label{classoftreessigma} Пусть $T\\in\\mathcal T_{n,\\Delta}$, пусть $v_0\\in V(T)$ --- вершина степени $\\Delta$, и пусть $y\\ne v_0$ --- вершина $T$, смежная по крайней мере с двумя висячими вершинами, где $\\lambda=d_T(y)\\ge3$ и $2\\Delta<3(\\lambda+1)$. Тогда существует дерево $T'\\in\\mathcal T_{n,\\Delta}$ такое, что $\\sigma(T')<\\sigma(T)$. \\end{proposition}","proof":"Пусть $N_T(y)=\\{y_1,\\dots,y_\\lambda\\}$, где $y_1,y_2$ --- висячие вершины, и положим $b_i=d_T(y_i)$ при $i\\ge3$. Пусть $T'$ получено из $T$ удалением ребра $yy_1$ и добавлением ребра $y_1y_2$. Если удалить $yy_1$, остаются изолированная вершина $y_1$ и дерево, содержащее $y_2$. Тогда добавление $y_1y_2$ соединяет их заново. Тогда $T'$ --- дерево на тех же $n$ вершинах. Его степени отличаются от степеней $T$ только в $y,y_1,y_2$, причём $d_{T'}(y)=\\lambda-1$, $d_{T'}(y_1)=1$, $d_{T'}(y_2)=2$. Так как $\\Delta\\ge\\lambda\\ge3$, вершина $v_0$. Следовательно, $T'\\in\\mathcal T_{n,\\Delta}$. Поскольку $y_2$ --- висячая вершина, она не имеет других рёбер. Следовательно, \\begin{align*} \\sigma(T)-\\sigma(T')&=(\\lambda-1)^2+(\\lambda-1)^2+\\sum_{i=3}^{\\lambda}(\\lambda-b_i)^2-(1-2)^2-\\bigl(2-(\\lambda-1)\\bigr)^2\\\\ &\\qquad -\\sum_{i=3}^{\\lambda}(\\lambda-1-b_i)^2\\\\ &=2(\\lambda-1)^2-1-(\\lambda-3)^2+\\sum_{i=3}^{\\lambda}\\bigl(2(\\lambda-b_i)-1\\bigr)\\\\ &=3(\\lambda-2)(\\lambda+1)-2\\sum_{i=3}^{\\lambda}b_i , \\end{align*} Поскольку $x^2-(x-1)^2=2x-1$, $2(\\lambda-1)^2-1-(\\lambda-3)^2+(\\lambda-2)(2\\lambda-1)=3\\lambda^2-3\\lambda-6$. Поскольку $b_i\\le\\Delta$ для каждого из $\\lambda-2$ индексов $i\\ge3$, $\\lambda\\ge3$ и $2\\Delta<3(\\lambda+1)$, отсюда следует, что \\[ \\sigma(T)-\\sigma(T')\\ \\ge\\ (\\lambda-2)\\bigl(3(\\lambda+1)-2\\Delta\\bigr)\\ >\\ 0 , \\] Следовательно, $\\sigma(T')<\\sigma(T)$.","defence":[],"kind":"proposition","revision":""}},"classoftreesstrong":{"old":{"short":"П 2.4.7","title":"Уменьшение irr: сильная опора","chapter":2,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{proposition}~\\label{classoftreesstrong} Пусть $\\mathcal{T}_{n, \\Delta}$ --- класс деревьев с $n$ вершинами, пусть $\\TT \\in \\mathcal{T}_{n, \\Delta}$ --- дерево, и пусть $v_0 \\in V(\\TT)$ --- вершина с максимальной степенью $\\Delta$. Для любой сильной опорной вершины $v_{\\ell}$ в $\\TT$, отличной от $v_0$, где $d(v_{\\ell})\\geqslant 3$. Тогда существует другое дерево $T^{\\prime} \\in \\mathcal{T}_{n, \\Delta}$ такое, что $\\irr(\\TT^{\\prime}) < \\irr(\\TT)$. \\end{proposition}","line":2359,"page":68,"defence":[]},"new":{"title":"Уменьшение irr: сильная опора","short":"П 2.4.5","num":"2.4.5","page":"20","chapter":2,"line":647,"label":"classoftreesstrong","statement":"\\begin{proposition}\\label{classoftreesstrong} Если вне выбранной вершины максимальной степени $\\Delta$ существует сильная опорная вершина степени не ниже трёх, индекс $\\irr$ можно строго уменьшить при сохранении $n$ и $\\Delta$. \\end{proposition}","proof":"Все условия предложения~\\ref{classoftrees} выполнены.","defence":[],"kind":"proposition","revision":""}},"conj01dualityinformal":{"old":{"short":"Г 6.0.1","title":"Двойственность через замену и префикс","chapter":6,"severity":3,"note":"Для (a,b)=(1,2) частоты двух слов 0.42265 и 0.26795 ни равны, ни дополнительны. Замена букв и конечная префиксная поправка такого изменения дать не могут.","statement":"\\begin{conjecture}~\\label{conj01dualityinformal} Существует явное, эффективно вычислимое отображение $\\theta$ на бесконечных двоичных словах, построенное из переименования букв и ограниченной префиксной поправки, такое что \\[ \\FD^{(b,a)} = \\theta\\bigl(\\FD^{(a,b)}\\bigr) \\qquad \\text{для всех } a,b\\geqslant 1. \\] \\end{conjecture}","line":5081,"page":138,"defence":[]},"new":{"title":"Невозможность замены букв при разных параметрах","short":"П 6.2.1","num":"6.2.1","page":"54","chapter":6,"line":2075,"label":"conj01dualityinformal","statement":"\\begin{proposition}\\label{conj01dualityinformal} При $a\\ne b$ слова $\\FD^{(a,b)}$ и $\\FD^{(b,a)}$ невозможно получить одно из другого переименованием букв и конечным изменением префикса. \\end{proposition}","proof":"По теореме~\\ref{thm02freqduality} частоты единицы равны $b/(\\alpha+b)$ и $a/(\\alpha+a)$. Они различны и обе меньше $1/2$, поскольку $\\alpha>ab\\ge\\max(a,b)$. Конечная префиксная поправка сохраняет предельную частоту. Перестановка двоичного алфавита сохраняет её или заменяет дополнительной. Ни один вариант здесь невозможен. Действующая связь задана морфизмом теоремы~\\ref{thm01desub}.","defence":[],"kind":"proposition","revision":"Простая перестановка букв при различных параметрах исключена сравнением частот. Сохраняющаяся связь задаётся морфизмом."}},"cor001polarizedgraphical":{"old":{"short":"С 3.4.1","title":"Графичность поляризованных кандидатов","chapter":3,"severity":1,"note":"Графичность верна, но a₂=a₃=0 противоречит первоначальному aᵢ≥1. Требуется единый класс aᵢ≥0; графичность и связность различать.","statement":"\\begin{corollary}\\label{cor001polarizedgraphical} При $n\\ge8$ обе последовательности $\\mathcal P^{(2)}$ и $\\mathcal P^{(3)}$ из \\eqref{eqq01def002polarized} графичны. \\end{corollary}","line":3318,"page":93,"defence":[]},"new":{"title":"Графичность поляризованных кандидатов","short":"С 3.4.1","num":"3.4.1","page":"32","chapter":3,"line":1105,"label":"cor001polarizedgraphical","statement":"\\begin{corollary}\\label{cor001polarizedgraphical} При $n\\ge8$ обе последовательности $\\mathcal P^{(2)}$ и $\\mathcal P^{(3)}$ из \\eqref{eqq01def002polarized} графичны. \\end{corollary}","proof":"В каждом случае $a_2=a_3=0$, так что критерий графичности из леммы~\\ref{lem02parity} сводится к чётности одного лишь $a_1+a_3=a_1$. Для $\\mathcal P^{(2)}$ $a_1=2k$ чётно. Для $\\mathcal P^{(3)}$ $a_1=2k+2$ чётно. Поскольку $n=4k+2\\ge10$ и $n=4k+3\\ge11$ соответственно (оба $\\ge8$), лемма~\\ref{lem02parity} применима полностью, и обе последовательности графичны.","defence":[],"kind":"corollary","revision":""}},"cor002arbitrary":{"old":{"short":"С 6.2.2","title":"Неограниченные палиндромные префиксы","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{corollary}~\\label{cor002arbitrary} $\\FD^{(a,b)}$ имеет палиндромные префиксы сколь угодно большой длины; в частности, $P_{\\FD^{(a,b)}}(|\\FD^{(a,b)}_n|-2)\\geqslant 1$ для каждого $n\\geqslant 2$. \\end{corollary}","line":5553,"page":149,"defence":[7]},"new":{"title":"Критерий всех палиндромных префиксов","short":"С 6.2.2","num":"6.2.2","page":"57","chapter":6,"line":2199,"label":"cor002arbitrary","statement":"\\begin{corollary}\\label{cor002arbitrary} Пусть $\\{x\\}=x-\\lfloor x\\rfloor$. Для каждого целого $L\\ge0$ префикс длины $L$ палиндромен в точности тогда, когда $\\{(L+2)t\\}$ меньше всех либо больше всех чисел $\\{jt\\}$ при $1\\le j\\le L+1$. В частности, длины палиндромных префиксов не ограничены. \\end{corollary}","proof":"По следствию~\\ref{cor01sturmian} число единиц в начальном отрезке длины $j$ равно $C(j)=\\lfloor(j+1)t\\rfloor$. Префикс длины $L$ совпадает со своим обращением в точности тогда, когда $C(j)=C(L)-C(L-j)$ для всех $0\\le j\\le L$: вычитание соседних равенств сравнивает зеркальные буквы. Сумма $C(j)+C(L-j)$ равна $\\lfloor(L+2)t\\rfloor$ при $\\{(j+1)t\\}<\\{(L+2)t\\}$ и на единицу меньше при противоположном неравенстве. Равенства дробных частей невозможны ввиду иррациональности $t$. При $j=0$ сумма равна $C(L)$. Поэтому она постоянна ровно в двух указанных случаях. Неограниченность длин следует из теоремы~\\ref{thm01centralpalindrome}.","defence":[7],"kind":"corollary","revision":"Указан необходимый и достаточный критерий для всех длин палиндромных префиксов."}},"cor01bounded":{"old":{"short":"С 3.4.2","title":"Равномерный отрыв спектра от нуля","chapter":3,"severity":3,"note":"Наименьшее собственное значение −Q(λ) стремится к нулю при λ→2−. Равномерная оценка верна лишь на [0,2−ε].","statement":"\\begin{corollary}\\label{cor01bounded} Пусть $\\alpha(\\lambda)>0$ --- наименьшее собственное значение $-Q(\\lambda)$. Тогда $\\alpha(\\lambda)$ отделено от $0$ равномерно при $\\lambda\\in[0,2)$, и \\begin{equation} g_\\lambda(\\delta,t)\\leqslant-\\alpha(\\lambda)(\\delta^{2}+t^{2}) \\qquad\\text{для всех }(\\delta,t)\\in\\mathbb{Z}^{2}. \\end{equation} \\end{corollary}","line":3549,"page":99,"defence":[]},"new":{"title":"Равномерный отрыв спектра от нуля","short":"С 3.4.2","num":"3.4.2","page":"36","chapter":3,"line":1318,"label":"cor01bounded","statement":"\\begin{corollary}\\label{cor01bounded} При каждом фиксированном $\\lambda\\in[0,2)$ число $\\alpha(\\lambda)=\\mu_{\\min}(-Q(\\lambda))$ положительно и \\[ g_\\lambda(\\delta,t)\\le-\\alpha(\\lambda)(\\delta^2+t^2). \\] Для любого $\\varepsilon\\in(0,2)$ оценка равномерна на $[0,2-\\varepsilon]$. На всём $[0,2)$ равномерной положительной нижней границы нет. На $[0,1]$ можно использовать явную оценку $\\alpha(\\lambda)\\ge1/16$. \\end{corollary}","proof":"Первые утверждения следуют из отрицательной определённости $Q$ и непрерывности её собственных значений на компактном отрезке $[0,2-\\varepsilon]$. При $\\lambda\\to2-$ определитель $Q$ стремится к нулю, а $\\operatorname{tr}(-Q)\\to5/2$, поэтому $\\alpha(\\lambda)\\to0$. Для явной оценки положим $x=2^\\lambda$, $q=3^\\lambda$, $p=x-1$. На $[0,1]$ имеем $0\\le p\\le1$, $q\\ge x$ и $h=q-p^2\\ge q-p\\ge1$. Матрица $-Q=\\tfrac14\\left(\\begin{smallmatrix}q&p\\\\p&1\\end{smallmatrix}\\right)$ имеет определитель $h/16\\ge1/16$ и след $(q+1)/4\\le1$. Следовательно, $\\mu_{\\min}=\\det(-Q)/\\mu_{\\max}\\ge\\det(-Q)/\\operatorname{tr}(-Q)\\ge1/16$.","defence":[],"kind":"corollary","revision":""}},"cor01returnduality":{"old":{"short":"С 6.2.1","title":"Двойственность возвратных слов","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{corollary}~\\label{cor01returnduality} Возвратными словами $1$ в $\\FD^{(a,b)}$ и $\\FD^{(b,a)}$ являются $\\{1\\,0^a,\\ 1\\,0^{a+1}\\}$ и $\\{1\\,0^b,\\ 1\\,0^{b+1}\\}$ соответственно. Обмен $a$ и $b$ действует на множество возвратных слов $1$ в точности заменой показателя $a$ на $b$, тогда как множество возвратных слов $0$, $\\{0,01\\}$, остаётся неизменным. \\end{corollary}","line":5496,"page":147,"defence":[]},"new":{"title":"Двойственность возвратных слов","short":"С 6.2.1","num":"6.2.1","page":"56","chapter":6,"line":2178,"label":"cor01returnduality","statement":"\\begin{corollary}~\\label{cor01returnduality} Возвратными словами $1$ в $\\FD^{(a,b)}$ и $\\FD^{(b,a)}$ являются $\\{1\\,0^a,\\ 1\\,0^{a+1}\\}$ и $\\{1\\,0^b,\\ 1\\,0^{b+1}\\}$ соответственно. Обмен $a$ и $b$ действует на множество возвратных слов $1$ в точности заменой показателя $a$ на $b$, тогда как множество возвратных слов $0$, $\\{0,01\\}$, остаётся неизменным. \\end{corollary}","proof":"Подставим $(b,a)$ в теоремы~\\ref{thm01return0} и~\\ref{thm02return1}.","defence":[],"kind":"corollary","revision":""}},"cor01sturmian":{"old":{"short":"С 6.1.1","title":"Слово является штурмовым","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{corollary}~\\label{cor01sturmian} Для любых $a,b\\geqslant 1$ слово $\\FD^{(a,b)}$ является стандартным словом Штурма. \\end{corollary}","line":5158,"page":140,"defence":[7]},"new":{"title":"Слово является штурмовым","short":"С 6.1.1","num":"6.1.1","page":"53","chapter":6,"line":2006,"label":"cor01sturmian","statement":"\\begin{corollary}\\label{cor01sturmian} Для целых $a,b\\ge1$ слово $\\FD^{(a,b)}$ является характеристическим словом Штурма наклона $t=[0;a+1,\\overline{b,a}]$. При нумерации с нуля его буква с индексом $i$ равна $\\lfloor(i+2)t\\rfloor-\\lfloor(i+1)t\\rfloor$. \\end{corollary}","proof":"Применим предложение~2.2.24 из~\\cite{Lothaire2002} к направляющей последовательности предложения~\\ref{prop01fabisstandard}. Формула букв есть механическая запись характеристического слова с начальной точкой $t$.","defence":[7],"kind":"corollary","revision":""}},"cor01symmetry":{"old":{"short":"С 6.3.1","title":"Симметрия функции Ind","chapter":6,"severity":0,"note":"Алгебраическое утверждение о явно определённой функции Ind согласовано. Равенство Ind=CE в работе не доказано; этот цвет не подтверждает интерпретацию как критического показателя.","statement":"\\begin{corollary}~\\label{cor01symmetry} Для $a,b\\geqslant 1$ имеет место $\\operatorname{Ind}(\\FD^{(a,b)})=\\operatorname{Ind}(\\FD^{(b,a)})$. \\end{corollary}","line":5736,"page":153,"defence":[]},"new":{"title":"Симметрия функции Ind","short":"С 6.3.1","num":"6.3.1","page":"59","chapter":6,"line":2300,"label":"cor01symmetry","statement":"\\begin{corollary}~\\label{cor01symmetry} Для $a,b\\geqslant 1$ имеет место $\\operatorname{Ind}(\\FD^{(a,b)})=\\operatorname{Ind}(\\FD^{(b,a)})$. \\end{corollary}","proof":"Обе величины $M$ и $\\alpha(ab)$ в теореме~\\ref{ind_ce} симметричны по $a,b$.","defence":[],"kind":"corollary","revision":""}},"corbounds":{"old":{"short":"С 2.4.1","title":"Граница минимума irr через n и Δ","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{corollary}~\\label{corbounds} Пусть $M=\\{d_1,\\dots,d_k\\}$, $k\\ge2$, --- мультимножество целых чисел $\\ge2$ с максимумом $\\Delta$, и $n=\\sum_{i=1}^{k}(d_i-1)+2$ --- порядок соответствующих гусеничных деревьев. Тогда \\begin{equation}~\\label{eqqq01corbounds} \\irr_{\\min}(\\TT(M))\\le(\\Delta-2)n+2, \\end{equation} причём равенство достигается тогда и только тогда, когда все $d_i=\\Delta$ или $\\Delta=2$. \\end{corollary}","line":2266,"page":65,"defence":[]},"new":{"title":"Граница минимума irr через n и Δ","short":"С 2.4.1","num":"2.4.1","page":"19","chapter":2,"line":608,"label":"corbounds","statement":"\\begin{corollary}~\\label{corbounds} Пусть $M=\\{d_1,\\dots,d_k\\}$, $k\\ge2$, --- мультимножество целых чисел $\\ge2$ с максимумом $\\Delta$, и $n=\\sum_{i=1}^{k}(d_i-1)+2$ --- порядок соответствующих гусеничных деревьев. Тогда \\begin{equation}~\\label{eqqq01corbounds} \\irr_{\\min}(\\TT(M))\\le(\\Delta-2)n+2, \\end{equation} причём равенство достигается тогда и только тогда, когда все $d_i=\\Delta$ или $\\Delta=2$. \\end{corollary}","proof":"Предположим, что $\\TT(M)\\cong K_{1,\\Delta}$, тогда оно имеет $n=\\Delta+1$, и $(\\Delta-2)n+2=(\\Delta-1)\\Delta$. Поскольку $\\sum(d_i-1)(d_i-2)\\le(\\Delta-2)\\sum(d_i-1)$, имеем $D(M) \\le (\\Delta-2)(n-2)$, причём равенство достигается тогда и только тогда, когда каждое $d_i=\\Delta$ или $\\Delta=2$. Таким образом, $D(M)-2+2\\Delta\\le(\\Delta-2)(n-2)+2\\Delta-2=(\\Delta-2)n+2$. Тогда $D(M)\\le(\\Delta-2)(n-2)$. Таким образом, верхняя оценка~\\eqref{eqqq01corbounds} выполняется, и она точна.","defence":[],"kind":"corollary","revision":""}},"corsmall":{"old":{"short":"С 2.2.1","title":"Формулы для коротких хребтов","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{corollary}~\\label{corsmall} Пусть $a_1\\ge\\dots\\ge a_k\\ge 2$ — степени хребта $\\TT$ в невозрастающем порядке. Тогда \\begin{align} &\\operatorname{irr}_{\\min}(\\TT)=\\sum_{i=1}^{k}(a_i-1)^2+a_1-\\sum_{i=2}^{k}a_i+k-2,~\\label{eqq01corsmall} \\\\ &\\operatorname{irr}_{\\max}(\\TT)-\\operatorname{irr}_{\\min}(\\TT)=2\\Bigl(\\sum_{i=2}^{h}a_i-\\sum_{i=k-h+2}^{k}a_i\\Bigr),~\\label{eqq02corsmall} \\end{align} где $h=\\lfloor(k+1)/2\\rfloor$. \\end{corollary}","line":1626,"page":52,"defence":[]},"new":{"title":"Формулы для коротких хребтов","short":"С 2.2.1","num":"2.2.1","page":"15","chapter":2,"line":468,"label":"corsmall","statement":"\\begin{corollary}~\\label{corsmall} Пусть $a_1\\ge\\dots\\ge a_k\\ge 2$ — степени хребта $\\TT$ в невозрастающем порядке. Тогда \\begin{align} &\\operatorname{irr}_{\\min}(\\TT)=\\sum_{i=1}^{k}(a_i-1)^2+a_1-\\sum_{i=2}^{k}a_i+k-2,~\\label{eqq01corsmall} \\\\ &\\operatorname{irr}_{\\max}(\\TT)-\\operatorname{irr}_{\\min}(\\TT)=2\\Bigl(\\sum_{i=2}^{h}a_i-\\sum_{i=k-h+2}^{k}a_i\\Bigr),~\\label{eqq02corsmall} \\end{align} где $h=\\lfloor(k+1)/2\\rfloor$. \\end{corollary}","proof":"В теореме~\\ref{thmext} заменим $(a_i-2)(a_i-1)$ на $(a_i-1)^2-(a_i-1)$. Затем вычтем выражение для минимума из выражения для максимума.","defence":[],"kind":"corollary","revision":""}},"cortreen1":{"old":{"short":"С 1.2.1","title":"Следствие для числа доминирования","chapter":1,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{corollary}[\\cite{Reinhard6thDiestel}]~\\label{cortreen1} Пусть $G$ — связный граф с $n$ вершинами. Тогда $G$ является деревом $\\TT$ тогда и только тогда, когда $G$ имеет $n-1$ рёбер. \\end{corollary}","line":594,"page":21,"defence":[]},"new":{"title":"Следствие для числа доминирования","short":"С 1.2.1","num":"1.2.1","page":"5","chapter":1,"line":140,"label":"cortreen1","statement":"\\begin{corollary}[\\cite{Reinhard6thDiestel}]~\\label{cortreen1} Пусть $G$ — связный граф с $n$ вершинами. Тогда $G$ является деревом $\\TT$ тогда и только тогда, когда $G$ имеет $n-1$ рёбер. \\end{corollary}","proof":"Связный граф содержит остовное дерево. В дереве порядка $n$ ровно $n-1$ рёбер, что следует индукцией с удалением листа. Если столько же рёбер имеет сам граф, то он совпадает со своим остовным деревом.","defence":[],"kind":"corollary","revision":""}},"def001modifiedsequences":{"old":null,"new":{"title":"Два преобразования кратностей","short":"О 3.4.4","num":"3.4.4","page":"32","chapter":3,"line":1119,"label":"def001modifiedsequences","statement":"\\begin{definition}~\\label{def001modifiedsequences} Пусть $\\mathscr{S}=(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ --- химическая последовательность степеней. Определим следующие элементарные модификации $\\mathscr{S}$: \\begin{itemize} \\item $\\mathscr{S}^+ = (1^{a_1-1},\\,2^{a_2-1},\\,3^{a_3+1},\\,4^{a_4+1})$ при условии, что $a_1,a_2\\geq 1$; \\item $\\mathscr{S}^- = (1^{a_1+1},\\,2^{a_2+1},\\,3^{a_3-1},\\,4^{a_4-1})$ при условии, что $a_3,a_4\\geq 1$; \\item $\\mathscr{S}^\\dagger = (1^{a_1+1},\\,2^{a_2-1},\\,3^{a_3+1},\\,4^{a_4-1})$ при условии, что $a_2,a_4\\geq 1$; \\item $\\mathscr{S}^\\ddagger = (1^{a_1-1},\\,2^{a_2+1},\\,3^{a_3-1},\\,4^{a_4+1})$ при условии, что $a_1,a_3\\geq 1$. \\end{itemize} \\end{definition}","proof":"","defence":[],"kind":"definition","revision":""}},"def01ce":{"old":null,"new":{"title":"Критический показатель слова","short":"О 6.0.2","num":"6.0.2","page":"52","chapter":6,"line":1971,"label":"def01ce","statement":"\\begin{definition}\\label{def01ce} Период непустого конечного слова $w$ --- положительное целое $p$, для которого $w_i=w_{i+p}$ при $0\\le i<|w|-p$. При наименьшем периоде $\\pi(w)$ полагаем $e(w)=|w|/\\pi(w)$. Критический показатель $\\CE(x)$ бесконечного слова есть супремум $e(w)$ по его непустым факторам. Для начального показателя $\\ice(x)$ супремум берётся по непустым префиксам. \\end{definition}","proof":"","defence":[],"kind":"definition","revision":""}},"def01families":{"old":null,"new":{"title":"Однопараметрические семейства кратностей","short":"О 3.4.1","num":"3.4.1","page":"31","chapter":3,"line":1062,"label":"def01families","statement":"\\begin{definition}~\\label{def01families} Пусть $\\mathscr S_a^{(r)}$ --- семейство кандидатов. Тогда \\begin{enumerate} \\item Для $0 \\le a \\le k$ и $r=1$ положим \\begin{equation}~\\label{eqq01familyr1} \\mathscr S_a^{(1)} = \\big(1^{k+a},\\, 2^{k-a},\\, 3^{k-a},\\, 4^{k+1+a}\\big). \\end{equation} \\item Для $0 \\le a \\le k$ и $r=2$ положим \\begin{equation}~\\label{eqq01familyr2} \\mathscr S_a^{(2)} = \\big(1^{k+a},\\, 2^{k+1-a},\\, 3^{k-a},\\, 4^{k+1+a}\\big), \\end{equation} \\item Для $0 \\le a \\le k$ и $r=3$ положим \\begin{equation}~\\label{eqq01familyr3} \\mathscr S_a^{(3)} = \\big(1^{k+1+a},\\, 2^{k-a},\\, 3^{k+1-a},\\, 4^{k+1+a}\\big), \\end{equation} \\end{enumerate} \\end{definition}","proof":"","defence":[],"kind":"definition","revision":""}},"def01returnword":{"old":null,"new":{"title":"Возвратное слово","short":"О 6.2.1","num":"6.2.1","page":"56","chapter":6,"line":2151,"label":"def01returnword","statement":"\\begin{definition}~\\label{def01returnword} Пусть $w\\in\\AlphA^{\\N}$, и пусть $u\\in\\mathcal{L}(w)$ встречается в позициях $p_0<p_1<p_2<\\cdots$ слова $w$. \\emph{Возвратными словами} слова $u$ в $w$ называются факторы $w[p_i,p_{i+1})$, $i\\geqslant 0$, где каждый такой фактор начинается с вхождения $u$ и продолжается до места непосредственно перед следующим вхождением. \\end{definition}","proof":"","defence":[],"kind":"definition","revision":""}},"def01standardsequence":{"old":null,"new":{"title":"Стандартная последовательность слов","short":"О 6.1.1","num":"6.1.1","page":"53","chapter":6,"line":1979,"label":"def01standardsequence","statement":"\\begin{definition}~\\label{def01standardsequence} Для заданной последовательности положительных целых чисел $(d_k)_{k\\ge1}$ соответствующая \\emph{стандартная последовательность} $(s_k)_{k\\ge-1}$ определяется формулами \\[ s_{-1} = 1, \\qquad s_0 = 0, \\qquad s_k = s_{k-1}^{\\,d_k}\\,s_{k-2} \\quad (k\\ge1). \\] \\end{definition}","proof":"","defence":[],"kind":"definition","revision":""}},"defence_sigma":{"old":{"short":"Положение п.4","title":"Минимум σ только на одном порядке","chapter":7,"severity":3,"note":"Положение на защиту повторяет ложную исключительность порядка. Величина минимума остаётся корректной.","statement":"","line":null,"page":29,"defence":[4]},"new":{"title":"Минимум σ и критерий равенства","short":"Защ. 4","num":"","page":"7","chapter":1,"line":198,"label":"defence4","statement":"\\item\\label{defence4} Пусть $2\\le d_1\\le\\cdots\\le d_k$, $k\\ge2$. Среди гусениц с этими степенями хребта минимум $\\sigma$ достигается, если сначала выписать $d_i$ с нечётными индексами по возрастанию индексов, затем $d_i$ с чётными индексами по убыванию индексов. При попарно различных степенях порядок единствен с точностью до обращения. Для повторяющихся степеней все случаи равенства описывает критерий по разрезам в теореме~\\ref{thmsigmin001}. {\\small См.~\\ref{thmsigmin001}.}","proof":"","defence":[4],"kind":"claim","revision":""}},"domnumn1":{"old":{"short":"П 1.1.3","title":"Число доминирования дерева","chapter":1,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{proposition}[\\cite{Slater1995PJV1, Desormeaux2014WyattHaynes}]~\\label{domnumn1} Пусть $d_1\\ge d_2\\ge\\dots\\ge d_n$ — последовательность степеней графа $G$ порядка $n$, и пусть $\\gamma(G)$ — его число доминирования. Тогда \\[ \\gamma(G)\\ \\ge\\ \\min\\Bigl\\{\\,t\\ :\\ t+\\sum_{i=1}^{t}d_i\\ \\ge\\ n\\Bigr\\}. \\] \\end{proposition}","line":563,"page":20,"defence":[]},"new":{"title":"Число доминирования дерева","short":"П 1.1.3","num":"1.1.3","page":"5","chapter":1,"line":128,"label":"domnumn1","statement":"\\begin{proposition}[\\cite{Slater1995PJV1, Desormeaux2014WyattHaynes}]~\\label{domnumn1} Пусть $d_1\\ge d_2\\ge\\dots\\ge d_n$ — последовательность степеней графа $G$ порядка $n$, и пусть $\\gamma(G)$ — его число доминирования. Тогда \\[ \\gamma(G)\\ \\ge\\ \\min\\Bigl\\{\\,t\\ :\\ t+\\sum_{i=1}^{t}d_i\\ \\ge\\ n\\Bigr\\}. \\] \\end{proposition}","proof":"Если доминирующее множество содержит $t$ вершин, объединение их замкнутых окрестностей содержит все $n$ вершин и имеет мощность не больше $t+\\sum_{i=1}^t d_i$. Отсюда получается указанное ограничение.","defence":[],"kind":"proposition","revision":""}},"end_chemical":{"old":{"short":"Итог §3.4","title":"Полная глобальная классификация","chapter":3,"severity":2,"note":"Итог не учитывает связанные дискретные параметры и опирается на неверное отсечение ветвей.","statement":"","line":null,"page":113,"defence":[]},"new":{"title":"Заключение об области оптимизации","short":"Закл. хим.","num":"","page":"60","chapter":7,"line":2313,"label":"end_chemical","statement":"Для модифицированной полной нерегулярности инвариант определяется кратностями степеней. Теорема~\\ref{Thm02worksep} даёт конечный алгоритм при $\\lambda\\ge0$, учитывающий чётность и границы допустимой области. Теорема~\\ref{thm001global} дополнительно сокращает множество рассматриваемых ветвей при $0\\le\\lambda\\le1$. Условие существования связной реализации можно включить в тот же отбор.","proof":"","defence":[],"kind":"text","revision":""}},"end_gut":{"old":{"short":"Заключение п.4","title":"Повтор единственности экстремумов Gut","chapter":7,"severity":3,"note":"Повторяет опровергнутую единственность Т 4.0.1 и конструкцию Т 4.0.2.","statement":"","line":null,"page":162,"defence":[]},"new":{"title":"Заключение об оптимальных расстановках Gut","short":"Закл. Gut","num":"","page":"60","chapter":7,"line":2315,"label":"end_gut","statement":"Для индекса Гутмана каждое ребро хребта вносит в сумму расстояний величину, определяемую суммой весов начального отрезка. По теоремам~\\ref{ThmLinDualln1} и~\\ref{ThmLinDualln2} это даёт точный алгоритм для обоих экстремумов. Даже при фиксации всех степеней экстремальное дерево может быть неединственным. Лемма~\\ref{lems001wap} определяет изменение индекса при одном обмене; пример с восемью степенями показывает границу применения такого теста.","proof":"","defence":[],"kind":"text","revision":""}},"end_slope":{"old":{"short":"Текст §6.3","title":"Одинаковый ab ⇒ одинаковый наклон","chapter":6,"severity":3,"note":"Общий параметр α не определяет наклон первого семейства без отдельного параметра b.","statement":"","line":null,"page":151,"defence":[]},"new":{"title":"Заключение о наклоне и критическом показателе","short":"Закл. слово","num":"","page":"61","chapter":7,"line":2319,"label":"end_slope","statement":"Для рекурсии с начальными словами $1,0$ наклон и частота единицы равны $b/(\\alpha+b)$. В теореме~\\ref{thm01desub} связь между переставленными параметрами установлена для каждого конечного слова и его предела. Получены явные возвратные слова и критерий палиндромных префиксов. Подстановка цепной дроби в классическую формулу штурмова индекса приводит к~\\eqref{eqq01indMP}. В пределах рассматриваемого семейства слова с переставленными параметрами имеют одинаковый критический показатель, хотя при $a\\ne b$ различаются их частоты.","proof":"","defence":[],"kind":"text","revision":""}},"eq1gut":{"old":null,"new":{"title":"Определение индекса Гутмана","short":"Ф 4.1","num":"4.1","page":"43","chapter":4,"line":1703,"label":"eq1gut","statement":"\\begin{equation}\\label{eq1gut} \\Gut(G)=\\sum_{\\{u,v\\}\\subset V(G)}d(u)d(v)\\dist(u,v). \\end{equation}","proof":"","defence":[],"kind":"equation","revision":""}},"eqq01Dsign":{"old":null,"new":{"title":"Знак коэффициента D(λ)","short":"Ф 3.42","num":"3.42","page":"38","chapter":3,"line":1449,"label":"eqq01Dsign","statement":"\\begin{equation}~\\label{eqq01Dsign} D(\\lambda) \\;\\begin{cases} >0, & \\lambda\\in[0,2), \\\\ <0, & \\lambda\\in(2,\\infty). \\end{cases} \\end{equation}","proof":"","defence":[],"kind":"equation","revision":""}},"eqq01def002Sp":{"old":null,"new":{"title":"Семейство при n ≡ 2 (mod 4)","short":"Ф 3.27","num":"3.27","page":"32","chapter":3,"line":1098,"label":"eqq01def002Sp","statement":"\\begin{definition} Для $n=4k+2$ и $0\\le p\\le 2k$ положим \\begin{equation}\\label{eqq01def002Sp} \\mathscr S_p := \\big(1^{p},\\,2^{2k+2-p},\\,3^{2k-p},\\,4^{p}\\big). \\end{equation} \\end{definition}","proof":"","defence":[],"kind":"equation","revision":""}},"eqq01def002polarized":{"old":null,"new":{"title":"Поляризованные последовательности","short":"Ф 3.26","num":"3.26","page":"32","chapter":3,"line":1087,"label":"eqq01def002polarized","statement":"\\begin{definition} Для $r\\in\\{2,3\\}$ \\emph{поляризованной последовательностью} $\\mathcal P^{(r)}$ называется последовательность степеней без вершин степени $2$ или $3$: \\begin{equation}\\label{eqq01def002polarized} \\mathcal P^{(2)} = \\big(1^{2k},\\,4^{2k+2}\\big), \\qquad \\mathcal P^{(3)} = \\big(1^{2k+2},\\,4^{2k+1}\\big). \\end{equation} \\end{definition}","proof":"","defence":[],"kind":"equation","revision":""}},"eqq01modsigma":{"old":null,"new":{"title":"Полная модифицированная нерегулярность","short":"Ф 3.21","num":"3.21","page":"31","chapter":3,"line":1043,"label":"eqq01modsigma","statement":"\\begin{equation}~\\label{eqq01modsigma} \\sig{\\lambda}(G) = \\sum_{\\{u,v\\} \\subseteq V(G)} |d_G(u) - d_G(v)|^{\\lambda}. \\end{equation}","proof":"","defence":[],"kind":"equation","revision":""}},"eqq02modsigma":{"old":null,"new":{"title":"Формула по четырём кратностям","short":"Ф 3.22","num":"3.22","page":"31","chapter":3,"line":1054,"label":"eqq02modsigma","statement":"\\begin{equation}~\\label{eqq02modsigma} \\sig{\\lambda}(\\mathscr S) = (a_1a_2+a_2a_3+a_3a_4) + (a_1a_3+a_2a_4)\\,2^{\\lambda} + a_1a_4\\,3^{\\lambda} \\end{equation}","proof":"","defence":[],"kind":"equation","revision":""}},"eqq1AlphAadef":{"old":null,"new":{"title":"Квадратичный параметр α","short":"Ф 6.2","num":"6.2","page":"53","chapter":6,"line":2014,"label":"eqq1AlphAadef","statement":"\\begin{equation}\\label{eqq1AlphAadef} \\alpha=\\alpha(a,b)=\\tfrac12(ab+\\sqrt{a^2b^2+4ab}). \\end{equation}","proof":"","defence":[],"kind":"equation","revision":""}},"exgutlocal":{"old":null,"new":{"title":"Локальный максимум Gut ниже глобального","short":"Пр 4.2.1","num":"4.2.1","page":"45","chapter":4,"line":1806,"label":"exgutlocal","statement":"\\begin{example}\\label{exgutlocal} Условие локального максимума по всем попарным обменам степеней может выполняться строго ниже глобального максимума.\\end{example}","proof":"Хребет $(7,6,6,4,2,4,7,8)$ имеет $\\Gut=10381$. Для левого конца $a$ от 1 до 7 максимальные изменения по всем $b>a$, вычисленные по лемме~\\ref{lems001wap}, равны $0,0,-32,0,-48,-156,-92$. Вместе с тем теорема~\\ref{ThmLinDualln1} даёт максимум $10385$, достигаемый, например, на $(8,6,6,2,4,4,7,7)$.","defence":[5],"kind":"example","revision":""}},"exguttie":{"old":null,"new":{"title":"Два неизоморфных максимизатора Gut","short":"Пр 4.1.1","num":"4.1.1","page":"44","chapter":4,"line":1752,"label":"exguttie","statement":"\\begin{example}\\label{exguttie} Для одного мультимножества степеней максимум индекса Гутмана могут достигать две неизоморфные гусеницы.\\end{example}","proof":"Применим рекурсии теорем~\\ref{ThmLinDualln1} и~\\ref{ThmLinDualln2}. При $M=\\{2,3,4\\}$ последовательности $(4,3,2)$ и $(2,4,3)$ дают соответственно $147$ и $143$; вторая является минимизатором. При $M=\\{2,3,3,3,5\\}$ два порядка $(3,3,2,3,5)$ и $(3,3,3,2,5)$ достигают максимума $692$. Их нельзя получить друг из друга обращением, поскольку расстояния вдоль хребта между вершинами степеней $2$ и $5$ различны. Следовательно, классификация экстремальных деревьев должна допускать несколько оптимальных расстановок.","defence":[],"kind":"example","revision":""}},"freq_initial":{"old":{"short":"Ф 6.2","title":"Старая формула частот 1/(1+α)","chapter":6,"severity":3,"note":"Для F₀=1,F₁=0 верно b/(α+b); исходная формула совпадает только при b=1.","statement":"","line":null,"page":137,"defence":[]},"new":null},"general01Gutmanindex":{"old":{"short":"Т 1.1.2","title":"Общий индекс Гутмана r-дольного графа","chapter":1,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{theorem}[\\cite{GeneralGutman}]~\\label{general01Gutmanindex} Пусть $\\mathrm{Gut}_{a,b}(G)$ — общий индекс Гутмана при $a \\leq 0$ и $b > 0$. Для любого $r$-дольного графа $G$ с $n$ вершинами, где $2 \\leq r \\leq n$, имеем \\[ \\mathrm{Gut}_{a,b}(G) \\geq \\mathrm{Gut}_{a,b}(K_{n_1, n_2, \\ldots, n_r}), \\] причём равенство выполняется тогда и только тогда, когда $G$ является полным $r$-дольным графом $K_{n_1, n_2, \\ldots, n_r}$, где $n_1 + n_2 + \\cdots + n_r = n$. \\end{theorem}","line":428,"page":16,"defence":[]},"new":{"title":"Общий индекс Гутмана r-дольного графа","short":"Т 1.1.1","num":"1.1.1","page":"5","chapter":1,"line":121,"label":"general01Gutmanindex","statement":"\\begin{theorem}\\label{general01Gutmanindex} Пусть связный граф $G$ порядка $n\\ge2$ разбит на $r\\ge2$ непустых независимых долей размеров $n_1,\\ldots,n_r$. При $a\\le0$, $b>0$ имеем $\\Gut_{a,b}(G)\\ge\\Gut_{a,b}(K_{n_1,\\ldots,n_r})$. Равенство достигается только для полного многодольного графа. \\end{theorem}","proof":"Добавление отсутствующего междольного ребра увеличивает степени концов и не увеличивает расстояний. Каждый множитель в сумме поэтому не возрастает. Для концов нового ребра расстояние строго уменьшается, так что при $b>0$ хотя бы одно слагаемое строго убывает. Добавляем по очереди все отсутствующие рёбра.","defence":[],"kind":"theorem","revision":""}},"hypothesizeSigmaCatern1":{"old":{"short":"З 3.1.1","title":"Проверенный кандидат максимума σ","chapter":3,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{remark}~\\label{hypothesizeSigmaCatern1} Фактически, максимизация $\\sigma$ означает максимизацию $Q$ по циклическим расположениям $\\{1\\}\\cup M$. Упорядочение $d_n>d_1>d_{n-2}>\\dots>d_3>d_2>d_{n-1}$, то есть $(s_{k-1},s_2,\\dots,s_{k-2},s_1,s_k)$, является максимизатором $\\sigma$ во всех проверенных случаях при $3\\le k\\le6$ \\end{remark}","line":2591,"page":76,"defence":[]},"new":{"title":"Точный максимум σ по подмножествам","short":"З 3.1.1","num":"3.1.1","page":"23","chapter":3,"line":743,"label":"hypothesizeSigmaCatern1","statement":"\\begin{remark}\\label{hypothesizeSigmaCatern1} Для произвольного числа степеней точный максимум квадратичной вариации вычисляется по подмножествам рангов. Пусть $H(S,j)$ --- максимум на пути из $0$, посещающем ровно ранги $S$ и заканчивающемся в $j\\in S$. Тогда \\[ H(\\{j\\},j)=z_j^2,\\qquad H(S,j)=\\max_{i\\in S\\setminus\\{j\\}}\\{H(S\\setminus\\{j\\},i)+(z_j-z_i)^2\\} \\] для $|S|\\ge2$. К $\\max_j[H(\\{1,\\ldots,k\\},j)+z_j^2]$ прибавляется $\\Gamma(M)$. \\end{remark}","proof":"Удаление последнего ребра даёт путь в одном из состояний правой части. Любой такой путь можно продолжить ребром в $j$. Замыкающее ребро в $0$ и лемма~\\ref{lemsigred} дают значение индекса. Имеется $O(k2^k)$ состояний и $O(k^22^k)$ операций сравнения и сложения.","defence":[],"kind":"remark","revision":"Вместо предположительного порядка дан алгоритм, доказанный для любого числа и любых кратностей степеней."}},"ind_ce":{"old":{"short":"Интерпретация §6.3","title":"Тождество Ind = CE не доказано","chapter":6,"severity":2,"note":"Оптимизация определённой функции Ind не доказывает результат о CE без установления их равенства.","statement":"","line":null,"page":152,"defence":[]},"new":{"title":"Точная формула критического показателя","short":"Т 6.3.3","num":"6.3.3","page":"58","chapter":6,"line":2251,"label":"ind_ce","statement":"\\begin{theorem}
