\\label{ind_ce} Пусть $a,b\\ge1$ и $M=\\max(a,b)$. Тогда критический показатель бесконечного слова равен \\begin{equation}\\label{eqq01indMP} \\CE(\\FD^{(a,b)})=2+M\\left(1+\\frac1{\\alpha}\\right). \\end{equation} \\end{theorem}","proof":"Из теоремы~\\ref{thm01slopecf} наклон равен $[0;c'_1,c'_2,\\dots]$, где $c'_1=a+1$, затем следуют $b,a,b,a,\\dots$. Обозначим знаменатели через $Q_{-1}=0,\\ Q_0=1,\\ Q_j=c'_jQ_{j-1}+Q_{j-2}$. По формуле Карпи--де Луки и Даманика--Ленца для штурмовых слов (см.~\\cite[теорема 2.1]{Cassaigne2008}) \\[ \\CE=\\sup_{j\\ge0}\\left(2+c'_{j+1}+\\frac{Q_{j-1}-2}{Q_j}\\right). \\] Для нечётных $j$ положим $\\rho_j=b/\\alpha$, для чётных $\\rho_j=a/\\alpha$. Все $\\rho_j$ лежат строго между нулём и единицей. Из $\\alpha^2=ab(\\alpha+1)$ следует $\\rho_j(c'_j+\\rho_{j-1})=1$ при $j\\ge2$. Положим $E_j=Q_{j-1}-\\rho_jQ_j$. Тогда $E_j=-\\rho_j E_{j-1}$ при $j\\ge2$. При $j=1$ имеем $E_1=1-(a+1)b/\\alpha$ и $|E_1|<1$, поскольку $ab/\\alpha<1$, $b/\\alpha<1$. Значит, $|E_j|<1$ для всех $j\\ge1$. Поэтому $(Q_{j-1}-2)/Q_j=\\rho_j+(E_j-2)/Q_j<\\rho_j$. Так как $Q_j\\to\\infty$, по каждой чётности эта дробь стремится к соответствующему $\\rho_j$. Два предельных значения выражения под супремумом равны $2+b+b/\\alpha$ и $2+a+a/\\alpha$. Член с $j=0$ равен $a+1$ и меньше большего из них. Следовательно, супремум совпадает с их максимумом.","defence":[],"kind":"theorem","revision":"Формула выведена из классической теоремы о штурмовом индексе. Проверены обе подпоследовательности знаменателей и первый член супремума."}},"irr_norm":{"old":{"short":"Определения §1.1","title":"Смешаны irr и нормировки irrₜ","chapter":1,"severity":2,"note":"Среднее абсолютное отклонение не равно irr; 1/2 перед неупорядоченной суммой irrₜ ошибочна. Поздние правильные доказательства не обязаны зависеть от этих строк.","statement":"","line":null,"page":11,"defence":[]},"new":{"title":"Две нормировки полной нерегулярности","short":"Нормировки","num":"","page":"4","chapter":1,"line":82,"label":"defallirr","statement":"Индекс Альбертсона~\\cite{Albertson1997MO}, рёберный сигма-индекс~\\cite{Dimitrov2018Abdo} и полная нерегулярность~\\cite{Brandt} задаются формулами \\begin{align} \\irr(G)&=\\sum_{uv\\in E}|d(u)-d(v)|,\\qquad \\sigma(G)=\\sum_{uv\\in E}(d(u)-d(v))^2,\\label{defedgeindices}\\\\ \\irr_t(G)&=\\sum_{\\{u,v\\}\\subset V}|d(u)-d(v)| =\\tfrac12\\sum_{u,v\\in V}|d(u)-d(v)|.\\label{defallirr} \\end{align} В первой сумме по вершинам каждая двухэлементная пара учитывается один раз. Среднее абсолютное отклонение степеней от $2m/n$ является другой характеристикой. На пути $P_3$ оно равно $4/9$, тогда как $\\irr(P_3)=2$.","proof":"","defence":[],"kind":"text","revision":""}},"irr_wrongbound":{"old":{"short":"Формула §1.1","title":"irr ≤ √(mM₁−4m²)","chapter":1,"severity":3,"note":"K₁,₃: правая часть 0, irr=6. Не использовать вместо корректной оценки через F−2M₂.","statement":"","line":null,"page":11,"defence":[]},"new":{"title":"Коши и верная оценка через F−2M₂","short":"Оценка irr","num":"","page":"4","chapter":1,"line":91,"label":"normbound","statement":"Первые два индекса Загреба и сумма кубов степеней суть $M_1=\\sum_v d(v)^2$, $M_2=\\sum_{uv\\in E}d(u)d(v)$ и $F=\\sum_v d(v)^3$. В частности, $\\sum_{uv\\in E}(d(u)+d(v))=M_1$. Раскрывая квадрат в~\\eqref{defedgeindices} и применяя неравенство Коши, получаем \\begin{equation}\\label{normbound} \\sigma=F-2M_2,\\qquad \\irr^2\\le m(F-2M_2). \\end{equation} Для полной суммы квадратов по парам вершин соответствующее тождество имеет вид $\\sigma_t=nM_1-4m^2$. При нормировке дисперсии делением на $n$ это $n^2\\operatorname{Var}(d)$.","proof":"","defence":[],"kind":"text","revision":"Зафиксированы рёберная сумма и обе нормировки полной нерегулярности. Оценка через квадратичную сумму получена из неравенства Коши."}},"lem0001compatibility":{"old":{"short":"Л 3.4.1","title":"Совместимость δ−t по модулю 4","chapter":3,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{lemma}~\\label{lem0001compatibility} Пусть $n\\geqslant 8$ и $(\\DA, \\DB)\\in\\mathbb{Z}^2$. Предположим, что $(\\DA, \\DB)=(a_1-a_4,\\,a_2-a_3)$ для некоторой графичной химической последовательности степеней $(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ порядка $n$. Тогда $n +\\DA-\\DB \\equiv 0 \\pmod 4$. \\end{lemma}","line":3385,"page":94,"defence":[]},"new":{"title":"Совместимость δ−t по модулю 4","short":"Л 3.4.1","num":"3.4.1","page":"33","chapter":3,"line":1175,"label":"lem0001compatibility","statement":"\\begin{lemma}~\\label{lem0001compatibility} Пусть $n\\geqslant 8$ и $(\\DA, \\DB)\\in\\mathbb{Z}^2$. Предположим, что $(\\DA, \\DB)=(a_1-a_4,\\,a_2-a_3)$ для некоторой графичной химической последовательности степеней $(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ порядка $n$. Тогда $n +\\DA-\\DB \\equiv 0 \\pmod 4$. \\end{lemma}","proof":"Положим $u=a_1+a_4$, $v=a_2+a_3$, где $u+v=n$, $u\\equiv\\DA\\pmod2$, $v\\equiv\\DB\\pmod2$, и $a_1=(u+\\DA)/2,\\ a_4=(u-\\DA)/2,\\ a_2=(v+\\DB)/2,\\ a_3=(v-\\DB)/2$. Тогда \\begin{equation}~\\label{eqq01lem0001compatibility} \\begin{aligned} a_1+a_3 &= \\frac{u+\\DA}{2}+\\frac{v-\\DB}{2}= \\frac{(u+v)+\\DA-\\DB}{2}\\\\ & = \\frac{n+\\DA-\\DB}{2}, \\end{aligned} \\end{equation} не зависящее от разбиения $u,v$, то есть $n+\\DA-\\DB\\equiv0\\pmod4$. Из~\\eqref{eqq01lem0001compatibility} обратное, при $n\\ge|\\DA|+|\\DB|$: выберем любое $u$ с $u\\equiv\\DA\\pmod2$ и $|\\DA|\\leqslant u\\le n-|\\DB|$. Тогда $v=n-u\\equiv\\DB\\pmod2$, и все четыре получающихся $a_i$ являются неотрицательными целыми числами, причём $a_1+a_3$ чётно по построению.","defence":[],"kind":"lemma","revision":""}},"lem001negdef":{"old":{"short":"Л 3.4.3","title":"Отрицательная определённость gλ","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lem001negdef} Для каждого $\\lambda\\in[0,2)$ и каждой $(\\delta,t)\\ne(0,0)$ имеем $g_\\lambda(\\delta,t)<0$ на $\\mathbb{R}^{2}$, и $g_\\lambda(0,0)=0$. \\end{lemma}","line":3423,"page":95,"defence":[]},"new":{"title":"Отрицательная определённость gλ","short":"Л 3.4.3","num":"3.4.3","page":"34","chapter":3,"line":1215,"label":"lem001negdef","statement":"\\begin{lemma}~\\label{lem001negdef} Для каждого $\\lambda\\in[0,2)$ и каждой $(\\delta,t)\\ne(0,0)$ имеем $g_\\lambda(\\delta,t)<0$ на $\\mathbb{R}^{2}$, и $g_\\lambda(0,0)=0$. \\end{lemma}","proof":"Пусть $v=(\\delta,t)^{\\top}$ и запишем $g_\\lambda(\\delta,t)=v^{\\top}Q(\\lambda)v$, где \\[ Q(\\lambda)=\\begin{pmatrix} -\\dfrac{3^{\\lambda}}{4} & \\dfrac{1-2^{\\lambda}}{4}\\\\[2pt] \\dfrac{1-2^{\\lambda}}{4} & -\\dfrac{1}{4} \\end{pmatrix}. \\] След $Q(\\lambda)$ равен \\[ \\operatorname{tr}Q(\\lambda)=-\\dfrac{3^{\\lambda}+1}{4}<0. \\] Остаётся показать, что $\\det Q(\\lambda)>0$. Симметричная матрица $2\\times2$ с отрицательным следом и положительным определителем отрицательно определена. Непосредственное вычисление даёт \\begin{equation}\\label{eqq01lem001negdef} \\det Q(\\lambda)=\\dfrac{3^{\\lambda}}{16}-\\dfrac{(1-2^{\\lambda})^{2}}{16}=\\dfrac{h(\\lambda)}{16}, \\end{equation} где \\[ h(\\lambda):=3^{\\lambda}+2^{\\lambda+1}-4^{\\lambda}-1. \\] Утверждаем, что $h(\\lambda)>0$ для всех $\\lambda\\in[0,2)$. Сначала заметим, что $h(0)=1>0$ и $h(2)=0$. Рассмотрим производную \\[ h'(\\lambda)=3^{\\lambda}\\ln3+2^{\\lambda+1}\\ln2-4^{\\lambda}\\ln4. \\] Определим \\[ s(\\lambda):=\\dfrac{h'(\\lambda)}{4^{\\lambda}} =\\Bigl(\\dfrac{3}{4}\\Bigr)^{\\lambda}\\ln3 +2\\Bigl(\\dfrac{1}{2}\\Bigr)^{\\lambda}\\ln2 -\\ln4. \\] Функция $s$ строго убывает на $[0,2]$, так как и $\\bigl(\\frac{3}{4}\\bigr)^{\\lambda}$, и $\\bigl(\\frac{1}{2}\\bigr)^{\\lambda}$ строго убывают, а их коэффициенты положительны. Более того, $s(0)=\\ln3>0$ и \\[ s(2)=\\dfrac{9}{16}\\ln3-\\dfrac{3}{2}\\ln2<0. \\] Следовательно, существует единственное $\\lambda_0\\in(0,2)$, такое что $s(\\lambda_0)=0$, то есть $h'(\\lambda_0)=0$. Таким образом, $h'(\\lambda)>0$ на $[0,\\lambda_0)$ и $h'(\\lambda)<0$ на $(\\lambda_0,2]$. Поэтому $h$ строго возрастает на $[0,\\lambda_0]$ и строго убывает на $[\\lambda_0,2]$. Поскольку $h(0)=1>0$ и $h(2)=0$, заключаем, что $h(\\lambda)>0$ для всех $\\lambda\\in[0,2)$. Из~\\eqref{eqq01lem001negdef} следует, что \\(\\det Q(\\lambda)>0\\). Следовательно, \\(Q(\\lambda)\\) отрицательно определена, что завершает доказательство.","defence":[],"kind":"lemma","revision":""}},"lem001starlikeloseform":{"old":{"short":"Л 3.2.1","title":"σ паука через число коротких ветвей","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lem001starlikeloseform} Пусть $S=S(n_1,\\dots,n_k)$ --- звездообразное дерево с $k\\ge 3$ ветвями, то есть дерево, полученное присоединением центральной вершины $r$ к одному концу каждого из $k$ попарно непересекающихся путей $\\mathcal P_{n_1},\\dots,\\mathcal P_{n_k}$. Пусть $a=a(S)=|\\{\\,i : n_i=1\\,\\}|$. Тогда \\begin{equation}~\\label{eqqq01lem001starlikeloseform} \\sigma(S)=k\\bigl[(k-2)^2+1\\bigr]+2(k-2)\\,a. \\end{equation} \\end{lemma}","line":2715,"page":79,"defence":[]},"new":{"title":"σ паука через число коротких ветвей","short":"Л 3.2.1","num":"3.2.1","page":"24","chapter":3,"line":772,"label":"lem001starlikeloseform","statement":"\\begin{lemma}~\\label{lem001starlikeloseform} Пусть $S=S(n_1,\\dots,n_k)$ --- звездообразное дерево с $k\\ge 3$ ветвями, то есть дерево, полученное присоединением центральной вершины $r$ к одному концу каждого из $k$ попарно непересекающихся путей $\\mathcal P_{n_1},\\dots,\\mathcal P_{n_k}$. Пусть $a=a(S)=|\\{\\,i : n_i=1\\,\\}|$. Тогда \\begin{equation}~\\label{eqqq01lem001starlikeloseform} \\sigma(S)=k\\bigl[(k-2)^2+1\\bigr]+2(k-2)\\,a. \\end{equation} \\end{lemma}","proof":"Пусть $r$ --- центр, $d(r)=k$. Ребро ветви $i$ относится к одному из трёх типов. Если $n_i=1$, ветвь есть ребро $rv$ с $d(v)=1$, вносящее $(k-1)^2$. Если $n_i\\ge2$, ребро при $r$ соединяет вершины степеней $k$ и $2$, вно= $(k-2)^2$. Таким образом, внутренние рёбра соединяют две вершины степени $2$ и вносят $0$; а последнее ребро соединяет вершину степени $2$ с висячей вершиной, внося $1$. Согласно лемме~\\ref{lem001starlikerr}, находим, что $\\irr(S)=k(k-1)$. Следовательно, \\begin{align*} \\sigma(S)&=a(k-1)^2+(k-a)\\bigl[(k-2)^2+1\\bigr]\\\\ &=k\\bigl[(k-2)^2+1\\bigr]+a\\bigl[(k-1)^2-(k-2)^2-1\\bigr], \\end{align*} и $(k-1)^2-(k-2)^2-1=2k-4$, что даёт~\\eqref{eqqq01lem001starlikeloseform}. Поскольку $k\\ge3$, $\\sigma(S)$ строго возрастает по $a$. Если $n_i\\ge2$ для $k-a$ невисячих ветвей, то $n-1\\ge a+2(k-a)$, то есть $a\\ge\\max\\{0,2k+1-n\\}$, и это значение достигается. Таким образом, минимум $\\sigma(S)$ по звездообразным деревьям порядка $n$ с $k$ ветвями достигается в точности тогда, когда $a=\\max\\{0,2k+1-n\\}$; в частности, $\\min\\sigma=k[(k-2)^2+1]$, если $n\\ge2k+1$.","defence":[],"kind":"lemma","revision":""}},"lem001starlikerr":{"old":{"short":"Л 2.4.2","title":"irr паука: k(k−1)","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}\\label{lem001starlikerr} Пусть $k\\ge2$ и пусть $S=S(n_1,\\dots,n_k)$ --- дерево, полученное из вершины $r$ присоединением $r$ к одному концу $u_i$ пути $\\mathcal P^{(i)}$ на $n_i\\ge1$ вершинах, для $i=1,\\dots,k$. Тогда $\\irr(S)=k(k-1)$. \\end{lemma}","line":2242,"page":64,"defence":[]},"new":{"title":"irr паука: k(k−1)","short":"Л 2.4.2","num":"2.4.2","page":"19","chapter":2,"line":601,"label":"lem001starlikerr","statement":"\\begin{lemma}\\label{lem001starlikerr} Пусть $S(l_1,\\ldots,l_d)$ состоит из $d\\ge2$ путей длины $l_i\\ge1$ с общим началом. Тогда $\\irr(S)=d(d-1)$. \\end{lemma}","proof":"Степени вдоль каждой ветви меняются от $d$ до единицы монотонно, возможно через несколько вершин степени два. Вариация на ветви равна $d-1$.","defence":[],"kind":"lemma","revision":""}},"lem001sumsquares":{"old":{"short":"Л 3.4.2","title":"Значение при λ=0","chapter":3,"severity":1,"note":"Формула использует соглашение 0⁰=0 (предел λ↓0 для одинаковых степеней), которое следует явно задать.","statement":"\\begin{lemma}~\\label{lem001sumsquares} Для любой химической последовательности степеней $\\mathscr S=(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ порядка $n$ при $\\lambda=0$ \\begin{equation}~\\label{eqq01lem001sumsquares} \\sig{0}(\\mathscr S) = \\frac{1}{2}\\,\\big(n^2 - \\big(a_1^2+a_2^2+a_3^2+a_4^2\\big)\\big). \\end{equation} \\end{lemma}","line":3409,"page":95,"defence":[]},"new":{"title":"Значение при λ=0","short":"Л 3.4.2","num":"3.4.2","page":"33","chapter":3,"line":1198,"label":"lem001sumsquares","statement":"\\begin{lemma}~\\label{lem001sumsquares} Для любой химической последовательности степеней $\\mathscr S=(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ порядка $n$ при $\\lambda=0$ \\begin{equation}~\\label{eqq01lem001sumsquares} \\sig{0}(\\mathscr S) = \\frac{1}{2}\\,\\big(n^2 - \\big(a_1^2+a_2^2+a_3^2+a_4^2\\big)\\big). \\end{equation} \\end{lemma}","proof":"При $\\lambda=0$ каждая пара разных степеней вносит единицу, а равных --- нуль. Число таких пар равно $\\sum_{i<j}a_i a_j=\\tfrac12[(\\sum_i a_i)^2-\\sum_i a_i^2]$.","defence":[],"kind":"lemma","revision":""}},"lem001tail":{"old":{"short":"Л 3.4.7","title":"Отсечение всех дальних ветвей","chapter":3,"severity":3,"note":"n=17, λ=1.5: дальняя ветвь (δ,t)=(3,0) даёт 363.73067, а лучшая точка заявленной опорной ветви (0,1) — 363.18117.","statement":"\\begin{lemma}~\\label{lem001tail} Для каждого $r$ каждая допустимая $(\\delta,t)$ с $\\delta^2+t^2\\geqslant5$ удовлетворяет \\[ g_\\lambda(\\delta,t)+M(\\delta,t) \\;<\\; g_\\lambda(\\delta_r,t_r)+M(\\delta_r,t_r) \\] для каждого $\\lambda\\in[0,2)$ равномерно по $n$. \\end{lemma}","line":3866,"page":105,"defence":[]},"new":{"title":"Отсечение всех дальних ветвей","short":"Л 3.4.7","num":"3.4.7","page":"40","chapter":3,"line":1566,"label":"lem001tail","statement":"\\begin{lemma}~\\label{lem001tail} Пусть $n\\ge8$ и $\\lambda\\in[0,1]$. У каждой последовательности, глобально максимизирующей $\\sig\\lambda$ среди графичных последовательностей порядка $n$, выполнено $\\delta^2+t^2<20$. То же верно при требовании существования связной реализации. \\end{lemma}","proof":"Положим $x=2^\\lambda$, $q=3^\\lambda$, $D=2x-q+1$. На данном отрезке $x\\le q\\le2x-1$, поэтому $0\\le s^*=n(1+x-q)/D\\le n/2$ и $0<|A_\\lambda|=D/4<3/4$. Для $r=n\\bmod4$ выберем базовую пару: $(0,0)$ при $r=0$, $(0,1)$ при $r=1$, $(1,-1)$ при $r=2$, $(0,-1)$ при $r=3$. У неё $g_\\lambda\\ge-1/2$ (для $r=2$ используем $q\\le2x-1$). В соответствующем $I_n$ есть точка на расстоянии не более $1$ от $s^*$: это чётная решётка в $[0,n]$ при $r=0$ и нечётная решётка в $[1,n-|\\delta|]$ в остальных случаях. Все эти базовые варианты имеют связную реализацию, так как $t\\le n+4-3\\delta$. Следовательно, существует допустимый кандидат со значением строго больше $f_{n,\\lambda}(s^*)-5/4$. С другой стороны, по следствию~\\ref{cor01bounded} при $\\delta^2+t^2\\ge20$ \\[ f_{n,\\lambda}(s)+g_\\lambda(\\delta,t) \\le f_{n,\\lambda}(s^*)-\\frac{\\delta^2+t^2}{16} \\le f_{n,\\lambda}(s^*)-\\frac54. \\] Такая пара не может быть оптимальной.","defence":[],"kind":"lemma","revision":""}},"lem003exact":{"old":{"short":"Л 3.4.6","title":"Поправка на чётность округления","chapter":3,"severity":0,"note":"Поправка на чётность обоснована для внутренней вершины, когда ближайшие целые обеих чётностей допустимы. Это не общий граничный результат.","statement":"\\begin{lemma}~\\label{lem003exact} Пусть $(\\delta_1,t_1)$, $(\\delta_2,t_2)$ --- две допустимые пары, лежащие в одном классе вычетов $\\delta-t\\equiv-r\\pmod4$, такие что $t_1$ нечётно, а $t_2$ чётно, и пусть $s^\\ast_{n,\\lambda}$, где $\\lambda\\in[0,2)$, лежит во внутренности допустимых $s$-диапазонов обеих последовательностей. Пусть $M(\\delta,t):=\\max\\{f_{n,\\lambda}(s): s\\equiv t\\!\\!\\pmod2,\\ s\\ \\text{допустимо для }(\\delta,t)\\}$. Если $M_{\\alpha}(\\delta,t)= \\big[g_\\lambda(\\delta_1,t_1)+M(\\delta_1,t_1)\\big] -\\big[g_\\lambda(\\delta_2,t_2)+M(\\delta_2,t_2)\\big]$, то \\begin{equation}\\label{eqq001lem003exact} M_{\\alpha}(\\delta,t)\\;=\\; \\big[g_\\lambda(\\delta_1,t_1)-g_\\lambda(\\delta_2,t_2)\\big] \\;+\\;|A_\\lambda|\\,\\tau(s^\\ast_{n,\\lambda}). \\end{equation} \\end{lemma}","line":3805,"page":104,"defence":[]},"new":{"title":"Поправка на чётность округления","short":"Л 3.4.6","num":"3.4.6","page":"38","chapter":3,"line":1478,"label":"lem003exact","statement":"\\begin{lemma}~\\label{lem003exact} Пусть $n\\ge8$, $0\\le\\lambda<2$ и $\\delta-t\\equiv-n\\pmod4$. Положим \\[ I_n(\\delta,t)=\\{s\\in\\mathbb Z:|t|\\le s\\le n-|\\delta|,\\quad s\\equiv t\\pmod2\\}. \\] Для связной реализации дополнительно требуется $t\\le n+4-3\\delta$. Если множество $I_n(\\delta,t)$ непусто и пара не исключена условием связности, то максимум на соответствующей ветви равен \\begin{equation}\\label{repair:branch} V_{n,\\lambda}(\\delta,t)=g_\\lambda(\\delta,t)+f_{n,\\lambda}(s^*) -|A_\\lambda|\\operatorname{dist}(s^*,I_n(\\delta,t))^2, \\qquad s^*=-\\frac{B_{n,\\lambda}}{2A_\\lambda}. \\end{equation} Все оптимальные $s$ --- ближайшие к $s^*$ точки $I_n(\\delta,t)$. Для двух ветвей разность максимумов равна \\begin{equation}\\label{eqq001lem003exact} V_1-V_2=g_\\lambda(\\delta_1,t_1)-g_\\lambda(\\delta_2,t_2) +|A_\\lambda|(d_2^2-d_1^2), \\end{equation} где $d_i=\\operatorname{dist}(s^*,I_n(\\delta_i,t_i))$. Если $t_1$ нечётно, $t_2$ чётно и ближайшие точки обеих неограниченных решёток чётности лежат в соответствующих $I_n$, то $d_2^2-d_1^2=\\tau(s^*)$. \\end{lemma}","proof":"Подстановка $f(s)=f(s^*)-|A_\\lambda|(s-s^*)^2$ даёт обе формулы. Для неограниченных решёток расстояния до ближайших чётного и нечётного чисел в сумме равны $1$; разность их квадратов равна заданной выше функции $\\tau$. Вне указанного условия нужно использовать расстояния до конечных множеств $I_n$, включая их концы.","defence":[],"kind":"lemma","revision":""}},"lem006cyc":{"old":{"short":"Л 2.2.2","title":"Вариация цикла: включён ли ноль","chapter":2,"severity":2,"note":"Вариация определена на цикле с нулём, а границы выписаны для списка без нуля. M={2,3,4}: вариация 8, заявленная верхняя граница 4. Отдельная задача без нуля имеет корректную формулу.","statement":"\\begin{lemma}~\\label{lem006cyc} Пусть $h=\\lfloor k/2\\rfloor$, где $k\\geqslant 3$, и пусть $s_1\\le\\dots\\le s_k$ — упорядоченные значения. Тогда \\begin{equation}~\\label{eqqq01claim02} 2(s_k-s_1)\\ \\le\\ I(\\TT)\\ \\le\\ 2\\Bigl(\\sum_{j=k-h+1}^{k}s_j-\\sum_{j=1}^{h}s_j\\Bigr), \\end{equation} и обе оценки достигаются. \\end{lemma}","line":1444,"page":45,"defence":[]},"new":{"title":"Вариация цикла: включён ли ноль","short":"Л 2.2.2","num":"2.2.2","page":"13","chapter":2,"line":393,"label":"lem006cyc","statement":"\\begin{lemma}\\label{lem006cyc} Для $m\\ge3$, $s_1\\le\\cdots\\le s_m$ и $h=\\lfloor m/2\\rfloor$ по всем циклическим расстановкам этих значений имеем точные границы \\begin{equation}\\label{eqqq01claim02} 2(s_m-s_1)\\le I\\le2\\left(\\sum_{i=m-h+1}^m s_i-\\sum_{i=1}^h s_i\\right). \\end{equation} \\end{lemma}","proof":"Каждая из двух дуг от минимума до максимума имеет вариацию не меньше их разности. Отсортированный цикл достигает нижней границы. Для верхней оценки различим равные значения по меткам и направим каждое ребро от меньшего ранга к большему. В сумме модулей коэффициенты вершин равны $-2,0,2$. Положительных и отрицательных коэффициентов поровну, по $p\\le h$. Сумма не превосходит удвоенной разности сумм $p$ наибольших и $p$ наименьших значений. Эта разность не убывает при увеличении $p$ до $h$. Чередование $h$ наименьших и $h$ наибольших значений достигает границы. При нечётном $m$ вставляем медиану на ребро между половинами. Его вариация сохраняется. При $m=3$ это обычный треугольник.","defence":[],"kind":"lemma","revision":""}},"lem01alphamonotone":{"old":{"short":"Л 6.3.1","title":"Монотонность α(P)","chapter":6,"severity":0,"note":"Алгебраическое утверждение о явно определённой функции Ind согласовано. Равенство Ind=CE в работе не доказано; этот цвет не подтверждает интерпретацию как критического показателя.","statement":"\\begin{lemma}~\\label{lem01alphamonotone} Функция $\\AlphA (P)$ строго возрастает при $P>0$. \\end{lemma}","line":5699,"page":152,"defence":[]},"new":{"title":"Монотонность α(P)","short":"Л 6.3.1","num":"6.3.1","page":"58","chapter":6,"line":2268,"label":"lem01alphamonotone","statement":"\\begin{lemma}~\\label{lem01alphamonotone} Функция $\\alpha (P)$ строго возрастает при $P>0$. \\end{lemma}","proof":"Дифференцирование даёт $\\alpha '(P) = \\frac12\\left(1+\\frac{P+2}{\\sqrt{P^2+4P}}\\right) >0$ для всех $P>0$.","defence":[],"kind":"lemma","revision":""}},"lem01length":{"old":{"short":"Л 6.2.1","title":"Длина образа при σd","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lem01length} Для каждого конечного слова $x\\in\\AlphA^{*}$ и каждого $d\\geqslant 1$ имеет место $|\\sigma_d(x)| = d\\,|x|_0 + |x|.$ \\end{lemma}","line":5246,"page":142,"defence":[]},"new":{"title":"Длина образа при σd","short":"Л 6.2.1","num":"6.2.1","page":"54","chapter":6,"line":2038,"label":"lem01length","statement":"\\begin{lemma}~\\label{lem01length} Для каждого конечного слова $x\\in\\AlphA^{*}$ и каждого $d\\geqslant 1$ имеет место $|\\sigma_d(x)| = d\\,|x|_0 + |x|.$ \\end{lemma}","proof":"Пусть $x$ --- конечное слово из $\\AlphA^{*}$ и пусть $d\\geqslant 1$. Так как $\\sigma_d(0)=0^d1$ имеет длину $d+1$, а $\\sigma_d(1)=0$ имеет длину $1$. Тогда, поскольку $\\sigma_d$ --- морфизм, $|\\sigma_d(x)| = (d+1)|x|_0 + 1\\cdot|x|_1 = d|x|_0 + (|x|_0+|x|_1) = d|x|_0+|x|$.","defence":[],"kind":"lemma","revision":""}},"lem01lockstructure":{"old":{"short":"Л 6.3.2","title":"Ind при фиксированном max(a,b)","chapter":6,"severity":0,"note":"Алгебраическое утверждение о явно определённой функции Ind согласовано. Равенство Ind=CE в работе не доказано; этот цвет не подтверждает интерпретацию как критического показателя.","statement":"\\begin{lemma}~\\label{lem01lockstructure} Пусть $M\\geqslant 1$, и пусть $(a,b)$ пробегает все пары с $\\max(a,b)=M$. Тогда $\\operatorname{Ind}(\\FD^{(a,b)})$ является строго убывающей функцией от $m=\\min(a,b)$. \\end{lemma}","line":5707,"page":152,"defence":[]},"new":{"title":"Ind при фиксированном max(a,b)","short":"Л 6.3.2","num":"6.3.2","page":"59","chapter":6,"line":2276,"label":"lem01lockstructure","statement":"\\begin{lemma}~\\label{lem01lockstructure} Пусть $M$ --- положительное целое и $(a,b)$ пробегает все пары с $\\max(a,b)=M$. Тогда $\\operatorname{Ind}(\\FD^{(a,b)})$ является строго убывающей функцией от $m=\\min(a,b)$. \\end{lemma}","proof":"По теореме~\\ref{ind_ce} при фиксированном $M$ имеем $\\operatorname{Ind}(\\FD^{(a,b)})=2+M(1+1/\\alpha (Mm))$, и это выражение зависит от $m$ только через $\\alpha (Mm)$. Так как $\\alpha $ строго возрастает (Лемма~\\ref{lem01alphamonotone}), $\\operatorname{Ind}$ строго убывает по $m$.","defence":[],"kind":"lemma","revision":""}},"lem01primitivity":{"old":{"short":"Л 6.2.2","title":"Образ примитивного слова примитивен","chapter":6,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{lemma}~\\label{lem01primitivity} Если $u\\in\\AlphA^{*}$ примитивно, то $\\sigma_d(u)$ примитивно для каждого $d\\geqslant 1$. \\end{lemma}","line":5254,"page":142,"defence":[]},"new":{"title":"Образ примитивного слова примитивен","short":"Л 6.2.2","num":"6.2.2","page":"54","chapter":6,"line":2046,"label":"lem01primitivity","statement":"\\begin{lemma}~\\label{lem01primitivity} Если непустое слово $u\\in\\{0,1\\}^*$ примитивно, то $\\sigma_d(u)$ примитивно при каждом целом $d\\ge1$. \\end{lemma}","proof":"Если в $u$ нет нуля, то $u=1$ и $\\sigma_d(u)=0$. В остальных случаях рассмотрим $v=\\sigma_d(u)$ как циклическое слово. Каждая единица является концом блока $0^d1$; ровно $d$ непосредственно предшествующих ей нулей принадлежат этому блоку. Остальные нули образуют односимвольные блоки $0$. Получаем единственное циклическое разбиение на блоки $0^d1$ и $0$, совпадающее с разбиением на образы букв $u$. Если $v=z^m$, $m\\ge2$, то сдвиг на $|z|$ сохраняет все единицы и это разбиение, в частности переводит границу начала $v$ в границу блока. Каждый из $m$ одинаковых участков $z$ поэтому декодируется в одно и то же слово $w$. Тогда $u=w^m$, вопреки примитивности.","defence":[],"kind":"lemma","revision":""}},"lem02exponenttransform":{"old":{"short":"Л 6.2.3","title":"Точное преобразование показателя","chapter":6,"severity":3,"note":"a=b=1, u=010, j=1, uₚ=ε: образ 01001 имеет наименьший период 3 и показатель 5/3; формула даёт 1.","statement":"\\begin{lemma}~\\label{lem02exponenttransform} Пусть $u\\in\\AlphA^{*}$ примитивно, пусть $u_p$ --- (возможно пустой) собственный префикс слова $u$, пусть $j\\geqslant 1$, и пусть $w=u^ju_p$. Если $w$ является фактором слова $\\FD^{(b,a)}$, то $\\sigma_a(w)$ является фактором слова $\\FD^{(a,b)}$ с показателем \\begin{equation}~\\label{eq01exponenttransform} e\\bigl(\\sigma_a(w)\\bigr) = j + \\frac{a|u_p|_0+|u_p|}{a|u|_0+|u|}. \\end{equation} В частности, $e(\\sigma_a(w)) = j+|u_p|/|u| = e(w)$ тогда и только тогда, когда $|u_p|_0/|u_p| = |u|_0/|u|$ при $u_p\\ne\\varepsilon$. \\end{lemma}","line":5320,"page":144,"defence":[]},"new":{"title":"Точное преобразование показателя","short":"Л 6.2.3","num":"6.2.3","page":"54","chapter":6,"line":2082,"label":"lem02exponenttransform","statement":"\\begin{lemma}~\\label{lem02exponenttransform} Пусть $u\\in\\{0,1\\}^*$ непусто и примитивно, $u_p$ --- собственный префикс $u$, возможно пустой, $j\\ge1$, $w=u^ju_p$. Если $w$ --- фактор $\\FD^{(b,a)}$, то $\\sigma_a(w)$ --- фактор $\\FD^{(a,b)}$, причём \\begin{equation}\\label{eq01exponenttransform} e(\\sigma_a(w))\\ \\ge\\ j+\\frac{a|u_p|_0+|u_p|}{a|u|_0+|u|}. \\end{equation} Равенство выполняется тогда и только тогда, когда $|\\sigma_a(u)|$ является наименьшим периодом $\\sigma_a(w)$. В частности, равенство гарантировано при $j\\ge2$. При $j\\ge2$ и $u_p\\ne\\varepsilon$ равенство $e(\\sigma_a(w))=e(w)$ эквивалентно $|u_p|_0/|u_p|=|u|_0/|u|$. \\end{lemma}","proof":"Положим $v=\\sigma_a(u)$, $v_p=\\sigma_a(u_p)$, $q=|v|$. Слово $\\sigma_a(w)=v^jv_p$ имеет период $q$, поэтому его наименьший период не больше $q$. Это даёт неравенство с помощью леммы~\\ref{lem01length}. Равенство эквивалентно минимальности $q$. При $j\\ge2$ слово начинается с $v^2$. Если бы $v^2$ имело период $p<q$, то для $0\\le i<q$ выполнялось бы $v_i=v_{(i+p)\\bmod q}$: сравниваем позиции $i$ и $i+p$ внутри $v^2$. Тогда $v$ было бы степенью слова длины $\\gcd(p,q)<q$, что противоречит лемме~\\ref{lem01primitivity}. Следовательно, $q$ --- наименьший период. Тот же аргумент для $u^2$ даёт $e(w)=j+|u_p|/|u|$ при $j\\ge2$. Сравнение двух дробей доказывает последнее утверждение. Факторность образа следует из $\\FD^{(a,b)}=\\sigma_a(\\FD^{(b,a)})$, то есть из теоремы~\\ref{thm01desub}.","defence":[],"kind":"lemma","revision":""}},"lem02parity":{"old":{"short":"Л 3.4.4","title":"Графичность: критерий чётности","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lem02parity} Пусть $n\\ge 8$. Химическая последовательность степеней $\\mathscr S=(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ порядка $n$ графична тогда и только тогда, когда $a_1+a_3$ чётно; эквивалентно, $\\delta - t \\equiv -r \\pmod 4$, где $n=4k+r$. \\end{lemma}","line":3473,"page":96,"defence":[]},"new":{"title":"Графичность: критерий чётности","short":"Л 3.4.4","num":"3.4.4","page":"35","chapter":3,"line":1265,"label":"lem02parity","statement":"\\begin{lemma}\\label{lem02parity} При $n\\ge8$ последовательность $\\mathscr S=(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ с неотрицательными кратностями и суммой кратностей $n$ графична в классе простых графов тогда и только тогда, когда $a_1+a_3$ чётно. \\end{lemma}","proof":"Необходимость следует из чётности суммы степеней. Для достаточности применим критерий Эрдёша--Галлаи к невозрастающему списку $d_1,\\ldots,d_n$. Требуется \\begin{equation}\\label{eqqEG} \\sum_{i=1}^j d_i\\le j(j-1)+\\sum_{i>j}\\min(j,d_i)\\qquad(1\\le j\\le n). \\end{equation} При $j\\ge5$ уже $j(j-1)\\ge4j$. При $j=4$ правая часть не меньше $12+n-4\\ge16$. При $j=1,2$ она не меньше $n-1,n$ соответственно. При $j=3$ получаем не менее $6+n-3=n+3$, чего достаточно при $n\\ge9$, а при $n=8$ --- если сумма трёх старших степеней не превосходит $11$. В оставшемся случае они равны $4,4,4$. Пять остальных не могут все равняться единице из-за чётности. Значит, их вклад справа не меньше шести, и~\\eqref{eqqEG} выполнено также в этом случае.","defence":[],"kind":"lemma","revision":""}},"lem03diagonalincreasing":{"old":{"short":"Л 6.3.3","title":"Возрастание Ind на диагонали","chapter":6,"severity":0,"note":"Алгебраическое утверждение о явно определённой функции Ind согласовано. Равенство Ind=CE в работе не доказано; этот цвет не подтверждает интерпретацию как критического показателя.","statement":"\\begin{lemma}~\\label{lem03diagonalincreasing} Функция $g(M):=\\operatorname{Ind}(\\FD^{(M,M)})$ строго возрастает при $M>0$. Явно, \\begin{equation}~\\label{eqq1lem03diagonalincreasing} g(M) = 2+M+\\dfrac{2}{M+\\sqrt{M^2+4}}. \\end{equation} \\end{lemma}","line":5715,"page":152,"defence":[]},"new":{"title":"Возрастание Ind на диагонали","short":"Л 6.3.3","num":"6.3.3","page":"59","chapter":6,"line":2284,"label":"lem03diagonalincreasing","statement":"\\begin{lemma}\\label{lem03diagonalincreasing} На положительной вещественной полуоси функция $g(M)=2+M+2/(M+\\sqrt{M^2+4})$ строго возрастает. При положительном целом $M$ она совпадает с $\\CE(\\FD^{(M,M)})$. \\end{lemma}","proof":"Формула на целых следует из теоремы~\\ref{ind_ce}. Умножая дробь на сопряжённое выражение, получаем $g(M)=2+(M+\\sqrt{M^2+4})/2$. Её производная равна $(1+M/\\sqrt{M^2+4})/2>0$.","defence":[],"kind":"lemma","revision":""}},"lemAdecomp":{"old":{"short":"Л 3.2.3","title":"Разбиение irr и σ на типы рёбер","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lemAdecomp} Пусть $\\TT$ --- гусеничное дерево с хребтом $v_1, v_2, \\dots, v_n$ из вершин степени не менее $2$ и последовательностью степеней хребта $\\mathscr{D} = (d_1, \\dots, d_n)$, где $d_i = d_{\\TT}(v_i)$ обозначает степень $v_i$ в $\\TT$. Для $i=1,\\dots,n$ пусть $\\ell_i$ обозначает число висячих вершин, присоединённых к $v_i$, так что $\\ell_1 = d_1 - 1$, $\\ell_n = d_n - 1$ и $\\ell_i = d_i - 2$ для всех $1<i<n$. Тогда \\begin{equation}\\label{eqAirr} \\irr(\\TT) = \\sum_{i=1}^{n-1} |d_i - d_{i+1}| + \\sum_{i=1}^{n} \\ell_i (d_i - 1), \\end{equation} \\begin{equation}\\label{eqAsigma} \\sigma(\\TT) = \\sum_{i=1}^{n-1} (d_i - d_{i+1})^2 + \\sum_{i=1}^{n} \\ell_i (d_i - 1)^2. \\end{equation} \\end{lemma}","line":2956,"page":82,"defence":[]},"new":{"title":"Разбиение irr и σ на типы рёбер","short":"Л 3.2.3","num":"3.2.3","page":"26","chapter":3,"line":846,"label":"lemAdecomp","statement":"\\begin{lemma}~\\label{lemAdecomp} Пусть $\\TT$ --- гусеничное дерево с хребтом $v_1, v_2, \\dots, v_n$ из вершин степени не менее $2$ и последовательностью степеней хребта $\\mathscr{D} = (d_1, \\dots, d_n)$, где $d_i = d_{\\TT}(v_i)$ обозначает степень $v_i$ в $\\TT$. Для $i=1,\\dots,n$ пусть $\\ell_i$ обозначает число висячих вершин, присоединённых к $v_i$, так что $\\ell_1 = d_1 - 1$, $\\ell_n = d_n - 1$ и $\\ell_i = d_i - 2$ для всех $1<i<n$. Тогда \\begin{equation}\\label{eqAirr} \\irr(\\TT) = \\sum_{i=1}^{n-1} |d_i - d_{i+1}| + \\sum_{i=1}^{n} \\ell_i (d_i - 1), \\end{equation} \\begin{equation}\\label{eqAsigma} \\sigma(\\TT) = \\sum_{i=1}^{n-1} (d_i - d_{i+1})^2 + \\sum_{i=1}^{n} \\ell_i (d_i - 1)^2. \\end{equation} \\end{lemma}","proof":"Пусть $\\ES(\\TT) = \\{\\, v_iv_{i+1} : 1 \\le i \\le n-1 \\,\\}$ и $\\EP(\\TT) = E(\\TT) \\setminus \\ES(\\TT)$, где $EP^{(i)}(\\TT) := \\{\\, uv_i : u \\text{ --- висячая вершина, присоединённая к } v_i \\,\\}$. Тогда получаем дизъюнктное объединение $E(\\TT) = \\ES(\\TT) \\,\\sqcup\\, \\EP(\\TT)$, где $\\ES(\\TT) \\cap\\EP(\\TT) = \\varnothing$, причём $|\\ES(\\TT)| = n-1$. Более того, $\\EP(\\TT)$ само разлагается в дизъюнктное объединение по вершинам хребта, \\begin{equation}\\label{eqPendPartition} \\EP(\\TT) = \\bigsqcup_{i=1}^{n} \\EP^{(i)}(\\TT), \\end{equation} где по определению $\\ell_i := |\\EP^{(i)}(\\TT)|$ есть число висячих вершин при $v_i$. Пусть $i \\in \\{1,\\dots,n\\}$, тогда соседями $v_i$ в $\\TT$ являются в точности её соседи по хребту и её $\\ell_i$ висячих вершин. Если $1<i<n$, то $v_i$ имеет двух соседей по хребту, $v_{i-1}$ и $v_{i+1}$; если $i\\in\\{1,n\\}$, то $v_i$ имеет ровно одного соседа по хребту ($v_2$ или $v_{n-1}$ соответственно). Обозначая через $c_i$ число соседей $v_i$ по хребту, и определяя его как \\begin{equation}\\label{eqCidef} c_i = \\begin{cases} 1, & i \\in \\{1,n\\}, \\\\ 2, & 1<i<n, \\end{cases} \\end{equation} степень $v_i$ аддитивно разлагается: $d_i = d_{\\TT}(v_i) = c_i + \\ell_i$. Таким образом, \\eqref{eqCidef} даёт \\begin{equation}\\label{eqEllFormula} \\ell_i = d_i - c_i = \\begin{cases} d_i - 1, & i \\in \\{1,n\\}, \\\\ d_i - 2, & 1<i<n, \\end{cases} \\end{equation} Пусть $N = n + \\sum_{i=1}^n \\ell_i$ --- общее число вершин $\\TT$. Тогда \\begin{equation}\\label{eqEdgeCount1} |E(\\TT)| = (n-1) + \\sum_{i=1}^{n} \\ell_i. \\end{equation} Так как $\\sum_{i=1}^n c_i= 2(n-1)$, получаем \\begin{equation}\\label{eqDegSumSpine} \\sum_{i=1}^n d_i = \\sum_{i=1}^n c_i + \\sum_{i=1}^n \\ell_i = 2(n-1) + \\sum_{i=1}^n \\ell_i. \\end{equation} Таким образом, по определению $\\irr(\\TT)$ и $\\sigma(\\TT)$ запишем \\[ \\IS=\\sum_{v_iv_{i+1} \\in \\ES(\\TT)} |d_i - d_{i+1}|, \\quad \\IP=\\sum_{uv_i \\in \\EP(\\CC)} |d_i - d_{\\TT}(u)| \\] и \\[ \\SG=\\sum_{v_iv_{i+1} \\in \\ES(\\TT)} (d_i - d_{i+1})^2, \\quad \\SP=\\sum_{uv_i \\in \\EP(\\TT)} (d_i - d_{\\TT}(u))^2 \\] Следовательно, $\\irr(\\TT) =\\IS+\\IP$ и $\\sigma(\\TT)=\\SG+\\SP$. Для сумм по висячим рёбрам рассмотрим внутреннюю сумму по $\\EP^{(i)}(\\TT)$ из \\eqref{eqPendPartition}. Каждая висячая вершина $u$, присоединённая к $v_i$, имеет степень $d_{\\TT}(u) = 1$, где висячая вершина имеет ровно одно инцидентное ребро, к $v_i$. Таким образом, каждое из $\\ell_i$ рёбер в $\\EP^{(i)}(\\TT)$ вносит одно и то же значение $|d_i - 1| = d_i - 1$ в $\\IP$ в силу $d_i \\geqslant 1$ и $(d_i-1)^2$ в $\\SP$. Тогда \\begin{equation}\\label{eqPendInner} \\sum_{uv_i \\in \\EP^{(i)}(\\TT)} |d_i - 1| = \\ell_i(d_i - 1), \\qquad \\sum_{uv_i \\in \\EP^{(i)}(\\TT)} (d_i - 1)^2 = \\ell_i(d_i-1)^2. \\end{equation} Суммируя \\eqref{eqPendInner} по $i=1,\\dots,n$ и в силу \\eqref{eqPendPartition}, получаем \\begin{equation}\\label{eqIpend} \\IP = \\sum_{i=1}^{n} \\ell_i(d_i-1), \\qquad \\SP = \\sum_{i=1}^n \\ell_i(d_i-1)^2, \\end{equation} что и требовалось.","defence":[],"kind":"lemma","revision":""}},"lemcutform":{"old":{"short":"Л 4.2.3","title":"Gut через префиксные суммы","chapter":4,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lemcutform} Пусть $\\ell\\ge2$, пусть $m_1,\\dots,m_\\ell\\ge0$ --- целые числа, и пусть $\\TT_\\ell(m_1,\\dots,m_\\ell)$. Пусть $s_1=s_\\ell=1$, $s_i=2$ при $1<i<\\ell$, $M=\\sum_{i=1}m_i$ и $S_t=\\sum_{i\\le t}m_i$. Тогда \\begin{equation}~\\label{eqqq01lemcutform} \\Gut(\\TT)=2M^2+4\\sum_{t=1}^{\\ell-1}S_t\\,(M-S_t)+\\sum_{i=1}^{\\ell}c_i\\,m_i+C_\\ell, \\end{equation} где $c_i=(s_i-1)+\\sum_{j\\ne i}s_j\\,(2|i-j|+1)$ и $C_\\ell=\\sum_{i<j}s_is_j\\,(j-i)$ зависят только от $\\ell$. \\end{lemma}","line":4516,"page":123,"defence":[]},"new":{"title":"Gut через префиксные суммы","short":"Л 4.2.3","num":"4.2.3","page":"46","chapter":4,"line":1829,"label":"lemcutform","statement":"\\begin{lemma}~\\label{lemcutform} Пусть $\\ell\\ge2$, пусть $m_1,\\dots,m_\\ell\\ge0$ --- целые числа, и пусть $\\TT=\\TT_\\ell(m_1,\\dots,m_\\ell)$ получено присоединением $m_i$ листьев к вершине $i$ пути. Пусть $s_1=s_\\ell=1$, $s_i=2$ при $1<i<\\ell$, $M=\\sum_{i=1}m_i$ и $S_t=\\sum_{i\\le t}m_i$. Тогда \\begin{equation}~\\label{eqqq01lemcutform} \\Gut(\\TT)=2M^2+4\\sum_{t=1}^{\\ell-1}S_t\\,(M-S_t)+\\sum_{i=1}^{\\ell}c_i\\,m_i+C_\\ell, \\end{equation} где $c_i=(s_i-1)+\\sum_{j\\ne i}s_j\\,(2|i-j|+1)$ и $C_\\ell=\\sum_{i<j}s_is_j\\,(j-i)$ зависят только от $\\ell$. \\end{lemma}","proof":"В предложении~\\ref{propgutformula} подставим $d_i=m_i+s_i$. Квадратичные члены равны $2M^2+4\\sum_{i<j}(j-i)m_i m_j$. Разность $j-i$ считает разрезы с $i\\le t<j$, откуда $\\sum_{i<j}(j-i)m_im_j=\\sum_{t=1}^{\\ell-1} S_t(M-S_t)$. Слагаемые, линейные по $m_i$, равны $(s_i-1)m_i+\\sum_{j\\ne i}(2|j-i|+1)s_j m_i$, а постоянные дают $C_\\ell$.","defence":[],"kind":"lemma","revision":""}},"lemleaves":{"old":{"short":"Л 2.1.2","title":"Число листьев через степени","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lemleaves} Пусть $\\TT$ — дерево, степени невисячих вершин которого равны $d_1,\\dots,d_n\\ge 2$, где $n\\geqslant 1$. Тогда $\\TT$ имеет \\begin{equation}~\\label{eq2lemmaworkn1} \\ell(\\mathscr{D})=\\sum_{i=1}^n d_i - 2n + 2, \\end{equation} висячих вершин, и $|V(\\TT)|=n+\\ell$. \\end{lemma}","line":1069,"page":37,"defence":[]},"new":{"title":"Число листьев через степени","short":"Л 2.1.2","num":"2.1.2","page":"12","chapter":2,"line":309,"label":"lemleaves","statement":"\\begin{lemma}~\\label{lemleaves} Пусть $\\TT$ — дерево, степени невисячих вершин которого равны $d_1,\\dots,d_n\\ge 2$, где $n\\geqslant 1$. Тогда $\\TT$ имеет \\begin{equation}~\\label{eq2lemmaworkn1} \\ell(\\mathscr{D})=\\sum_{i=1}^n d_i - 2n + 2, \\end{equation} висячих вершин, и $|V(\\TT)|=n+\\ell$. \\end{lemma}","proof":"Пусть $\\ell$ --- число листьев и $k$ --- число остальных вершин. Из $\\ell+\\sum_{i=1}^k d_i=2(k+\\ell-1)$ получаем утверждение.","defence":[],"kind":"lemma","revision":""}},"lemm01Total":{"old":{"short":"Л 2.1.1","title":"Формула полной нерегулярности","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}[Ali, A. и др.~\\cite{Albalahi2025DimitrovAli}]~\\label{lemm01Total} Пусть $d_1\\ge d_2\\ge\\dots\\ge d_n$ — степени графа $G$ и $m=|E(G)|$. Тогда \\begin{equation}~\\label{eqqq01lemm01Total} \\operatorname{irr}_t(G)=2(n+1)m-2\\sum_{i=1}^{n}i\\,d_i . \\end{equation} \\end{lemma}","line":1020,"page":36,"defence":[]},"new":{"title":"Формула полной нерегулярности","short":"Л 2.1.1","num":"2.1.1","page":"11","chapter":2,"line":299,"label":"lemm01Total","statement":"\\begin{lemma}[Ali, A. и др.~\\cite{Albalahi2025DimitrovAli}]~\\label{lemm01Total} Пусть $d_1\\ge d_2\\ge\\dots\\ge d_n$ — степени графа $G$ и $m=|E(G)|$. Тогда \\begin{equation}~\\label{eqqq01lemm01Total} \\operatorname{irr}_t(G)=2(n+1)m-2\\sum_{i=1}^{n}i\\,d_i . \\end{equation} \\end{lemma}","proof":"При сортировке по невозрастанию сумма~\\eqref{defallirr} равна $\\sum_i(n+1-2i)d_i$. Подставляем $\\sum_i d_i=2m$.","defence":[],"kind":"lemma","revision":""}},"lemmaboundAlbertsonn2":{"old":{"short":"Л 2.4.1","title":"Верхняя граница irr через n и Δ","chapter":2,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{lemma}~\\label{lemmaboundAlbertsonn2} Пусть $\\TT$ --- дерево порядка $n\\ge4$ с максимальной степенью $\\Delta$, и $0\\le\\alpha\\le1$. Тогда \\begin{equation}~\\label{eqqq01lemmaboundAlbertsonn2} \\irr(\\TT)\\le\\Bigl\\lfloor\\frac{3n^2-10n}{2}\\Bigr\\rfloor2^{\\alpha}+\\Delta^2-n. \\end{equation} \\end{lemma}","line":2185,"page":62,"defence":[]},"new":{"title":"Двусторонняя оценка irr через Δ","short":"Л 2.4.1","num":"2.4.1","page":"18","chapter":2,"line":594,"label":"lemmaboundAlbertsonn2","statement":"\\begin{lemma}\\label{lemmaboundAlbertsonn2} Для дерева порядка $n\\ge3$ с максимальной степенью $\\Delta$ имеем $\\Delta(\\Delta-1)\\le\\irr(T)\\le(n-1)(\\Delta-1)$. \\end{lemma}","proof":"В доказательстве предложения~\\ref{propMaximumn1trees} использованы $\\Delta$ путей из вершины максимальной степени в разные листья. На каждом из $n-1$ рёбер разность степеней не превосходит $\\Delta-1$.","defence":[],"kind":"lemma","revision":""}},"lemmastep2Albertsonn2":{"old":{"short":"Л 2.4.3","title":"«irr ≥ irr(P) только для пути»","chapter":2,"severity":1,"note":"Перепутаны «≥» и «=». Неравенство верно для любого дерева, а равенство характеризует путь. Хребет (3,2): irr=6>2.","statement":"\\begin{lemma}~\\label{lemmastep2Albertsonn2} Пусть $\\TT\\in \\mathcal{T}_{n,\\Delta}$ таково, что $\\TT\\ncong \\mathcal{S}_n$. Тогда $\\irr(\\TT)\\geq \\irr(\\mathcal{P}_n)$ тогда и только тогда, когда $\\TT\\cong \\mathcal{P}_n$. \\end{lemma}","line":2299,"page":66,"defence":[]},"new":{"title":"Путь как единственный минимизатор irr","short":"Л 2.4.3","num":"2.4.3","page":"19","chapter":2,"line":620,"label":"lemmastep2Albertsonn2","statement":"\\begin{lemma}\\label{lemmastep2Albertsonn2} Для любого дерева $T$ порядка $n\\ge3$ имеем $\\irr(T)\\ge\\irr(P_n)=2$, причём равенство характеризует путь. \\end{lemma}","proof":"Применим предложение~\\ref{propMaximumn1trees}.","defence":[],"kind":"lemma","revision":""}},"lemmastep2Sigman1":{"old":{"short":"Л 3.3.1","title":"Границы σ через листья и Δ","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lemmastep2Sigman1} Пусть $T\\in\\mathcal T_{n,\\Delta}$, $n\\ge3$, и пусть $\\ell$ --- число его висячих вершин. Тогда \\[ \\ell\\ \\le\\ \\sigma(T)\\ \\le\\ (n-1)(\\Delta-1)^2. \\] Нижняя оценка достигается тогда и только тогда, когда $T\\cong\\mathcal P_n$, а верхняя --- тогда и только тогда, когда $T\\cong K_{1,n-1}$. \\end{lemma}","line":3088,"page":86,"defence":[]},"new":{"title":"Границы σ через листья и Δ","short":"Л 3.3.1","num":"3.3.1","page":"29","chapter":3,"line":953,"label":"lemmastep2Sigman1","statement":"\\begin{lemma}~\\label{lemmastep2Sigman1} Пусть $T\\in\\mathcal T_{n,\\Delta}$, $n\\ge3$, и пусть $\\ell$ --- число его висячих вершин. Тогда \\[ \\ell\\ \\le\\ \\sigma(T)\\ \\le\\ (n-1)(\\Delta-1)^2. \\] Нижняя оценка достигается тогда и только тогда, когда $T\\cong\\mathcal P_n$, а верхняя --- тогда и только тогда, когда $T\\cong K_{1,n-1}$. \\end{lemma}","proof":"Каждое из $\\ell$ висячих рёбер вносит не меньше единицы. При равенстве все опорные вершины имеют степень два, а соседние невисячие вершины имеют равные степени. Они образуют связное поддерево, значит, все имеют степень два. Это путь, который достигает нижней границы. На каждом ребре квадрат не превосходит $(\\Delta-1)^2$. При верхнем равенстве у каждого ребра есть висячий конец, поэтому дерево является звездой; на звезде равенство выполняется.","defence":[],"kind":"lemma","revision":""}},"lemn1gut":{"old":{"short":"Л 4.0.1","title":"Лемма о степенях со ссылкой [49]","chapter":4,"severity":2,"note":"Лемма приписана работе [49] о рекомендациях образовательных траекторий; по доступным издательским данным соответствие не подтверждено. Ложность самой леммы не установлена.","statement":"\\begin{lemma}[\\cite{Guillaume2013}]~\\label{lemn1gut} Для диаметра $d$ и минимальной степени $\\delta$ связного графа $G$ порядка $n$. Пусть $v, v'$ --- произвольные вершины $G$. Если $d_G(v) \\leq n-d(\\delta+1)/3+2\\delta$ и $d(v,v')\\geq 3$. Тогда \\begin{equation}~\\label{eq1lemn1gut} d_G(v) +d_G(v') \\leq n - \\frac{1}{3}d(\\delta + 1) + 4\\delta. \\end{equation} \\end{lemma}","line":4217,"page":115,"defence":[]},"new":{"title":"Разрез дерева и тождество Гутмана — Винера","short":"Л 4.0.1","num":"4.0.1","page":"43","chapter":4,"line":1708,"label":"lemn1gut","statement":"\\begin{lemma}\\label{lemn1gut} Ребро дерева порядка $n$ выделяет компоненты размеров $s,n-s$. Суммы степеней исходного дерева в этих компонентах равны $2s-1,2(n-s)-1$. В частности, \\[ W(T)=\\sum_{e}s_e(n-s_e),\\qquad \\Gut(T)=4W(T)-(n-1)(2n-1). \\] \\end{lemma}","proof":"В первой компоненте ровно $s-1$ внутренних рёбер и один конец удалённого ребра. Аналогично считаются степени во второй компоненте. Путь неупорядоченной пары проходит через ребро $e$ ровно тогда, когда вершины пары лежат по разные стороны. В~\\eqref{eq1gut} вклад ребра равен $(2s_e-1)(2(n-s_e)-1)=4s_e(n-s_e)-(2n-1)$. После сложения по $n-1$ рёбрам получаем оба тождества.","defence":[],"kind":"lemma","revision":""}},"lemrea001rr":{"old":{"short":"Л 4.2.2","title":"Перестановочное неравенство","chapter":4,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{lemma}~\\label{lemrea001rr} Пусть $w_1,\\dots,w_k$ --- фиксированные вещественные числа и пусть $d_1\\le\\dots\\le d_k$. Для перестановки $\\pi$ множества $\\{1,\\dots,k\\}$ положим \\begin{equation} S(\\pi)=\\sum_{i=1}^{k}d_{\\pi(i)}\\,w_i . \\end{equation} Если $\\pi$ максимизирует $S$, то $d_{\\pi(i)}$ и $w_i$ одинаково упорядочены, то есть из $w_i<w_j$ следует $d_{\\pi(i)}\\le d_{\\pi(j)}$. \\end{lemma}","line":4441,"page":121,"defence":[]},"new":{"title":"Перестановочное неравенство","short":"Л 4.2.2","num":"4.2.2","page":"46","chapter":4,"line":1822,"label":"lemrea001rr","statement":"\\begin{lemma}\\label{lemrea001rr} Если $v_1\\le\\cdots\\le v_k$ и $w_1\\le\\cdots\\le w_k$, то максимум $\\sum_i w_i v_{\\pi(i)}$ достигается при совпадающем порядке, минимум --- при обратном. \\end{lemma}","proof":"Обмен инверсии при максимизации даёт приращение $(w_j-w_i)(v_{\\pi(i)}-v_{\\pi(j)})\\ge0$ для $i<j$. Для минимума применим тот же аргумент к $-w_i$. Для индекса Гутмана веса расстояний меняются при обмене, поэтому его изменение вычисляется отдельно по лемме~\\ref{lems001wap}.","defence":[],"kind":"lemma","revision":""}},"lemred0005":{"old":{"short":"Л 2.2.1","title":"irr: постоянная часть и вариация","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lemred0005} Пусть $\\TT$ — гусеничное дерево с последовательностью степеней хребта $(d_1,\\dots,d_k)$, $k\\ge 2$. Тогда \\begin{equation}~\\label{eqqq01lemred0005} \\irr(\\TT)=\\sum_{i=1}^{k}(d_i-1)(d_i-2)+d_1+d_k-2+\\sum_{i=1}^{k-1}|d_i-d_{i+1}|. \\end{equation} \\end{lemma}","line":1426,"page":44,"defence":[]},"new":{"title":"irr: постоянная часть и вариация","short":"Л 2.2.1","num":"2.2.1","page":"13","chapter":2,"line":381,"label":"lemred0005","statement":"\\begin{lemma}\\label{lemred0005} Положим $D(M)=\\sum_{d\\in M}(d-1)(d-2)$, считая элементы с кратностями. Для расстановки $x=(x_1,\\dots,x_k)$ выполнено \\begin{equation}\\label{eqqq01lemred0005} \\irr(T)=D(M)-2+x_1+x_k+\\sum_{i=1}^{k-1}|x_i-x_{i+1}|. \\end{equation} \\end{lemma}","proof":"В предложении~\\ref{Caterpillar} добавим для каждого из двух концов вклад $(x_i-1)(x_i-2)$ к постоянной сумме. Остаётся по $x_i-1$ на каждом конце.","defence":[],"kind":"lemma","revision":""}},"lems001wap":{"old":{"short":"Л 4.2.1","title":"Изменение Gut при перестановке","chapter":4,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lems001wap} Пусть $\\TT$ --- гусеничное дерево со степенями хребта $(d_1,\\dots,d_k)$, $n=\\sum(d_i-1)+2$. Для $1\\le a<b\\le k$ пусть $\\TT'$ получено из $\\TT$ перестановкой $d_a$ и $d_b$, и положим $\\delta=d_b-d_a$. Тогда \\begin{equation}~\\label{eqqq01lems001wap} \\Gut(\\TT')-\\Gut(\\TT)=4\\delta\\sum_{i=a}^{b-1}\\bigl(n-2A_i-\\delta\\bigr). \\end{equation} \\end{lemma}","line":4395,"page":119,"defence":[5]},"new":{"title":"Изменение Gut при перестановке","short":"Л 4.2.1","num":"4.2.1","page":"45","chapter":4,"line":1796,"label":"lems001wap","statement":"\\begin{lemma}~\\label{lems001wap} Пусть $\\TT$ --- гусеничное дерево со степенями хребта $(d_1,\\dots,d_k)$, $n=\\sum(d_i-1)+2$. Для $1\\le a<b\\le k$ пусть $\\TT'$ получено из $\\TT$ перестановкой $d_a$ и $d_b$, и положим $\\delta=d_b-d_a$. Тогда \\begin{equation}~\\label{eqqq01lems001wap} \\Gut(\\TT')-\\Gut(\\TT)=4\\delta\\sum_{i=a}^{b-1}\\bigl(n-2A_i-\\delta\\bigr). \\end{equation} \\end{lemma}","proof":"По лемме~\\ref{lemn1gut} и формуле для $a(S)$ из предыдущего раздела имеем $W=\\ell(n-1)+\\sum_{i=1}^{k-1} A_i(n-A_i)$. При обмене $d_a,d_b$ только величины $A_i$ при $a\\le i<b$ получают приращение $\\delta$. Разность $(A_i+\\delta)(n-A_i-\\delta)-A_i(n-A_i)$ равна $\\delta(n-2A_i-\\delta)$. Суммируем её и переходим от $W$ к $\\Gut$.","defence":[5],"kind":"lemma","revision":"Добавлены знак обмена и границы суммирования. Отсутствие улучшающего обмена необходимо для глобального максимума. Контрпример к обратному утверждению дан отдельно."}},"lemsigred":{"old":{"short":"Л 3.1.3","title":"σ как циклическая квадратичная сумма","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lemsigred} Пусть $\\TT$ --- гусеничное дерево с хребтом $v_1v_2\\cdots v_k$, $k\\ge2$, и пусть $M=\\{d_1,\\dots,d_k\\}$. Пусть $\\Gamma(M)=\\sum_{i=1}^{k}(d_i-1)^2(d_i-2)$, которая зависит только от мультимножества $M$. Тогда $\\sigma(\\TT)=\\Gamma(M)+Q(M)$. \\end{lemma}","line":2540,"page":74,"defence":[]},"new":{"title":"σ как циклическая квадратичная сумма","short":"Л 3.1.2","num":"3.1.2","page":"22","chapter":3,"line":708,"label":"lemsigred","statement":"\\begin{lemma}\\label{lemsigred} Положим $z_0=0$, а по хребту $z_i=x_i-1$, $1\\le i\\le k$. Дополним список ребром, возвращающим последний элемент к нулю. Тогда $\\sigma(T)=\\Gamma(M)+Q(C)$, где $\\Gamma(M)=\\sum_{d\\in M}(d-2)(d-1)^2$ и $Q(C)=\\sum_{uv\\in E(C)}(z_u-z_v)^2$. \\end{lemma}","proof":"В предложении~\\ref{propsigmaspine} выделим постоянную часть висячих рёбер. Две оставшиеся концевые поправки равны квадратам разностей с нулём.","defence":[],"kind":"lemma","revision":""}},"lemstarliken200":{"old":{"short":"Л 3.2.2","title":"Перенос вершины между ветвями","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{lemma}~\\label{lemstarliken200} Пусть $S=S(n_1,\\dots,n_k)$ --- звездообразное дерево с $k\\ge 3$ ветвями, и пусть $n_i=1$ и $n_j\\ge 3$ для некоторых $i\\ne j$. Пусть $S^{*}=S(n_1,\\dots,n_i+1,\\dots,n_j-1,\\dots,n_k)$ --- звездообразное дерево, полученное из $S$ перенесением концевой вершины $j$-й ветви к концевой вершине $i$-й ветви. Тогда $\\sigma(S)-\\sigma(S^{*})=2(k-2)>0$. \\end{lemma}","line":2743,"page":80,"defence":[]},"new":{"title":"Перенос вершины между ветвями","short":"Л 3.2.2","num":"3.2.2","page":"25","chapter":3,"line":797,"label":"lemstarliken200","statement":"\\begin{lemma}~\\label{lemstarliken200} Пусть $S=S(n_1,\\dots,n_k)$ --- звездообразное дерево с $k\\ge 3$ ветвями, и пусть $n_i=1$ и $n_j\\ge 3$ для некоторых $i\\ne j$. Пусть $S^{*}=S(n_1,\\dots,n_i+1,\\dots,n_j-1,\\dots,n_k)$ --- звездообразное дерево, полученное из $S$ перенесением концевой вершины $j$-й ветви к концевой вершине $i$-й ветви. Тогда $\\sigma(S)-\\sigma(S^{*})=2(k-2)>0$. \\end{lemma}","proof":"Поскольку $n_i=1$, имеем $n_i+1=2$, а если $n_j\\ge 3$, то $n_j-1\\ge 2$. Следовательно, при переходе от $S$ к $S^{*}$ $i$-я ветвь перестаёт иметь длину~$1$, а длина $j$-й ветви остаётся не меньше двух. Все остальные ветви не затрагиваются. Следовательно, $a(S^{*})=a(S)-1$. Таким образом, согласно лемме~\\ref{lem001starlikeloseform}, так как $k\\geqslant 3$, \\[ \\sigma(S)-\\sigma(S^{*})=2(k-2)\\bigl[a(S)-a(S^{*})\\bigr]=2(k-2)>0. \\]","defence":[],"kind":"lemma","revision":""}},"lesegma3":{"old":{"short":"Л 3.1.1","title":"σ: хребет длины 3","chapter":3,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{lemma}~\\label{lesegma3} Пусть $\\TT$ --- гусеничное дерево с хребтом $v_1v_2v_3$ и степенями хребта $(d_1,d_2,d_3)$, где $d_i\\geqslant 2, i=1,2,3$. Тогда \\begin{equation}\\label{eqlesegma3n1} \\sigma(\\TT)=\\sum_{i=1}^{3}(d_i-1)^3+\\sum_{i=1}^{2}(d_i-d_{i+1})^2-(d_2-1)^2. \\end{equation} \\end{lemma}","line":2437,"page":71,"defence":[]},"new":{"title":"σ: хребет длины 3","short":"Л 3.1.1","num":"3.1.1","page":"22","chapter":3,"line":698,"label":"lesegma3","statement":"\\begin{lemma}~\\label{lesegma3} Пусть $\\TT$ --- гусеничное дерево с хребтом $v_1v_2v_3$ и степенями хребта $(d_1,d_2,d_3)$, где $d_i\\geqslant 2, i=1,2,3$. Тогда \\begin{equation}\\label{eqlesegma3n1} \\sigma(\\TT)=\\sum_{i=1}^{3}(d_i-1)^3+\\sum_{i=1}^{2}(d_i-d_{i+1})^2-(d_2-1)^2. \\end{equation} \\end{lemma}","proof":"Подстановка $k=3$ в предложение~\\ref{propsigmaspine} даёт формулу, так как $(d_2-2)(d_2-1)^2=(d_2-1)^3-(d_2-1)^2$.","defence":[],"kind":"lemma","revision":""}},"lesigma2":{"old":{"short":"Л 3.1.2","title":"σ: экстремумы при k=4","chapter":3,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{lemma}\\label{lesigma2} Пусть $\\TT$ --- гусеничное дерево с хребтом $v_1v_2v_3v_4$, степени хребта которого в неубывающем порядке равны $d_1\\le d_2\\le d_3\\le d_4$, все степени не менее $2$. Тогда по всем упорядочениям степеней хребта \\begin{align*} \\sigma_{\\max}(\\TT)&=\\sum_{i=1}^{4}(d_i-1)^3\\!-\\!\\sum_{i=1}^{2}\\!(d_i\\!-\\!1)^2\\!+\\!(d_4\\!-\\!d_1)^2\\!+\\!(d_1\\!-\\!d_2)^2\\!+\\!(d_2\\!-\\!d_3)^2,\\,(d_4,d_1,d_2,d_3),\\\\ \\sigma_{\\min}(\\TT)&=\\sum_{i=1}^{4}(d_i-1)^3\\!-\\!\\sum_{i=3}^{4}\\!(d_i\\!-\\!1)^2\\!+\\!(d_1\\!-\\!d_3)^2\\!+\\!(d_3\\!-\\!d_4)^2\\!+\\!(d_4\\!-\\!d_2)^2,\\,(d_1,d_3,d_4,d_2). \\end{align*} \\end{lemma}","line":2470,"page":72,"defence":[]},"new":{"title":"Точные экстремумы σ на четырёх степенях","short":"Л 3.1.3","num":"3.1.3","page":"23","chapter":3,"line":732,"label":"lesigma2","statement":"\\begin{lemma}\\label{lesigma2} Пусть $2\\le d_1\\le d_2\\le d_3\\le d_4$, $z_0=0$, $z_i=d_i-1$. Минимум равен $\\Gamma(M)+Q(0,1,3,4,2)$, максимум равен $\\Gamma(M)+Q(0,4,1,2,3)$. Последний ранг в каждом списке соединяется с нулём. \\end{lemma}","proof":"Минимум установлен в теореме~\\ref{thmsigmin}. Для максимума используем её разложение $Q=\\sum_{i,j}g_ig_jN(i,j)$ по четырём промежуткам. В цикле $(0,4,1,2,3)$ матрица пересечений равна \\[ \\left(\\begin{smallmatrix}2&2&2&1\\\\2&4&3&2\\\\2&3&4&2\\\\1&2&2&2\\end{smallmatrix}\\right). \\] Каждое значение есть верхняя граница соответствующего коэффициента. Действительно, $N(i,j)$ при $i\\le j$ считает рёбра из рангов $\\le i$ в ранги $>j$. Их не больше удвоенной мощности меньшей группы и не больше произведения мощностей групп. Для $i=1,j=2$ оба множества имеют по две вершины; все четыре возможных ребра образовали бы четырёхцикл без связи с пятым рангом, поэтому остаётся не более трёх. Эти ограничения дают ровно выписанную матрицу. Поскольку $g_i\\ge0$, цикл максимизирует $Q$, и лемма~\\ref{lemsigred} завершает доказательство.","defence":[],"kind":"lemma","revision":""}},"lowerboundSigmastep2":{"old":{"short":"П 3.3.2","title":"Логарифмическая нижняя граница σ","chapter":3,"severity":3,"note":"Для P₄ имеем σ=2, Δ=2, а логарифмическая нижняя граница равна 7.","statement":"\\begin{proposition}\\label{lowerboundSigmastep2} Пусть $\\TT$ --- гусеничное дерево с максимальной степенью $\\Delta$ и минимальной степенью $\\delta$. Тогда нижняя оценка $\\sigma_{\\min}(\\TT)$ такова: \\begin{equation}\\label{eq1lowerboundSigmastep2} \\sigma_{\\min}(\\TT)\\geq \\ceil{\\log_2(n^2+1)-1}+2\\Delta(\\TT)-1. \\end{equation} \\end{proposition}","line":3027,"page":84,"defence":[]},"new":{"title":"Нижняя оценка σ через Δ","short":"П 3.3.2","num":"3.3.2","page":"28","chapter":3,"line":929,"label":"lowerboundSigmastep2","statement":"\\begin{proposition}\\label{lowerboundSigmastep2} На гусенице порядка $n\\ge3$ с максимальной степенью $\\Delta$ выполнено $\\sigma(T)\\ge\\Delta(\\Delta-1)$. Для $\\Delta=2$ оценка точна при каждом $n\\ge3$. \\end{proposition}","proof":"Применим лемму~\\ref{lemmaboundAlbertsonn2} и теорему~\\ref{thmSigman4}. Если $\\Delta=2$, дерево есть путь, и утверждение следует из предложения~\\ref{proposition_3.3.1}.","defence":[],"kind":"proposition","revision":""}},"maxtreejas":{"old":{"short":"Т 1.1.1","title":"Экстремумы полной нерегулярности деревьев","chapter":1,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}[\\cite{Albalahi2025DimitrovAli}]~\\label{maxtreejas} Для любого дерева $\\TT$ порядка $n \\geq 4$ имеем $ \\irr_{t_{\\max}}(G) = (n-1)(n-2)$, и $\\mathrm{irr}_{t_{\\min}}(\\TT) = 2(n-2)$. \\end{theorem}","line":389,"page":14,"defence":[]},"new":{"title":"Экстремумы полной нерегулярности деревьев","short":"Т 1.2.1","num":"1.2.1","page":"6","chapter":1,"line":163,"label":"maxtreejas","statement":"\\begin{theorem}\\label{maxtreejas} На классе деревьев порядка $n\\ge3$ минимум $\\irr_t$ равен $2(n-2)$, а максимум равен $(n-1)(n-2)$. \\end{theorem}","proof":"Положим $e_v=d(v)-1$, так что $e_v\\ge0$ и $\\sum_v e_v=n-2$. Так как $|e_u-e_v|\\le e_u+e_v$, получаем верхнюю границу, достигаемую на звезде. Если $e_i\\ge e_j+2$, замена $(e_i,e_j)$ на $(e_i-1,e_j+1)$ уменьшает их взаимную разность на два и не увеличивает сумму расстояний от этой пары до каждого другого числа. После конечного числа шагов останутся $n-2$ единиц и два нуля. Такая последовательность реализуется путём и даёт минимум $2(n-2)$.","defence":[],"kind":"theorem","revision":""}},"numbercaterpillartree":{"old":{"short":"П 1.2.1","title":"Число гусеничных деревьев","chapter":1,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{proposition}[\\cite{catjasn1}]~\\label{numbercaterpillartree} Пусть $\\TT$ — гусеничное дерево порядка $n\\geqslant 3$. Тогда число $\\CC_n$ равно \\[ N(\\TT_n)=2^{n-4}+2^{\\floor*{\\frac{n}{2}-2}}. \\] \\end{proposition}","line":832,"page":24,"defence":[]},"new":{"title":"Число гусеничных деревьев","short":"П 1.2.1","num":"1.2.1","page":"6","chapter":1,"line":156,"label":"numbercaterpillartree","statement":"\\begin{proposition}\\label{numbercaterpillartree} Число неизоморфных гусениц порядка $n\\ge3$ равно $2^{n-4}+2^{\\lfloor n/2\\rfloor-2}$. \\end{proposition}","proof":"Запишем положительные числа $w_i=x_i-1$. Имеем $\\sum_i w_i=n-2$. Композиции числа $N=n-2$ однозначно задают гусеницы с выбранным направлением хребта, включая композицию длины один для звезды. Обычная гусеница соответствует орбите обращения. Композиции задаются подмножествами $N-1$ промежутков между единицами. Из $2^{N-1}$ подмножеств инвариантны при отражении ровно $2^{\\lceil(N-1)/2\\rceil}$. Полусумма этих двух чисел даёт формулу.","defence":[],"kind":"proposition","revision":""}},"proSigmaCaterpillarn1":{"old":{"short":"П 3.1.1","title":"σ: одинаковое число листьев","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}\\label{proSigmaCaterpillarn1} Пусть $n\\ge2$ и $m\\ge1$, и пусть $\\TT$ --- гусеничное дерево с хребтом $x_1x_2\\cdots x_n$, в котором каждая $x_i$ смежна ровно с $m$ висячими вершинами $y_{i,1},\\dots,y_{i,m}$. Тогда \\begin{equation}~\\label{eqqq01proSigmaCaterpillarn1} \\sigma(\\TT)=\\begin{cases} 2m^3, & n=2,\\\\[2pt] 2m^3+(n-2)\\,m\\,(m+1)^2+2, & n\\ge3. \\end{cases} \\end{equation} \\end{proposition}","line":2414,"page":70,"defence":[]},"new":{"title":"σ: одинаковое число листьев","short":"П 3.1.2","num":"3.1.2","page":"22","chapter":3,"line":685,"label":"proSigmaCaterpillarn1","statement":"\\begin{proposition}\\label{proSigmaCaterpillarn1} Пусть $n\\ge2$ и $m\\ge1$, и пусть $\\TT$ --- гусеничное дерево с хребтом $x_1x_2\\cdots x_n$, в котором каждая $x_i$ смежна ровно с $m$ висячими вершинами $y_{i,1},\\dots,y_{i,m}$. Тогда \\begin{equation}~\\label{eqqq01proSigmaCaterpillarn1} \\sigma(\\TT)=\\begin{cases} 2m^3, & n=2,\\\\[2pt] 2m^3+(n-2)\\,m\\,(m+1)^2+2, & n\\ge3. \\end{cases} \\end{equation} \\end{proposition}","proof":"Подставим $p_i=m$ в теорему~\\ref{ThmDecSigma}. При $n=2$ обе степени равны $m+1$. При $n\\ge3$ крайние степени равны $m+1$, внутренние $m+2$, и путь вносит два единичных квадрата.","defence":[],"kind":"proposition","revision":""}},"problemn2":{"old":{"short":"Т 4.2.1","title":"M₁ и M₂ после висячих расширений","chapter":4,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{theorem}\\label{problemn2} Пусть $n\\ge3$, $p\\ge1$, и пусть $d_1,\\dots,d_s\\ge1$ --- целые числа. Пусть $\\TT$ --- дерево, полученное из $\\TT_n(p,p,\\dots,p)$ посредством $s$ последовательных равномерных висячих расширений, $j$-е из которых присоединяет $d_j$ новых висячих вершин к каждому текущему листу при $d_1=k$, $d_{j+1}=\\ell_j$, $s=m+1$. Если $\\mathcal P_0=1$, $\\mathcal P_j=d_1d_2\\cdots d_j$. Пусть $\\lambda_{m}=\\!n(p+2)^2\\!-\\!(p+2)(p+4)\\!+\\!p\\,(d_1+1)(np\\!+\\!2n\\!-\\!2)$. Тогда \\begin{align} M_1(\\TT)\\!&=\\!2(p+1)^2\\!+(n-2)(p+2)^2+np\\sum_{j=1}^{s}\\mathcal P_{j-1}(d_j+1)^2+np\\mathcal P_s,~\\label{eqqq01gut0014m1}\\\\ M_2(\\TT)\\!&=\\lambda_{m}\\!+\\!np\\sum_{j=1}^{s-1}\\mathcal P_j(d_j\\!+\\!1)(d_{j+1}\\!+\\!1)\\!+np \\mathcal P_s(d_s+1).~\\label{eqqq02gut0014m1} \\end{align} \\end{theorem}","line":4563,"page":124,"defence":[]},"new":{"title":"M₁ и M₂ после висячих расширений","short":"Т 4.2.1","num":"4.2.1","page":"46","chapter":4,"line":1844,"label":"problemn2","statement":"\\begin{theorem}\\label{problemn2} Пусть $n\\ge3$, $p\\ge1$ и $h\\ge1$. На $j$-м шаге присоединим к каждому текущему листу $b_j\\ge1$ новых листьев. Положим $P_0=1$, $P_j=\\prod_{t=1}^j b_t$, $s_1=s_n=p+1$, $s_i=p+2$ при $1<i<n$. Тогда \\begin{align*} M_1={}&\\sum_{i=1}^n s_i^2+np\\sum_{j=1}^hP_{j-1}(1+b_j)^2+npP_h,\\\\ M_2={}&\\sum_{i=1}^{n-1}s_i s_{i+1}+p(1+b_1)\\sum_i s_i\\\\ &+np\\sum_{j=1}^{h-1}P_j(1+b_j)(1+b_{j+1})+npP_h(1+b_h). \\end{align*} \\end{theorem}","proof":"Число листьев непосредственно перед шагом $j$ равно $npP_{j-1}$, а их окончательная степень равна $1+b_j$. В последнем поколении все $npP_h$ вершин имеют степень один. Это даёт $M_1$. В $M_2$ отдельно суммируем произведения на рёбрах хребта, от хребта к исходным листьям, между соседними поколениями и в последнем поколении. Все рёбра дерева учтены по одному разу.","defence":[],"kind":"theorem","revision":""}},"projas":{"old":{"short":"П 2.2.1","title":"irr: одинаковое число листьев","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}\\label{projas} Пусть $\\TT^*(n,m)$ — гусеничное дерево. Тогда индекс Альбертсона задаётся как: \\[ \\irr(\\TT^*(n,m))= \\begin{cases} m(m+1)n-2m+2, \\quad &\\text{если } n\\geqslant 3, \\\\ m(m+1)n-2m, \\quad &\\text{если } n\\in\\{1,2\\}.\\end{cases} \\] \\end{proposition}","line":1207,"page":39,"defence":[]},"new":{"title":"irr: одинаковое число листьев","short":"П 2.3.3","num":"2.3.3","page":"17","chapter":2,"line":546,"label":"projas","statement":"\\begin{proposition}\\label{projas} Пусть $P_k$ --- выделенный путь, и к каждой его вершине присоединено $m\\ge1$ листьев. Индекс полученного дерева при $k=1$ равен $m(m-1)$, при $k=2$ равен $2m^2$, а при $k\\ge3$ равен $km(m+1)-2m+2$. \\end{proposition}","proof":"При $k=1$ это звезда. При $k=2$ степени соседних вершин пути равны $m+1$. При $k\\ge3$ два конца имеют степень $m+1$, а внутренние вершины степень $m+2$. Вклад висячих рёбер составляет $2m^2+(k-2)m(m+1)$, вклад пути равен двум.","defence":[],"kind":"proposition","revision":""}},"prop001convergentidentity":{"old":{"short":"П 6.3.2","title":"Длины и знаменатели подходящих дробей","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}~\\label{prop001convergentidentity} Для всех $n\\geqslant 0$ длина $q_n=|\\FD^{(a,b,n)}|$, определённая соотношением~\\eqref{eqq01qnrecurrence}, совпадает со знаменателем $q_{n-1}$ $(n-1)$-й подходящей дроби цепной дроби $\\zeta=[0;\\overline{a,b}]$ (с соглашением $q_{-1}=0$). \\end{proposition}","line":5685,"page":151,"defence":[]},"new":{"title":"Длины и знаменатели подходящих дробей","short":"П 6.3.2","num":"6.3.2","page":"58","chapter":6,"line":2244,"label":"prop001convergentidentity","statement":"\\begin{proposition}\\label{prop001convergentidentity} При $n\\ge1$ длина $q_n$ равна знаменателю подходящей дроби наклона с номером $n-1$, если нулевая подходящая дробь равна $0/1$. \\end{proposition}","proof":"Первые знаменатели равны $1,a+1$, то есть $q_1,q_2$. Далее обе последовательности подчиняются одной рекурсии с множителями $b,a,b,a,\\ldots$.","defence":[],"kind":"proposition","revision":""}},"prop001r1":{"old":{"short":"Л 3.4.5","title":"Максимизаторы gλ по вычетам","chapter":3,"severity":2,"note":"Сравнено лишь несколько кандидатов; ссылка на положительную определённость не даёт конкретной границы решётки. Результат о g может быть верен на [0,1], но представленное доказательство неполно.","statement":"\\begin{lemma}~\\label{prop001r1} Пусть $n=4k+r$, где $r\\in\\{1,2,3\\}$, и пусть $(\\delta,t)\\in\\mathbb Z^2$ пробегает пары, совместимые с вычетом $r$, то есть $\\delta-t\\equiv -r\\pmod4$. Тогда максимизатор $g_\\lambda(\\delta,t)$ на этой решётке при $\\lambda\\in[0,1]$ таков: \\begin{enumerate} \\item[\\textup{(i)}] Если $r=1$, то пара $(\\delta,t)=(0,1)$ максимизирует $g_\\lambda$, строго при $\\lambda\\in(0,1]$, с точным равенством значений с $(\\delta,t)=(-1,0)$ при $\\lambda=0$. \\item[\\textup{(ii)}] Если $r=2$, то зеркальные пары $(\\delta,t)=(1,-1)$ и $(\\delta,t)=(-1,1)$ совместно максимизируют $g_\\lambda$, с равным значением при каждом $\\lambda\\in[0,1]$. \\item[\\textup{(iii)}] Если $r=3$, то пара $(\\delta,t)=(0,-1)$ максимизирует $g_\\lambda$, строго при $\\lambda\\in(0,1]$, с точным равенством значений с $(\\delta,t)=(1,0)$ при $\\lambda=0$. \\end{enumerate} \\end{lemma}","line":3588,"page":99,"defence":[]},"new":{"title":"Максимизаторы gλ по вычетам","short":"Л 3.4.5","num":"3.4.5","page":"36","chapter":3,"line":1341,"label":"prop001r1","statement":"\\begin{lemma}~\\label{prop001r1} Пусть $\\lambda\\in[0,1]$ и $\\delta-t\\equiv-r\\pmod4$. На этой решётке функция $g_\\lambda$ имеет следующие максимизаторы: при $r=0$ --- $(0,0)$; при $r=1$ --- $(0,1)$, а при $\\lambda=0$ также $(-1,0)$; при $r=2$ --- $(1,-1)$ и $(-1,1)$; при $r=3$ --- $(0,-1)$, а при $\\lambda=0$ также $(1,0)$. Перечень полон. Это утверждение относится к $g_\\lambda$, а не непосредственно к $\\sig\\lambda$. \\end{lemma}","proof":"С обозначениями $x=2^\\lambda$, $q=3^\\lambda$, $p=x-1$ имеем \\[ g_\\lambda(\\delta,t)=-\\frac{(t+p\\delta)^2+(q-p^2)\\delta^2}{4}, \\qquad q-p^2\\ge1. \\] Поэтому $|\\delta|\\ge2$ даёт $g_\\lambda\\le-1$. Указанные кандидаты имеют значение не меньше $-1/2$: для $r=2$ это следует из $q\\le2x-1$. Последнее неравенство получается из выпуклости $x^{\\log_2 3}$ на $[1,2]$ и хорды, соединяющей $(1,1)$ и $(2,3)$. Остаётся $\\delta=-1,0,1$. При фиксированном $\\delta$ выбираем ближайшие к $-p\\delta$ числа $t\\equiv\\delta+r\\pmod4$. Для $r=1$ лучшие значения при $\\delta=0,-1,1$ равны соответственно $-1/4$, $-q/4$, $-(q+4-4p)/4$. Последнее строго меньше $-1/4$, поскольку $q+3-4p\\ge4-3p\\ge1$; второе равно первому только при $\\lambda=0$. Случай $r=3$ получается заменой знаков. При $r=2$ пары с $\\delta=\\pm1$ имеют значение $-(q-2p+1)/4\\ge-1/2$, а при $\\delta=0$ наибольшее значение равно $-1$. Случай $r=0$ следует из отрицательной определённости.","defence":[],"kind":"lemma","revision":""}},"prop001r13":{"old":{"short":"П 3.4.4","title":"Сравнение ветвей при r=1,3","chapter":3,"severity":2,"note":"Нужны условия применимости формулы округления; при Δr=0 обе ветви максимизируют, а не только одна. Глобальность вне проверенного диапазона отдельно не установлена.","statement":"\\begin{proposition}~\\label{prop001r13} Для $n\\equiv1\\pmod4$ (соответственно $n\\equiv3\\pmod4$) при $\\lambda\\in[0,2)$ ветвь $(0,1)$ (соответственно $(0,-1)$) является глобальным максимизатором среди допустимых $(\\delta,t)$ с $|\\delta|\\leqslant1$ тогда и только тогда, когда \\begin{equation}\\label{eqq01prop001r13} \\Delta_r(\\lambda,n):=\\tfrac14(3^\\lambda-1)+|A_\\lambda|\\,\\tau\\!\\big(s^\\ast_{n,\\lambda}\\big)\\;>\\;0; \\end{equation} в противном случае максимизатором является ветвь $(-1,0)$ (соответственно $(1,0)$). \\end{proposition}","line":3857,"page":105,"defence":[]},"new":{"title":"Сравнение ветвей при r=1,3","short":"П 3.4.4","num":"3.4.4","page":"39","chapter":3,"line":1545,"label":"prop001r13","statement":"\\begin{proposition}~\\label{prop001r13} Пусть $n\\equiv r\\pmod4$, $r=1$ или $3$, $n\\ge8$ и $\\lambda\\in[0,2)$. Сравним только две ветви: $b_o=(0,1)$ и $b_e=(-1,0)$ при $r=1$; $b_o=(0,-1)$ и $b_e=(1,0)$ при $r=3$. Положим $d_o=\\operatorname{dist}(s^*,I_n(b_o))$, $d_e=\\operatorname{dist}(s^*,I_n(b_e))$. Тогда \\begin{equation}\\label{eqq01prop001r13} \\Delta_r=V_{n,\\lambda}(b_o)-V_{n,\\lambda}(b_e) =\\frac{3^\\lambda-1}{4}+|A_\\lambda|(d_e^2-d_o^2). \\end{equation} Если $\\Delta_r>0$, выигрывает $b_o$; если $\\Delta_r<0$, выигрывает $b_e$; при $\\Delta_r=0$ обе ветви дают один максимум. Когда ближайшие точки неограниченных решёток допустимы, $d_e^2-d_o^2=\\tau(s^*)$. Утверждение не является классификацией всех глобальных максимумов. \\end{proposition}","proof":"В обоих случаях $g_\\lambda(b_o)-g_\\lambda(b_e)=(3^\\lambda-1)/4$. Применяем лемму~\\ref{lem003exact}. Все указанные пары допускают связную реализацию при любом допустимом $s$ и рассматриваемом $n$.","defence":[],"kind":"proposition","revision":""}},"prop01AlphAacf":{"old":{"short":"П 6.1.2","title":"α = bχ для периодической дроби","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}~\\label{prop01AlphAacf} Для всех $a,b\\geqslant 1$ $\\AlphA a(a,b) = b\\cdot\\chi(a,b).$ \\end{proposition}","line":5173,"page":141,"defence":[]},"new":{"title":"α = bχ для периодической дроби","short":"П 6.1.2","num":"6.1.2","page":"53","chapter":6,"line":2018,"label":"prop01AlphAacf","statement":"\\begin{proposition}\\label{prop01AlphAacf} Выполняется равенство $\\alpha=b\\chi(a,b)$. \\end{proposition}","proof":"Периодичность даёт $\\chi=a+1/(b+1/\\chi)$, откуда $b\\chi^2-ab\\chi-a=0$. Единственный положительный корень равен $\\alpha/b$ по~\\eqref{eqq1AlphAadef}.","defence":[],"kind":"proposition","revision":""}},"prop01alphareduced":{"old":{"short":"П 6.3.1","title":"α — приведённая иррациональность","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}~\\label{prop01alphareduced} Для всех целых $a,b\\geqslant 1$ число $\\AlphA =\\AlphA (a,b)$ является приведённой квадратичной иррациональностью. \\end{proposition}","line":5576,"page":149,"defence":[]},"new":{"title":"α — приведённая иррациональность","short":"П 6.3.1","num":"6.3.1","page":"57","chapter":6,"line":2210,"label":"prop01alphareduced","statement":"\\begin{proposition}~\\label{prop01alphareduced} Для всех целых $a,b\\geqslant 1$ число $\\alpha =\\alpha (a,b)$ является приведённой квадратичной иррациональностью. \\end{proposition}","proof":"Положим $P=ab$. Имеем $(P+1)^2<P^2+4P<(P+2)^2$ при $P\\ge1$, поэтому корни $x^2-Px-P=0$ иррациональны. Корень $\\alpha>P\\ge1$, а сопряжённый корень находится в $(-1,0)$, что и даёт приведённость.","defence":[],"kind":"proposition","revision":""}},"prop01celowerbound":{"old":{"short":"Л 6.2.4","title":"Нижняя граница критического показателя","chapter":6,"severity":1,"note":"Нижняя граница сохраняется: длина образа u является некоторым периодом, поэтому достаточно ≥ вместо ложного точного равенства из Л 6.2.3.","statement":"\\begin{lemma}~\\label{prop01celowerbound} Для $a,b \\geqslant 1$ \\[ \\CE\\bigl(\\FD^{(a,b)}\\bigr) \\ \\geqslant \\sup\\Bigl\\{\\, j + \\frac{a|u_p|_0+|u_p|}{a|u|_0+|u|} \\Bigr\\}, \\] где $u^ju_p$ является фактором слова $\\FD^{(b,a)}$, $u$ примитивно, а $u_p$ --- собственный префикс слова $u,\\ j\\geqslant 1$. \\end{lemma}","line":5351,"page":144,"defence":[]},"new":{"title":"Нижняя граница критического показателя","short":"Л 6.2.4","num":"6.2.4","page":"55","chapter":6,"line":2110,"label":"prop01celowerbound","statement":"\\begin{lemma}~\\label{prop01celowerbound} Для $a,b\\ge1$ имеем \\[ \\CE(\\FD^{(a,b)})\\ge \\sup\\left\\{j+\\frac{a|u_p|_0+|u_p|}{a|u|_0+|u|}: u^ju_p\\text{ --- фактор }\\FD^{(b,a)}\\right\\}, \\] где $u$ непусто и примитивно, $u_p$ --- собственный префикс $u$, $j\\ge1$. \\end{lemma}","proof":"Каждому рассматриваемому фактору соответствует фактор $\\sigma_a(u^ju_p)$ слова $\\FD^{(a,b)}$. Его показатель не меньше указанной величины по лемме~\\ref{lem02exponenttransform}. Берём супремум и используем определение $\\CE$. Минимальность периода $|\\sigma_a(u)|$ для этой нижней оценки не требуется.","defence":[],"kind":"lemma","revision":""}},"prop01fabisstandard":{"old":{"short":"П 6.1.1","title":"Совпадение со стандартной последовательностью","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}~\\label{prop01fabisstandard} Для любых $a,b\\geqslant 1$ бипериодическое слово Фибоначчи $f^{(a,b)}$ совпадает со стандартной последовательностью $s^{(d_1,d_2,d_3,\\ldots)}$ с направляющей последовательностью \\[ (d_1,d_2,d_3,d_4,\\ldots) = (a,b,a,b,\\ldots), \\qquad d_k = \\begin{cases} a & k \\text{ нечётно},\\\\ b & k \\text{ чётно}.\\end{cases} \\] \\end{proposition}","line":5137,"page":140,"defence":[7]},"new":{"title":"Совпадение со стандартной последовательностью","short":"П 6.1.1","num":"6.1.1","page":"53","chapter":6,"line":1988,"label":"prop01fabisstandard","statement":"\\begin{proposition}~\\label{prop01fabisstandard} Для любых $a,b\\geqslant 1$ бипериодическое слово Фибоначчи $f^{(a,b)}$ совпадает со стандартной последовательностью $s^{(d_1,d_2,d_3,\\ldots)}$ с направляющей последовательностью \\[ (d_1,d_2,d_3,d_4,\\ldots) = (a,b,a,b,\\ldots), \\qquad d_k = \\begin{cases} a & k \\text{ нечётно},\\\\ b & k \\text{ чётно}.\\end{cases} \\] \\end{proposition}","proof":"Согласно Определению~\\ref{def01standardsequence} и начальным словам $\\FD^{(a,b)}_0=1=s_{-1}$, $\\FD^{(a,b)}_1=0=s_0$, а рекуррентное соотношение~\\eqref{eqq01biperiodicrecurrence}, переиндексированное как $k=n-1$, при $n\\geqslant 2$ получаем $\\FD^{(a,b)}_n = s_{n-1}$ требует $s_k = s_{k-1}^{d_k}s_{k-2}$ с $d_k=a$, когда $n=k+1$ чётно. Непосредственная индукция по $n$ тогда даёт $\\FD^{(a,b)}_n=s_{n-1}$ для всех $n\\geqslant 0$, а рассматривая $n\\to\\infty$, получаем $\\FD^{(a,b)}=s^{(a,b,a,b,\\ldots)}$.","defence":[7],"kind":"proposition","revision":""}},"prop01icelowerbound":{"old":{"short":"П 6.2.1","title":"Нижняя граница начального показателя","chapter":6,"severity":1,"note":"Нижняя граница верна как оценка; переход от примитивности к точному минимальному периоду при j=1 неверен и не нужен.","statement":"\\begin{proposition}~\\label{prop01icelowerbound} Для каждого $n\\geqslant 1$ слово $s_n^{d_{n+1}}s_{n-1}$ является префиксом слова $\\FD^{(a,b)}$, и, следовательно, \\[ \\ice\\bigl(\\FD^{(a,b)}\\bigr)\\geqslant \\sup_{n\\geqslant 1} \\left(d_{n+1}+\\frac{L_{n-1}}{L_n}\\right). \\] \\end{proposition}","line":5370,"page":145,"defence":[]},"new":{"title":"Нижняя граница начального показателя","short":"П 6.2.2","num":"6.2.2","page":"55","chapter":6,"line":2126,"label":"prop01icelowerbound","statement":"\\begin{proposition}~\\label{prop01icelowerbound} Для каждого $n\\ge1$ слово $s_n^{d_{n+1}}s_{n-1}=s_{n+1}$ является префиксом $\\FD^{(a,b)}$. Следовательно, \\[ \\ice(\\FD^{(a,b)})\\ge \\sup_{n\\ge1}\\left(d_{n+1}+\\frac{L_{n-1}}{L_n}\\right). \\] \\end{proposition}","proof":"По определению стандартной последовательности $s_{n+1}=s_n^{d_{n+1}}s_{n-1}$, где $s_{n-1}$ --- собственный префикс $s_n$, а $s_{n+1}$ --- префикс предельного слова. Поэтому $L_n$ является периодом этого префикса, а его показатель не меньше $|s_{n+1}|/L_n=d_{n+1}+L_{n-1}/L_n$. Берём супремум по $n$. Утверждение, что $L_n$ --- наименьший период, не требуется.","defence":[],"kind":"proposition","revision":""}},"prop06squeeze":{"old":{"short":"П 3.4.2","title":"Локальный тест как глобальный критерий","chapter":3,"severity":3,"note":"При λ=1/2 вектор (1,1,3,3) удовлетворяет тесту, но имеет значение 26.6814 против 31.0737 у (3,1,1,3). Локальная устойчивость не является глобальным максимумом.","statement":"\\begin{proposition}~\\label{prop06squeeze} Пусть $\\mathscr S=(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ --- графичная химическая последовательность степеней и пусть $\\lambda\\in[0,1]$. Тогда \\begin{equation}~\\label{eqq01prop06squeeze} \\begin{aligned} \\sig{\\lambda}(\\mathscr S^\\dagger) - \\sig{\\lambda}(\\mathscr S) &= \\DA(2^\\lambda-3^\\lambda-1) + \\DB(2-2^\\lambda) + \\big(2^{\\lambda+1}-3^\\lambda-3\\big),\\\\ \\sig{\\lambda}(\\mathscr S^\\ddagger) - \\sig{\\lambda}(\\mathscr S) &= -\\DA(2^\\lambda-3^\\lambda-1) - \\DB(2-2^\\lambda) + \\big(2^{\\lambda+1}-3^\\lambda-3\\big), \\end{aligned} \\end{equation} что $\\mathscr S$ максимизирует $\\sig{\\lambda}$ среди графичных последовательностей тогда и только тогда, когда $ \\big|\\DA(2^\\lambda-3^\\lambda-1) + \\DB(2-2^\\lambda)\\big| \\;\\le\\; 3+3^\\lambda-2^{\\lambda+1}.$ \\end{proposition}","line":3371,"page":94,"defence":[]},"new":{"title":"Локальный тест как глобальный критерий","short":"П 3.4.2","num":"3.4.2","page":"33","chapter":3,"line":1155,"label":"prop06squeeze","statement":"\\begin{proposition}~\\label{prop06squeeze} Пусть $\\mathscr S=(1^{a_1},2^{a_2},3^{a_3},4^{a_4})$ графична, $n\\ge8$, $a_i\\ge1$ и $\\lambda\\in[0,1]$. Обозначим $L=\\DA(2^\\lambda-3^\\lambda-1)+\\DB(2-2^\\lambda)$ и $c=3+3^\\lambda-2^{\\lambda+1}$. Тогда \\begin{equation}\\label{eqq01prop06squeeze} \\sig\\lambda(\\mathscr S^\\dagger)-\\sig\\lambda(\\mathscr S)=L-c,\\qquad \\sig\\lambda(\\mathscr S^\\ddagger)-\\sig\\lambda(\\mathscr S)=-L-c. \\
