end{equation} Обе модификации не увеличивают значение тогда и только тогда, когда $|L|\\le c$. Это условие локальной оптимальности относительно двух указанных модификаций. Глобальная оптимальность из него не следует. \\end{proposition}","proof":"У модификаций $s$ не меняется, а $(\\delta,t)$ заменяется на $(\\delta+2,t-2)$ или $(\\delta-2,t+2)$. Раскрытие $g_\\lambda$ даёт~\\eqref{eqq01prop06squeeze}. Условие одновременной неположительности двух приращений равносильно $-c\\le L\\le c$.","defence":[],"kind":"proposition","revision":""}},"prop3spine":{"old":{"short":"П 2.1.2","title":"irr: разность экстремумов при k=3","chapter":2,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{proposition}\\label{prop3spine} Пусть $d_1\\ge d_2\\ge d_3\\ge 2$ и пусть $\\mathcal C$ — класс гусеничных деревьев, последовательность степеней хребта которых является упорядочением $(d_1,d_2,d_3)$. Тогда \\[ \\operatorname{irr}_{\\max}(\\TT)-\\operatorname{irr}_{\\min}(\\TT)=2(d_2-d_3). \\] Если $d_2>d_3$, то максимум достигается в точности тогда, когда средняя степень хребта равна $d_3$, а минимум — в точности тогда, когда она равна $d_1$ или $d_2$. Если $d_2=d_3$, то разность равна $0$. \\end{proposition}","line":1184,"page":38,"defence":[]},"new":{"title":"irr: разность экстремумов при k=3","short":"П 2.2.2","num":"2.2.2","page":"16","chapter":2,"line":480,"label":"prop3spine","statement":"\\begin{proposition}\\label{prop3spine} Пусть $d_1\\ge d_2\\ge d_3\\ge 2$ и пусть $\\mathcal C$ — класс гусеничных деревьев, последовательность степеней хребта которых является упорядочением $(d_1,d_2,d_3)$. Тогда \\[ \\operatorname{irr}_{\\max}(\\TT)-\\operatorname{irr}_{\\min}(\\TT)=2(d_2-d_3). \\] Если $d_2>d_3$, то максимум достигается в точности тогда, когда средняя степень хребта равна $d_3$, а минимум — в точности тогда, когда она равна $d_1$ или $d_2$. Если $d_2=d_3$, то разность равна $0$. \\end{proposition}","proof":"По теореме~\\ref{thmext} при $k=3$ разность равна $2(d_2-d_3)$. Если средняя вершина имеет степень $d_1$ или $d_2$, порядок унимодален и вариация с нулём равна $2d_1$. Если в середине стоит $d_3$, вариация равна $2(d_1+d_2-d_3)$. Эти варианты исчерпывают все порядки.","defence":[],"kind":"proposition","revision":""}},"prop:r2":{"old":{"short":"П 3.4.3","title":"Сравнение ветвей при r=2","chapter":3,"severity":2,"note":"Использует внутреннюю формулу округления, но объявлен для всего [0,2). При λ>1 вершина s* отрицательна; ближайшее нечётное значение может давать отрицательные кратности. Нужен отдельный разбор границы.","statement":"\\begin{proposition}~\\label{prop:r2} Для каждого $n\\equiv2\\pmod4$, $n\\ge10$, и каждого $\\lambda\\in[0,2)$ ветвь $(\\delta,t)=(1,-1)$ (эквивалентно $(-1,1)$), где $s$ --- ближайшее нечётное целое число к $s^\\ast_{n,\\lambda}$, слабо доминирует ветвь $(0,2)$ (эквивалентно $(0,-2)$), причём строго, если только $s^\\ast_{n,\\lambda}\\notin2\\mathbb Z$ в точности. \\end{proposition}","line":3845,"page":105,"defence":[]},"new":{"title":"Сравнение ветвей при r=2","short":"П 3.4.3","num":"3.4.3","page":"39","chapter":3,"line":1525,"label":"prop:r2","statement":"\\begin{proposition}~\\label{prop:r2} Пусть $n\\equiv2\\pmod4$, $n\\ge10$, $\\lambda\\in[0,1]$. При сравнении только ветвей $(\\delta,t)=(1,-1),(-1,1)$ и $(0,2),(0,-2)$ первые две слабо доминируют последние две. Положим $d_o=\\operatorname{dist}(s^*,I_n(1,-1))$ и $d_e=\\operatorname{dist}(s^*,I_n(0,2))$. Разность их лучших значений равна $|A_\\lambda|(1+d_e^2-d_o^2)$; равенство имеет место в точности при $d_o^2=1+d_e^2$. Если ближайшие точки неограниченных решёток допустимы, равенство эквивалентно $s^*\\in2\\mathbb Z$. Это сравнение само по себе не исключает другие ветви. \\end{proposition}","proof":"Имеем $g_\\lambda(1,-1)-g_\\lambda(0,2)=D(\\lambda)/4=|A_\\lambda|$. На $[0,1]$ выполнено $0\\le s^*\\le n/2$, поэтому ближайшее допустимое нечётное $s\\in[1,n-1]$ имеет расстояние $d_o\\le1$. Формула леммы~\\ref{lem003exact} даёт разность; она неотрицательна, так как $1+d_e^2-d_o^2\\ge0$. Замена знаков сохраняет $g$, множества $I_n$ и допустимость связности для всех четырёх рассматриваемых пар.","defence":[],"kind":"proposition","revision":""}},"propMaximumn1trees":{"old":{"short":"П 2.1.1","title":"irr: звезда и путь","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}\\label{propMaximumn1trees} Пусть $n\\ge 2$. Тогда $\\operatorname{irr}_{\\max}(\\mathcal T_n)=(n-1)(n-2)$, причём оно достигается только на звезде $K_{1,n-1}$, и \\[ \\operatorname{irr}_{\\min}(\\mathcal T_n)=\\begin{cases}0,& n=2,\\\\ 2,& n\\ge 3,\\end{cases} \\] причём при $n\\geqslant 3$ оно достигается только на пути $\\mathcal P_n$. \\end{proposition}","line":997,"page":35,"defence":[]},"new":{"title":"irr: звезда и путь","short":"П 2.1.1","num":"2.1.1","page":"11","chapter":2,"line":288,"label":"propMaximumn1trees","statement":"\\begin{proposition}\\label{propMaximumn1trees} Пусть $n\\ge 2$. Тогда $\\operatorname{irr}_{\\max}(\\mathcal T_n)=(n-1)(n-2)$, причём оно достигается только на звезде $K_{1,n-1}$, и \\[ \\operatorname{irr}_{\\min}(\\mathcal T_n)=\\begin{cases}0,& n=2,\\\\ 2,& n\\ge 3,\\end{cases} \\] причём при $n\\geqslant 3$ оно достигается только на пути $\\mathcal P_n$. \\end{proposition}","proof":"Степени концов ребра заключены между $1$ и $n-1$. Суммирование даёт верхнюю границу $(n-1)(n-2)$, которую по лемме~\\ref{albstarirr} достигает звезда. При $n>2$ равенство требует наличия вершины степени $n-1$. Для минимума возьмём вершину степени $\\Delta$ и из неё пройдём к листу внутри каждой из $\\Delta$ компонент после её удаления. Вариация степеней на каждом таком пути не меньше $\\Delta-1$. Пути рёберно не пересекаются, поэтому $\\irr(T)\\ge\\Delta(\\Delta-1)$. При $\\Delta\\ge3$ значение строго больше двух. При $\\Delta=2$ дерево есть путь, и два крайних ребра дают по единице. При $n=2$ единственное ребро даёт нуль.","defence":[],"kind":"proposition","revision":""}},"propfib":{"old":{"short":"П 2.4.4","title":"irr: степени Фибоначчи","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}~\\label{propfib} Пусть $F_1=F_2=1$, $F_{i+1}=F_i+F_{i-1}$, и пусть $\\TT_m$ --- гусеничное дерево, где $m\\ge4$, со степенями хребта $(F_3,F_4,\\dots,F_m)$. Тогда \\begin{equation}~\\label{eqqq01propfib} \\irr(\\TT_m)=F_mF_{m+1}-3F_{m+2}+2F_m+2m+1 , \\end{equation} \\end{proposition}","line":2279,"page":65,"defence":[]},"new":{"title":"irr: степени Фибоначчи","short":"П 2.3.4","num":"2.3.4","page":"18","chapter":2,"line":553,"label":"propfib","statement":"\\begin{proposition}~\\label{propfib} Пусть $F_1=F_2=1$, $F_{i+1}=F_i+F_{i-1}$, и пусть $\\TT_m$ --- гусеничное дерево, где $m\\ge4$, со степенями хребта $(F_3,F_4,\\dots,F_m)$. Тогда \\begin{equation}~\\label{eqqq01propfib} \\irr(\\TT_m)=F_mF_{m+1}-3F_{m+2}+2F_m+2m+1 , \\end{equation} \\end{proposition}","proof":"Согласно предложению~\\ref{propmono}, $\\operatorname{irr}=\\sum_{i=3}^m(F_i-1)(F_i-2)-2+2F_m$. Поскольку $\\sum_{i=1}^mF_i^2=F_mF_{m+1}$ и $\\sum_{i=1}^mF_i=F_{m+2}-1$, находим, что: для $i=1,2$, \\begin{equation}~\\label{eqqq02propfib} \\sum_{i=3}^mF_i^2=F_mF_{m+1}-2, \\quad \\sum_{i=3}^mF_i=F_{m+2}-3 \\end{equation} Тогда \\begin{equation}~\\label{eqqq03propfib} \\sum_{i=3}^m(F_i^2-3F_i+2)=F_mF_{m+1}-2-3F_{m+2}+9+2(m-2). \\end{equation} Следовательно, из~\\eqref{eqqq02propfib} и \\eqref{eqqq03propfib}, прибавляя $-2+2F_m$, получаем~\\eqref{eqqq01propfib}.","defence":[],"kind":"proposition","revision":""}},"propfibsig":{"old":{"short":"П 3.2.2","title":"σ: степени Фибоначчи","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}~\\label{propfibsig} Пусть $\\TT_m$ --- гусеничное дерево с хребтом $v_1v_2\\cdots v_{m-2}$ таким, что $d(v_j)=F_{j+2}$, где $v_1$ несёт одну висячую вершину, $v_{m-2}$ несёт $F_m-1$, а каждая $v_j$ при $1<j<m-2$ несёт $F_{j+2}-2$. Тогда \\begin{equation}~\\label{eqqq01propfibsig} \\sigma(\\TT_m)=1+(F_m-1)^3+\\sum_{i=4}^{m-1}(F_i-2)(F_i-1)^2+\\bigl(F_{m-2}F_{m-1}-1\\bigr). \\end{equation} \\end{proposition}","line":2937,"page":82,"defence":[]},"new":{"title":"σ: степени Фибоначчи","short":"П 3.2.2","num":"3.2.2","page":"26","chapter":3,"line":829,"label":"propfibsig","statement":"\\begin{proposition}~\\label{propfibsig} Пусть $m\\ge4$, а $\\TT_m$ --- гусеничное дерево с хребтом $v_1v_2\\cdots v_{m-2}$ таким, что $d(v_j)=F_{j+2}$, где $v_1$ несёт одну висячую вершину, $v_{m-2}$ несёт $F_m-1$, а каждая $v_j$ при $1<j<m-2$ несёт $F_{j+2}-2$. Тогда \\begin{equation}~\\label{eqqq01propfibsig} \\sigma(\\TT_m)=1+(F_m-1)^3+\\sum_{i=4}^{m-1}(F_i-2)(F_i-1)^2+\\bigl(F_{m-2}F_{m-1}-1\\bigr). \\end{equation} \\end{proposition}","proof":"Согласно предложению~\\ref{propsigmaspine}, $\\sigma(\\TT_m)$ есть сумма вкладов рёбер хребта и висячих рёбер. Таким образом, висячие рёбра при $v_1$ вносят $1\\cdot(F_3-1)^2=1$; при $v_{m-2}$ вносят $(F_m-1)(F_m-1)^2=(F_m-1)^3$. Затем висячие рёбра при внутренних вершинах степени $F_i$, $4\\le i\\le m-1$, вносят $(F_i-2)(F_i-1)^2$. Рёбра хребта вносят \\begin{equation}~\\label{eqqq02propfibsig} \\sum_{i=3}^{m-1}(F_{i+1}-F_i)^2=\\sum_{i=3}^{m-1}F_{i-1}^2 =\\sum_{j=2}^{m-2}F_j^2=F_{m-2}F_{m-1}-1, \\end{equation} Следовательно, из~\\eqref{eqqq02propfibsig}, используя $\\sum_{j=1}^{r}F_j^2=F_rF_{r+1}$ и $F_1=1$, получаем~\\eqref{eqqq01propfibsig}.","defence":[],"kind":"proposition","revision":""}},"propgutformula":{"old":{"short":"П 4.2.1","title":"Gut через типы пар вершин","chapter":4,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}\\label{propgutformula} Пусть $\\TT$ --- гусеничное дерево с хребтом $v_1v_2\\cdots v_k$, $k\\ge2$, где $d_i=d_{\\TT}(v_i)\\ge2$. Пусть $s_1=s_k=1$, $s_i=2$ при $1<i<k$, и $p_i=d_i-s_i$ --- число висячих вершин при $v_i$. Тогда \\[ \\Gut(\\TT)=\\sum_{i=1}^{k}\\bigl(d_ip_i+p_i(p_i-1)\\bigr) +\\sum_{1\\le i<j\\le k}\\Bigl(d_id_j\\,a_{ij}+(d_ip_j+d_jp_i)(a_{ij}+1) +p_ip_j(a_{ij}+2)\\Bigr), \\] где $a_{ij}=j-i$. \\end{proposition}","line":4419,"page":120,"defence":[]},"new":{"title":"Gut через типы пар вершин","short":"П 4.2.1","num":"4.2.1","page":"46","chapter":4,"line":1809,"label":"propgutformula","statement":"\\begin{proposition}\\label{propgutformula} Пусть $\\TT$ --- гусеничное дерево с хребтом $v_1v_2\\cdots v_k$, $k\\ge2$, где $d_i=d_{\\TT}(v_i)\\ge2$. Пусть $s_1=s_k=1$, $s_i=2$ при $1<i<k$, и $p_i=d_i-s_i$ --- число висячих вершин при $v_i$. Тогда \\[ \\Gut(\\TT)=\\sum_{i=1}^{k}\\bigl(d_ip_i+p_i(p_i-1)\\bigr) +\\sum_{1\\le i<j\\le k}\\Bigl(d_id_j\\,a_{ij}+(d_ip_j+d_jp_i)(a_{ij}+1) +p_ip_j(a_{ij}+2)\\Bigr), \\] где $a_{ij}=j-i$. \\end{proposition}","proof":"Разобьём вершины на группы, состоящие из $v_i$ и всех её висячих соседей. Внутри группы вклад пар центр--лист равен $d_ip_i$, а пар лист--лист равен $2\\binom{p_i}{2}$. Между группами с номерами $i<j$ имеются пары двух вершин хребта, пары с одним листом и пары двух листьев. Их расстояния равны соответственно $a_{ij}$, $a_{ij}+1$, $a_{ij}+2$. Подстановка весов по~\\eqref{eq1gut} даёт указанную сумму.","defence":[],"kind":"proposition","revision":""}},"propjoinirr":{"old":{"short":"П 1.1.1","title":"Нерегулярность соединения графов","chapter":1,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{proposition}~\\label{propjoinirr} Пусть $G,H$ — графы, для которых $n_1=|V(G)|\\ge n_2=|V(H)|\\ge 1$. Тогда \\begin{equation}~\\label{eqboundjoin} \\operatorname{irr}(G+H)\\le \\operatorname{irr}(G)+\\operatorname{irr}(H)+n_1n_2(n_1-1). \\end{equation} Равенство выполняется тогда и только тогда, когда $G=\\overline{K_{n_1}}$ и $H=K_{n_2}$ (при $n_1=n_2\\ge 2$ также когда $G=K_{n_1}$ и $H=\\overline{K_{n_2}}$); в частности, \\eqref{eqboundjoin} является точной оценкой. \\end{proposition}","line":332,"page":12,"defence":[]},"new":{"title":"Нерегулярность соединения графов","short":"П 1.1.1","num":"1.1.1","page":"4","chapter":1,"line":99,"label":"propjoinirr","statement":"\\begin{proposition}~\\label{propjoinirr} Пусть $G,H$ — графы, для которых $n_1=|V(G)|\\ge n_2=|V(H)|\\ge 1$. Тогда \\begin{equation}~\\label{eqboundjoin} \\operatorname{irr}(G+H)\\le \\operatorname{irr}(G)+\\operatorname{irr}(H)+n_1n_2(n_1-1). \\end{equation} Равенство выполняется тогда и только тогда, когда $G=\\overline{K_{n_1}}$ и $H=K_{n_2}$ (при $n_1=n_2\\ge 2$ также когда $G=K_{n_1}$ и $H=\\overline{K_{n_2}}$); в частности, \\eqref{eqboundjoin} является точной оценкой. \\end{proposition}","proof":"Вклады старых рёбер сохраняются, поскольку на одной стороне степени увеличиваются на одну и ту же величину. Для нового ребра $uv$, $u\\in G$, $v\\in H$, положим $x=d_H(v)+n_1-d_G(u)-n_2$. Тогда $1-n_2\\le x\\le n_1-1$. Отсюда следует оценка. При $n_1>n_2$ равенство требует $x=n_1-1$ на каждой паре, то есть $G$ пуст, а $H$ полон. При $n_1=n_2>1$ модули достигают максимума, когда все степени на одной стороне равны нулю, а на другой равны $n_1-1$: достаточно зафиксировать по одной вершине каждой стороны. При $n_1=n_2=1$ оба графа одновершинны.","defence":[],"kind":"proposition","revision":""}},"propleaves":{"old":{"short":"П 2.2.4","title":"irr ≤ ℓ(ℓ−1) и равенство","chapter":2,"severity":1,"note":"Нужно «не более одной вершины степени >2», а не ≥2; P₄ опровергает буквальную формулировку. Оценка верна. В доказательстве также перепутаны T/S и пары вершин/рёбер.","statement":"\\begin{proposition}~\\label{propleaves} Пусть $\\TT$ — дерево с $n\\ge 3$ вершинами и $\\ell$ висячими вершинами. Тогда $\\operatorname{irr}(\\TT)\\le\\ell(\\ell-1)$, причём равенство выполняется тогда и только тогда, когда $\\TT$ есть паук не более чем с одной вершиной степени не менее 2. \\end{proposition}","line":1404,"page":43,"defence":[]},"new":{"title":"irr ≤ ℓ(ℓ−1) и равенство","short":"П 2.1.3","num":"2.1.3","page":"12","chapter":2,"line":331,"label":"propleaves","statement":"\\begin{proposition}~\\label{propleaves} Пусть $T$ --- дерево с $n\\ge3$ вершинами и $\\ell$ листьями. Тогда $\\irr(T)\\le\\ell(\\ell-1)$. Равенство выполняется тогда и только тогда, когда в $T$ не более одной вершины степени строго больше $2$, то есть $T$ --- подразделение звезды, включая путь. \\end{proposition}","proof":"Пусть $S$ --- поддерево, порождённое невисячими вершинами, и $t_v=d_T(v)-2\\ge0$ для $v\\in V(S)$. Разделяя рёбра $T$ на висячие и рёбра $S$, получаем \\[ \\irr(T)=\\sum_{v\\in V(S)}t_v^2+3\\sum_{v\\in V(S)}t_v+2 -2\\sum_{uv\\in E(S)}\\min(t_u,t_v). \\] Поскольку $\\ell=2+\\sum_v t_v$, имеем \\begin{equation}\\label{eqqq01propleaves} \\ell(\\ell-1)-\\irr(T) =2\\sum_{\\{u,v\\}\\subseteq V(S),\\,u\\ne v}t_ut_v +2\\sum_{uv\\in E(S)}\\min(t_u,t_v)\\ge0. \\end{equation} Первая сумма берётся по неупорядоченным двухэлементным множествам вершин. Она обращается в нуль в точности тогда, когда положительно не более одного $t_v$; в этом случае вторая сумма также равна нулю.","defence":[],"kind":"proposition","revision":""}},"proplusmnus01":{"old":{"short":"П 3.4.1","title":"Изменение σᵗ при операциях ±","chapter":3,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{proposition}~\\label{proplusmnus01} Пусть $a_1,a_2,a_3,a_4\\geqslant 1$ --- графичная химическая последовательность степеней и пусть $\\lambda \\in [0,1]$. Тогда \\begin{equation}~\\label{eqqplussigma} \\sig{\\lambda }(\\mathscr S^+)-\\sig{\\lambda}(\\mathscr S)= \\DA(2^{\\lambda}+3^{\\lambda}-1)+2^{\\lambda}\\DB +\\bigl(1-2^{\\lambda+1}-3^{\\lambda}\\bigr), \\end{equation} \\begin{equation}~\\label{eqqminussigma} \\sig{\\lambda}(\\mathscr S^-)-\\sig{\\lambda}(\\mathscr S)= -\\DA(2^{\\lambda}+3^{\\lambda}-1)-2^{\\lambda}\\DB +\\bigl(1-2^{\\lambda+1}-3^{\\lambda}\\bigr). \\end{equation} \\end{proposition}","line":3357,"page":94,"defence":[]},"new":{"title":"Изменение σᵗ при операциях ±","short":"П 3.4.1","num":"3.4.1","page":"32","chapter":3,"line":1139,"label":"proplusmnus01","statement":"\\begin{proposition}~\\label{proplusmnus01} Пусть $a_1,a_2,a_3,a_4\\geqslant 1$ --- графичная химическая последовательность степеней и пусть $\\lambda \\in [0,1]$. Тогда \\begin{equation}~\\label{eqqplussigma} \\sig{\\lambda }(\\mathscr S^+)-\\sig{\\lambda}(\\mathscr S)= \\DA(2^{\\lambda}+3^{\\lambda}-1)+2^{\\lambda}\\DB +\\bigl(1-2^{\\lambda+1}-3^{\\lambda}\\bigr), \\end{equation} \\begin{equation}~\\label{eqqminussigma} \\sig{\\lambda}(\\mathscr S^-)-\\sig{\\lambda}(\\mathscr S)= -\\DA(2^{\\lambda}+3^{\\lambda}-1)-2^{\\lambda}\\DB +\\bigl(1-2^{\\lambda+1}-3^{\\lambda}\\bigr). \\end{equation} \\end{proposition}","proof":"Подставим в~\\eqref{eqq02modsigma} вектор $a+h$, где $h=(-1,-1,1,1)$ или $-h$. Разность квадратного выражения есть сумма линейного по $h$ приращения и постоянного вклада пар $h_i h_j$. Последний равен $1-2^{\\lambda+1}-3^\\lambda$ в обоих случаях, а линейная часть равна $\\pm[(2^\\lambda+3^\\lambda-1)(a_1-a_4)+2^\\lambda(a_2-a_3)]$.","defence":[],"kind":"proposition","revision":""}},"propmono":{"old":{"short":"П 2.3.1","title":"Унимодальный хребет минимизирует irr","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}~\\label{propmono} Пусть $\\TT$ — гусеничное дерево с последовательностью степеней хребта $(d_1,\\dots,d_k)$, $k\\ge 2$, $\\Delta=\\max d_i$. Если последовательность унимодальна, то \\begin{equation}~\\label{eqq01propmono} \\irr(\\TT)=\\sum_{i=1}^{k}d_i^2-3\\sum_{i=1}^{k}d_i+2\\Delta+2k-2, \\end{equation} и это есть минимум $\\operatorname{irr}$ по всем гусеничным деревьям с теми же степенями хребта. \\end{proposition}","line":1798,"page":57,"defence":[]},"new":{"title":"Унимодальный хребет минимизирует irr","short":"П 2.3.1","num":"2.3.1","page":"16","chapter":2,"line":511,"label":"propmono","statement":"\\begin{proposition}~\\label{propmono} Пусть $\\TT$ — гусеничное дерево с последовательностью степеней хребта $(d_1,\\dots,d_k)$, $k\\ge 2$, $\\Delta=\\max d_i$. Если последовательность унимодальна, то \\begin{equation}~\\label{eqq01propmono} \\irr(\\TT)=\\sum_{i=1}^{k}d_i^2-3\\sum_{i=1}^{k}d_i+2\\Delta+2k-2, \\end{equation} и это есть минимум $\\operatorname{irr}$ по всем гусеничным деревьям с теми же степенями хребта. \\end{proposition}","proof":"В цикле, начинающемся с нуля, путь до максимальной степени и путь обратно монотонны. Вариация равна $2\\Delta$. Подставляем это значение в лемму~\\ref{lemred0005} и применяем теорему~\\ref{thmext}.","defence":[],"kind":"proposition","revision":""}},"proposition_3.3.1":{"old":{"short":"П 3.3.1","title":"«2 < σ(T)» для любого дерева","chapter":3,"severity":1,"note":"Нужно 2≤σ(T), а не 2<σ(T): любой Pₙ, n≥3, имеет σ=2.","statement":"\\begin{proposition}[\\cite{Yang2023Deng}] Для любого дерева $T$ порядка $n$ выполняется $ 2 < \\sigma(T) \\leq (n-1)(n-2)^2.$ \\end{proposition}","line":3023,"page":84,"defence":[]},"new":{"title":"Точные общие границы σ для дерева","short":"П 3.3.1","num":"3.3.1","page":"28","chapter":3,"line":922,"label":"proposition_3.3.1","statement":"\\begin{proposition}\\label{proposition_3.3.1} Для дерева $T$ порядка $n\\ge3$ имеем $2\\le\\sigma(T)\\le(n-1)(n-2)^2$. Нижнее равенство характеризует путь, верхнее --- звезду. \\end{proposition}","proof":"Из предложения~\\ref{propMaximumn1trees} и теоремы~\\ref{thmSigman4} следует нижняя граница с необходимым условием равенства. На пути ровно два ребра дают по единице. Верхняя оценка следует из $|d(u)-d(v)|\\le n-2$; равенство на каждом ребре требует вершины степени $n-1$ и достигается на звезде.","defence":[],"kind":"proposition","revision":""}},"propsigM1":{"old":{"short":"П 3.3.3","title":"Нижняя граница σ через M₁","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}\\label{propsigM1} Для каждого дерева $\\TT$ порядка $n\\ge3$ с максимальной степенью $\\Delta$ \\[ \\sigma(\\TT)\\geqslant M_1(\\TT)-4(n-1)+2\\Delta. \\] \\end{proposition}","line":3035,"page":85,"defence":[]},"new":{"title":"Нижняя граница σ через M₁","short":"П 3.3.3","num":"3.3.3","page":"28","chapter":3,"line":936,"label":"propsigM1","statement":"\\begin{proposition}\\label{propsigM1} Для каждого дерева $\\TT$ порядка $n\\ge3$ с максимальной степенью $\\Delta$ \\[ \\sigma(\\TT)\\geqslant M_1(\\TT)-4(n-1)+2\\Delta. \\] \\end{proposition}","proof":"Применяем нижнюю оценку предложения~\\ref{propzagreb} и неравенство $\\sigma\\ge\\irr$ из теоремы~\\ref{thmSigman4}.","defence":[],"kind":"proposition","revision":""}},"propsigcat":{"old":{"short":"П 3.3.4","title":"Границы минимума σ через n и Δ","chapter":3,"severity":1,"note":"Итоговая оценка верна; в цепочке доказательства потерян множитель Δ−1.","statement":"\\begin{proposition}~\\label{propsigcat} Пусть $M=\\{d_1,\\dots,d_k\\}$ --- мультимножество целых чисел, не меньших $2$, $\\Delta=\\max M$, $n=\\sum(d_i-1)+2$ --- порядок гусеничных деревьев с такими степенями хребта. Тогда минимум $\\sigma$ по всем упорядочениям $M$ удовлетворяет \\begin{equation}~\\label{eqqq01propsigcat} \\Delta(\\Delta-1)\\ \\le\\ \\sigma_{\\min}(M)\\ \\le\\ (\\Delta-1)\\bigl((\\Delta-2)n+2\\bigr). \\end{equation} Верхняя оценка достигается на звезде $K_{1,\\Delta}$ ($k=1$). \\end{proposition}","line":3066,"page":86,"defence":[]},"new":{"title":"Границы минимума σ через n и Δ","short":"П 3.3.4","num":"3.3.4","page":"28","chapter":3,"line":946,"label":"propsigcat","statement":"\\begin{proposition}\\label{propsigcat} Для фиксированного мультимножества степеней хребта гусеницы порядка $n\\ge3$ имеем $\\Delta(\\Delta-1)\\le\\sigma_{\\min}\\le(\\Delta-1)((\\Delta-2)n+2)$. При одной невисячей вершине верхняя граница достигается. \\end{proposition}","proof":"Нижняя граница установлена в предложении~\\ref{lowerboundSigmastep2}. При $k\\ge2$ возьмём расстановку, минимизирующую $\\irr$, и применим последовательно теорему~\\ref{thmSigman4} и следствие~\\ref{corbounds}. На звезде прямой подсчёт даёт $\\Delta(\\Delta-1)^2$, а $n=\\Delta+1$.","defence":[],"kind":"proposition","revision":""}},"propsigma":{"old":{"short":"П 2.4.2","title":"Границы irr через F и M₂","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}~\\label{propsigma} Пусть $G$ — нерегулярный граф с $m$ рёбрами, \\begin{equation}~\\label{eqqq01propsigma} \\frac{F(G)-2M_2(G)}{\\Delta-\\delta}\\ \\le\\ \\operatorname{irr}(G)\\ \\le\\ \\sqrt{m\\,(F(G)-2M_2(G))}. \\end{equation} \\end{proposition}","line":2149,"page":61,"defence":[]},"new":{"title":"Границы irr через F и M₂","short":"П 2.4.1","num":"2.4.1","page":"18","chapter":2,"line":573,"label":"propsigma","statement":"\\begin{proposition}~\\label{propsigma} Пусть $G$ — нерегулярный граф с $m$ рёбрами, \\begin{equation}~\\label{eqqq01propsigma} \\frac{F(G)-2M_2(G)}{\\Delta-\\delta}\\ \\le\\ \\operatorname{irr}(G)\\ \\le\\ \\sqrt{m\\,(F(G)-2M_2(G))}. \\end{equation} \\end{proposition}","proof":"Для $x_e=|d(u)-d(v)|$ выполнено $x_e^2\\le(\\Delta-\\delta)x_e$. Нижнюю границу получаем суммированием и подстановкой $\\sigma=F-2M_2$ из~\\eqref{normbound}. Верхняя граница также содержится в~\\eqref{normbound}.","defence":[],"kind":"proposition","revision":""}},"propsigmaspine":{"old":{"short":"П 3.1.2","title":"Формула σ через хребет","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}\\label{propsigmaspine} Пусть $\\TT$ --- гусеничное дерево с последовательностью степеней хребта $(d_1,\\dots,d_k)$, $k\\ge2$. Тогда \\begin{equation}~\\label{eqqq01propsigmaspine} \\sigma(\\TT)=(d_1-1)^3+(d_k-1)^3+\\sum_{i=2}^{k-1}(d_i-1)^2(d_i-2)+\\sum_{i=1}^{k-1}(d_i-d_{i+1})^2 . \\end{equation} \\end{proposition}","line":2480,"page":73,"defence":[1]},"new":{"title":"Формула σ через хребет","short":"П 3.1.1","num":"3.1.1","page":"21","chapter":3,"line":660,"label":"propsigmaspine","statement":"\\begin{proposition}\\label{propsigmaspine} Пусть $\\TT$ --- гусеничное дерево с последовательностью степеней хребта $(d_1,\\dots,d_k)$, $k\\ge2$. Тогда \\begin{equation}~\\label{eqqq01propsigmaspine} \\sigma(\\TT)=(d_1-1)^3+(d_k-1)^3+\\sum_{i=2}^{k-1}(d_i-1)^2(d_i-2)+\\sum_{i=1}^{k-1}(d_i-d_{i+1})^2 . \\end{equation} \\end{proposition}","proof":"Обозначим множество висячих соседей $v_i$ через $L_i$. На концах хребта $|L_i|=d_i-1$, внутри $|L_i|=d_i-2$. Все рёбра попарно однозначно учитываются в сумме \\begin{equation}\\label{eqqq02propsigmaspine} \\sigma(\\TT)=\\sum_{i=1}^k|L_i|(d_i-1)^2+\\sum_{i=1}^{k-1}(d_i-d_{i+1})^2 . \\end{equation} Подстановка трёх значений $|L_i|$ даёт~\\eqref{eqqq01propsigmaspine}.","defence":[1],"kind":"proposition","revision":""}},"propstar":{"old":{"short":"П 2.2.5","title":"irr: внутренний подграф K₁,₃","chapter":2,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{proposition}~\\label{propstar} Пусть $\\TT$ — дерево, невисячие вершины которого порождают $K_{1,3}$ с центром степени $d\\ge 3$ и тремя другими вершинами степеней $d_1,d_2,d_3\\ge 2$. Пусть $A=\\{d_1,d_2,d_3\\}$, если $d\\ge\\max(d_1,d_2,d_3)$. Тогда \\begin{equation}~\\label{eqqq01propstar} \\irr(\\TT)=\\sum_{i\\in A}^{}(d_i-1)^2+\\sum_{i\\in A}^{} \\lvert d-d_i\\rvert++(d-1)(d-3). \\end{equation} \\end{proposition}","line":1735,"page":55,"defence":[]},"new":{"title":"irr: внутренний подграф K₁,₃","short":"П 2.3.2","num":"2.3.2","page":"17","chapter":2,"line":539,"label":"propstar","statement":"\\begin{proposition}\\label{propstar} Если невисячие вершины дерева порождают $K_{1,3}$, обозначим полную степень центральной вершины через $d$ и степени трёх её соседей через $b_1,b_2,b_3$. Тогда $\\irr=(d-3)(d-1)+\\sum_{i=1}^3[(b_i-1)^2+|b_i-d|]$. \\end{proposition}","proof":"У центральной вершины $d-3$ висячих соседей, у $i$-й крайней вершины $b_i-1$. Добавим вклады трёх внутренних рёбер по~\\eqref{defedgeindices}.","defence":[],"kind":"proposition","revision":""}},"propzagreb":{"old":{"short":"П 2.4.1","title":"Границы irr через M₁","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}~\\label{propzagreb} Для каждого дерева $\\TT$ с $n\\ge 3$ вершинами и максимальной степенью $\\Delta$ \\begin{equation}~\\label{eqqq01propzagreb} M_1(\\TT)-4(n-1)+2\\Delta\\ \\le\\ \\operatorname{irr}(\\TT)\\ \\le\\ M_1(\\TT)-2(n-1). \\end{equation} Правая часть неравенства выполняется тогда и только тогда, когда $\\TT\\cong \\mathcal S_n$, а равенство слева выполняется тогда и только тогда, когда $\\TT$ имеет вершину $\\ell$ максимальной степени такую, что степени не возрастают вдоль любого пути, начинающегося в $\\ell$. \\end{proposition}","line":2134,"page":60,"defence":[3]},"new":{"title":"Границы irr через M₁","short":"П 2.1.2","num":"2.1.2","page":"12","chapter":2,"line":320,"label":"propzagreb","statement":"\\begin{proposition}~\\label{propzagreb} Для каждого дерева $\\TT$ с $n\\ge 3$ вершинами и максимальной степенью $\\Delta$ \\begin{equation}~\\label{eqqq01propzagreb} M_1(\\TT)-4(n-1)+2\\Delta\\ \\le\\ \\operatorname{irr}(\\TT)\\ \\le\\ M_1(\\TT)-2(n-1). \\end{equation} Равенство справа достигается в точности на звезде $\\mathcal S_n$. Равенство слева достигается тогда и только тогда, когда существует корень степени $\\Delta$, от которого степени не возрастают вдоль каждого простого пути. \\end{proposition}","proof":"Положим $H=\\sum_{uv\\in E(T)}\\min(d(u),d(v))$. Из $|p-q|=p+q-2\\min(p,q)$ следует $\\operatorname{irr}=M_1-2H$. Каждое из $n-1$ рёбер даёт в $H$ не менее единицы. Равенство требует висячего конца на каждом ребре. Две невисячие вершины тогда невозможны, поскольку внутренние вершины пути между ними также невисячие. Получаем звезду. Укореним дерево в вершине $r$ степени $\\Delta$. Каждая некорневая вершина $v$ является дочерней ровно для одного ребра, поэтому $H\\le\\sum_{v\\ne r}d(v)=2(n-1)-\\Delta$. Равенство в сумме равносильно $d(v)\\le d(\\mathrm{parent}(v))$ на каждом ребре. Обе оценки и оба критерия следуют подстановкой в тождество.","defence":[3],"kind":"proposition","revision":"Для нижней границы выписан необходимый и достаточный критерий монотонности от корня максимальной степени."}},"prozagrebAlbertsonn1":{"old":{"short":"П 2.4.3","title":"irr при равных внутренних степенях","chapter":2,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{proposition}\\label{prozagrebAlbertsonn1} Пусть $\\TT$ — гусеничное дерево с хребтом $v_1\\cdots v_k$, $k\\ge3$, и степенями хребта $d_i=\\deg(v_i)$, такими что $d_1 \\ge\\ d_2=\\dots=d_{k-1}\\ge\\ d_k=\\delta\\ \\ge 2$, где $d_1=\\Delta$, $d_{k-1}=\\lambda$, $d_k=\\delta\\geqslant$ и $\\lambda=\\tfrac{\\Delta+\\delta}{2}\\in\\mathbb Z$. Тогда \\begin{align} \\operatorname{irr}(\\TT)&=(\\Delta-1)^2+(\\delta-1)^2+(k-2)(\\lambda-1)(\\lambda-2)+\\Delta-\\delta, \\label{eqqq01prozagrebAlbertsonn1}\\\\ \\operatorname{irr}(\\TT)&=M_1(\\TT)-2\\sum_{i=2}^{k-1}d_i-2\\delta-2(n-k). \\label{eqqq02prozagrebAlbertsonn1} \\end{align} \\end{proposition}","line":2169,"page":61,"defence":[]},"new":{"title":"irr при равных внутренних степенях","short":"П 2.4.2","num":"2.4.2","page":"18","chapter":2,"line":583,"label":"prozagrebAlbertsonn1","statement":"\\begin{proposition}\\label{prozagrebAlbertsonn1} Пусть $\\TT$ — гусеничное дерево с хребтом $v_1\\cdots v_k$, $k\\ge3$, и степенями хребта $d_i=\\deg(v_i)$, такими что $d_1 \\ge\\ d_2=\\dots=d_{k-1}\\ge\\ d_k=\\delta\\ \\ge 2$, где $d_1=\\Delta$, $d_{k-1}=\\lambda$, $d_k=\\delta\\geqslant$ и $\\lambda=\\tfrac{\\Delta+\\delta}{2}\\in\\mathbb Z$. Тогда \\begin{align} \\operatorname{irr}(\\TT)&=(\\Delta-1)^2+(\\delta-1)^2+(k-2)(\\lambda-1)(\\lambda-2)+\\Delta-\\delta, \\label{eqqq01prozagrebAlbertsonn1}\\\\ \\operatorname{irr}(\\TT)&=M_1(\\TT)-2\\sum_{i=2}^{k-1}d_i-2\\delta-2(n-k). \\label{eqqq02prozagrebAlbertsonn1} \\end{align} \\end{proposition}","proof":"При степенях $(\\Delta,\\lambda,\\ldots,\\lambda,\\delta)$ соседние разности суммируются в $\\Delta-\\delta$. Первая формула следует из предложения~\\ref{Caterpillar}. Минимумы на внутренних рёбрах суммируются в $\\sum_{i=2}^k d_i$, на висячих --- в $n-k$. Тождество $\\irr=M_1-2\\sum\\min(d_u,d_v)$ даёт вторую формулу.","defence":[],"kind":"proposition","revision":""}},"relationn1pro":{"old":{"short":"П 3.3.5","title":"Зигзаг не увеличивает σ","chapter":3,"severity":1,"note":"Нужно явно понимать d₁≤…≤dₖ как отсортированное мультимножество; без сортировки предложенная перестановка не обязана уменьшать σ. Численное утверждение в отсортированном варианте следует из Т 3.1.1.","statement":"\\begin{proposition}\\label{relationn1pro} Пусть $\\TT$ --- гусеничное дерево со степенями хребта $\\mathscr D=(d_1,\\dots,d_k)$, и пусть $\\TT_{\\mathscr D}$ --- гусеничное дерево с теми же степенями хребта, расположенными в порядке $d_1,d_3,d_5,\\dots,d_6,d_4,d_2$. Согласно теореме~\\ref{thmsigmin}, $\\sigma(\\TT_{\\mathscr D})\\le\\sigma(\\TT)$. \\end{proposition}","line":3190,"page":89,"defence":[4]},"new":{"title":"Зигзаг не увеличивает σ","short":"П 3.3.5","num":"3.3.5","page":"30","chapter":3,"line":1017,"label":"relationn1pro","statement":"\\begin{proposition}\\label{relationn1pro} Пусть $2\\le d_1\\le\\cdots\\le d_k$, $k\\ge2$. Если $\\TT$ --- произвольное гусеничное дерево с этим мультимножеством степеней хребта, а $\\TT_{\\mathscr D}$ имеет порядок $d_1,d_3,d_5,\\dots,d_6,d_4,d_2$, то $\\sigma(\\TT_{\\mathscr D})\\le\\sigma(\\TT)$. \\end{proposition}","proof":"Указанный порядок достигает нижней оценки теоремы~\\ref{thmsigmin001}. Это даёт требуемое неравенство без предположения о единственности.","defence":[4],"kind":"proposition","revision":""}},"remarksec3ch301":{"old":{"short":"З 2.3.1","title":"Монотонный порядок степеней","chapter":2,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{remark}\\label{remarksec3ch301} Для неубывающего случая предложение~\\ref{Caterpillar} даёт \\begin{equation}~\\label{eqqq01remarksec3ch301} \\irr(\\TT)=(d_1-1)^2+(d_k-1)^2+\\sum_{i=2}^{k-1}(d_i-1)(d_i-2)+d_k-d_1. \\end{equation} \\end{remark}","line":1818,"page":58,"defence":[]},"new":{"title":"Монотонный порядок степеней","short":"З 2.3.1","num":"2.3.1","page":"17","chapter":2,"line":522,"label":"remarksec3ch301","statement":"\\begin{remark}\\label{remarksec3ch301} Для неубывающего случая предложение~\\ref{Caterpillar} даёт \\begin{equation}~\\label{eqqq01remarksec3ch301} \\irr(\\TT)=(d_1-1)^2+(d_k-1)^2+\\sum_{i=2}^{k-1}(d_i-1)(d_i-2)+d_k-d_1. \\end{equation} \\end{remark}","proof":"Для неубывающего порядка сумма абсолютных разностей в предложении~\\ref{Caterpillar} телескопируется.","defence":[],"kind":"remark","revision":""}},"remhy1":{"old":{"short":"З 2.2.1","title":"Замечание о максимальном порядке","chapter":2,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{remark}~\\label{remhy1} Пусть $s_1<\\dots<s_k$ и рассмотрим хребет $(s_{k-1},s_2,s_3,\\dots,s_{k-2},s_1,s_k)$ с порядком $d_n>d_1>d_{n-2}>\\dots>d_3>d_2>d_{n-1}$. По теореме~\\ref{thmchar007} он является максимизатором при $3\\le k\\le 6$. Тогда $s_2,s_3\\in L$ смежны. \\end{remark}","line":1622,"page":51,"defence":[]},"new":{"title":"Соседство верхних и нижних рангов","short":"З 2.2.1","num":"2.2.1","page":"15","chapter":2,"line":461,"label":"remhy1","statement":"\\begin{remark}\\label{remhy1} Если две последовательные вершины расширенного цикла входят в верхнюю половину при попарно различных степенях, верхняя граница не достигается. То же справедливо для двух элементов нижней половины, соседство которых сохраняется после исключения медианы. \\end{remark}","proof":"Это следует из характеризации чередования в теореме~\\ref{thmchar007}.","defence":[],"kind":"remark","revision":""}},"sharpbound":{"old":{"short":"Т 5.3.1","title":"Граница σ и случай равенства","chapter":5,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}~\\label{sharpbound} Пусть $\\mathcal{BG}$ --- двудольный граф с долями размеров $n_1,n_2$ и по крайней мере одним ребром. Тогда $\\sigma(\\mathcal{BG})<n_1^4+n_2^4$. Более точно, $\\sigma(\\mathcal{BG})\\le n_1n_2\\bigl(\\max\\{n_1,n_2\\}-1\\bigr)^2$, причём равенство имеет место тогда и только тогда, когда $\\mathcal{BG}\\cong K_{1,n}$. \\end{theorem}","line":4878,"page":134,"defence":[6]},"new":{"title":"Граница σ и случай равенства","short":"Т 5.3.1","num":"5.3.1","page":"51","chapter":5,"line":1950,"label":"sharpbound","statement":"\\begin{theorem}~\\label{sharpbound} Пусть $\\mathcal{BG}$ --- простой двудольный граф с долями размеров $n_1,n_2$ и по крайней мере одним ребром. Тогда $\\sigma(\\mathcal{BG})<n_1^4+n_2^4$. Более точно, $\\sigma(\\mathcal{BG})\\le n_1n_2\\bigl(\\max\\{n_1,n_2\\}-1\\bigr)^2$, причём равенство имеет место тогда и только тогда, когда $\\mathcal{BG}\\cong K_{1,\\max(n_1,n_2)}$. \\end{theorem}","proof":"Аргумент предложения~\\ref{boundbipartitegraph} использует только положительность степеней концов рёбер. Поэтому он даёт ту же верхнюю границу и тот же критерий равенства для графа с изолированными вершинами при $m\\ge1$. Если $M=\\max(n_1,n_2)$, то $n_1n_2(M-1)^2<M^4\\le n_1^4+n_2^4$.","defence":[6],"kind":"theorem","revision":""}},"slope_definition":{"old":{"short":"Ф 6.8","title":"Наклон объявлен равным 1/(1+α)","chapter":6,"severity":3,"note":"Подставлена α вместо χ=α/b; противоречит Т 6.2.1.","statement":"","line":null,"page":149,"defence":[]},"new":null},"theorem_5.2.1":{"old":{"short":"Т 5.2.1","title":"Минимум M₁ двудольного графа","chapter":5,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{theorem}[Минимум первого индекса Загреба~\\cite{ChengTCEZhang, Liu2019Wang}] Пусть $G$ --- двудольный $(n,m)$-граф при $n \\geq 2$ и $0 \\leq m \\leq \\lfloor n/2 \\rfloor \\lfloor n/2 \\rfloor$. Тогда минимальное значение первого индекса Загреба задаётся формулой \\[ \\left\\{ \\begin{array}{ll} (4m - n - nt)t + 2m & \\text{если $n$ чётно; или если $n$ нечётно}\\\\ & \\text{и $nt + t \\leq 2m \\leq nt + n - t - 1$}, \\\\ (4m + 1 - nt)t & \\text{если $n$ нечётно и $nt \\leq 2m < nt + t$}, \\\\ (4m - n + 1 - nt)(t + 1) & \\text{если $n$ нечётно и $nt + n - t + 1 \\leq 2m \\leq nt + n$,} \\end{array} \\right. \\] где $t = \\lfloor 2m/n \\rfloor$. \\end{theorem}","line":4677,"page":128,"defence":[]},"new":{"title":"Минимум M₁ при заданных долях и числе рёбер","short":"Т 5.2.1","num":"5.2.1","page":"48","chapter":5,"line":1868,"label":"theorem_5.2.1","statement":"\\begin{theorem}\\label{theorem_5.2.1} Пусть $0\\le m\\le pq$ и $B(s,m)=(s-r)t^2+r(t+1)^2$, где $m=st+r$, $0\\le r<s$. Минимум $M_1$ по простым двудольным графам с долями $p,q$ и $m$ рёбрами равен $B(p,m)+B(q,m)$. При фиксированных $n=p+q,m$ берётся минимум этого выражения по всем допустимым парам $p,q$. \\end{theorem}","proof":"Для $s$ неотрицательных целых с суммой $m$ минимум суммы квадратов достигается при разностях не более единицы: перенос единицы с большего значения на меньшее при разности хотя бы два строго уменьшает сумму. Получаем две нижние оценки для строк и столбцов. Реализуем их одновременно. Строкам зададим длины $\\lfloor m/p\\rfloor$ или $\\lceil m/p\\rceil$ с нужной суммой. Заполняем строки друг за другом, располагая единицы по столбцам циклически и продолжая счёт с места остановки предыдущей строки. Длина строки не больше $q$, поэтому внутри строки повторений нет. Все $m$ занятых позиций обходят столбцы по циклу, так что суммы столбцов также различаются не более чем на единицу.","defence":[],"kind":"theorem","revision":"Минимум M₁ записан с учётом целочисленности. Дана одновременная реализация почти равных сумм строк и столбцов."}},"thm001global":{"old":{"short":"Т 3.4.5","title":"Глобальная классификация кандидатов","chapter":3,"severity":2,"note":"Опирается на ложную Л 3.4.7. Внутренний случай и границы не объединены; при λ>1 условие внутренней вершины невозможно. Прямой контрпример именно внутренней версии здесь не утверждается.","statement":"\\begin{theorem}[Завершение теоремы~\\ref{Thm03worksep}]\\label{thm001global} Пусть $n=4k+r\\geqslant8$, $r\\in\\{1,2,3\\}$, $\\lambda\\in[0,2)$, и пусть $s^\\ast_{n,\\lambda}$ лежит во внутренности соответствующих допустимых диапазонов. Глобальный максимизатор $\\sig\\lambda$ среди всех графичных химических последовательностей степеней порядка $n$ обладает следующим: \\begin{itemize} \\item При $r=2$ --- $(\\delta,t)=(1,-1)$ или $(-1,1)$, где $s=\\Round_{\\mathrm{odd}}(s^\\ast_{n,\\lambda})$, --- безусловно, для каждого $\\lambda\\in[0,2)$ (предложение~\\ref{prop:r2}); \\item При $r=1,3$ --- $(\\delta,t)=(0,\\pm1)$, где $s=\\Round_{\\mathrm{odd}}(s^\\ast_{n,\\lambda})$, если $\\Delta_r(\\lambda,n)>0$; в противном случае $(\\delta,t)=(\\mp1,0)$, где $s=\\Round_{\\mathrm{even}}(s^\\ast_{n,\\lambda})$ (предложение~\\ref{prop001r13}). В частности, это $(0,\\pm1)$ безусловно, когда $\\lambda>1$. \\end{itemize} Никакая другая допустимая $(\\delta,t)$ не может быть оптимальной в силу леммы~\\ref{lem001tail}. \\end{theorem}","line":4013,"page":109,"defence":[]},"new":{"title":"Глобальная классификация кандидатов","short":"Т 3.4.5","num":"3.4.5","page":"41","chapter":3,"line":1655,"label":"thm001global","statement":"\\begin{theorem}[Точная конечная редукция]\\label{thm001global} Пусть $n\\ge8$, $r=n\\bmod4$ и $\\lambda\\in[0,1]$. Положим \\[ \\mathcal C_r=\\{(\\delta,t)\\in\\mathbb Z^2: \\delta-t\\equiv-r\\pmod4,\\quad\\delta^2+t^2<20\\}. \\] Глобальный максимум $\\sig\\lambda$ среди всех графичных последовательностей порядка $n$ равен \\begin{equation}\\label{repair:global} \\max_{\\substack{(\\delta,t)\\in\\mathcal C_r\\\\I_n(\\delta,t)\\ne\\varnothing}} \\left[g_\\lambda(\\delta,t)+f_{n,\\lambda}(s^*) -|A_\\lambda|\\operatorname{dist}(s^*,I_n(\\delta,t))^2\\right]. \\end{equation} Для максимизации среди последовательностей со связной реализацией в максимум дополнительно включаются только пары $t\\le n+4-3\\delta$. Все максимизирующие последовательности получаются восстановлением~\\eqref{eqq01recover} из всех пар, достигающих~\\eqref{repair:global}, и всех ближайших допустимых $s$. Числа пар в $\\mathcal C_0,\\mathcal C_1,\\mathcal C_2,\\mathcal C_3$ равны соответственно $17,16,12,16$; они не зависят от $n$. \\end{theorem}","proof":"Лемма~\\ref{lem001tail} исключает все пары вне $\\mathcal C_r$. Для каждой оставшейся пары лемма~\\ref{lem003exact} даёт точное значение лучшей ветви и все случаи равенства, а теорема~\\ref{Thm02worksep} обеспечивает точные условия допустимости и связности. Множества $\\mathcal C_r$ подсчитываются перебором $-4\\le\\delta,t\\le4$ с указанными двумя условиями.","defence":[],"kind":"theorem","revision":"Ограничение на число ветвей доказано при 0 ≤ λ ≤ 1. При других значениях λ применим общий конечный алгоритм."}},"thm001lambda2":{"old":{"short":"Т 3.4.4","title":"Максимум в семействе при λ=2","chapter":3,"severity":0,"note":"Сформулированный максимум по фиксированному семейству при λ=2 следует из положительности линейного коэффициента. Это не глобальная классификация.","statement":"\\begin{theorem}[Вырожденный случай $\\lambda=2$]\\label{thm001lambda2} Для $n=4k+r\\geqslant8$, где $r\\in\\{1,2,3\\}$, при $\\lambda=2$ максимизатор $\\sig{2}$ в рамках семейства $\\mathscr S_a^{(r)}$ есть $\\mathscr S_k^{(r)}$ для каждого $r\\in\\{1,2,3\\}$. \\end{theorem}","line":3989,"page":108,"defence":[]},"new":{"title":"Максимум в семействе при λ=2","short":"Т 3.4.4","num":"3.4.4","page":"41","chapter":3,"line":1631,"label":"thm001lambda2","statement":"\\begin{theorem}[Вырожденный случай $\\lambda=2$]\\label{thm001lambda2} Для $n=4k+r\\geqslant8$, где $r\\in\\{1,2,3\\}$, при $\\lambda=2$ максимизатор $\\sig{2}$ в рамках семейства $\\mathscr S_a^{(r)}$ есть $\\mathscr S_k^{(r)}$ для каждого $r\\in\\{1,2,3\\}$. \\end{theorem}","proof":"Положим $\\lambda=2$; $D(2)=2^3-3^2+1=0$ по \\eqref{eqq01Dsign}, так что \\eqref{eqq01quadraticgeneral} вырождается в аффинную функцию \\[ \\sig{2}(\\mathscr S_x^{(r)}) = B_r(2)\\,x + C_r(2), \\qquad x\\in[0,k]. \\] Теперь, подставляя $\\lambda=2$ в формулы для $B_r(\\lambda)$ из доказательства теоремы~\\ref{Thm03worksep}, получаем \\begin{align*} & B_1(2)=(2k+1)(3^2-1)-2^2=16k+4,\\\\ & B_2(2)=(2k+1)(3^2-1)=16k+8, \\\\ & B_3(2)=2(k+1)(3^2-1)-2^2=16k+12, \\end{align*} каждая строго положительна при каждом $k\\geqslant2$. Следовательно, $\\sig{2}(\\mathscr S_x^{(r)})$ строго возрастает по $x$ на $[0,k]$ для каждого $r\\in\\{1,2,3\\}$. Таким образом, её максимум достигается в правом концевом пункте $x=k$, то есть на $\\mathscr S_k^{(r)}$.","defence":[],"kind":"theorem","revision":""}},"thm01alphacf":{"old":{"short":"Т 6.3.1","title":"Цепная дробь α","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}~\\label{thm01alphacf} Для всех целых $a,b\\geqslant 1$ \\begin{equation}~\\label{eq01alphacf} \\AlphA (a,b) \\;=\\; [\\overline{ab,\\,1}]. \\end{equation} \\end{theorem}","line":5606,"page":150,"defence":[]},"new":{"title":"Цепная дробь α","short":"Т 6.3.1","num":"6.3.1","page":"57","chapter":6,"line":2218,"label":"thm01alphacf","statement":"\\begin{theorem}~\\label{thm01alphacf} Для всех целых $a,b\\geqslant 1$ \\begin{equation}~\\label{eq01alphacf} \\alpha (a,b) \\;=\\; [\\overline{ab,\\,1}]. \\end{equation} \\end{theorem}","proof":"Число $x=[\\overline{ab,1}]$ удовлетворяет $x=ab+x/(1+x)$, то есть $x^2-abx-ab=0$. Единственный положительный корень равен $\\alpha$ по~\\eqref{eqq1AlphAadef}.","defence":[],"kind":"theorem","revision":""}},"thm01centralpalindrome":{"old":{"short":"Т 6.2.5","title":"Палиндромность усечённых слов","chapter":6,"severity":2,"note":"Палиндромность поддержана классической теорией (способ 1). Во способе 2 потерян конечный множитель sₖ₋₂; он не является независимым доказательством.","statement":"\\begin{theorem}~\\label{thm01centralpalindrome} Для любых $a,b\\geqslant 1$ и любого $n\\geqslant 2$ слово $\\bigl(\\FD^{(a,b)}_n\\bigr)^{-}$ является палиндромом. \\end{theorem}","line":5506,"page":147,"defence":[7]},"new":{"title":"Палиндромность усечённых слов","short":"Т 6.2.6","num":"6.2.6","page":"56","chapter":6,"line":2189,"label":"thm01centralpalindrome","statement":"\\begin{theorem}~\\label{thm01centralpalindrome} Для любых $a,b\\geqslant 1$ и любого $n\\geqslant 2$ слово $\\bigl(\\FD^{(a,b)}_n\\bigr)^{-}$ является палиндромом. \\end{theorem}","proof":"Пишем $s_j=F_{j+1}$ и $C_j=s_j^-$ для $j\\ge1$. Произведения $s_j s_{j-1}$ и $s_{j-1}s_j$ совпадают до последних двух букв, а эти две буквы переставлены. При $j=0$ это $01$ и $10$. Шаг индукции получается приписыванием слева $s_{j-1}^{d_j}$ к двум произведениям предыдущего шага в обратном порядке. Последние пары у $s_1,s_2$ равны $01,10$, и далее чередуются, так как $s_j$ оканчивается на $s_{j-2}$ при $j\\ge3$. Теперь $C_1=0^{a-1}$ и $C_2=(0^a1)^{b-1}0^a$ палиндромны. При $j\\ge3$ запишем $s_{j-1}=Pxy$, $s_{j-2}=Qyx$, где $P,Q$ палиндромны по индукции. Удалив последние две буквы в установленном тождестве префиксов, получаем $PxyQ=QyxP$. Значит, $C_j=(Pxy)^{d_j}Q=Q(yxP)^{d_j}$, а правая часть есть обращение левой. Полученные палиндромы являются префиксами предельного слова и имеют неограниченные длины.","defence":[7],"kind":"theorem","revision":""}},"thm01desub":{"old":{"short":"Т 6.1.1","title":"Морфизм связывает два семейства","chapter":6,"severity":0,"note":"Конечное тождество и его предельная версия верны по индукции. Это морфизм переменной длины, а не преобразование из Г 6.0.1.","statement":"\\begin{theorem}~\\label{thm01desub} Для всех $a,b\\geqslant 1$ и всех $n\\geqslant 0$ \\[ \\sigma_a\\bigl(\\FD^{(b,a)}_n\\bigr) = \\FD^{(a,b)}_{n+1}, \\] тогда и только тогда, когда $\\sigma_a\\bigl(\\FD^{(b,a)}\\bigr) = \\FD^{(a,b)}$ при больших $n$. \\end{theorem}","line":5201,"page":141,"defence":[7]},"new":{"title":"Морфизм связывает два семейства","short":"Т 6.1.1","num":"6.1.1","page":"53","chapter":6,"line":2025,"label":"thm01desub","statement":"\\begin{theorem}\\label{thm01desub} Для целых $a,b\\ge1$ и всех $n\\ge0$ выполняется \\[ \\sigma_a(\\FD^{(b,a)}_n)=\\FD^{(a,b)}_{n+1},\\qquad \\FD^{(a,b)}=\\sigma_a(\\FD^{(b,a)}). \\] \\end{theorem}","proof":"При $n=0,1$ равенства следуют из $\\sigma_a(1)=0$, $\\sigma_a(0)=0^a1$. В рекурсии~\\eqref{eqq01biperiodicrecurrence} показатель на шаге $n$ для пары $(b,a)$ равен показателю на шаге $n+1$ для пары $(a,b)$. Применяем морфизм к конкатенации в рекурсии и используем индукцию по $n$. Поскольку морфизм нестирающий, переход к пределу вложенных префиксов даёт равенство бесконечных слов.","defence":[7],"kind":"theorem","revision":""}},"thm01globalmin":{"old":{"short":"Т 6.3.3","title":"Глобальный минимум функции Ind","chapter":6,"severity":0,"note":"Алгебраическое утверждение о явно определённой функции Ind согласовано. Равенство Ind=CE в работе не доказано; этот цвет не подтверждает интерпретацию как критического показателя.","statement":"\\begin{theorem}~\\label{thm01globalmin} Среди всех $\\FD^{(a,b)}$ с целыми $a,b\\geqslant 1$ величина $\\operatorname{Ind}(\\FD^{(a,b)})$ достигает своего глобального минимума единственным образом при $(a,b)=(1,1)$, со значением $2+\\varphi$. \\end{theorem}","line":5730,"page":152,"defence":[]},"new":{"title":"Глобальный минимум функции Ind","short":"Т 6.3.4","num":"6.3.4","page":"59","chapter":6,"line":2291,"label":"thm01globalmin","statement":"\\begin{theorem}~\\label{thm01globalmin} Среди всех $\\FD^{(a,b)}$ с целыми $a,b\\geqslant 1$ величина $\\operatorname{Ind}(\\FD^{(a,b)})$ достигает своего глобального минимума единственным образом при $(a,b)=(1,1)$, со значением $2+\\varphi$. \\end{theorem}","proof":"При фиксированном $M=\\max(a,b)$ по лемме~\\ref{lem01lockstructure} наименьшее значение получается при $\\min(a,b)=M$. На диагонали значение строго возрастает по лемме~\\ref{lem03diagonalincreasing}. Поэтому единственная пара параметров, достигающая минимума, есть $(1,1)$. При ней $\\alpha=\\varphi=(1+\\sqrt5)/2$, и теорема~\\ref{ind_ce} даёт $2+\\varphi$.","defence":[],"kind":"theorem","revision":""}},"thm01return0":{"old":{"short":"Т 6.2.3","title":"Возвратные слова нуля","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}~\\label{thm01return0} Для любых $a,b\\geqslant 1$ возвратными словами буквы $0$ в $\\FD^{(a,b)}$ являются в точности $\\{\\,0,\\ 01\\,\\}.$ \\end{theorem}","line":5416,"page":146,"defence":[7]},"new":{"title":"Возвратные слова нуля","short":"Т 6.2.4","num":"6.2.4","page":"56","chapter":6,"line":2164,"label":"thm01return0","statement":"\\begin{theorem}~\\label{thm01return0} Для любых $a,b\\geqslant 1$ возвратными словами буквы $0$ в $\\FD^{(a,b)}$ являются в точности $\\{\\,0,\\ 01\\,\\}.$ \\end{theorem}","proof":"По теореме~\\ref{thm01desub} слово разбито на блоки $0^a1$ и $0$. Между последовательными нулями находится не более одной единицы. Последний нуль длинного блока даёт возврат $01$, а короткий блок вместе с первым нулём следующего даёт возврат $0$. Оба типа блоков встречаются по теореме~\\ref{thm02freqduality} для пары $(b,a)$.","defence":[7],"kind":"theorem","revision":""}},"thm01slopecf":{"old":{"short":"Т 6.3.2","title":"Наклон зависит только от ab","chapter":6,"severity":3,"note":"Для семейства F₀=1,F₁=0 наклон b/(α+b), а не 1/(1+α). При (1,2) ошибочная формула даёт 0.26795 вместо 0.42265.","statement":"\\begin{theorem}~\\label{thm01slopecf} Для всех целых $a,b\\geqslant 1$ наклон бипериодического слова Фибоначчи $\\FD^{(a,b)}$ имеет разложение в цепную дробь \\begin{equation}~\\label{eqq2slopecf} \\theta^{(a,b)} \\;=\\; \\bigl[\\,0;\\; ab+1,\\; \\overline{1,\\,ab}\\,\\bigr]. \\end{equation} \\end{theorem}","line":5628,"page":150,"defence":[]},"new":{"title":"Наклон зависит только от ab","short":"Т 6.3.2","num":"6.3.2","page":"58","chapter":6,"line":2228,"label":"thm01slopecf","statement":"\\begin{theorem}\\label{thm01slopecf} Наклон слова для рекурсии~\\eqref{eqq01biperiodicrecurrence} равен \\begin{equation}\\label{eqq2slopecf} \\theta^{(a,b)}=[0;a+1,\\overline{b,a}]=b/(\\alpha+b). \\end{equation} \\end{theorem}","proof":"Это следует из отождествления со стандартной последовательностью в следствии~\\ref{cor01sturmian} и равенства $\\alpha=b[\\overline{a,b}]$.","defence":[],"kind":"theorem","revision":""}},"thm01trivialinvariants":{"old":{"short":"Т 6.2.2","title":"Баланс 1 и абелева сложность 2","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}~\\label{thm01trivialinvariants} Для любых $a,b\\geqslant 1$ слово $\\FD^{(a,b)}$ является $1$-сбалансированным, где $B(n)\\equiv1$; а его абелева сложность равна $\\mathcal{AC}_{\\FD^{(a,b)}}(n)\\equiv2$ для всех $n\\geqslant 1$. \\end{theorem}","line":5391,"page":145,"defence":[]},"new":{"title":"Баланс 1 и абелева сложность 2","short":"Т 6.2.2","num":"6.2.2","page":"55","chapter":6,"line":2144,"label":"thm01trivialinvariants","statement":"\\begin{theorem}\\label{thm01trivialinvariants} Для всех $a,b\\ge1$ и $L\\ge1$ имеем $B(L)=1$ и $\\mathcal{AC}(L)=2$. \\end{theorem}","proof":"По следствию~\\ref{cor01sturmian} число единиц в факторе длины $L$, начинающемся в позиции $i$, есть $\\lfloor(i+L+1)t\\rfloor-\\lfloor(i+1)t\\rfloor$. Оно равно либо $\\lfloor Lt\\rfloor$, либо $\\lceil Lt\\rceil$. Обе величины встречаются: дробные части $(i+1)t$ плотны в $[0,1]$ для иррационального $t$, а $Lt$ не целое. Число нулей однозначно определяется числом единиц.","defence":[],"kind":"theorem","revision":""}},"thm01vuillon":{"old":{"short":"Т 6.0.1","title":"Характеризация Вуйона","chapter":6,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{theorem}[Вуйон~\\cite{Vuillon2001}] \\label{thm01vuillon} Апериодическое двоичное слово $w$ является словом Штурма тогда и только тогда, когда каждый $u\\in\\mathcal{L}(w)$ имеет ровно два возвратных слова в $w$. \\end{theorem}","line":5071,"page":138,"defence":[]},"new":{"title":"Характеризация Вуйона","short":"Т 6.2.3","num":"6.2.3","page":"56","chapter":6,"line":2158,"label":"thm01vuillon","statement":"\\begin{theorem}[Вуйон~\\cite{Vuillon2001}] \\label{thm01vuillon} Апериодическое двоичное слово $w$ является словом Штурма тогда и только тогда, когда каждый непустой фактор $u\\in\\mathcal{L}(w)$ имеет ровно два возвратных слова в $w$. \\end{theorem}","proof":"","defence":[],"kind":"theorem","revision":""}},"thm02freqduality":{"old":{"short":"Т 6.2.1","title":"Исправленные частоты b/(α+b)","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}~\\label{thm02freqduality} Для всех $a,b\\geqslant 1$ частоты букв слова $f^{(a,b)}$ равны \\begin{equation}~\\label{eq01freqcorrected} \\operatorname{freq}_1\\bigl(\\FD^{(a,b)}\\bigr)=\\frac{b}{\\alpha+b}, \\qquad \\operatorname{freq}_0\\bigl(\\FD^{(a,b)}\\bigr)=\\frac{\\alpha}{\\alpha+b}. \\end{equation} \\end{theorem}","line":5265,"page":143,"defence":[7]},"new":{"title":"Частоты букв при фиксированных начальных словах","short":"Т 6.2.1","num":"6.2.1","page":"54","chapter":6,"line":2063,"label":"thm02freqduality","statement":"\\begin{theorem}~\\label{thm02freqduality} Для всех $a,b\\geqslant 1$ частоты букв слова $f^{(a,b)}$ равны \\begin{equation}~\\label{eq01freqcorrected} \\operatorname{freq}_1\\bigl(\\FD^{(a,b)}\\bigr)=\\frac{b}{\\alpha+b}, \\qquad \\operatorname{freq}_0\\bigl(\\FD^{(a,b)}\\bigr)=\\frac{\\alpha}{\\alpha+b}. \\end{equation} \\end{theorem}","proof":"Согласно следствию~\\ref{cor01sturmian} частичные суммы букв механического слова равны $C(L)=\\lfloor(L+1)t\\rfloor$, где $t=[0;a+1,\\overline{b,a}]$. Отсюда $C(L)/L\\to t$ по всем длинам префиксов. Из предложения~\\ref{prop01AlphAacf} имеем $t=1/(1+\\chi)=b/(\\alpha+b)$. Для частоты нуля остаётся вычесть эту величину из единицы.","defence":[7],"kind":"theorem","revision":"При начальных словах 1, 0 частота единиц равна b/(α+b). Перестановка параметров учитывается формулой морфизма."}},"thm02return1":{"old":{"short":"Т 6.2.4","title":"Возвратные слова единицы","chapter":6,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}~\\label{thm02return1} Для любых $a,b\\geqslant 1$ возвратными словами буквы $1$ в $\\FD^{(a,b)}$ являются в точности $\\{\\,1\\,0^a,\\ 1\\,0^{a+1}\\,\\}.$ \\end{theorem}","line":5455,"page":146,"defence":[7]},"new":{"title":"Возвратные слова единицы","short":"Т 6.2.5","num":"6.2.5","page":"56","chapter":6,"line":2171,"label":"thm02return1","statement":"\\begin{theorem}~\\label{thm02return1} Для любых $a,b\\geqslant 1$ возвратными словами буквы $1$ в $\\FD^{(a,b)}$ являются в точности $\\{\\,1\\,0^a,\\ 1\\,0^{a+1}\\,\\}.$ \\end{theorem}","proof":"Единицы оканчивают длинные блоки морфизма теоремы~\\ref{thm01desub}. Согласно теореме~\\ref{thm01return0} для исходного слова с переставленными параметрами между двумя последовательными нулями встречается либо ноль, либо одна единица. Значит, между соответствующими длинными блоками стоит ноль или один короткий блок. От единицы до следующей единицы получаем $10^a$ или $10^{a+1}$, и оба возврата реализуются.","defence":[7],"kind":"theorem","revision":""}},"thm1sigmaindexbipartite01":{"old":{"short":"Т 5.2.3","title":"σ полного двудольного графа","chapter":5,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}[Секар и др.~\\cite{Sekar}]\\label{thm1sigmaindexbipartite01} Пусть $G = K_{m,n}$ --- полный двудольный граф. Тогда сигма-индекс равен \\[ \\sigma(K_{m,n}) = mn (n-m)^2. \\] \\end{theorem}","line":4780,"page":130,"defence":[]},"new":{"title":"σ полного двудольного графа","short":"Т 5.2.3","num":"5.2.3","page":"50","chapter":5,"line":1909,"label":"thm1sigmaindexbipartite01","statement":"\\begin{theorem}[Секар и др.~\\cite{Sekar}]\\label{thm1sigmaindexbipartite01} Пусть $G = K_{m,n}$ --- полный двудольный граф. Тогда сигма-индекс равен \\[ \\sigma(K_{m,n}) = mn (n-m)^2. \\] \\end{theorem}","proof":"У всех $mn$ рёбер разность степеней по модулю равна $|m-n|$. Подставляем в~\\eqref{bipmatrix}.","defence":[],"kind":"theorem","revision":""}},"thmSigman4":{"old":{"short":"Т 3.3.1","title":"irr ≤ σ ≤ (Δ−1)irr","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}\\label{thmSigman4} Для каждого дерева $\\TT$ порядка $n\\geq 3$ с максимальной степенью $\\Delta$ \\begin{equation}~\\label{eqqq01thmSigman4} \\irr(\\TT)\\;\\le\\;\\sigma(\\TT)\\;\\le\\;(\\Delta-1)\\,\\irr(\\TT), \\end{equation} \\end{theorem}","line":3042,"page":85,"defence":[]},"new":{"title":"irr ≤ σ ≤ (Δ−1)irr","short":"Т 3.3.2","num":"3.3.2","page":"28","chapter":3,"line":915,"label":"thmSigman4","statement":"\\begin{theorem}\\label{thmSigman4} Для дерева с $n\\ge3$ выполняется $\\irr(T)\\le\\sigma(T)\\le(\\Delta-1)\\irr(T)$. \\end{theorem}","proof":"Применим теорему~\\ref{thmrelationsialn1} с $\\delta=1$.","defence":[],"kind":"theorem","revision":""}},"thmalbertsonn5":{"old":{"short":"Т 2.4.1","title":"Нижняя граница irr через M₁","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}~\\label{thmalbertsonn5} Пусть $\\TT$ --- дерево порядка $n\\ge3$ с максимальной степенью $\\Delta$. Тогда \\begin{equation}\\label{eq0thmalbertsonn5} \\operatorname{irr}(\\TT)\\ \\ge\\ M_1(\\TT)-4(n-1)+2\\Delta , \\end{equation} \\end{theorem}","line":2211,"page":63,"defence":[3]},"new":{"title":"Нижняя граница irr через M₁","short":"Т 2.1.1","num":"2.1.1","page":"13","chapter":2,"line":356,"label":"thmalbertsonn5","statement":"\\begin{theorem}~\\label{thmalbertsonn5} Пусть $\\TT$ --- дерево порядка $n\\ge3$ с максимальной степенью $\\Delta$. Тогда \\begin{equation}\\label{eq0thmalbertsonn5} \\operatorname{irr}(\\TT)\\ \\ge\\ M_1(\\TT)-4(n-1)+2\\Delta , \\end{equation} \\end{theorem}","proof":"Это нижняя оценка предложения~\\ref{propzagreb}; равенство характеризуется невозрастанием степеней от корня максимальной степени.","defence":[3],"kind":"theorem","revision":""}},"thmalltrees":{"old":{"short":"Т 2.2.4","title":"Минимум irr по всем деревьям","chapter":2,"severity":-1,"note":"Отдельная содержательная оценка этого утверждения не зафиксирована. Серый цвет не означает корректность.","statement":"\\begin{theorem}\\label{thmalltrees} Для $k=|M|\\ge 2$\\ $\\operatorname{irr}_{\\min}(\\mathcal T_{\\ell}(M))=D(M)-2+2\\Delta$. Равенство выполняется тогда и только тогда, когда поддерево $S$, порождённое невисячими вершинами, имеет вершину $\\ell$ максимальной степени такую, что степени не возрастают вдоль любого пути в $S$, начинающегося в $\\ell$. \\end{theorem}","line":1713,"page":53,"defence":[]},"new":{"title":"Минимум irr по всем деревьям","short":"Т 2.3.1","num":"2.3.1","page":"17","chapter":2,"line":532,"label":"thmalltrees","statement":"\\begin{theorem}\\label{thmalltrees} Пусть $M$ --- мультимножество $k\\ge2$ степеней невисячих вершин и $\\Delta=\\max M$. Среди всех деревьев с этими степенями, включая реализации, в которых невисячие вершины не лежат на одном пути, минимум $\\irr$ равен $D(M)-2+2\\Delta$. Равенство выполняется в точности при невозрастании степеней на путях от некоторой вершины степени $\\Delta$. \\end{theorem}","proof":"При фиксированном $M$ величины $n$ и $M_1$ фиксированы по лемме~\\ref{lemleaves}. Подстановка $\\ell=2+\\sum_{d\\in M}(d-2)$ в нижнюю границу предложения~\\ref{propzagreb} даёт $D(M)-2+2\\Delta$. Отсортированная гусеница достигает этой величины по предложению~\\ref{propmono}. Условие равенства следует из предложения~\\ref{propzagreb}.","defence":[],"kind":"theorem","revision":""}},"thmchar007":{"old":{"short":"Т 2.2.3","title":"Все максимизаторы irr: разные степени","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}\\label{thmchar007} Пусть $M=\\{d_1,\\dots,d_k\\}$, $k\\ge2$, — множество попарно различных целых чисел $\\ge 2$. Пусть $n=k+1$, $h=\\lfloor n/2\\rfloor=\\lfloor (k+1)/2\\rfloor$, и упорядочим $M\\cup\\{0\\}$ как $w_1>w_2>\\dots>w_n=0$. Пусть $H=\\{w_1,\\dots,w_h\\}$ и $L=\\{w_{n-h+1},\\dots,w_n\\}$; заметим, что $0\\in L$. \\begin{itemize} \\item Если $k$ нечётно ($n=2h$), то $\\irr$ максимален тогда и только тогда, когда циклическая последовательность $(0,y_1,\\dots,y_k)$ чередуется между $L$ и $H$. \\item Если $k$ чётно ($n=2h+1$) и $m^{*}=w_{h+1}$ — медиана $M\\cup\\{0\\}$, то $\\irr$ максимален тогда и только тогда, когда после исключения $m^{*}$ циклическая последовательность чередуется между $L$ и $H$, а $m^{*}$ вставлен между соседом из $L$ и соседом из $H$. \\end{itemize} \\end{theorem}","line":1583,"page":50,"defence":[]},"new":{"title":"Все максимизаторы irr: разные степени","short":"Т 2.2.3","num":"2.2.3","page":"15","chapter":2,"line":450,"label":"thmchar007","statement":"\\begin{theorem}\\label{thmchar007} Пусть $M=\\{d_1,\\dots,d_k\\}$, $k\\ge2$, — множество попарно различных целых чисел $\\ge 2$. Пусть $n=k+1$, $h=\\lfloor n/2\\rfloor=\\lfloor (k+1)/2\\rfloor$, и упорядочим $M\\cup\\{0\\}$ как $w_1>w_2>\\dots>w_n=0$. Пусть $H=\\{w_1,\\dots,w_h\\}$ и $L=\\{w_{n-h+1},\\dots,w_n\\}$; заметим, что $0\\in L$. \\begin{itemize} \\item Если $k$ нечётно ($n=2h$), то $\\irr$ максимален тогда и только тогда, когда циклическая последовательность $(0,y_1,\\dots,y_k)$ чередуется между $L$ и $H$. \\item Если $k$ чётно ($n=2h+1$) и $m^{*}=w_{h+1}$ — медиана $M\\cup\\{0\\}$, то $\\irr$ максимален тогда и только тогда, когда после исключения $m^{*}$ циклическая последовательность чередуется между $L$ и $H$, а $m^{*}$ вставлен между соседом из $L$ и соседом из $H$. \\end{itemize} \\end{theorem}","proof":"Для цикла из доказательства теоремы~\\ref{thmext} коэффициент каждой вершины в вариации равен $-2,0$ или $2$. Число пиков равно числу впадин и не превосходит $h$. Поскольку все значения различны, замена $p<h$ на $p+1$ строго увеличивает разность сумм $p$ наибольших и $p$ наименьших чисел. Равенство требует ровно $h$ пиков, занимаемых верхней половиной, и $h$ впадин, занимаемых нижней. При чётном числе вершин отсюда следует чередование. При нечётном числе одна вершина остаётся с нулевым коэффициентом; это медиана, расположенная между меньшим и большим соседями. Обратно, каждый такой порядок даёт требуемый набор коэффициентов.","defence":[],"kind":"theorem","revision":""}},"thmext":{"old":{"short":"Т 2.2.2","title":"Минимум и максимум irr","chapter":2,"severity":1,"note":"Формулы подтверждены для отсортированных d₁≥…≥dₖ≥2; это условие нужно явно внести в формулировку.","statement":"\\begin{theorem}~\\label{thmext} Пусть $M=\\{d_1,\\dots,d_k\\}$, где $d_k\\geqslant 2$ и $k\\geqslant 2$, — мультимножество целых чисел с $\\Delta=\\max M$ и $h=\\lfloor (k+1)/2\\rfloor$. Тогда \\begin{align} &\\irr_{\\min}(\\TT)=\\sum_{i=1}^{k}(d_i-1)(d_i-2)-2+2\\Delta,~\\label{eqqq01thmext} \\\\ &\\irr_{\\max}(\\TT)=\\sum_{i=1}^{k}(d_i-1)(d_i-2)-2+2\\Bigl(\\sum_{i=1}^{h}d_i-\\sum_{i=k-h+2}^{k}d_i\\Bigr)~\\label{eqqq02thmext}. \\end{align} \\end{theorem}","line":1530,"page":47,"defence":[2]},"new":{"title":"Минимум и максимум irr","short":"Т 2.2.2","num":"2.2.2","page":"14","chapter":2,"line":420,"label":"thmext","statement":"\\begin{theorem}~\\label{thmext} Пусть $M=\\{d_1,\\dots,d_k\\}$, где $d_1\\ge\\cdots\\ge d_k\\ge2$, $k\\ge2$, $\\Delta=d_1$ и $h=\\lceil k/2\\rceil$. На классе $\\TT(M)$ всех гусеничных деревьев с этим мультимножеством степеней хребта имеем \\begin{align} \\irr_{\\min}(M)&=\\sum_{i=1}^k(d_i-1)(d_i-2)-2+2\\Delta, \\label{eqqq01thmext}\\\\ \\irr_{\\max}(M)&=\\sum_{i=1}^k(d_i-1)(d_i-2)-2 +2\\left(\\sum_{i=1}^h d_i-\\sum_{i=k-h+2}^k d_i\\right). \\label{eqqq02thmext} \\end{align} \\end{theorem}","proof":"Для порядка $y$ мультимножества $M$ положим $F(y)=y_1+y_k+\\sum_{i=1}^{k-1}|y_i-y_{i+1}|$. По лемме~\\ref{lemred0005}, $\\irr=\\sum_i(d_i-1)(d_i-2)-2+F(y)$. В цикле $(0,y_1,\\dots,y_k,0)$ две дуги от $0$ до $\\Delta$ имеют вариацию не менее $\\Delta$ каждая. Поэтому $F(y)\\ge2\\Delta$; неубывающий порядок даёт равенство. Верхняя оценка и её достижимость следуют из теоремы~\\ref{Thmcor01}. Для дальнейшего использования зафиксируем также тождество для этого цикла $Z$. Упорядочим помеченные вершины сначала по значению $z_v$, затем по их метке. Пусть $c_v$ равно числу меньших соседей минус число больших соседей; $P(Z)=\\{v:c_v=2\\}$ и $F(Z)=\\{v:c_v=-2\\}$. Тогда \\begin{equation}\\label{eqqq05thmext} F(y)=\\sum_{v\\in V(Z)}c_vz_v =2\\sum_{v\\in P(Z)}z_v-2\\sum_{v\\in F(Z)}z_v. \\end{equation} Равные значения не нарушают тождества, поскольку соответствующее ребро имеет нулевой вклад.","defence":[2],"kind":"theorem","revision":""}},"thmrelationsialn1":{"old":{"short":"Т 3.3.2","title":"Общие границы σ и член irr²/m","chapter":3,"severity":1,"note":"Член irr²/m требует Коши–Буняковского; этот шаг пропущен. Следует исключить m=0 (граф K₁).","statement":"\\begin{theorem}\\label{thmrelationsialn1} Пусть $G$ --- связный граф. Тогда \\begin{equation}\\label{eq1thmrelationsialn1} \\max\\Bigl\\{\\operatorname{irr}(G),\\ \\frac{\\operatorname{irr}(G)^2}{m}\\Bigr\\}\\ \\le\\ \\sigma(G)\\ \\le\\ (\\Delta-\\delta)\\operatorname{irr}(G). \\end{equation} \\end{theorem}","line":3101,"page":86,"defence":[]},"new":{"title":"Общие границы σ и член irr²/m","short":"Т 3.3.1","num":"3.3.1","page":"28","chapter":3,"line":905,"label":"thmrelationsialn1","statement":"\\begin{theorem}\\label{thmrelationsialn1} Пусть $G$ имеет $m\\ge1$ рёбер. Тогда \\begin{equation}\\label{eq1thmrelationsialn1} \\max\\{\\irr(G),\\irr(G)^2/m\\}\\le\\sigma(G)\\le(\\Delta-\\delta)\\irr(G). \\end{equation} \\end{theorem}","proof":"Положим $x_e=|d(u)-d(v)|$ для $e=uv$. Имеем $x_e\\le x_e^2\\le(\\Delta-\\delta)x_e$ ввиду целочисленности степеней. Дополнительно $(\\sum_e x_e)^2\\le m\\sum_e x_e^2$ по неравенству Коши. Суммирование даёт все три оценки.","defence":[],"kind":"theorem","revision":""}},"thmsigmin":{"old":{"short":"Т 3.1.1","title":"Точное значение минимума σ","chapter":3,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{theorem}~\\label{thmsigmin} Пусть $M=\\{d_1,\\dots,d_k\\}$ --- мультимножество целых чисел со степенями не менее 2, где $d_1\\leqslant d_2 \\leqslant \\dots \\leqslant d_k$. Минимум $\\sigma$ по всем гусеничным деревьям, степени хребта которых являются упорядочением $M$, равен \\begin{equation}~\\label{eqqq01thmsigmin} \\sigma_{\\min}(M)=\\sum_{i=1}^{k}(d_i-1)^2(d_i-2)+\\sum_{i=1}^{2}(d_i-1)^2+(d_k-d_{k-1})^2+\\sum_{j=1}^{k-2}(d_{j+2}-d_j)^2, \\end{equation} и достигается на порядке $(\\dots,d_{k-5},d_{k-3},d_{k-1},d_k,d_{k-2},d_{k-4},\\dots)$. \\end{theorem}","line":2551,"page":75,"defence":[4]},"new":{"title":"Точное значение минимума σ","short":"Т 3.1.2","num":"3.1.2","page":"22","chapter":3,"line":715,"label":"thmsigmin","statement":"\\begin{theorem}~\\label{thmsigmin} Пусть $M=\\{d_1,\\dots,d_k\\}$ --- мультимножество целых чисел со степенями не менее 2, где $d_1\\leqslant d_2 \\leqslant \\dots \\leqslant d_k$. Предполагается $k\\ge2$. Минимум $\\sigma$ по всем гусеничным деревьям, степени хребта которых являются упорядочением $M$, равен \\begin{equation}~\\label{eqqq01thmsigmin} \\sigma_{\\min}(M)=\\sum_{i=1}^{k}(d_i-1)^2(d_i-2)+\\sum_{i=1}^{2}(d_i-1)^2+(d_k-d_{k-1})^2+\\sum_{j=1}^{k-2}(d_{j+2}-d_j)^2, \\end{equation} и достигается при обходе нечётных индексов по возрастанию, а затем чётных по убыванию. \\end{theorem}","proof":"Положим $z_0=0$, $z_i=d_i-1$ и $g_j=z_{j+1}-z_j$ при $0\\le j<k$. Фактическая расстановка с добавленным нулём образует цикл $C$ на рангах $0,\\ldots,k$. При равных значениях выбираем различимые метки. Ребро $\\{u,v\\}$ покрывает промежуток $j$, если $\\min(u,v)\\le j<\\max(u,v)$. Пусть $N_C(j,l)$ считает рёбра, покрывающие одновременно $j,l$. Согласно формуле для хребта, переменная часть индекса равна \\begin{equation}\\label{eqqq02thmsigmin} Q(C)=\\sum_{\\{u,v\\}\\in E(C)}(z_u-z_v)^2 =\\sum_{j,l=0}^{k-1}g_jg_l N_C(j,l). \\end{equation} Любой нетривиальный разрез цикла пересекают как минимум два ребра, значит $N_C(j,j)\\ge2$. Удаление ранга $j+1$ оставляет связный путь. Тогда хотя бы одно ребро соединяет ранги $\\le j$ с рангами $\\ge j+2$, откуда $N_C(j,j+1)\\ge1$. В цикле из указанного порядка рёбра имеют вид $\\{i,i+2\\}$ при $0\\le i\\le k-2$, а также $\\{0,1\\}$ и $\\{k-1,k\\}$. Поэтому значения на диагонали равны двум, на соседних диагоналях --- единице, остальные равны нулю. Все $g_jg_l\\ge0$, и этот цикл минимизирует $Q$. Сумма квадратов по перечисленным рёбрам и постоянный вклад висячих рёбер дают заявленную формулу.","defence":[4],"kind":"theorem","revision":""}},"thmsigmin001":{"old":{"short":"Т 3.3.3","title":"Минимум σ: «только один порядок»","chapter":3,"severity":3,"note":"Значение минимума верно, но исключительность порядка неверна: (2,3,4,3,3) и (2,3,3,4,3) дают σmin=38 и не обращаются друг в друга.","statement":"\\begin{theorem}~\\label{thmsigmin001} Пусть $\\TT$ --- гусеничное дерево со степенями хребта $2\\le d_1\\le\\dots\\le d_k$, $k\\ge2$. Тогда \\begin{equation}~\\label{eqqq01thmsigmin001} \\begin{split} \\sigma(\\TT) \\ge & \\sum_{i=1}^{k}(d_i-1)^2(d_i-2) + (d_1-1)^2 + (d_2-1)^2 \\\\ & + (d_k-d_{k-1})^2 + \\sum_{j=1}^{k-2}(d_{j+2}-d_j)^2. \\end{split} \\end{equation} причём равенство имеет место тогда и только тогда, когда степени хребта расположены в порядке $d_1,d_3,d_5,\\dots,d_6,d_4,d_2$. \\end{theorem}","line":3120,"page":87,"defence":[4]},"new":{"title":"Все порядки, достигающие минимума σ","short":"Т 3.3.3","num":"3.3.3","page":"29","chapter":3,"line":964,"label":"thmsigmin001","statement":"\\begin{theorem}~\\label{thmsigmin001} Пусть $\\TT$ --- гусеничное дерево с мультимножеством степеней хребта $2\\le d_1\\le\\cdots\\le d_k$, $k\\ge2$; индексы $d_i$ здесь задают сортировку, а не фактический порядок вдоль хребта. Тогда \\begin{equation}\\label{eqqq01thmsigmin001} \\begin{split} \\sigma(\\TT)\\ge{}&\\sum_{i=1}^k(d_i-1)^2(d_i-2)+(d_1-1)^2+(d_2-1)^2\\\\ &+(d_k-d_{k-1})^2+\\sum_{j=1}^{k-2}(d_{j+2}-d_j)^2. \\end{split} \\end{equation} Равенство достигается, в частности, на порядке $d_1,d_3,d_5,\\dots,d_6,d_4,d_2$ и его обращении. Полная характеризация равенства следующая. Положим $z_0=0$, $z_i=d_i-1$, $g_j=z_{j+1}-z_j$ ($0\\le j<k$). Пометим повторяющиеся значения различными метками. Пусть $C$ --- цикл $(0,x_1,\\dots,x_k,0)$, где $x_i=d(v_i)-1$ в фактическом порядке хребта, и $N_C(j,l)$ --- число его рёбер, покрывающих оба промежутка между индексами $j,j+1$ и $l,l+1$. Равенство имеет место тогда и только тогда, когда одновременно: \\begin{enumerate} \\item $N_C(j,j)=2$ для всех $g_j>0$; \\item $N_C(j,j+1)=1$ для всех $g_jg_{j+1}>0$; \\item $N_C(j,l)=0$ для всех $l\\ge j+2$ с $g_jg_l>0$. \\end{enumerate} Критерий не зависит от нумерации равных значений. При повторениях другие порядки могут также давать равенство. \\end{theorem}","proof":"По формуле для $\\sigma$ через хребет имеем \\[ \\sigma(\\TT)=\\sum_{i=1}^k(d_i-1)^2(d_i-2)+Q(C),\\qquad Q(C)=\\sum_{uv\\in E(C)}(z_u-z_v)^2. \\] Каждое ребро охватывает набор последовательных промежутков, поэтому \\[ Q(C)=\\sum_{j,l=0}^{k-1}g_jg_lN_C(j,l). \\] Каждый разрез индексов $\\{0,\\dots,j\\}\\mid\\{j+1,\\dots,k\\}$ пересекается не менее двух раз, откуда $N_C(j,j)\\ge2$. Если $N_C(j,j+1)=0$, после удаления вершины $j+1$ отсутствует ребро между непустыми группами $\\{0,\\dots,j\\}$ и $\\{j+2,\\dots,k\\}$. Но цикл после удаления одной вершины есть связный путь, противоречие. Следовательно, $N_C(j,j+1)\\ge1$. Для цикла $Z=(0,1,3,5,\\dots,6,4,2,0)$ эти числа равны $2$ на диагонали, $1$ на соседних диагоналях и $0$ в остальных местах. Значит, $N_C\\ge N_Z$ поэлементно. Все $g_j\\ge0$, поэтому $Q(C)\\ge Q(Z)$, что даёт указанную оценку. Разность есть сумма неотрицательных слагаемых $g_jg_l(N_C(j,l)-N_Z(j,l))$. Она равна нулю в точности при перечисленных условиях. При попарно различных степенях все $g_j>0$. Равенство исключает рёбра с разностью рангов больше двух. Тогда одновременно пересечь промежутки $j$ и $j+1$ может только ребро $\\{j,j+2\\}$, так что все такие рёбра обязательны. Ранги $0$ и $k$ имеют степень два и требуют ещё рёбер $\\{0,1\\}$ и $\\{k-1,k\\}$. Это в точности описанный цикл. Его обход от $0$ оставляет выбор лишь между двумя направлениями. При повторениях хребты $(2,3,4,3,3)$ и $(2,3,3,4,3)$ дают одно и то же минимальное значение $38$. Расстояния между единственными вершинами степеней $2$ и $4$ на хребте равны соответственно двум и трём, так что обращения не отождествляют порядки.","defence":[4],"kind":"theorem","revision":"Введён критерий равенства через пересечения разрезов, учитывающий повторяющиеся степени."}},"three.c":{"old":{"short":"П 2.2.2","title":"irr: три порядка при k=3","chapter":2,"severity":0,"note":"Основная содержательная формула/свойство согласуется с проверкой в рецензии. Это не экспертиза новизны и не гарантия отсутствия мелких описок.","statement":"\\begin{proposition}\\label{three.c} Пусть $d_1\\ge d_2\\ge d_3\\ge2$ — целые числа, и пусть $\\TT(d_1,d_2,d_3)$ — класс гусеничных деревьев, степени хребта $(y_1,y_2,y_3)$ которых являются перестановкой $(d_1,d_2,d_3)$. С точностью до обращения гусеничное дерево этого класса определяется средней степенью $y_2$, что даёт три случая (таблица~\\ref{figpro.2}). При $S=\\sum_{i=1}^{3}(d_i-1)^2$ \\begin{align*} \\text{Случай 1, } y_2=d_1:&\\quad \\irr(\\TT)=S+d_1-d_2-d_3+1,\\\\ \\text{Случай 2, } y_2=d_2:&\\quad \\irr(\\TT)=S+d_1-d_2-d_3+1,\\\\ \\text{Случай 3, } y_2=d_3:&\\quad \\irr(\\TT)=S+d_1+d_2-3d_3+1. \\end{align*} Следовательно, \\begin{align*} \\irr_{\\min}(\\TT)&=(d_1-1)^2+(d_3-1)^2+(d_2-1)(d_2-2)+(d_1-d_3),\\\\ \\irr_{\\max}(\\TT)&=(d_1-1)^2+(d_2-1)^2+(d_3-1)(d_3-2)+(d_1-d_3)+(d_2-d_3), \\end{align*} и $\\irr_{\\max}-\\irr_{\\min}=2(d_2-d_3)$. \\end{proposition}","line":1329,"page":41,"defence":[]},"new":{"title":"irr: три порядка при k=3","short":"П 2.2.3","num":"2.2.3","page":"16","chapter":2,"line":491,"label":"three.c","statement":"\\begin{proposition}\\label{three.c} Пусть $d_1\\ge d_2\\ge d_3\\ge2$ — целые числа, и пусть $\\TT(d_1,d_2,d_3)$ — класс гусеничных деревьев, степени хребта $(y_1,y_2,y_3)$ которых являются перестановкой $(d_1,d_2,d_3)$. С точностью до обращения гусеничное дерево этого класса определяется средней степенью $y_2$, что даёт три случая. При $S=\\sum_{i=1}^{3}(d_i-1)^2$ \\begin{align*} \\text{Случай 1, } y_2=d_1:&\\quad \\irr(\\TT)=S+d_1-d_2-d_3+1,\\\\ \\text{Случай 2, } y_2=d_2:&\\quad \\irr(\\TT)=S+d_1-d_2-d_3+1,\\\\ \\text{Случай 3, } y_2=d_3:&\\quad \\irr(\\TT)=S+d_1+d_2-3d_3+1. \\end{align*} Следовательно, \\begin{align*} \\irr_{\\min}(\\TT)&=(d_1-1)^2+(d_3-1)^2+(d_2-1)(d_2-2)+(d_1-d_3),\\\\ \\irr_{\\max}(\\TT)&=(d_1-1)^2+(d_2-1)^2+(d_3-1)(d_3-2)+(d_1-d_3)+(d_2-d_3), \\end{align*} и $\\irr_{\\max}-\\irr_{\\min}=2(d_2-d_3)$. \\end{proposition}","proof":"Для произвольных $(u,v,w)$ предложение~\\ref{Caterpillar} даёт $\\irr=(u-1)^2+(w-1)^2+(v-1)(v-2)+|u-v|+|v-w|$. Подстановка трёх вариантов средней вершины и упрощение с учётом $d_1\\ge d_2\\ge d_3$ даёт указанные формулы.","defence":[],"kind":"proposition","revision":""}},"upboun1jas":{"old":{"short":"П 1.1.2","title":"Оценки максимальной σ-нерегулярности","chapter":1,"severity":1,"note":"В тексте названы верхние оценки, но знаки > задают нижние. Требуется сверка направления и терминологии; ложность самих численных границ здесь не установлена.","statement":"\\begin{proposition}[\\cite{Dimitrov2018Abdo}]~\\label{upboun1jas} Для любого связного графа $G$ с $n$ вершинами, минимальной степенью $\\delta$, максимальной степенью $\\Delta$ и максимальной $\\sigma$-нерегулярностью выполняются следующие верхние оценки для $\\sigma$: \\begin{equation}~\\label{eq5BoundsonGraph} \\sigma(G)>\\frac{\\delta}{\\Delta+1}(\\Delta - \\delta)^3 n, \\quad \\sigma(G) > \\frac{1}{\\Delta+1}(\\Delta - 1)^3 n. \\end{equation} \\end{proposition}","line":406,"page":15,"defence":[]},"new":{"title":"Оценка σ по разбросу степеней","short":"П 1.1.2","num":"1.1.2","page":"4","chapter":1,"line":112,"label":"upboun1jas","statement":"\\begin{proposition}\\label{upboun1jas} Если связный граф имеет $m\\ge1$ рёбер, то $\\sigma(G)\\le m(\\Delta-\\delta)^2$. При заданных $\\delta,\\Delta$ любое реализованное значение $\\sigma$ служит нижней оценкой максимума по тому же классу. \\end{proposition}","proof":"На каждом ребре $|d(u)-d(v)|\\le\\Delta-\\delta$. Суммируем квадраты по $E(G)$. Утверждение о максимуме следует из его определения.","defence":[],"kind":"proposition","revision":""}},"word_initial":{"old":{"short":"Определение §6.0","title":"Начальные слова F₀=1, F₁=0","chapter":6,"severity":0,"note":"Согласованная исходная постановка; с ней проверены частоты и морфизмы.","statement":"","line":null,"page":136,"defence":[]},"new":{"title":"Рекурсия и начальные слова 1, 0","short":"О 6.0.1","num":"6.0.1","page":"52","chapter":6,"line":1962,"label":"word_initial","statement":"\\begin{definition}\\label{word_initial} Для целых $a,b\\ge1$ положим $F_0^{(a,b)}=1$, $F_1^{(a,b)}=0$ и при $n\\ge2$ \\begin{equation}\\label{eqq01biperiodicrecurrence} F_n^{(a,b)}=(F_{n-1}^{(a,b)})^{c_n}F_{n-2}^{(a,b)},\\qquad c_n=\\begin{cases}a,&n\\text{ чётно},\\\\ b,&n\\text{ нечётно}.\\end{cases} \\end{equation} Предел $F^{(a,b)}$ по вложенным префиксам $F_n^{(a,b)}$, $n\\ge1$, называется бипериодическим словом с параметрами $(a,b)$. Записи $F$ и $\\FD$ для этого семейства равнозначны. \\end{definition}","proof":"","defence":[],"kind":"definition","revision":"Во всей главе используются единые начальные данные. Для встречающегося в литературе другого соглашения указано отличие."}},"word_redefined":{"old":{
